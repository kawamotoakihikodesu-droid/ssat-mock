<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SSAT 模擬試験（Upper Level 対策）</title>
<style>
  :root{
    --navy:#1f3a5f; --navy2:#2c5282; --bg:#f4f6f9; --card:#fff; --line:#d5dbe3;
    --text:#1f2933; --muted:#5f6b7a; --ok:#1e8e3e; --ng:#d93025; --warn:#e37400;
    --sel:#e3edfb; --selb:#2c5282; --hl:#fff176;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:"Helvetica Neue",Arial,"Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
  button{font:inherit;cursor:pointer}
  a{color:var(--navy2)}
  /* top nav */
  #topbar{background:var(--navy);color:#fff;display:flex;align-items:center;gap:8px;padding:0 16px;height:52px;position:sticky;top:0;z-index:20}
  #topbar .brand{font-weight:700;margin-right:16px;white-space:nowrap}
  #topbar nav{display:flex;gap:4px;overflow-x:auto}
  #topbar nav a{color:#dbe6f5;text-decoration:none;padding:6px 12px;border-radius:6px;white-space:nowrap;font-size:14px}
  #topbar nav a.active,#topbar nav a:hover{background:rgba(255,255,255,.15);color:#fff}
  body.in-exam #topbar{display:none}
  main{max-width:1000px;margin:0 auto;padding:24px 16px 80px}
  body.in-exam main{max-width:none;padding:0}
  h1{font-size:24px;margin:0 0 8px} h2{font-size:20px;margin:28px 0 12px} h3{font-size:17px;margin:20px 0 8px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;margin:14px 0}
  .muted{color:var(--muted)} .small{font-size:13px}
  .btn{background:var(--navy2);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-weight:600}
  .btn:hover{filter:brightness(1.1)}
  .btn.sec{background:#fff;color:var(--navy2);border:1px solid var(--navy2)}
  .btn.danger{background:#fff;color:var(--ng);border:1px solid var(--ng)}
  .btn.big{padding:14px 26px;font-size:17px}
  .btn:disabled{opacity:.4;cursor:default}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
  table{border-collapse:collapse;width:100%;font-size:14px}
  th,td{border:1px solid var(--line);padding:8px 10px;text-align:center}
  th{background:#eef2f7}
  td.l,th.l{text-align:left}
  .tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;background:#eef2f7;color:var(--muted);margin-right:4px}
  .tag.ok{background:#e6f4ea;color:var(--ok)} .tag.ng{background:#fce8e6;color:var(--ng)} .tag.om{background:#fef7e0;color:var(--warn)}
  .frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px;line-height:1.25}
  .frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}
  .bar{height:12px;background:#e8ecf1;border-radius:6px;overflow:hidden;min-width:80px}
  .bar>div{height:100%;background:var(--navy2)}
  input[type=text]{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;width:260px;max-width:100%}

  /* ===== exam (CBT-like) ===== */
  .exam{display:flex;flex-direction:column;height:100vh}
  .examhead{background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:8px 16px;flex-wrap:wrap}
  .examhead .sec{font-weight:700}
  .examhead .qpos{opacity:.9}
  .examhead .sp{flex:1}
  .timer{font-family:Menlo,Consolas,monospace;font-size:20px;font-weight:700;background:rgba(255,255,255,.12);padding:2px 12px;border-radius:6px;min-width:90px;text-align:center}
  .timer.warn{background:var(--warn)} .timer.crit{background:var(--ng)}
  .hbtn{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:6px;padding:4px 10px;font-size:13px}
  .exambody{flex:1;display:flex;min-height:0;background:#fff}
  .pane{overflow:auto;padding:24px 32px}
  .passage{flex:1;border-right:4px solid var(--line);background:#fcfcfa}
  .passage p{font-size:16.5px;line-height:1.9}
  .passage mark{background:var(--hl);padding:0}
  .qpane{flex:1;max-width:900px;margin:0 auto;width:100%}
  .split .qpane{max-width:none;margin:0}
  .partlabel{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .directions{font-size:13.5px;color:var(--muted);background:#f6f8fb;border-left:3px solid var(--line);padding:8px 12px;margin:8px 0 16px}
  .qnum{font-weight:700;color:var(--navy2);margin:6px 0}
  .prompt{font-size:18px;margin-bottom:18px}
  .prompt .word{font-size:26px;font-weight:700;letter-spacing:.04em}
  .choice{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;margin:9px 0;cursor:pointer;user-select:none;background:#fff;font-size:17px}
  .choice:hover{border-color:#9fb3cc}
  .choice .letter{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid #8b98a8;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
  .choice.sel{background:var(--sel);border-color:var(--selb)}
  .choice.sel .letter{background:var(--selb);border-color:var(--selb);color:#fff}
  .choice .ctext{flex:1}
  .choice.elim .ctext{text-decoration:line-through;color:#a0a8b3}
  .choice .x{flex:none;border:0;background:transparent;color:#a0a8b3;font-size:16px;padding:2px 6px;border-radius:4px}
  .choice .x:hover{background:#f1f3f4;color:var(--ng)}
  .confrow{margin-top:20px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
  .confrow button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 14px}
  .confrow button.on{background:var(--navy2);color:#fff;border-color:var(--navy2)}
  .examfoot{display:flex;gap:10px;align-items:center;padding:10px 16px;border-top:1px solid var(--line);background:#f1f4f8;flex-wrap:wrap}
  .examfoot .sp{flex:1}
  .flagbtn.on{background:#fef7e0;color:var(--warn);border-color:var(--warn)}
  .center-card{max-width:760px;margin:40px auto;padding:0 16px}
  .hlpop{position:fixed;z-index:50;background:var(--navy);color:#fff;border:0;border-radius:6px;padding:6px 12px;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
  textarea.essay{width:100%;min-height:52vh;font:16px/1.7 Georgia,"Times New Roman",serif;padding:16px;border:1px solid var(--line);border-radius:8px;resize:vertical}
  .pausecover{position:fixed;inset:0;background:rgba(31,58,95,.97);color:#fff;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
  /* modal */
  #modal .back{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:70;display:flex;align-items:center;justify-content:center;padding:16px}
  #modal .box{background:#fff;border-radius:10px;padding:22px;max-width:620px;width:100%;max-height:90vh;overflow:auto}
  .navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;margin:14px 0}
  .navgrid button{border:1.5px solid var(--line);background:#fff;border-radius:6px;padding:8px 0;font-weight:600;position:relative}
  .navgrid button.ans{background:var(--sel);border-color:var(--selb)}
  .navgrid button.cur{outline:3px solid var(--warn)}
  .navgrid button .f{position:absolute;top:-6px;right:-4px;font-size:13px}
  /* review cards */
  .qcard{border:1px solid var(--line);border-radius:10px;background:#fff;margin:10px 0;overflow:hidden}
  .qcard>summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .qcard>summary::-webkit-details-marker{display:none}
  .qcard[open]>summary{border-bottom:1px solid var(--line);background:#fafbfc}
  .qcard .body{padding:14px 18px}
  .qcard .rchoice{padding:6px 10px;border-radius:6px;margin:4px 0;border:1px solid transparent}
  .qcard .rchoice.correct{background:#e6f4ea;border-color:#a8dab5}
  .qcard .rchoice.wrong{background:#fce8e6;border-color:#f4b6b0}
  .expl{background:#f6f8fb;border-left:4px solid var(--navy2);padding:10px 14px;margin-top:12px;border-radius:4px}
  .filters button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:4px 14px;margin:3px 2px;font-size:14px}
  .filters button.on{background:var(--navy2);color:#fff;border-color:var(--navy2)}
  .passbox{background:#fcfcfa;border:1px solid var(--line);border-radius:6px;padding:10px 14px;font-size:14.5px;margin-bottom:10px}
  .kpi{display:flex;gap:14px;flex-wrap:wrap}
  .kpi>div{flex:1;min-width:140px;background:#f6f8fb;border-radius:8px;padding:12px 14px}
  .kpi b{display:block;font-size:24px;color:var(--navy)}
  @media (max-width:760px){
    .exambody.split{flex-direction:column}
    .passage{border-right:0;border-bottom:4px solid var(--line);max-height:45vh}
    .pane{padding:16px}
  }
</style>
</head>
<body>
<header id="topbar">
  <div class="brand">📝 SSAT 模擬試験</div>
  <nav>
    <a href="#/home" data-r="home">模試を受ける</a>
    <a href="#/history" data-r="history">テスト結果・解説</a>
    <a href="#/review" data-r="review">問題と解説一覧</a>
    <a href="#/guide" data-r="guide">本番情報</a>
  </nav>
</header>
<main id="app"></main>
<div id="modal"></div>

<script>
/* =====================================================================
 *  DATA  (出典: SSAT問題集 ver. 1)
 * ===================================================================== */
const F = (a, b) => `<span class="frac"><span>${a}</span><span>${b}</span></span>`;
const L = ['A','B','C','D','E'];

const SECTION_INFO = {
  verbal:  {name:'Verbal Section', jp:'語彙・類推', time:12,
            directions:'<b>Part A: Synonyms</b> — Each of the following questions consists of one word in capital letters followed by five words or phrases. Select the one word or phrase whose meaning is closest to the word in capital letters.<br><b>Part B: Analogies</b> — The following questions ask you to find relationships between words. For each question, select the answer choice that best completes the meaning of the sentence.'},
  quant:   {name:'Quantitative (Math) Section', jp:'数学', time:20,
            directions:'Solve each problem and select the one correct answer from the five choices given. (Note: Calculators are NOT permitted on the SSAT.)'},
  reading: {name:'Reading Section', jp:'長文読解', time:20,
            directions:'Read each passage carefully and answer the questions that follow based on what is stated or implied in the passage.'},
  writing: {name:'Writing Sample', jp:'エッセイ', time:25,
            directions:'Choose ONE of the two prompts below and write a well-organized essay (Introduction, Body Paragraphs, Conclusion). Although the Writing Sample is not scored, a copy is sent directly to the admissions office of the schools to which you apply.'}
};
const PART_DIR = {
  'Synonyms':'Select the one word or phrase whose meaning is closest to the word in capital letters.',
  'Analogies':'Select the answer choice that best completes the meaning of the sentence.'
};

const PASSAGES = {
  p1:{title:'Passage 1: Architecture & Society', jp:'都市建築とバイオフィリック・デザイン', html:`<p>For decades, urban architecture treated nature as an ornamental afterthought—a row of neatly trimmed shrubs beside a concrete lobby or a solitary tree confined to a sidewalk planter. In recent years, however, a paradigm shift known as <i>biophilic design</i> has begun to reshape city skylines. Rather than merely decorating steel-and-glass towers with greenery, biophilic architects weave living ecosystems directly into the structural fabric of buildings. Vertical forests, daylight-flooded atriums, and natural ventilation corridors are no longer seen as aesthetic luxuries; empirical studies demonstrate that they significantly reduce urban heat-island effects, lower energy consumption, and measurably improve the cognitive function and emotional well-being of occupants. Yet, despite these clear benefits, widespread adoption remains hindered by high upfront construction costs and the specialized maintenance required to keep elevated ecosystems thriving in harsh wind and temperature conditions.</p>`},
  p2:{title:'Passage 2: Literary Fiction / Narrative', jp:'文学・小説「画家のクララ」', html:`<p>Clara stood before the tall studio window, watching the afternoon rain blur the brick facades of the city below. On her easel rested the canvas she had repainted four times that week. Her instructor, Monsieur Laurent, had praised the first version for its technical precision—every shadow measured, every perspective line obeying the strict geometry of the academy. Yet Clara had scraped the palette knife across it the moment she returned to her room. Accuracy, she realized, was not what she was chasing. What she wanted was the <i>hum</i> of the street at dusk: the way wet cobblestones caught the amber glow of streetlamps, not as sharp reflections, but as restless ribbons of warmth. Picking up a wide, coarse brush, she dipped it into cadmium yellow and struck the canvas with a bold, uncalculated sweep. For the first time all week, her shoulders dropped, and she began to breathe.</p>`},
  p3:{title:'Passage 3: History / Social Studies', jp:'歴史・社会「グーテンベルクの活版印刷」', html:`<p>Before the mid-fifteenth century, the production of books in Europe was an arduous craft confined largely to monastic scriptoriums, where scribes copied texts by hand onto parchment. A single volume could take months to complete, rendering books rare symbols of elite wealth. When Johannes Gutenberg introduced his movable-type printing press in Mainz, Germany, around 1440, he did not merely accelerate a manufacturing process; he catalyzed an information revolution. By combining durable metal alloy type, oil-based inks, and a wooden screw press adapted from agricultural wine-making, Gutenberg made the mass reproduction of texts economically viable. Within five decades, millions of books were circulating across Europe. This sudden democratization of knowledge weakened traditional monopolies on learning, fueled the scientific inquiry of the Renaissance, and laid the groundwork for widespread vernacular literacy.</p>`},
  p4:{title:'Passage 4: Natural Science', jp:'自然科学「深海生物の生物発光」', html:`<p>In the sunless depths of the ocean's <i>bathypelagic zone</i>—stretching from 1,000 to 4,000 meters below the surface—sunlight is entirely absent, yet the darkness is frequently pierced by flashes of living light. This phenomenon, known as <i>bioluminescence</i>, is produced through a chemical reaction within an organism's cells, wherein a light-emitting compound called luciferin is oxidized by the enzyme luciferase. Remarkably, evolutionary biologists estimate that bioluminescence has evolved independently at least forty times across diverse marine lineages, from bacteria and jellyfish to deep-sea anglerfish. Such striking <i>convergent evolution</i> underscores the immense survival value of light in the abyss: species wield it to lure unsuspecting prey, startle predators with blinding decoys, or signal potential mates through species-specific blinking patterns.</p>`}
};

const Q = [];
const add = o => Q.push(o);

/* ---- Verbal: Synonyms (Q1–10) ---- */
[
 ['CANDID',['sweet','frank','secretive','anxious','careful'],'B','<b>candid</b> は「率直な、包み隠さない」。類義語は (B) frank（率直な）。(A) sweet は <i>candy</i> と見た目が似た引っ掛け選択肢です。'],
 ['EPHEMERAL',['eternal','fragile','short-lived','dramatic','mysterious'],'C','<b>ephemeral</b> は「つかの間の、短命な（short-lived）」。SSAT最頻出単語の一つ。(A) eternal（永遠の）は対義語。'],
 ['MITIGATE',['aggravate','alleviate','investigate','imitate','congregate'],'B','<b>mitigate</b> は「（痛みや被害を）和らげる、軽減する（alleviate）」。(A) aggravate（悪化させる）は対義語。'],
 ['PRAGMATIC',['idealistic','practical','stubborn','ancient','dramatic'],'B','<b>pragmatic</b> は「実用的な、現実的な（practical）」。(A) idealistic（理想主義的な）は対義語。'],
 ['NOVICE',['expert','novel','beginner','judge','messenger'],'C','語根 <i>nov-</i> は「新しい（new）」。<b>novice</b> は「初心者、新米（beginner）」。(B) novel は同じ語源を使った見た目引っ掛けです。'],
 ['OBSCURE',['unclear','obvious','stubborn','tidy','cheerful'],'A','<b>obscure</b> は「曖昧な、分かりにくい（unclear）、無名の」。(B) obvious（明白な）は対義語。'],
 ['BENEVOLENT',['violent','charitable','wealthy','reluctant','solitary'],'B','接頭辞 <i>bene-</i> は「良い（good）」。<b>benevolent</b> は「慈悲深い、慈善的な（charitable）」。'],
 ['ZEALOUS',['jealous','lazy','enthusiastic','cautious','comical'],'C','<b>zealous</b> は「熱狂的な、極めて熱心な（enthusiastic）」。発音が似た (A) jealous（嫉妬深い）は定番の引っ掛けです。'],
 ['SUPERFLUOUS',['superior','flowing','unnecessary','essential','rapid'],'C','語源は <i>super-</i>（超えて）＋ <i>flu-</i>（流れる＝溢れ出る）。「余分な、不必要な（unnecessary）」。'],
 ['VINDICATE',['accuse','justify','indicate','destroy','surrender'],'B','<b>vindicate</b> は「無実を証明する、正当性を立証する（justify）」。(A) accuse（非難する）は対義語。']
].forEach((r,i)=>add({n:i+1, sec:'verbal', part:'Synonyms', topic:'Synonyms', prompt:`<span class="word">${r[0]}</span>`, short:r[0], choices:r[1], ans:r[2], expl:r[3]}));

/* ---- Verbal: Analogies (Q11–20) ---- */
[
 ['Sketch is to painting as',['frame is to museum','chisel is to sculpture','outline is to essay','melody is to instrument','actor is to script'],'C','「Sketch（下描き）は Painting（絵画）の事前の構成案である」→「Outline（アウトライン）は Essay（エッセイ）の事前の構成案である」。'],
 ['Frugal is to miser as',['generous is to philanthropist','timid is to leader','wealthy is to banker','strict is to student','clumsy is to athlete'],'A','「Frugal（倹約・ケチ）は Miser（守銭奴）の特徴である」→「Generous（寛大）は Philanthropist（慈善家）の特徴である」。'],
 ['Drought is to rain as',['hurricane is to wind','famine is to food','flood is to river','harvest is to crop','winter is to snow'],'B','「Drought（干ばつ）は Rain（雨）が極端に不足した状態である」→「Famine（飢饉）は Food（食料）が極端に不足した状態である」。'],
 ['Whisper is to shout as',['walk is to run','smile is to cry','listen is to hear','sleep is to dream','read is to write'],'A','「Whisper（ささやく）より強度が大きいのが Shout（叫ぶ）である」→「Walk（歩く）より速度・強度が大きいのが Run（走る）である」。'],
 ['Stanza is to poem as',['page is to paper','verse is to rhyme','act is to play','author is to novel','brush is to canvas'],'C','「Stanza（詩の連）は Poem（詩）を構成する単位である」→「Act（幕）は Play（演劇）を構成する単位である」。'],
 ['Scalpel is to surgeon as',['stethoscope is to patient','symptom is to doctor','gavel is to judge','telescope is to star','tractor is to harvest'],'C','「Scalpel（メス）は Surgeon（外科医）が使う専門道具である」→「Gavel（木槌）は Judge（裁判官）が使う専門道具である」。'],
 ['Hermit is to solitary as',['nomad is to wandering','athlete is to polite','scholar is to wealthy','coward is to brave','guest is to permanent'],'A','「Hermit（隠者）は定義上 Solitary（孤独な）人である」→「Nomad（遊牧民）は定義上 Wandering（放浪する）人である」。'],
 ['Transparent is to opaque as',['fragile is to delicate','hollow is to empty','turbulent is to calm','ancient is to historical','damp is to wet'],'C','「Transparent（透明）と Opaque（不透明）は対義語である」→「Turbulent（荒れ狂う）と Calm（穏やかな）は対義語である」。'],
 ['Catalyst is to reaction as',['brake is to vehicle','spark is to fire','umbrella is to rain','anchor is to ship','shadow is to light'],'B','「Catalyst（触媒）は Reaction（反応）を引き起こすきっかけである」→「Spark（火花）は Fire（火事・炎）を引き起こすきっかけである」。'],
 ['Sonnet is to poetry as',['biography is to nonfiction','dictionary is to alphabet','symphony is to conductor','portrait is to frame','newspaper is to journalist'],'A','「Sonnet（14行詩）は Poetry（詩）という大分類の1ジャンルである」→「Biography（伝記）は Nonfiction（ノンフィクション）という大分類の1ジャンルである」。']
].forEach((r,i)=>add({n:i+11, sec:'verbal', part:'Analogies', topic:'Analogies', prompt:r[0], short:r[0], choices:r[1], ans:r[2], expl:'<b>ブリッジ文：</b>'+r[3]}));

/* ---- Quantitative (Q21–36) ---- */
[
 ['連続割引','A jacket originally priced at $120 is placed on sale at a 20% discount. Later, the discounted price is reduced by an additional 10% for a weekend promotion. What is the final price of the jacket?',['$84.00','$86.40','$88.00','$90.00','$96.00'],'B','最初の20%オフで $120×0.8=$96.00。そこからさらに10%オフなので $96.00×0.9=$86.40。（※30%オフにして $84 を選ばないよう注意）'],
 ['一次方程式',`If ${F('3<i>x</i> − 5','4')} = ${F('<i>x</i> + 3','2')}, what is the value of <i>x</i>?`,['2','4','8','11','13'],'D','両辺を4倍して分母を払うと 3<i>x</i>−5=2(<i>x</i>+3) → 3<i>x</i>−5=2<i>x</i>+6 → <i>x</i>=11。'],
 ['平均と合計','The average (arithmetic mean) of five numbers is 18. When a sixth number is added to the group, the new average of the six numbers becomes 21. What is the sixth number?',['24','30','33','36','39'],'D','5つの数の合計は 18×5=90。6つの数の合計は 21×6=126。差は 126−90=36。'],
 ['長方形の周囲と面積','The length of a rectangle is 3 times its width. If the perimeter of the rectangle is 48 cm, what is the area of the rectangle in cm²?',['36','72','108','144','192'],'C','幅を <i>w</i>、長さを 3<i>w</i> とすると、周囲は 2(<i>w</i>+3<i>w</i>)=48 → 8<i>w</i>=48 → <i>w</i>=6, 長さ=18。面積は 6×18=108。'],
 ['新定義演算','For all real numbers <i>a</i> and <i>b</i>, let the symbol ⋆ be defined by the equation <i>a</i> ⋆ <i>b</i> = <i>a</i>² − 2<i>ab</i>. What is the value of 5 ⋆ 3?',['−5','1','7','10','19'],'A','<i>a</i>=5, <i>b</i>=3 を代入すると 5²−2(5)(3)=25−30=−5。'],

function startExam(planKey, custom){
  if (cur && !confirm('受験途中の模試があります。破棄して新しく開始しますか？')) return;
  const p = custom || PLANS[planKey];
  cur = {id: Date.now().toString(36), planKey, planName: p.name, name: load(LS_NAME,''),
         steps: custom ? custom.steps : p.steps(), stepIdx:0, phase:'intro', qIdx:0,
         answers:{}, conf:{}, flags:{}, elim:{}, hl:{}, essay:{prompt:'', text:''},
         used:{}, startedAt: Date.now(), endAt:null, pausedLeft:null};
  enterStep();
  saveCur();
  location.hash = '#/exam';
}
function abandon(){
  if (!confirm('受験途中の模試を破棄します。よろしいですか？')) return;
  cur = null; saveCur(); renderHome();
}

/* =====================================================================
 *  EXAM ENGINE
 * ===================================================================== */
const step = () => cur.steps[cur.stepIdx];
function enterStep(){
  cur.qIdx = 0; cur.pausedLeft = null;
  if (step().type === 'break') { cur.phase = 'run'; cur.endAt = Date.now() + step().time*1000; }
  else { cur.phase = 'intro'; cur.endAt = null; }
}
function beginStep(){
  cur.phase = 'run'; cur.endAt = Date.now() + step().time*1000; saveCur(); renderExam();
}
function timeLeft(){
  if (cur.pausedLeft != null) return cur.pausedLeft/1000;
  return cur.endAt ? (cur.endAt - Date.now())/1000 : step().time;
}
function finishStep(){
  const s = step();
  if (s.type !== 'break') cur.used[cur.stepIdx] = Math.min(s.time, Math.round(s.time - Math.max(0, timeLeft())));
  closeModal(); hideHlPop();
  cur.stepIdx++;
  if (cur.stepIdx >= cur.steps.length) return finalize();
  enterStep(); saveCur(); renderExam();
}
function finalize(){
  const a = {id: cur.id, date: Date.now(), startedAt: cur.startedAt, planKey: cur.planKey, planName: cur.planName, name: cur.name,
             steps: cur.steps.map((s,i)=>({type:s.type, key:s.key, label:s.label, qs:s.qs||[], time:s.time, used:cur.used[i]??null})),
             answers: cur.answers, conf: cur.conf, flags: cur.flags, essay: cur.essay, checks:{}};
  const list = attempts(); list.unshift(a); store(LS_ATT, list);
  cur = null; saveCur();
  location.hash = '#/result/' + a.id;
}

let timerHandle = null;
function tick(){
  if (!cur || !location.hash.startsWith('#/exam') || cur.phase !== 'run' || cur.pausedLeft != null) return;
  const left = timeLeft();
  const el = $('#timer');
  if (el) {
    el.textContent = fmt(left);
    el.classList.toggle('warn', left <= 300 && left > 60);
    el.classList.toggle('crit', left <= 60);
  }
  if (left <= 0) {
    if (step().type === 'break') return finishStep();
    finishStep();
    modal(`<h3 style="margin-top:0">⏰ 時間切れ</h3><p>前のセクションの制限時間が終了したため、自動的に次へ進みました。</p><button class="btn" onclick="closeModal()">OK</button>`);
  }
}
timerHandle = setInterval(tick, 500);

function headHTML(extra){
  const s = step(); const left = timeLeft();
  return `<div class="examhead">
    <span class="sec">${esc(s.label)}</span>${extra||''}
    <span class="sp"></span>
    <span class="small" style="opacity:.8">残り時間</span>
    <span id="timer" class="timer ${left<=60?'crit':left<=300?'warn':''}" style="${cur.hideTimer?'visibility:hidden':''}">${fmt(left)}</span>
    <button class="hbtn" onclick="cur.hideTimer=!cur.hideTimer;saveCur();renderExam()">${cur.hideTimer?'時計を表示':'時計を隠す'}</button>
    <button class="hbtn" onclick="pause()">一時停止</button>
    <button class="hbtn" onclick="location.hash='#/home'">中断</button>
  </div>`;
}

function renderExam(){
  if (!cur) return;
  const s = step();
  if (cur.pausedLeft != null) { app.innerHTML = `<div class="pausecover"><h2>一時停止中</h2><p>残り時間 ${fmt(cur.pausedLeft/1000)}（問題は非表示になっています）</p><button class="btn big" onclick="resume()">再開する</button></div>`; return; }

  // auto-advance if time expired while away
  if (cur.phase === 'run' && timeLeft() <= 0) { tick(); return; }

  if (s.type === 'break') {
    app.innerHTML = `<div class="exam">${headHTML()}<div class="exambody"><div class="center-card">

        <button class="btn big" onclick="finishStep()">休憩を終了して次へ進む</button>

        ${s.type==='writing' ? '<p class="small">⌨️ 本番 PC 受験ではキーボードで入力します。この画面ではスペルチェック（自動補正）はオフになっています。</p>' : ''}

function renderQuestion(){
  const s = step();
  const n = s.qs[cur.qIdx]; const q = QMAP[n];
  const sel = cur.answers[n]; const el = cur.elim[n] || [];
  const pas = q.passage ? PASSAGES[q.passage] : null;

  app.innerHTML = `<div class="exam">

    <div class="exambody ${pas?'split':''}">

      <div class="pane qpane">

          <div class="choice ${sel===L[i]?'sel':''} ${el.includes(L[i])?'elim':''}" onclick="choose('${L[i]}')">
            <span class="letter">${L[i]}</span><span class="ctext">${c}</span>
            <button class="x" title="この選択肢を消去" onclick="event.stopPropagation();toggleElim('${L[i]}')">✕</button>
          </div>`).join('')}</div>
        <div class="confrow">自信度：
          ${['○','△','Skip'].map(c=>`<button class="${cur.conf[n]===c?'on':''}" onclick="setConf('${c}')">${c}</button>`).join('')}
          ${sel ? `<button style="margin-left:auto" onclick="choose(null)">解答を取り消す</button>` : ''}
        </div>
      </div>
    </div>
    <div class="examfoot">
      <button class="btn sec" ${cur.qIdx===0?'disabled':''} onclick="go(-1)">◀ 前へ</button>
      <button class="btn sec flagbtn ${cur.flags[n]?'on':''}" onclick="toggleFlag()">🚩 見直し</button>
      <button class="btn sec" onclick="showNav()">問題一覧</button>
      <span class="sp"></span>
      ${cur.qIdx < s.qs.length-1 ? `<button class="btn" onclick="go(1)">次へ ▶</button>` : `<button class="btn" onclick="confirmEnd()">セクションを終了</button>`}
    </div>
  </div>`;
}

function choose(l){ const n = step().qs[cur.qIdx]; if (l) { cur.answers[n] = l; (cur.elim[n]||[]).includes(l) && toggleElim(l, true); } else delete cur.answers[n]; saveCur(); renderQuestion(); }
function toggleElim(l, silent){ const n = step().qs[cur.qIdx]; const e = cur.elim[n] = cur.elim[n] || []; const i = e.indexOf(l); i>=0 ? e.splice(i,1) : e.push(l); if (i<0 && cur.answers[n]===l) delete cur.answers[n]; if (!silent) { saveCur(); renderQuestion(); } }
function setConf(c){ const n = step().qs[cur.qIdx]; cur.conf[n] === c ? delete cur.conf[n] : cur.conf[n] = c; saveCur(); renderQuestion(); }
function toggleFlag(){ const n = step().qs[cur.qIdx]; cur.flags[n] ? delete cur.flags[n] : cur.flags[n] = true; saveCur(); renderQuestion(); }
function go(d){ const s = step(); cur.qIdx = Math.max(0, Math.min(s.qs.length-1, cur.qIdx + d)); hideHlPop(); saveCur(); renderQuestion(); const qp = document.querySelector('.qpane'); if (qp) qp.scrollTop = 0; }
function jump(i){ cur.qIdx = i; closeModal(); saveCur(); renderQuestion(); }
function showNav(){
  const s = step();
  const un = s.qs.filter(n=>!cur.answers[n]).length;
  modal(`<h3 style="margin-top:0">問題一覧（${esc(s.label)}）</h3>
    <div class="small muted">青＝解答済み / 白＝未解答 / 🚩＝見直しマーク　未解答：${un}問</div>
    <div class="navgrid">${s.qs.map((n,i)=>`<button class="${cur.answers[n]?'ans':''} ${i===cur.qIdx?'cur':''}" onclick="jump(${i})">Q${n}${cur.answers[n]?`<div class="small">${cur.answers[n]}</div>`:'<div class="small">&nbsp;</div>'}${cur.flags[n]?'<span class="f">🚩</span>':''}</button>`).join('')}</div>
    <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn sec" onclick="closeModal()">閉じる</button><button class="btn" onclick="confirmEnd()">セクションを終了</button></div>`);
}
function confirmEnd(){
  const s = step();
  let msg;
  if (s.type === 'writing') msg = `現在 <b>${words(cur.essay.text)}</b> 語です。`;
  else { const un = s.qs.filter(n=>!cur.answers[n]).length, fl = s.qs.filter(n=>cur.flags[n]).length;
         msg = `未解答：<b>${un}</b>問　見直しマーク：<b>${fl}</b>問`; }
  modal(`<h3 style="margin-top:0">${esc(s.label)} を終了しますか？</h3><p>${msg}</p>
    <p class="small muted">終了すると、このセクションには戻れません。残り時間：${fmt(timeLeft())}</p>
    <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn sec" onclick="closeModal()">戻る</button><button class="btn" onclick="finishStep()">終了して次へ</button></div>`);
}
function pause(){ cur.pausedLeft = Math.max(0, cur.endAt - Date.now()); saveCur(); renderExam(); }
function resume(){ cur.endAt = Date.now() + cur.pausedLeft; cur.pausedLeft = null; saveCur(); renderExam(); }

/* --- highlight in passage --- */
let hlPop = null;
function hideHlPop(){ if (hlPop) { hlPop.remove(); hlPop = null; } }
document.addEventListener('mouseup', ev => {
  if (ev.target.closest && ev.target.closest('.hlpop')) return;
  setTimeout(() => {
    hideHlPop();
    const pt = $('#ptext'); if (!pt) return;
    const sel = window.getSelection(); if (!sel.rangeCount || sel.isCollapsed) return;
    const r = sel.getRangeAt(0); if (!pt.contains(r.commonAncestorContainer)) return;
    const rect = r.getBoundingClientRect();
    hlPop = document.createElement('button'); hlPop.className = 'hlpop'; hlPop.textContent = '🖍 ハイライト';
    hlPop.style.left = Math.max(8, rect.left + rect.width/2 - 50) + 'px'; hlPop.style.top = Math.max(8, rect.top - 40) + 'px';
    hlPop.onclick = () => { applyHl(r); hideHlPop(); sel.removeAllRanges(); };
    document.body.appendChild(hlPop);
  }, 10);
});
function applyHl(r){
  const q = QMAP[step().qs[cur.qIdx]];
  // wrap each text node fragment inside the range
  const pt = $('#ptext');
  const walker = document.createTreeWalker(pt, NodeFilter.SHOW_TEXT);
  const nodes = []; while (walker.nextNode()) { const t = walker.currentNode; if (r.intersectsNode(t)) nodes.push(t); }
  nodes.forEach(t => {
    let s = 0, e = t.length;
    if (t === r.startContainer) s = r.startOffset;
    if (t === r.endContainer) e = r.endOffset;
    if (e <= s) return;
    const mid = t.splitText(s); mid.splitText(e - s);
    const m = document.createElement('mark'); mid.parentNode.insertBefore(m, mid); m.appendChild(mid);
  });
  cur.hl[q.passage] = pt.innerHTML; saveCur();
}
function clearHl(p){ delete cur.hl[p]; saveCur(); renderQuestion(); }

document.addEventListener('keydown', ev => {
  if (!cur || !location.hash.startsWith('#/exam') || cur.phase !== 'run' || cur.pausedLeft != null) return;
  if (step().type !== 'section' || $('#modal').innerHTML) return;
  if (['INPUT','TEXTAREA'].includes(document.activeElement.tagName) || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const k = ev.key.toUpperCase();
  if (L.includes(k)) choose(k);
  else if (ev.key === 'ArrowRight') go(1);
  else if (ev.key === 'ArrowLeft') go(-1);
});

/* =====================================================================
 *  SCORING
 * ===================================================================== */
function score(a){
  const rows = [];
  a.steps.forEach(s => (s.qs||[]).forEach(n => {
    const q = QMAP[n]; const ua = a.answers[n];
    rows.push({n, q, ua, st: !ua ? 'om' : ua === q.ans ? 'ok' : 'ng', conf: a.conf[n], flag: a.flags[n]});
  }));
  const agg = list => { const ok = list.filter(r=>r.st==='ok').length, ng = list.filter(r=>r.st==='ng').length, om = list.filter(r=>r.st==='om').length;
                        return {ok, ng, om, total:list.length, raw: ok - ng/4, pct: list.length ? Math.round(ok*100/list.length) : 0}; };
  const bySec = {}; ['verbal','quant','reading'].forEach(k => { const l = rows.filter(r=>r.q.sec===k); if (l.length) bySec[k] = agg(l); });
  const byTopic = {};
  rows.forEach(r => { const t = r.q.sec==='quant' ? 'Math' : r.q.topic; (byTopic[t] = byTopic[t] || []).push(r); });
  return {rows, all: agg(rows), bySec, byTopic: Object.fromEntries(Object.entries(byTopic).map(([k,v])=>[k, agg(v)]))};
}
const SEC_LABEL = {verbal:'Verbal（語彙・類推）', quant:'Quantitative（数学）', reading:'Reading（長文読解）'};
const fmtRaw = x => (Math.round(x*100)/100).toString();

        <td class="l">${fmtDate(a.date)}${a.name?`<div class="small muted">${esc(a.name)}</div>`:''}</td>
        <td class="l">${esc(a.planName)}</td>
        <td>${s.all.total ? `${s.all.ok} / ${s.all.total}` : '—'}</td>

    ${list.length ? `<h2>苦手分析（全受験の合計）</h2>${weakness(list)}` : ''}

      <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn sec" onclick="exportData()">結果を書き出す（JSON）</button>

      </div></div>`;
}
function weakness(list){
  const t = {}; const wrongCount = {};
  list.forEach(a => score(a).rows.forEach(r => {
    const k = r.q.sec==='quant' ? 'Math' : r.q.topic; t[k] = t[k] || {ok:0,total:0}; t[k].total++; if (r.st==='ok') t[k].ok++;
    if (r.st !== 'ok') wrongCount[r.n] = (wrongCount[r.n]||0) + 1;
  }));
  const ws = Object.entries(wrongCount).sort((a,b)=>b[1]-a[1]).slice(0,10);
  return `<div class="card">${topicTable(Object.fromEntries(Object.entries(t).map(([k,v])=>[k,{...v,pct:Math.round(v.ok*100/v.total)}])))}
    ${ws.length ? `<h3>よく間違える問題</h3><div>${ws.map(([n,c])=>`<span class="tag ng">Q${n}（${c}回）</span>`).join(' ')}</div>
      <div style="margin-top:10px"><button class="btn" onclick="retry([${ws.map(w=>w[0]).join(',')}],'よく間違える問題の解き直し')">これらを解き直す</button></div>` : ''}</div>`;
}
function topicTable(bt){
  return `<table><tr><th class="l">分野</th><th>正解</th><th style="width:45%">正答率</th></tr>
    ${Object.entries(bt).map(([k,v])=>`<tr><td class="l">${esc(k)}</td><td>${v.ok} / ${v.total}</td>
      <td><div style="display:flex;align-items:center;gap:8px"><div class="bar" style="flex:1"><div style="width:${v.pct}%;background:${v.pct>=80?'var(--ok)':v.pct>=60?'var(--navy2)':'var(--ng)'}"></div></div><span>${v.pct}%</span></div></td></tr>`).join('')}</table>`;
}
function exportData(){
  const blob = new Blob([JSON.stringify(attempts(), null, 1)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'ssat-mock-results.json'; a.click();
}
function importData(file){
  if (!file) return;
  file.text().then(t => { const inc = JSON.parse(t); const list = attempts(); const ids = new Set(list.map(a=>a.id));
    inc.forEach(a => { if (!ids.has(a.id)) list.push(a); }); list.sort((a,b)=>b.date-a.date); store(LS_ATT, list); renderHistory(); })
    .catch(() => alert('読み込みに失敗しました'));
}

    ${(confOkNg.length || confLucky.length) ? `<h2>自信度の分析</h2><div class="card small">
      ${confOkNg.length ? `<p>⚠️ <b>自信（○）があったのに不正解：</b>${confOkNg.map(r=>`<a href="#q${r.n}" class="tag ng">Q${r.n}</a>`).join(' ')}<br><span class="muted">思い込み・単語の覚え違いの可能性。最優先で復習しましょう。</span></p>` : ''}
      ${confLucky.length ? `<p>🤔 <b>自信なし（△/Skip）で正解：</b>${confLucky.map(r=>`<a href="#q${r.n}" class="tag ok">Q${r.n}</a>`).join(' ')}<br><span class="muted">たまたま正解した可能性があります。解説で根拠を確認しましょう。</span></p>` : ''}
    </div>` : ''}
    <h2>問題ごとの解説</h2>
    <div class="filters" id="filters"></div>
    ${wrongNs.length ? `<div style="margin:8px 0"><button class="btn" onclick="retry([${wrongNs.join(',')}],'間違えた問題の解き直し')">✍️ 間違えた・無回答の問題（${wrongNs.length}問）を解き直す</button></div>` : ''}
    <div id="qlist"></div>` : ''}
    ${wStep ? `<h2>Writing Sample</h2>${writingResult(a)}` : ''}
    <div style="margin-top:30px"><button class="btn danger" onclick="delAttempt('${a.id}')">この結果を削除</button></div>`;
  if (hasMC) drawList(a, s);
}
function drawList(a, s){
  const F_ = [['all','すべて'],['ng','不正解'],['om','無回答'],['wrongall','不正解＋無回答'],['flag','🚩見直しマーク'],['tri','自信度 △/Skip'],['ok','正解']];
  const cnt = k => s.rows.filter(r=>match(r,k)).length;
  $('#filters').innerHTML = F_.map(([k,l])=>`<button class="${resultFilter===k?'on':''}" onclick="resultFilter='${k}';drawList(window._a,window._s)">${l}（${cnt(k)}）</button>`).join('');
  window._a = a; window._s = s;
  const rows = s.rows.filter(r=>match(r,resultFilter));
  let lastPas = null;
  $('#qlist').innerHTML = rows.length ? rows.map(r => qcard(r.q, r, resultFilter !== 'all' && resultFilter !== 'ok')).join('') : '<p class="muted">該当する問題はありません。</p>';
}
function match(r,k){
  return k==='all' || (k==='wrongall' ? r.st!=='ok' : k==='flag' ? !!r.flag : k==='tri' ? (r.conf==='△'||r.conf==='Skip') : r.st===k);
}
function qcard(q, r, open){
  const st = r ? r.st : null;
  const pas = q.passage ? PASSAGES[q.passage] : null;
  return `<details class="qcard" id="q${q.n}" ${open?'open':''}>
    <summary>
      <b>Q${q.n}</b>
      ${st ? `<span class="tag ${st}">${st==='ok'?'○ 正解':st==='ng'?'✕ 不正解':'— 無回答'}</span>` : ''}
      <span class="tag">${esc(q.sec==='quant' ? 'Math: '+q.topic : q.topic)}</span>
      ${r && r.conf ? `<span class="tag">自信度 ${r.conf}</span>` : ''}${r && r.flag ? '<span class="tag">🚩</span>' : ''}
      <span class="small muted" style="flex:1;min-width:200px">${q.sec==='verbal' ? esc(q.short) : esc(plain(q.prompt).slice(0,70))+'…'}</span>
      ${r ? `<span class="small">あなた：<b>${r.ua||'—'}</b>／正解：<b>${q.ans}</b></span>` : `<span class="small">正解：<b>${q.ans}</b></span>`}
    </summary>
    <div class="body">
      ${pas ? `<details class="passbox"><summary><b>${esc(pas.title)}</b>（本文を表示）</summary>${pas.html}</details>` : ''}
      <div class="prompt" style="font-size:16.5px">${q.prompt}</div>
      ${q.choices.map((c,i)=>{ const l=L[i]; const cls = l===q.ans ? 'correct' : (r && r.ua===l ? 'wrong' : '');
        return `<div class="rchoice ${cls}">(${l}) ${c} ${l===q.ans?' ✅':''}${r && r.ua===l && l!==q.ans?' ← あなたの解答':''}</div>`; }).join('')}
      <div class="expl"><b>解説</b>　正解：(${q.ans})<br>${q.expl}</div>
    </div></details>`;
}
function writingResult(a){
  const e = a.essay || {}; const p = WRITING_PROMPTS[e.prompt];
  const checks = a.checks || {};
  return `<div class="card">
    <p><b>選択したプロンプト：</b>${p ? `${p.label}<br><span class="small">${p.text}</span>` : '（未選択）'}</p>
    <p><b>語数：</b>${words(e.text)} words <span class="small muted">（目安 250〜350語）</span></p>
    <div style="white-space:pre-wrap;background:#fcfcfa;border:1px solid var(--line);border-radius:6px;padding:14px;font-family:Georgia,serif;max-height:420px;overflow:auto">${esc(e.text||'（未記入）')}</div>
    <div style="margin-top:8px"><button class="btn sec" onclick="navigator.clipboard.writeText(${esc(JSON.stringify(e.text||''))}).then(()=>alert('コピーしました'))">エッセイをコピー</button></div>
    <h3>セルフチェック（保護者の方と一緒に確認）</h3>
    ${WRITING_CHECKS.map((c,i)=>`<label style="display:block;margin:4px 0"><input type="checkbox" ${checks[i]?'checked':''} onchange="setCheck('${a.id}',${i},this.checked)"> ${c}</label>`).join('')}
    <h3>採点基準と構成例（25分で書き切る完成度：250〜350語程度で最後まで完結しているか）</h3>
    <div style="overflow:auto"><table><tr><th>段落</th><th>役割</th><th>目標語数</th><th>時間配分</th><th class="l">書くべき内容</th></tr>
      ${WRITING_RUBRIC.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td class="l">${r[4]}</td></tr>`).join('')}</table></div>
  </div>`;
}
function setCheck(id,i,v){ const list = attempts(); const a = list.find(x=>x.id===id); a.checks = a.checks||{}; a.checks[i] = v; store(LS_ATT, list); }
function delAttempt(id){ if (!confirm('この結果を削除しますか？')) return; store(LS_ATT, attempts().filter(a=>a.id!==id)); location.hash = '#/history'; }
function retry(ns, name){
  ns = [...new Set(ns)].sort((a,b)=>a-b);
  const secOf = n => QMAP[n].sec;
  const steps = []; ['verbal','quant','reading'].forEach(k => { const qs = ns.filter(n=>secOf(n)===k); if (qs.length) {
    const per = k==='verbal' ? 36 : k==='quant' ? 75 : 86; // 本番と同程度の1問あたり時間（秒）
    steps.push({type:'section', key:k, label:`${name}：${SECTION_INFO[k].name}`, qs, time: Math.max(60, Math.ceil(qs.length*per/60)*60)}); } });
  startExam(null, {name, steps});
}

/* =====================================================================
 *  REVIEW (all questions)
 * ===================================================================== */
function renderReview(){
  const secs = [['verbal','Section 1: Verbal Section（Q1–Q20）'],['quant','Section 2: Quantitative Section（Q21–Q36）'],['reading','Section 3: Reading Section（Q37–Q50）']];
  app.innerHTML = `<h1>問題と解説一覧</h1>
    <p class="muted">全問題を確認できます。各問題をクリックすると選択肢・正解・解説が表示されます（答えを考えてから開きましょう）。</p>
    <div class="filters">${secs.map(([k,l])=>`<a class="tag" href="javascript:document.getElementById('sec-${k}').scrollIntoView()">${l.split('（')[0]}</a>`).join('')}<a class="tag" href="javascript:document.getElementById('sec-writing').scrollIntoView()">Section 4: Writing</a></div>
    ${secs.map(([k,l])=>`<h2 id="sec-${k}">${l}</h2><div class="directions">${SECTION_INFO[k].directions}</div>
      ${k==='reading' ? Object.entries(PASSAGES).map(([pk,p])=>`<h3>${esc(p.title)} <span class="small muted">${p.jp}</span></h3><div class="passbox">${p.html}</div>
        ${Q.filter(q=>q.passage===pk).map(q=>qcard(q,null,false)).join('')}`).join('')
      : Q.filter(q=>q.sec===k).map(q=>qcard(q,null,false)).join('')}`).join('')}
    <h2 id="sec-writing">Section 4: Writing Sample（25分）</h2>
    <div class="card"><div class="directions">${SECTION_INFO.writing.directions}</div>
      ${Object.values(WRITING_PROMPTS).map(p=>`<p><b>${p.label}</b><br>${p.text}</p>`).join('')}
      <h3>採点基準と構成例</h3>
      <div style="overflow:auto"><table><tr><th>段落</th><th>役割</th><th>目標語数</th><th>時間配分</th><th class="l">書くべき内容</th></tr>
      ${WRITING_RUBRIC.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td class="l">${r[4]}</td></tr>`).join('')}</table></div></div>`;
}
