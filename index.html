, "quick"], "ant": ["clumsy", "sluggish"], "ex": "The agile cat leaped onto the fence.", "tip": "名詞はagility。fragile（壊れやすい）と形が似ているが無関係。", "q": {"choices": ["fragile", "sluggish", "rigid", "nimble", "angular"], "ans": "D"}}, {"w": "alleviate", "pos": "v.", "ja": "軽減する、和らげる", "syn": ["relieve", "ease", "mitigate"], "ant": ["aggravate", "worsen"], "ex": "The medicine helped alleviate her headache.", "tip": "al+lev（軽い、lever・levitate）→軽くする。elevate（持ち上げる）は引っ掛け。", "q": {"choices": ["mitigate", "elevate", "aggravate", "intensify", "alienate"], "ans": "A"}}, {"w": "aloof", "pos": "adj.", "ja": "よそよそしい、超然とした", "syn": ["distant", "detached", "reserved"], "ant": ["friendly", "sociable"], "ex": "The new student seemed aloof, but she was actually just shy.", "tip": "元は航海用語で「（風上に）離れて」→人と距離を置く。aloft（高く）は綴りの引っ掛け。", "q": {"choices": ["aloft", "sociable", "detached", "foolish", "warm"], "ans": "C"}}, {"w": "altruistic", "pos": "adj.", "ja": "利他的な、私心のない", "syn": ["selfless", "unselfish", "charitable"], "ant": ["selfish", "egotistic"], "ex": "Her altruistic work at the shelter inspired others to volunteer.", "tip": "alter（他の）→他者のために尽くす。artistic・realisticは語尾が似ているだけの引っ掛け。", "q": {"choices": ["selfless", "artistic", "realistic", "greedy", "selfish"], "ans": "A"}}, {"w": "ambiguous", "pos": "adj.", "ja": "あいまいな、二通りに取れる", "syn": ["unclear", "vague", "equivocal"], "ant": ["clear", "explicit"], "ex": "The ending of the movie was ambiguous.", "tip": "ambi（両方）→二つの意味に取れる。ambitious（野心的な）は引っ掛け。", "q": {"choices": ["ambitious", "explicit", "obvious", "ambidextrous", "vague"], "ans": "E"}}, {"w": "ambivalent", "pos": "adj.", "ja": "相反する感情を持つ、どっちつかずの", "syn": ["conflicted", "uncertain", "torn"], "ant": ["certain", "decisive"], "ex": "He felt ambivalent about moving to a new city.", "tip": "ambi（両方）+val（力・価値）→二つの気持ちが引き合う。ambiguous（意味があいまい）との違いに注意。", "q": {"choices": ["ambitious", "conflicted", "decisive", "equivalent", "benevolent"], "ans": "B"}}, {"w": "ameliorate", "pos": "v.", "ja": "改善する、良くする", "syn": ["improve", "better", "enhance"], "ant": ["worsen", "deteriorate"], "ex": "The new policies were designed to ameliorate living conditions.", "tip": "ラテン語melior（より良い）→良くする。反意語deteriorate（悪化する）とセットで。", "q": {"choices": ["deteriorate", "amplify", "decorate", "improve", "eliminate"], "ans": "D"}}, {"w": "amiable", "pos": "adj.", "ja": "感じのよい、人当たりのよい", "syn": ["friendly", "pleasant", "good-natured"], "ant": ["hostile", "disagreeable"], "ex": "The amiable shopkeeper greeted every customer by name.", "tip": "ami（友・愛、フランス語ami）→友好的。admirable（称賛に値する）は意味が違う。", "q": {"choices": ["hostile", "pleasant", "capable", "admirable", "miserable"], "ans": "B"}}, {"w": "amicable", "pos": "adj.", "ja": "友好的な、円満な", "syn": ["harmonious", "cordial", "peaceful"], "ant": ["hostile", "acrimonious"], "ex": "The two companies reached an amicable agreement.", "tip": "amiableは主に「人柄」、amicableは「関係・解決・合意」に使う。applicableは引っ掛け。", "q": {"choices": ["hostile", "applicable", "cordial", "comical", "acrimonious"], "ans": "C"}}, {"w": "anomaly", "pos": "n.", "ja": "異常、例外的なもの", "syn": ["irregularity", "abnormality", "aberration"], "ant": ["norm", "rule"], "ex": "A warm day in January is an anomaly in this area.", "tip": "an（否定）+homal（一様な・平らな、ギリシャ語）→規則どおりでないもの。analogy（類推）は綴りの引っ掛け。", "q": {"choices": ["norm", "analogy", "anonymity", "harmony", "irregularity"], "ans": "E"}}, {"w": "antagonize", "pos": "v.", "ja": "敵に回す、反感を買う", "syn": ["provoke", "anger", "alienate"], "ant": ["placate", "appease"], "ex": "His rude remarks antagonized his coworkers.", "tip": "anti（反対）+agon（闘う）→antagonist（敵役）。agonize（苦悩する）は引っ掛け。", "q": {"choices": ["provoke", "placate", "agonize", "organize", "pacify"], "ans": "A"}}, {"w": "apathy", "pos": "n.", "ja": "無関心、無気力", "syn": ["indifference", "unconcern", "lethargy"], "ant": ["enthusiasm", "passion"], "ex": "Voter apathy led to a very low turnout.", "tip": "a（無）+pathy（感情、sympathy）→感情がない。antipathy（反感）は「嫌う」なので別物。", "q": {"choices": ["sympathy", "empathy", "indifference", "enthusiasm", "antipathy"], "ans": "C"}}, {"w": "appease", "pos": "v.", "ja": "なだめる、（欲求を）満たす", "syn": ["pacify", "placate", "soothe"], "ant": ["provoke", "anger"], "ex": "The manager tried to appease the angry customer with a refund.", "tip": "ap+pease（peace）→平和な状態にする。appeal（訴える）は見た目の引っ掛け。", "q": {"choices": ["provoke", "appeal", "applaud", "placate", "release"], "ans": "D"}}, {"w": "arbitrary", "pos": "adj.", "ja": "恣意的な、根拠のない", "syn": ["random", "capricious", "unreasoned"], "ant": ["reasoned", "systematic"], "ex": "The referee's decision seemed arbitrary and unfair.", "tip": "arbiter（裁定者）の勝手な判断から→筋道のない。contrary（反対の）は語尾の引っ掛け。", "q": {"choices": ["systematic", "random", "contrary", "logical", "ordinary"], "ans": "B"}}, {"w": "arduous", "pos": "adj.", "ja": "骨の折れる、困難な", "syn": ["strenuous", "grueling", "laborious"], "ant": ["easy", "effortless"], "ex": "The climb to the summit was long and arduous.", "tip": "ardent（熱心な）と形が似ているが意味は別。「きつい・大変な」と覚える。", "q": {"choices": ["effortless", "ardent", "odorous", "simple", "grueling"], "ans": "E"}}, {"w": "articulate", "pos": "adj.", "ja": "（話し方が）明瞭な、はっきり表現できる", "syn": ["eloquent", "well-spoken", "lucid"], "ant": ["inarticulate", "incoherent"], "ex": "She is an articulate speaker who explains complex ideas clearly.", "tip": "article（区切り）と同語源→言葉をはっきり区切る。動詞で「明確に述べる」も重要。", "q": {"choices": ["eloquent", "incoherent", "artificial", "particular", "mute"], "ans": "A"}}, {"w": "ascend", "pos": "v.", "ja": "上がる、登る", "syn": ["climb", "rise", "mount"], "ant": ["descend"], "ex": "The hikers ascended the steep trail at dawn.", "tip": "a(d)+scend（登る）。名詞ascent。assent（同意する）は同音の引っ掛け。", "q": {"choices": ["descend", "assent", "extend", "mount", "sink"], "ans": "D"}}, {"w": "assert", "pos": "v.", "ja": "断言する、主張する", "syn": ["declare", "affirm", "claim"], "ant": ["deny"], "ex": "The lawyer asserted that her client was innocent.", "tip": "形容詞assertive（自己主張の強い）。desert・insertは綴りの引っ掛け。", "q": {"choices": ["affirm", "deny", "assist", "desert", "insert"], "ans": "A"}}, {"w": "astute", "pos": "adj.", "ja": "鋭い、抜け目のない", "syn": ["shrewd", "perceptive", "sharp"], "ant": ["naive", "obtuse"], "ex": "An astute investor, she sold her shares just before prices fell.", "tip": "同義語shrewdとセットで覚える。astound（驚かせる）とは無関係。", "q": {"choices": ["naive", "astounded", "obtuse", "absolute", "shrewd"], "ans": "E"}}, {"w": "audacious", "pos": "adj.", "ja": "大胆な、向こう見ずな", "syn": ["bold", "daring", "fearless"], "ant": ["timid", "cautious"], "ex": "The explorers made an audacious attempt to cross the frozen sea.", "tip": "名詞audacity。aud（聞く）のaudibleとは別語源なので引っ掛けに注意。", "q": {"choices": ["audible", "timid", "cautious", "daring", "auspicious"], "ans": "D"}}, {"w": "augment", "pos": "v.", "ja": "増やす、増大させる", "syn": ["increase", "enlarge", "supplement"], "ant": ["reduce", "diminish"], "ex": "He took a part-time job to augment his income.", "tip": "aug（増す）→auction（競り上げ）も同系。argue（論じる）は見た目の引っ掛け。", "q": {"choices": ["argue", "diminish", "enlarge", "augur", "reduce"], "ans": "C"}}, {"w": "austere", "pos": "adj.", "ja": "厳格な、簡素な", "syn": ["severe", "stern", "spartan"], "ant": ["lavish", "ornate"], "ex": "The monks lived in austere rooms with no decoration.", "tip": "名詞austerity（緊縮）。「厳しくて飾り気がない」がコアイメージ。", "q": {"choices": ["lavish", "stern", "ornate", "cheerful", "extravagant"], "ans": "B"}}, {"w": "authentic", "pos": "adj.", "ja": "本物の、信頼できる", "syn": ["genuine", "real", "bona fide"], "ant": ["fake", "counterfeit"], "ex": "The museum confirmed that the painting was authentic.", "tip": "author（作者）と同語源→作者自身の手による本物。authoritative（権威ある）は別語。", "q": {"choices": ["counterfeit", "artificial", "authoritative", "synthetic", "genuine"], "ans": "E"}}, {"w": "avarice", "pos": "n.", "ja": "強欲、貪欲", "syn": ["greed", "cupidity", "covetousness"], "ant": ["generosity"], "ex": "The king's avarice led him to tax the people heavily.", "tip": "形容詞avaricious。average（平均）やcowardice（臆病）は語形の引っ掛け。", "q": {"choices": ["generosity", "average", "greed", "cowardice", "avalanche"], "ans": "C"}}, {"w": "aversion", "pos": "n.", "ja": "嫌悪、反感", "syn": ["dislike", "distaste", "antipathy"], "ant": ["fondness", "liking"], "ex": "She has a strong aversion to spiders.", "tip": "a（離れて）+vers（向ける）→顔を背ける。averse（嫌がって）の名詞形。", "q": {"choices": ["affection", "distaste", "version", "diversion", "attraction"], "ans": "B"}}, {"w": "baffle", "pos": "v.", "ja": "困惑させる、当惑させる", "syn": ["puzzle", "perplex", "confound"], "ant": ["clarify", "enlighten"], "ex": "The magician's final trick baffled the entire audience.", "tip": "bewilder・perplexと同じ「頭を混乱させる」グループ。battle・babbleは音の引っ掛け。", "q": {"choices": ["perplex", "explain", "battle", "babble", "enlighten"], "ans": "A"}}, {"w": "banal", "pos": "adj.", "ja": "陳腐な、ありふれた", "syn": ["trite", "hackneyed", "clichéd"], "ant": ["original", "fresh"], "ex": "The movie's plot was so banal that I guessed the ending.", "tip": "「ありきたりでつまらない」。novel（目新しい）は反意語なので引っ掛けに注意。", "q": {"choices": ["novel", "original", "banned", "trite", "vital"], "ans": "D"}}, {"w": "belligerent", "pos": "adj.", "ja": "好戦的な、けんか腰の", "syn": ["hostile", "aggressive", "combative"], "ant": ["peaceful", "conciliatory"], "ex": "The belligerent fan was escorted out of the stadium.", "tip": "bell（戦争、ラテン語bellum）+ger（行う）→戦いを仕掛ける。beautifulとは無関係。", "q": {"choices": ["peaceful", "beautiful", "combative", "elegant", "docile"], "ans": "C"}}, {"w": "benevolent", "pos": "adj.", "ja": "慈悲深い、善意の", "syn": ["kind", "charitable", "generous"], "ant": ["malevolent", "cruel"], "ex": "A benevolent donor paid for the new library.", "tip": "bene（良い）+vol（意志）→善意。mal（悪い）のmalevolentが反意語。", "q": {"choices": ["charitable", "malevolent", "cruel", "relevant", "violent"], "ans": "A"}}, {"w": "benign", "pos": "adj.", "ja": "優しい、無害な（腫瘍が）良性の", "syn": ["harmless", "gentle", "kindly"], "ant": ["malignant", "harmful"], "ex": "Fortunately, the tumor turned out to be benign.", "tip": "bene（良い）系の単語。医学では「良性」⇔malignant「悪性」。", "q": {"choices": ["malignant", "sinister", "hostile", "bright", "harmless"], "ans": "E"}}, {"w": "berate", "pos": "v.", "ja": "激しく叱る、叱りつける", "syn": ["scold", "rebuke", "upbraid"], "ant": ["praise", "compliment"], "ex": "The coach berated the players for their lack of effort.", "tip": "be+rate（叱る）。rate（評価する）やrebate（払い戻し）と混同しないこと。", "q": {"choices": ["praise", "rebuke", "rotate", "rebate", "celebrate"], "ans": "B"}}, {"w": "bewilder", "pos": "v.", "ja": "当惑させる、まごつかせる", "syn": ["confuse", "perplex", "baffle"], "ant": ["enlighten"], "ex": "The complicated directions bewildered the tourists.", "tip": "be+wilder（荒野で迷わせる）→途方に暮れさせる。wilt（しおれる）は引っ掛け。", "q": {"choices": ["clarify", "wilt", "reward", "confuse", "enlighten"], "ans": "D"}}, {"w": "blatant", "pos": "adj.", "ja": "あからさまな、見え透いた", "syn": ["obvious", "flagrant", "glaring"], "ant": ["subtle", "hidden"], "ex": "The essay contained blatant errors in spelling.", "tip": "悪いことが「露骨な」というマイナス文脈で使う。latent（潜在的な）は逆の意味の引っ掛け。", "q": {"choices": ["subtle", "flagrant", "latent", "bland", "discreet"], "ans": "B"}}, {"w": "boisterous", "pos": "adj.", "ja": "騒がしい、にぎやかな", "syn": ["rowdy", "noisy", "unruly"], "ant": ["quiet", "restrained"], "ex": "The boisterous crowd cheered as the team took the field.", "tip": "「元気がよすぎてうるさい」イメージ。moist（湿った）は綴りの引っ掛け。", "q": {"choices": ["quiet", "restrained", "timid", "moist", "rowdy"], "ans": "E"}}, {"w": "bolster", "pos": "v.", "ja": "支える、強化する", "syn": ["support", "strengthen", "reinforce"], "ant": ["undermine", "weaken"], "ex": "The coach's speech bolstered the team's confidence.", "tip": "名詞bolsterは「長枕」→枕で支えるイメージ。bluster（威張り散らす）は引っ掛け。", "q": {"choices": ["reinforce", "undermine", "bluster", "weaken", "boast"], "ans": "A"}}, {"w": "brevity", "pos": "n.", "ja": "簡潔さ、（時間の）短さ", "syn": ["conciseness", "briefness", "terseness"], "ant": ["verbosity", "wordiness"], "ex": "The speech was praised for its brevity and wit.", "tip": "brief（短い）の名詞形。bravery（勇敢さ）と見間違えないこと。", "q": {"choices": ["bravery", "verbosity", "gravity", "conciseness", "levity"], "ans": "D"}}, {"w": "brusque", "pos": "adj.", "ja": "ぶっきらぼうな、そっけない", "syn": ["curt", "blunt", "abrupt"], "ant": ["courteous", "polite"], "ex": "The clerk's brusque reply made the customer feel unwelcome.", "tip": "発音は「ブラスク」。礼儀を欠いた短い返答のイメージで、curtとセットで覚える。", "q": {"choices": ["courteous", "rustic", "curt", "gracious", "gentle"], "ans": "C"}}, {"w": "buoyant", "pos": "adj.", "ja": "浮力のある、快活な", "syn": ["afloat", "cheerful", "resilient"], "ant": ["sinking", "depressed"], "ex": "Despite the bad news, she remained buoyant and optimistic.", "tip": "buoy（ブイ、浮標）から→水に浮かぶ・気分が浮き立つ。boyish（少年らしい）は音の引っ掛け。", "q": {"choices": ["heavy", "gloomy", "boyish", "cheerful", "brilliant"], "ans": "D"}}, {"w": "cajole", "pos": "v.", "ja": "おだてて〜させる、甘言で説得する", "syn": ["coax", "wheedle", "persuade"], "ant": ["coerce"], "ex": "She cajoled her little brother into doing the dishes.", "tip": "力ずくのcoerceではなく「おだてて」動かす。console（慰める）は音の引っ掛け。", "q": {"choices": ["threaten", "coax", "console", "cancel", "jeer"], "ans": "B"}}, {"w": "callous", "pos": "adj.", "ja": "冷淡な、無神経な", "syn": ["heartless", "insensitive", "unfeeling"], "ant": ["compassionate", "sensitive"], "ex": "His callous remark about the accident upset everyone.", "tip": "callus（皮膚のたこ）と同語源→心が硬くなっている。callow（未熟な）は引っ掛け。", "q": {"choices": ["insensitive", "sympathetic", "careful", "callow", "tender"], "ans": "A"}}, {"w": "candid", "pos": "adj.", "ja": "率直な、遠慮のない", "syn": ["frank", "honest", "forthright"], "ant": ["evasive", "guarded"], "ex": "I appreciate your candid opinion of my essay.", "tip": "candidate（候補者）と同語源で「白い・純粋な」→隠し立てしない。candied（砂糖漬けの）は引っ掛け。", "q": {"choices": ["deceptive", "candied", "evasive", "secretive", "frank"], "ans": "E"}}, {"w": "capricious", "pos": "adj.", "ja": "気まぐれな、移り気な", "syn": ["fickle", "impulsive", "erratic"], "ant": ["steady", "consistent"], "ex": "The capricious weather changed from sunny to stormy in minutes.", "tip": "caper（はね回る）・ヤギ（capr-）が語源→ヤギのように予測不能。precious（貴重な）は引っ掛け。", "q": {"choices": ["consistent", "spacious", "fickle", "precious", "cautious"], "ans": "C"}}, {"w": "castigate", "pos": "v.", "ja": "厳しく非難する、懲らしめる", "syn": ["chastise", "rebuke", "reprimand"], "ant": ["praise", "commend"], "ex": "The critic castigated the director for the film's weak plot.", "tip": "cast（純粋な、chaste）→罰して正す。instigate（扇動する）は語尾の引っ掛け。", "q": {"choices": ["chastise", "commend", "instigate", "investigate", "applaud"], "ans": "A"}}, {"w": "caustic", "pos": "adj.", "ja": "辛辣な、腐食性の", "syn": ["biting", "scathing", "sarcastic"], "ant": ["mild", "gentle"], "ex": "Her caustic comments hurt his feelings.", "tip": "ギリシャ語「焼く」が語源→化学では腐食性、比喩で痛烈な。cautious（用心深い）と混同注意。", "q": {"choices": ["soothing", "causal", "cautious", "scathing", "gentle"], "ans": "D"}}, {"w": "cautious", "pos": "adj.", "ja": "用心深い、慎重な", "syn": ["careful", "wary", "prudent"], "ant": ["reckless", "rash"], "ex": "Be cautious when driving on icy roads.", "tip": "caution（注意）の形容詞。caustic（辛辣な）と綴りが似ているので要注意。", "q": {"choices": ["reckless", "rash", "wary", "caustic", "curious"], "ans": "C"}}, {"w": "censure", "pos": "v.", "ja": "（公式に）非難する、とがめる", "syn": ["condemn", "criticize", "denounce"], "ant": ["praise", "approve"], "ex": "The senator was censured for misusing public funds.", "tip": "censor（検閲する）と混同注意。censureは「非難」、censorは「削除・検閲」。", "q": {"choices": ["censor", "approve", "praise", "ensure", "condemn"], "ans": "E"}}, {"w": "chronic", "pos": "adj.", "ja": "慢性的な、常習的な", "syn": ["persistent", "habitual", "long-lasting"], "ant": ["acute", "temporary"], "ex": "He suffers from chronic back pain.", "tip": "chron（時間、chronology）→長い時間続く。反意語acute（急性の）とセットで。", "q": {"choices": ["temporary", "persistent", "chronological", "brief", "comic"], "ans": "B"}}, {"w": "circumspect", "pos": "adj.", "ja": "慎重な、用心深い", "syn": ["cautious", "prudent", "wary"], "ant": ["reckless", "rash"], "ex": "Be circumspect about sharing personal information online.", "tip": "circum（周り）+spect（見る）→周りをよく見てから行動する。suspect（疑う）は引っ掛け。", "q": {"choices": ["reckless", "circular", "suspect", "impulsive", "prudent"], "ans": "E"}}, {"w": "coerce", "pos": "v.", "ja": "強要する、強制する", "syn": ["force", "compel", "pressure"], "ant": [], "ex": "The suspect claimed he had been coerced into confessing.", "tip": "名詞coercion。おだてるcajole・coaxに対して、こちらは「力ずくで」。", "q": {"choices": ["coax", "cohere", "compel", "release", "permit"], "ans": "C"}}, {"w": "cogent", "pos": "adj.", "ja": "説得力のある、筋の通った", "syn": ["convincing", "compelling", "persuasive"], "ant": ["weak", "unconvincing"], "ex": "She presented a cogent argument for extending the school day.", "tip": "co+ag（駆り立てる）→心を動かす。cognitive（認知の）は見た目の引っ掛け。", "q": {"choices": ["cognitive", "convincing", "flimsy", "urgent", "vague"], "ans": "B"}}, {"w": "coherent", "pos": "adj.", "ja": "首尾一貫した、筋の通った", "syn": ["logical", "consistent", "lucid"], "ant": ["incoherent", "confused"], "ex": "After the long flight, he was too tired to give a coherent answer.", "tip": "co+here（くっつく）→話がつながっている。inherent（固有の）は引っ掛け。", "q": {"choices": ["inherent", "confused", "adherent", "logical", "rambling"], "ans": "D"}}, {"w": "collaborate", "pos": "v.", "ja": "協力する、共同で取り組む", "syn": ["cooperate", "partner", "join forces"], "ant": ["compete"], "ex": "The two scientists collaborated on the research project.", "tip": "col（共に）+labor（働く）。corroborate（裏付ける）・elaborate（詳しく述べる）と混同注意。", "q": {"choices": ["cooperate", "corroborate", "compete", "elaborate", "calibrate"], "ans": "A"}}, {"w": "commence", "pos": "v.", "ja": "始まる、開始する", "syn": ["begin", "start", "initiate"], "ant": ["conclude", "end"], "ex": "The ceremony will commence at noon.", "tip": "commencementは「卒業式」（新生活の始まり）。commend（褒める）は綴りの引っ掛け。", "q": {"choices": ["conclude", "commend", "initiate", "comment", "terminate"], "ans": "C"}}, {"w": "commend", "pos": "v.", "ja": "褒める、推薦する", "syn": ["praise", "laud", "applaud"], "ant": ["criticize", "condemn"], "ex": "The mayor commended the firefighters for their bravery.", "tip": "recommend（推薦する）と同系。command（命令する）と見間違えないこと。", "q": {"choices": ["laud", "command", "condemn", "comment", "criticize"], "ans": "A"}}, {"w": "compassion", "pos": "n.", "ja": "思いやり、同情", "syn": ["sympathy", "empathy", "kindness"], "ant": ["cruelty", "indifference"], "ex": "The nurse treated every patient with compassion.", "tip": "com（共に）+pass（苦しむ、passion）→共に苦しむ心。passion（情熱）だけでは意味が違う。", "q": {"choices": ["cruelty", "passion", "compression", "indifference", "sympathy"], "ans": "E"}}, {"w": "compel", "pos": "v.", "ja": "強いる、無理に〜させる", "syn": ["force", "oblige", "coerce"], "ant": [], "ex": "The heavy rain compelled the organizers to cancel the game.", "tip": "com+pel（押す、propel）→押しつけてさせる。repel（はね返す）・dispel（払いのける）は引っ掛け。", "q": {"choices": ["repel", "oblige", "compile", "dispel", "allow"], "ans": "B"}}, {"w": "complacent", "pos": "adj.", "ja": "自己満足した、油断した", "syn": ["smug", "self-satisfied", "unconcerned"], "ant": ["concerned", "vigilant"], "ex": "After winning three games, the team became complacent and lost.", "tip": "「現状に満足して努力しない」ニュアンス。complaining（不平を言う）・compliant（従順な）は引っ掛け。", "q": {"choices": ["complaining", "vigilant", "compliant", "smug", "anxious"], "ans": "D"}}, {"w": "comply", "pos": "v.", "ja": "従う、応じる", "syn": ["obey", "conform", "submit"], "ant": ["defy", "disobey"], "ex": "All visitors must comply with the safety rules.", "tip": "名詞compliance。comply withの形で使う。complain（不平を言う）は引っ掛け。", "q": {"choices": ["defy", "obey", "complain", "compile", "resist"], "ans": "B"}}, {"w": "conciliatory", "pos": "adj.", "ja": "なだめるような、融和的な", "syn": ["appeasing", "placating", "peacemaking"], "ant": ["antagonistic", "hostile"], "ex": "He sent a conciliatory letter to end the argument.", "tip": "concil（会議・和解、council）→仲直りを図る。反意語belligerent（好戦的な）とセットで。", "q": {"choices": ["belligerent", "confrontational", "conspicuous", "placating", "concise"], "ans": "D"}}, {"w": "concise", "pos": "adj.", "ja": "簡潔な", "syn": ["brief", "succinct", "terse"], "ant": ["wordy", "verbose"], "ex": "Please write a concise summary of the article.", "tip": "con+cise（切る、scissors）→余分を切り取った。precise（正確な）は語尾の引っ掛け。", "q": {"choices": ["verbose", "precise", "succinct", "rambling", "concrete"], "ans": "C"}}, {"w": "condone", "pos": "v.", "ja": "（罪などを）容認する、大目に見る", "syn": ["excuse", "overlook", "tolerate"], "ant": ["condemn", "forbid"], "ex": "The school does not condone cheating of any kind.", "tip": "con+done（与える、donate）→許しを与える。condemn（非難する）と正反対。", "q": {"choices": ["overlook", "condemn", "condense", "donate", "punish"], "ans": "A"}}, {"w": "conform", "pos": "v.", "ja": "従う、順応する", "syn": ["comply", "adapt", "follow"], "ant": ["rebel", "deviate"], "ex": "Teenagers often feel pressure to conform to their friends' tastes.", "tip": "con（共に）+form（形）→同じ形に合わせる。confirm（確認する）は綴りの引っ掛け。", "q": {"choices": ["rebel", "confirm", "transform", "deviate", "comply"], "ans": "E"}}, {"w": "congenial", "pos": "adj.", "ja": "気の合う、感じのよい", "syn": ["agreeable", "pleasant", "friendly"], "ant": ["disagreeable", "unfriendly"], "ex": "We found the small town congenial and decided to stay.", "tip": "con（共に）+genial（陽気な）→気性が合う。congenital（先天的な）と混同注意。", "q": {"choices": ["congenital", "hostile", "genius", "agreeable", "ingenious"], "ans": "D"}}, {"w": "conspicuous", "pos": "adj.", "ja": "目立つ、人目を引く", "syn": ["noticeable", "prominent", "obvious"], "ant": ["inconspicuous", "hidden"], "ex": "She wore a bright red coat that made her conspicuous in the crowd.", "tip": "con+spic（見る、spectacle）→よく見える。suspicious（疑わしい）は音の引っ掛け。", "q": {"choices": ["suspicious", "prominent", "hidden", "contiguous", "subtle"], "ans": "B"}}, {"w": "contempt", "pos": "n.", "ja": "軽蔑", "syn": ["scorn", "disdain", "derision"], "ant": ["respect", "admiration"], "ex": "He looked at the cheater with contempt.", "tip": "contemptuous（軽蔑した）とcontemptible（軽蔑に値する）の区別が頻出。content（満足）は引っ掛け。", "q": {"choices": ["respect", "attempt", "content", "admiration", "disdain"], "ans": "E"}}, {"w": "contrite", "pos": "adj.", "ja": "深く悔いている、反省した", "syn": ["remorseful", "repentant", "penitent"], "ant": ["unrepentant", "defiant"], "ex": "The contrite boy apologized for breaking the window.", "tip": "名詞contrition（悔恨）。trite（陳腐な）とは別単語なので注意。", "q": {"choices": ["defiant", "trite", "remorseful", "contrary", "proud"], "ans": "C"}}, {"w": "conventional", "pos": "adj.", "ja": "従来の、慣習的な", "syn": ["traditional", "customary", "orthodox"], "ant": ["unconventional", "innovative"], "ex": "Instead of a conventional wedding, they got married on a mountaintop.", "tip": "convention（慣習）の形容詞。convenient（便利な）は見た目の引っ掛け。", "q": {"choices": ["traditional", "innovative", "convenient", "radical", "eccentric"], "ans": "A"}}, {"w": "convoluted", "pos": "adj.", "ja": "入り組んだ、複雑な", "syn": ["complicated", "intricate", "tangled"], "ant": ["simple", "straightforward"], "ex": "The movie's convoluted plot confused many viewers.", "tip": "con+volut（巻く、revolve）→ぐるぐる巻いて複雑。convinced（確信した）は引っ掛け。", "q": {"choices": ["intricate", "straightforward", "convinced", "devoted", "evolved"], "ans": "A"}}, {"w": "copious", "pos": "adj.", "ja": "大量の、豊富な", "syn": ["abundant", "plentiful", "profuse"], "ant": ["scarce", "meager"], "ex": "She took copious notes during the lecture.", "tip": "ラテン語copia（豊富）→cornucopia（豊穣の角）と同根。copied（写した）は引っ掛け。", "q": {"choices": ["scarce", "meager", "copied", "cozy", "profuse"], "ans": "E"}}, {"w": "corroborate", "pos": "v.", "ja": "裏付ける、確証する", "syn": ["confirm", "verify", "substantiate"], "ant": ["contradict", "refute"], "ex": "Two witnesses corroborated her account of the accident.", "tip": "co+robor（強い、robust）→証拠で強める。collaborate（協力する）と混同注意。", "q": {"choices": ["contradict", "collaborate", "corrode", "verify", "refute"], "ans": "D"}}, {"w": "covert", "pos": "adj.", "ja": "秘密の、ひそかな", "syn": ["secret", "hidden", "clandestine"], "ant": ["overt", "open"], "ex": "The spy carried out a covert mission behind enemy lines.", "tip": "cover（覆う）から。反意語overt（公然の）とセットで。convert（変える）は綴りの引っ掛け。", "q": {"choices": ["overt", "convert", "clandestine", "public", "coward"], "ans": "C"}}, {"w": "credible", "pos": "adj.", "ja": "信頼できる、信じられる", "syn": ["believable", "plausible", "trustworthy"], "ant": ["implausible", "dubious"], "ex": "The detective needed a credible witness.", "tip": "cred（信じる、credit）。credulous（だまされやすい）との区別が頻出の引っ掛け。", "q": {"choices": ["credulous", "plausible", "incredible", "dubious", "edible"], "ans": "B"}}, {"w": "credulous", "pos": "adj.", "ja": "だまされやすい、信じやすい", "syn": ["gullible", "naive", "trusting"], "ant": ["skeptical", "suspicious"], "ex": "The credulous tourists believed the vendor's story about the ancient coins.", "tip": "「人」が信じやすい＝credulous、「話・人」が信用できる＝credible。", "q": {"choices": ["skeptical", "credible", "cynical", "ridiculous", "gullible"], "ans": "E"}}, {"w": "culpable", "pos": "adj.", "ja": "責任がある、とがめられるべき", "syn": ["guilty", "blameworthy", "responsible"], "ant": ["innocent", "blameless"], "ex": "The court found the company culpable for the environmental damage.", "tip": "culp（罪）→culprit（犯人）と同根。capable（有能な）・palpable（明白な）は語尾の引っ掛け。", "q": {"choices": ["capable", "innocent", "blameworthy", "palpable", "harmless"], "ans": "C"}}, {"w": "cumbersome", "pos": "adj.", "ja": "扱いにくい、かさばる", "syn": ["unwieldy", "awkward", "bulky"], "ant": ["manageable", "convenient"], "ex": "The old computer was too cumbersome to carry around.", "tip": "cumber（邪魔する）+some→かさばって邪魔。cumulative（累積的な）は見た目の引っ掛け。", "q": {"choices": ["handy", "unwieldy", "wholesome", "lightweight", "cumulative"], "ans": "B"}}, {"w": "curtail", "pos": "v.", "ja": "削減する、短縮する", "syn": ["reduce", "cut back", "limit"], "ant": ["extend", "expand"], "ex": "The city curtailed bus service because of budget cuts.", "tip": "curt（短い）+tail（しっぽ）→しっぽを短く切ると覚える。entail・retailは語尾の引っ掛け。", "q": {"choices": ["reduce", "extend", "entail", "retail", "prolong"], "ans": "A"}}, {"w": "cynical", "pos": "adj.", "ja": "冷笑的な、人の善意を信じない", "syn": ["skeptical", "distrustful", "pessimistic"], "ant": ["trusting", "optimistic"], "ex": "After years of broken promises, voters became cynical about politicians.", "tip": "古代ギリシャの犬儒派（Cynics）に由来。clinical・cyclicalは綴りの引っ掛け。", "q": {"choices": ["trusting", "clinical", "cyclical", "distrustful", "naive"], "ans": "D"}}, {"w": "daunt", "pos": "v.", " , "ans": "A"}}, {"w": "deleterious", "pos": "adj.", "ja": "有害な", "syn": ["detrimental", "damaging", "harmful"], "ant": ["beneficial", "harmless"], "ex": "Scientists studied the deleterious effects of the chemical on fish.", "tip": "delete（消す）と似ていて「消してしまうほど有害」と覚える。delicious（おいしい）は引っ掛け。", "q": {"choices": ["beneficial", "delicious", "deliberate", "tedious", "harmful"], "ans": "E"}}, {"w": "delineate", "pos": "v.", "ja": "（輪郭を）描く、詳しく説明する", "syn": ["describe", "depict", "outline"], "ant": ["obscure"], "ex": "The report clearly delineates the responsibilities of each team member.", "tip": "de-（完全に）＋line（線）→線でくっきり描く。", "q": {"choices": ["delete", "linger", "outline", "conceal", "deviate"], "ans": "C"}}, {"w": "demeanor", "pos": "n.", "ja": "態度、物腰", "syn": ["manner", "bearing", "conduct"], "ant": [], "ex": "Despite the pressure, the pilot kept a calm demeanor.", "tip": "misdemeanor（軽犯罪）とは別物なので注意。", "q": {"choices": ["misdemeanor", "bearing", "meaning", "penalty", "domain"], "ans": "B"}}, {"w": "denounce", "pos": "v.", "ja": "公然と非難する、告発する", "syn": ["criticize", "condemn", "censure"], "ant": ["praise", "endorse"], "ex": "Community leaders denounced the vandalism at the park.", "tip": "de-（下げる）＋nounce（告げる）→悪く言い立てる。announce・pronounce は引っ掛け。", "q": {"choices": ["announce", "praise", "pronounce", "condemn", "defend"], "ans": "D"}}, {"w": "deplete", "pos": "v.", "ja": "使い果たす、激減させる", "syn": ["drain", "exhaust", "use up"], "ant": ["replenish", "restore"], "ex": "The long winter depleted the village's supply of firewood.", "tip": "de-（離れて）＋plete（満たす）→満ちた状態から減らす。complete（完成する）と反対方向。", "q": {"choices": ["replenish", "complete", "exhaust", "repeat", "delight"], "ans": "C"}}, {"w": "deride", "pos": "v.", "ja": "あざける、嘲笑する", "syn": ["mock", "ridicule", "scoff at"], "ant": ["praise", "respect"], "ex": "Critics derided the inventor's idea, but it later proved brilliant.", "tip": "de-＋ride（笑う：ridiculous と同語源）→笑いものにする。derive（由来する）と混同注意。", "q": {"choices": ["ridicule", "derive", "applaud", "ride", "decide"], "ans": "A"}}, {"w": "despondent", "pos": "adj.", "ja": "落胆した、意気消沈した", "syn": ["hopeless", "dejected", "downcast"], "ant": ["cheerful", "hopeful"], "ex": "After losing the final match, the team was despondent for days.", "tip": "de-（失う）＋spond（約束）→希望を失った。respondent（回答者）は形の引っ掛け。", "q": {"choices": ["respondent", "buoyant", "dependent", "dejected", "defiant"], "ans": "D"}}, {"w": "deter", "pos": "v.", "ja": "思いとどまらせる、阻止する", "syn": ["discourage", "prevent", "dissuade"], "ant": ["encourage", "persuade"], "ex": "Bright lights help deter burglars from approaching the house.", "tip": "de-（離れて）＋ter（恐れさせる：terror）→怖がらせて遠ざける。", "q": {"choices": ["encourage", "detour", "determine", "deteriorate", "dissuade"], "ans": "E"}}, {"w": "diligent", "pos": "adj.", "ja": "勤勉な、念入りな", "syn": ["hardworking", "industrious", "assiduous"], "ant": ["lazy", "negligent"], "ex": "A diligent student, she reviewed her notes every evening.", "tip": "indulgent（甘やかす）や intelligent（賢い）と音が似ているので注意。", "q": {"choices": ["indulgent", "industrious", "idle", "intelligent", "diluted"], "ans": "B"}}, {"w": "discern", "pos": "v.", "ja": "見分ける、識別する", "syn": ["perceive", "detect", "distinguish"], "ant": ["overlook"], "ex": "In the fog, it was hard to discern the outline of the ship.", "tip": "dis-（分けて）＋cern（ふるいにかける）→見分ける。concern（関係する）は引っ掛け。", "q": {"choices": ["perceive", "concern", "discard", "ignore", "disturb"], "ans": "A"}}, {"w": "disdain", "pos": "n.", "ja": "軽蔑、侮蔑", "syn": ["scorn", "derision", "contempt"], "ant": ["respect", "admiration"], "ex": "He looked at the cheap souvenir with obvious disdain.", "tip": "dis-（否定）＋dain（価値あると見なす）→価値なしと見下す。動詞としても使う。", "q": {"choices": ["admiration", "domain", "disguise", "regard", "contempt"], "ans": "E"}}, {"w": "disparage", "pos": "v.", "ja": "けなす、見くびる", "syn": ["denigrate", "deprecate", "belittle"], "ant": ["praise", "extol"], "ex": "It is unkind to disparage other people's efforts.", "tip": "dis-（下に）＋par（同等）→同等より下に扱う。disperse（散らす）と混同しない。", "q": {"choices": ["disperse", "encourage", "belittle", "dispatch", "compliment"], "ans": "C"}}, {"w": "divulge", "pos": "v.", "ja": "（秘密を）漏らす、明かす", "syn": ["reveal", "disclose", "leak"], "ant": ["conceal", "hide"], "ex": "The reporter refused to divulge the name of her source.", "tip": "di-（広く）＋vulg（大衆：vulgar）→大衆に広める＝秘密を漏らす。", "q": {"choices": ["indulge", "disclose", "conceal", "divide", "bulge"], "ans": "B"}}, {"w": "dogmatic", "pos": "adj.", "ja": "独断的な、教条的な", "syn": ["doctrinaire", "opinionated", "dictatorial"], "ant": ["open-minded", "flexible"], "ex": "His dogmatic attitude made it impossible to have a real discussion.", "tip": "dogma（教義）から。自説を絶対視して他を受け付けない態度。", "q": {"choices": ["dramatic", "flexible", "diplomatic", "opinionated", "democratic"], "ans": "D"}}, {"w": "dormant", "pos": "adj.", "ja": "休止中の、眠っている", "syn": ["latent", "inactive", "sleeping"], "ant": ["active", "awake"], "ex": "The volcano had been dormant for centuries before it erupted.", "tip": "dormitory（寮＝眠る場所）と同じ dorm（眠る）。dominant（支配的な）は引っ掛け。", "q": {"choices": ["active", "dominant", "inactive", "doormat", "vigorous"], "ans": "C"}}, {"w": "dubious", "pos": "adj.", "ja": "疑わしい、半信半疑の", "syn": ["doubtful", "questionable", "suspicious"], "ant": ["certain", "reliable"], "ex": "She was dubious about the salesman's claim that the car never needed repairs.", "tip": "dub は「二つ（double）」→二つの間で迷う＝疑わしい。devious（ずる賢い）とは別語。", "q": {"choices": ["doubtful", "certain", "dubbed", "obvious", "devious"], "ans": "A"}}, {"w": "ebullient", "pos": "adj.", "ja": "熱狂的な、元気あふれる", "syn": ["exuberant", "effervescent", "enthusiastic"], "ant": ["subdued", "depressed"], "ex": "The ebullient fans sang all the way home after the victory.", "tip": "e-（外へ）＋bull（沸騰する：boil）→喜びが沸き立つ。belligerent（好戦的な）は引っ掛け。", "q": {"choices": ["subdued", "eloquent", "belligerent", "enthusiastic", "apathetic"], "ans": "D"}}, {"w": "eccentric", "pos": "adj.", "ja": "風変わりな、常軌を逸した", "syn": ["odd", "unconventional", "peculiar"], "ant": ["conventional", "ordinary"], "ex": "The eccentric artist painted only with his left foot.", "tip": "ec-（外れて）＋centr（中心）→中心から外れた＝普通でない。concentric（同心の）は反対。", "q": {"choices": ["concentric", "ordinary", "electric", "central", "peculiar"], "ans": "E"}}, {"w": "eclectic", "pos": "adj.", "ja": "折衷的な、多様なものから取り入れた", "syn": ["varied", "diverse", "wide-ranging"], "ant": ["narrow", "uniform"], "ex": "Her eclectic music collection includes jazz, opera, and hip-hop.", "tip": "ec-（外から）＋lect（選ぶ：select）→あちこちから選び取る。electric とは無関係。", "q": {"choices": ["electric", "diverse", "uniform", "ecstatic", "exclusive"], "ans": "B"}}, {"w": "elated", "pos": "adj.", "ja": "大喜びの、意気揚々とした", "syn": ["overjoyed", "jubilant", "thrilled"], "ant": ["dejected", "despondent"], "ex": "Maria was elated when she received her acceptance letter.", "tip": "e-（外へ）＋late（運ぶ）→気分が高く持ち上げられた。deflated（しぼんだ）は反対語。", "q": {"choices": ["jubilant", "related", "dejected", "belated", "deflated"], "ans": "A"}}, {"w": "elicit", "pos": "v.", "ja": "（反応・情報を）引き出す", "syn": ["draw out", "extract", "evoke"], "ant": ["suppress"], "ex": "The teacher's question elicited a lively debate among the students.", "tip": "e-（外へ）＋licit（誘い出す）。illicit（不法な）とは発音が似ていても全く別の語。", "q": {"choices": ["illicit", "suppress", "elect", "delight", "evoke"], "ans": "E"}}, {"w": "eloquent", "pos": "adj.", "ja": "雄弁な、表現力豊かな", "syn": ["fluent", "articulate", "expressive"], "ant": ["inarticulate", "tongue-tied"], "ex": "Her eloquent speech moved many in the audience to tears.", "tip": "e-（外へ）＋loqu（話す：loquacious）→言葉があふれ出る。", "q": {"choices": ["eminent", "inarticulate", "articulate", "frequent", "eligible"], "ans": "C"}}, {"w": "elusive", "pos": "adj.", "ja": "捉えにくい、つかまえにくい", "syn": ["slippery", "evasive", "baffling"], "ant": ["attainable"], "ex": "The elusive fox escaped every trap the farmer set.", "tip": "elude（巧みに逃れる）の形容詞。allusive（暗示的な）や illusive（錯覚の）と区別。", "q": {"choices": ["allusive", "evasive", "obvious", "inclusive", "abusive"], "ans": "B"}}, {"w": "embellish", "pos": "v.", "ja": "飾る、（話を）誇張する", "syn": ["decorate", "exaggerate", "adorn"], "ant": ["simplify", "strip"], "ex": "Grandpa tends to embellish his fishing stories each time he tells them.", "tip": "em-＋bell（美しい：belle）→美しくする。embezzle（横領する）は形の引っ掛け。", "q": {"choices": ["embezzle", "abolish", "simplify", "adorn", "establish"], "ans": "D"}}, {"w": "eminent", "pos": "adj.", "ja": "著名な、高名な", "syn": ["renowned", "distinguished", "prominent"], "ant": ["obscure", "unknown"], "ex": "An eminent physicist was invited to give the graduation speech.", "tip": "e-（外へ）＋min（突き出る）→抜きん出た。imminent（差し迫った）は最頻出の引っ掛け。", "q": {"choices": ["imminent", "obscure", "distinguished", "emigrant", "ordinary"], "ans": "C"}}, {"w": "emulate", "pos": "v.", "ja": "見習う、張り合う", "syn": ["imitate", "copy", "rival"], "ant": ["ignore"], "ex": "Young players often try to emulate their favorite athletes.", "tip": "尊敬する人を手本に「追いつこう・まねしよう」とする意味。stimulate とは別。", "q": {"choices": ["imitate", "emancipate", "stimulate", "ignore", "emanate"], "ans": "A"}}, {"w": "enigma", "pos": "n.", "ja": "謎、不可解な人・物", "syn": ["puzzle", "riddle", "mystery"], "ant": ["solution"], "ex": "How the ancient stones were moved remains an enigma.", "tip": "形容詞 enigmatic（謎めいた）も頻出。stigma（汚名）・dogma（教義）は形の引っ掛け。", "q": {"choices": ["stigma", "solution", "dogma", "mystery", "emblem"], "ans": "D"}}, {"w": "ephemeral", "pos": "adj.", "ja": "はかない、つかの間の", "syn": ["fleeting", "short-lived", "transient"], "ant": ["permanent", "enduring"], "ex": "The beauty of cherry blossoms is ephemeral, lasting only a week or two.", "tip": "epi-（上に）＋hemera（1日）→1日だけの命＝はかない。ethereal（天上の、軽やかな）と混同注意。", "q": {"choices": ["eternal", "ethereal", "emphatic", "enduring", "transient"], "ans": "E"}}, {"w": "eradicate", "pos": "v.", "ja": "根絶する、撲滅する", "syn": ["wipe out", "eliminate", "abolish"], "ant": ["establish", "foster"], "ex": "Vaccines helped eradicate smallpox worldwide.", "tip": "e-（外へ）＋radic（根：radish）→根こそぎ取り除く。", "q": {"choices": ["radiate", "eliminate", "educate", "cultivate", "irritate"], "ans": "B"}}, {"w": "erratic", "pos": "adj.", "ja": "不規則な、気まぐれな", "syn": ["unpredictable", "irregular", "inconsistent"], "ant": ["steady", "consistent"], "ex": "The car's erratic movements suggested the driver was falling asleep.", "tip": "err（さまよう、誤る：error）→あちこちさまよう＝一定しない。", "q": {"choices": ["unpredictable", "steady", "ecstatic", "aromatic", "reliable"], "ans": "A"}}, {"w": "erudite", "pos": "adj.", "ja": "博学な、学識のある", "syn": ["learned", "knowledgeable", "scholarly"], "ant": ["ignorant", "uneducated"], "ex": "The erudite professor could quote poetry in five languages.", "tip": "e-（外へ）＋rud（粗野な：rude）→粗野さを抜け出た＝教養ある。crude・rude は引っ掛け。", "q": {"choices": ["crude", "ignorant", "rude", "eruptive", "scholarly"], "ans": "E"}}, {"w": "exacerbate", "pos": "v.", "ja": "（問題・痛みを）悪化させる", "syn": ["worsen", "aggravate", "intensify"], "ant": ["alleviate", "relieve"], "ex": "Scratching the rash will only exacerbate the itching.", "tip": "ex-（強く）＋acerb（苦い：acerbic）→さらに苦くする。exaggerate（誇張する）と混同しない。", "q": {"choices": ["alleviate", "exaggerate", "aggravate", "excavate", "exhilarate"], "ans": "C"}}, {"w": "exemplary", "pos": "adj.", "ja": "模範的な、見事な", "syn": ["model", "commendable", "ideal"], "ant": ["deplorable"], "ex": "The firefighter received an award for her exemplary courage.", "tip": "example（手本）の形容詞形。exempt（免除された）は形の引っ掛け。", "q": {"choices": ["exempt", "commendable", "temporary", "deplorable", "exploratory"], "ans": "B"}}, {"w": "exonerate", "pos": "v.", "ja": "無罪にする、嫌疑を晴らす", "syn": ["absolve", "acquit", "vindicate"], "ant": ["convict", "blame"], "ex": "New DNA evidence exonerated the man after ten years in prison.", "tip": "ex-（外へ）＋oner（重荷：onerous）→罪の重荷を取り除く。", "q": {"choices": ["exaggerate", "convict", "exasperate", "acquit", "honor"], "ans": "D"}}, {"w": "expedite", "pos": "v.", "ja": "促進する、早める", "syn": ["accelerate", "hasten", "speed up"], "ant": ["delay", "hinder"], "ex": "Paying an extra fee will expedite the delivery of your passport.", "tip": "ex-（外へ）＋ped（足）→足かせを外して速く進める。impede（妨げる）は反対語。", "q": {"choices": ["delay", "expire", "hasten", "impede", "export"], "ans": "C"}}, {"w": "extol", "pos": "v.", "ja": "絶賛する、褒めたたえる", "syn": ["praise", "laud", "acclaim"], "ant": ["criticize", "disparage"], "ex": "The coach extolled the team's hard work after the season.", "tip": "ex-（上へ）＋tol（持ち上げる）→褒めて持ち上げる。extort（ゆすり取る）は形の引っ掛け。", "q": {"choices": ["laud", "extort", "toll", "condemn", "extend"], "ans": "A"}}, {"w": "exuberant", "pos": "adj.", "ja": "元気あふれる、熱狂的な", "syn": ["high-spirited", "enthusiastic", "buoyant"], "ant": ["gloomy", "lethargic"], "ex": "The exuberant puppy leaped around the yard.", "tip": "ex-（外へ）＋uber（豊かな）→あふれ出るほど元気。exorbitant（法外な）と混同注意。", "q": {"choices": ["exorbitant", "lethargic", "exhausted", "buoyant", "exempt"], "ans": "D"}}, {"w": "fabricate", "pos": "v.", "ja": "でっち上げる、製造する", "syn": ["invent", "manufacture", "concoct"], "ant": ["verify"], "ex": "The witness was accused of fabricating his story.", "tip": "fabric（布・構造）から「組み立てる」→話を組み立てる＝捏造する。", "q": {"choices": ["verify", "demolish", "facilitate", "liberate", "concoct"], "ans": "E"}}, {"w": "facetious", "pos": "adj.", "ja": "ふざけた、おどけた（場違いに）", "syn": ["joking", "flippant", "tongue-in-cheek"], "ant": ["serious", "solemn"], "ex": "His facetious remark about the fire drill annoyed the principal.", "tip": "真面目な場面で冗談を言う感じ。fictitious（架空の）とは別。", "q": {"choices": ["fictitious", "flippant", "solemn", "ferocious", "factual"], "ans": "B"}}, {"w": "fallacy", "pos": "n.", "ja": "誤った考え、誤謬", "syn": ["misconception", "error", "delusion"], "ant": ["truth", "fact"], "ex": "It is a fallacy that people use only ten percent of their brains.", "tip": "fall（落ちる）ではなく fail/false（誤り）と同語源。", "q": {"choices": ["misconception", "fact", "falcon", "legacy", "faculty"], "ans": "A"}}, {"w": "fastidious", "pos": "adj.", "ja": "細かいことにうるさい、潔癖な", "syn": ["meticulous", "finicky", "fussy"], "ant": ["careless", "sloppy"], "ex": "The fastidious chef inspected every plate before it left the kitchen.", "tip": "fast（速い）とは無関係。「好みがうるさい・きちょうめん」の意。", "q": {"choices": ["fast", "tedious", "sloppy", "hideous", "fussy"], "ans": "E"}}, {"w": "feasible", "pos": "adj.", "ja": "実行可能な、実現できる", "syn": ["possible", "practicable", "viable"], "ant": ["impossible", "impractical"], "ex": "Building a bridge across the river is expensive but feasible.", "tip": "フランス語 faire（する）由来→「やれる」。feeble（弱い）と混同しない。", "q": {"choices": ["festive", "impractical", "viable", "feeble", "forcible"], "ans": "C"}}, {"w": "fervent", "pos": "adj.", "ja": "熱烈な、熱心な", "syn": ["passionate", "ardent", "zealous"], "ant": ["apathetic", "indifferent"], "ex": "She is a fervent supporter of animal rights.", "tip": "ferv（沸く・熱い：fervor（熱情））→熱い思い。servant（召使い）は音の引っ掛け。", "q": {"choices": ["frequent", "ardent", "apathetic", "fragrant", "servant"], "ans": "B"}}, {"w": "fickle", "pos": "adj.", "ja": "気まぐれな、移り気な", "syn": ["changeable", "inconstant", "capricious"], "ant": ["steadfast", "loyal"], "ex": "Fickle fans abandoned the team as soon as it started losing.", "tip": "気分や好みがころころ変わる人に使う。tickle（くすぐる）と見間違えない。", "q": {"choices": ["steadfast", "prickly", "faithful", "capricious", "freckled"], "ans": "D"}}, {"w": "flagrant", "pos": "adj.", "ja": "目に余る、甚だしい", "syn": ["glaring", "blatant", "outrageous"], "ant": ["subtle", "minor"], "ex": "The referee called a foul for the flagrant elbow to the face.", "tip": "flag（燃える：flame）→燃えるように目立つ悪事。fragrant（香りのよい）は最頻出の引っ掛け。", "q": {"choices": ["fragrant", "subtle", "blatant", "flexible", "hidden"], "ans": "C"}}, {"w": "flourish", "pos": "v.", "ja": "繁栄する、栄える", "syn": ["prosper", "thrive", "bloom"], "ant": ["wither", "decline"], "ex": "The small bakery began to flourish after a glowing review.", "tip": "flour/flower（花）→花が咲くように栄える。flounder（もがく）は反対寄りの引っ掛け。", "q": {"choices": ["thrive", "flounder", "wither", "nourish", "flatter"], "ans": "A"}}, {"w": "fortitude", "pos": "n.", "ja": "不屈の精神、忍耐力", "syn": ["courage", "resilience", "grit"], "ant": ["cowardice", "weakness"], "ex": "She faced months of painful treatment with remarkable fortitude.", "tip": "fort（強い：fortress, fortify）→心の強さ。gratitude（感謝）は形の引っ掛け。", "q": {"choices": ["fortune", "cowardice", "fortress", "grit", "gratitude"], "ans": "D"}}, {"w": "foster", "pos": "v.", "ja": "育成する、促進する", "syn": ["promote", "cultivate", "nurture"], "ant": ["suppress", "hinder"], "ex": "Group projects can foster cooperation among students.", "tip": "foster parent（里親）の「育てる」から、考えや関係を育む意味に広がる。", "q": {"choices": ["fester", "suppress", "forsake", "faster", "nurture"], "ans": "E"}}, {"w": "frivolous", "pos": "adj.", "ja": "軽薄な、取るに足らない", "syn": ["silly", "trivial", "superficial"], "ant": ["serious", "important"], "ex": "He wasted his allowance on frivolous gadgets.", "tip": "真剣さや価値に欠けるもの。furious（激怒した）は音の引っ掛け。", "q": {"choices": ["serious", "trivial", "furious", "frigid", "generous"], "ans": "B"}}, {"w": "frugal", "pos": "adj.", "ja": "倹約な、質素な", "syn": ["thrifty", "economical", "sparing"], "ant": ["extravagant", "wasteful"], "ex": "By being frugal, the family saved enough for a trip to Japan.", "tip": "fruit（実り）と同語源で「無駄なく役立てる」。fragile（壊れやすい）とは無関係。", "q": {"choices": ["thrifty", "fragile", "wasteful", "frantic", "fruitful"], "ans": "A"}}, {"w": "furtive", "pos": "adj.", "ja": "こそこそした、ひそかな", "syn": ["secretive", "sly", "stealthy"], "ant": ["open", "overt"], "ex": "The boy cast a furtive glance at the cookie jar.", "tip": "ラテン語 fur（泥棒）→泥棒のようにこっそり。futile・fertile は形の引っ掛け。", "q": {"choices": ["festive", "overt", "fertile", "futile", "stealthy"], "ans": "E"}}, {"w": "futile", "pos": "adj.", "ja": "無駄な、無益な", "syn": ["useless", "fruitless", "pointless"], "ant": ["effective", "fruitful"], "ex": "It was futile to argue with the referee once the call was made.", "tip": "「漏れ出てしまう」が原義→努力が全部こぼれて無駄に。fertile（肥沃な）と混同注意。", "q": {"choices": ["fertile", "fruitful", "pointless", "feudal", "facile"], "ans": "C"}}, {"w": "galvanize", "pos": "v.", "ja": "奮い立たせる、（人を）行動へ駆り立てる", "syn": ["stimulate", "rouse", "spur"], "ant": ["discourage", "pacify"], "ex": "The flood galvanized the town into building a stronger levee.", "tip": "電気で筋肉が動くことを発見したガルヴァーニの名から→電気ショックのように奮起させる。", "q": {"choices": ["gallop", "rouse", "pacify", "vandalize", "organize"], "ans": "B"}}, {"w": "garish", "pos": "adj.", "ja": "けばけばしい、派手すぎる", "syn": ["flashy", "gaudy", "loud"], "ant": ["subdued", "tasteful"], "ex": "The garish neon sign clashed with the quiet neighborhood.", "tip": "色が派手で趣味が悪いこと。garnish（料理の付け合わせ）は形の引っ掛け。", "q": {"choices": ["garnish", "tasteful", "gracious", "gaudy", "gloomy"], "ans": "D"}}, {"w": "garrulous", "pos": "adj.", "ja": "おしゃべりな、口数の多い", "syn": ["loquacious", "chatty", "talkative"], "ant": ["taciturn", "reticent"], "ex": "The garrulous passenger talked for the entire four-hour flight.", "tip": "ガラガラうるさくしゃべる、と音で覚える。querulous（不平を言う）と区別。", "q": {"choices": ["taciturn", "generous", "talkative", "querulous", "ridiculous"], "ans": "C"}}, {"w": "gaunt", "pos": "adj.", "ja": "やせこけた、やつれた", "syn": ["haggard", "emaciated", "skeletal"], "ant": ["plump", "robust"], "ex": "After weeks lost in the mountains, the climber looked gaunt and pale.", "tip": "病気や飢えで骨ばった様子。giant（巨大な）は形の引っ掛け。", "q": {"choices": ["emaciated", "giant", "plump", "gallant", "haunted"], "ans": "A"}}, {"w": "genial", "pos": "adj.", "ja": "愛想のよい、温和な", "syn": ["friendly", "amiable", "cordial"], "ant": ["unfriendly", "surly"], "ex": "Our genial host made every guest feel welcome.", "tip": "genius（天才）・genuine（本物の）とは別。人柄の温かさを表す。", "q": {"choices": ["genuine", "surly", "menial", "cordial", "general"], "ans": "D"}}, {"w": "glib", "pos": "adj.", "ja": "口先だけの、ぺらぺらとよくしゃべる", "syn": ["smooth-talking", "facile", "slick"], "ant": ["sincere", "halting"], "ex": "The politician gave a glib answer that avoided the real question.", "tip": "流暢だが中身や誠実さがない、という否定的ニュアンス。", "q": {"choices": ["glum", "sincere", "global", "gleeful", "slick"], "ans": "E"}}, {"w": "gratify", "pos": "v.", "ja": "喜ばせる、満足させる", "syn": ["please", "satisfy", "delight"], "ant": ["displease", "frustrate"], "ex": "It gratified the teacher to see her students succeed.", "tip": "grat（喜び・感謝：grateful）→喜ばせる。ratify（批准する）は形の引っ掛け。", "q": {"choices": ["gravitate", "satisfy", "frustrate", "ratify", "glorify"], "ans": "B"}}, {"w": "gratuitous", "pos": "adj.", "ja": "不必要な、いわれのない；無料の", "syn": ["unnecessary", "unwarranted", "uncalled-for"], "ant": ["justified", "warranted"], "ex": "Critics complained about the gratuitous violence in the film.", "tip": "原義は「無償の」→理由もなく与えられた＝必要のない。grateful（感謝している）とは別。", "q": {"choices": ["unwarranted", "grateful", "justified", "gracious", "generous"], "ans": "A"}}, {"w": "gregarious", "pos": "adj.", "ja": "社交的な、群れを好む", "syn": ["outgoing", "convivial", "sociable"], "ant": ["reclusive", "introverted"], "ex": "Gregarious by nature, Ken made friends wherever he went.", "tip": "greg（群れ：congregate）→群れたがる。egregious（ひどい）は形の引っ掛け。", "q": {"choices": ["egregious", "reclusive", "grievous", "gorgeous", "sociable"], "ans": "E"}}, {"w": "grueling", "pos": "adj.", "ja": "過酷な、へとへとにさせる", "syn": ["exhausting", "arduous", "punishing"], "ant": ["easy", "effortless"], "ex": "The marathon's final hill is especially grueling.", "tip": "gruel（薄いおかゆ）→罰として粗末な食事を与えられるほどきつい、が由来。gruesome（ぞっとする）と区別。", "q": {"choices": ["effortless", "gruesome", "arduous", "grumbling", "fueling"], "ans": "C"}}, {"w": "guile", "pos": "n.", "ja": "狡猾さ、ずる賢さ", "syn": ["cunning", "craftiness", "deceit"], "ant": ["honesty", "candor"], "ex": "The fox used guile rather than strength to get the cheese.", "tip": "beguile（だます）の中に入っている語。guilt（罪悪感）は形の引っ掛け。", "q": {"choices": ["guilt", "cunning", "candor", "guide", "style"], "ans": "B"}}, {"w": "gullible", "pos": "adj.", "ja": "だまされやすい", "syn": ["naive", "trusting", "credulous"], "ant": ["skeptical", "wary"], "ex": "The gullible tourist paid twenty dollars for a fake watch.", "tip": "gull（カモメ→「カモ」にする、だます）から。credulous も同義で頻出。", "q": {"choices": ["guilty", "skeptical", "gallant", "credulous", "edible"], "ans": "D"}}, {"w": "hackneyed", "pos": "adj.", "ja": "陳腐な、使い古された", "syn": ["clichéd", "trite", "stale"], "ant": ["original", "fresh"], "ex": "The essay was full of hackneyed phrases like \"at the end of the day.\"", "tip": "hackney（貸し馬）→誰もが使い回した＝ありふれた。", "q": {"choices": ["hacked", "original", "trite", "honeyed", "hectic"], "ans": "C"}}, {"w": "hamper", "pos": "v.", "ja": "妨げる、邪魔する", "syn": ["hinder", "impede", "obstruct"], "ant": ["facilitate", "aid"], "ex": "Heavy snow hampered the rescue efforts.", "tip": "名詞では「（ふた付きの）かご」の意もあるが、試験では動詞「妨げる」が中心。pamper（甘やかす）と区別。", "q": {"choices": ["obstruct", "pamper", "facilitate", "hammer", "prosper"], "ans": "A"}}, {"w": "haphazard", "pos": "adj.", "ja": "無計画な、でたらめな", "syn": ["disorganized", "random", "careless"], "ant": ["methodical", "systematic"], "ex": "Books were stacked in a haphazard way all over the floor.", "tip": "hap（偶然：happen）＋hazard（運）→行き当たりばったり。hazardous（危険な）は引っ掛け。", "q": {"choices": ["hazardous", "methodical", "happy", "random", "deliberate"], "ans": "D"}}, {"w": "harbinger", "pos": "n.", "ja": "前触れ、先駆け", "syn": ["herald", "forerunner", "omen"], "ant": [], "ex": "The first robin is often seen as a harbinger of spring.", "tip": "元は「宿を先に手配する先遣役」→先に来て知らせるもの。harbor（港）とは別。", "q": {"choices": ["harbor", "aftermath", "scavenger", "passenger", "forerunner"], "ans": "E"}}, {"w": "hardy", "pos": "adj.", "ja": "頑丈な、耐久力のある", "syn": ["sturdy", "robust", "tough"], "ant": ["frail", "delicate"], "ex": "Only hardy plants can survive the harsh desert climate.", "tip": "hard（固い）から→寒さや困難に強い。hardly（ほとんど〜ない）・tardy（遅れた）は引っ掛け。", "q": {"choices": ["tardy", "robust", "frail", "hasty", "hardly"], "ans": "B"}}, {"w": "haughty", "pos": "adj.", "ja": "傲慢な、横柄な", "syn": ["arrogant", "disdainful", "supercilious"], "ant": ["humble", "modest"], "ex": "The haughty queen refused to speak to commoners.", "tip": "haut（高い：フランス語）→お高くとまった。naughty（いたずらな）は音の引っ掛け。", "q": {"choices": ["arrogant", "naughty", "humble", "hearty", "thoughtful"], "ans": "A"}}, {"w": "heed", "pos": "v.", "ja": "注意を払う、（忠告を）聞き入れる", "syn": ["listen to", "mind", "take notice of"], "ant": ["ignore", "disregard"], "ex": "The hikers failed to heed the warning about falling rocks.", "tip": "heedless（不注意な）も頻出。need・feed などの音の似た語に惑わされないこと。", "q": {"choices": ["heal", "ignore", "need", "feed", "mind"], "ans": "E"}}, {"w": "heinous", "pos": "adj.", "ja": "極悪な、憎むべき", "syn": ["wicked", "atrocious", "monstrous"], "ant": ["admirable", "virtuous"], "ex": "The dictator was tried for heinous crimes against his people.", "tip": "古フランス語 haine（憎しみ：hate）から。発音は「ヘイナス」。", "q": {"choices": ["hilarious", "virtuous", "atrocious", "harmless", "heroic"], "ans": "C"}}, {"w": "heresy", "pos": "n.", "ja": "異端、（一般常識に反する）異説", "syn": ["dissent", "unorthodoxy", "heterodoxy"], "ant": ["orthodoxy"], "ex": "In the 1600s, claiming that Earth orbits the sun was considered heresy.", "tip": "正統（orthodoxy）に反する考え。hearsay（うわさ）は音の引っ掛け。", "q": {"choices": ["hearsay", "unorthodoxy", "orthodoxy", "history", "harmony"], "ans": "B"}}, {"w": "hinder", "pos": "v.", "ja": "妨げる、遅らせる", "syn": ["impede", "obstruct", "hamper"], "ant": ["help", "facilitate"], "ex": "Lack of sleep can hinder your ability to concentrate.", "tip": "hind（後ろ）→後ろに引き留める。名詞形 hindrance（障害）。", "q": {"choices": ["assist", "wander", "render", "hamper", "ponder"], "ans": "D"}}, {"w": "hostile", "pos": "adj.", "ja": "敵対的な、敵意のある", "syn": ["unfriendly", "antagonistic", "belligerent"], "ant": ["friendly", "amicable"], "ex": "The crowd grew hostile when the concert was canceled.", "tip": "host（敵：ラテン語 hostis）から。hospitable（もてなしのよい）は反対の引っ掛け。", "q": {"choices": ["hospitable", "amicable", "antagonistic", "docile", "fertile"], "ans": "C"}}, {"w": "hubris", "pos": "n.", "ja": "傲慢、過度の思い上がり", "syn": ["arrogance", "conceit", "pride"], "ant": ["humility", "modesty"], "ex": "The general's hubris led him to underestimate his enemy.", "tip": "ギリシャ悲劇で神の罰を招く「思い上がり」。debris（がれき）とは無関係。", "q": {"choices": ["arrogance", "humility", "debris", "humor", "hybrid"], "ans": "A"}}, {"w": "hypocrisy", "pos": "n.", "ja": "偽善", "syn": ["insincerity", "pretense", "duplicity"], "ant": ["sincerity", "honesty"], "ex": "Preaching honesty while lying to friends is pure hypocrisy.", "tip": "hypo-（下に）＋crisy（演じる）→仮面の下で演じる＝偽善。人は hypocrite。", "q": {"choices": ["hypothesis", "sincerity", "democracy", "duplicity", "hypnosis"], "ans": "D"}}, {"w": "idiosyncrasy", "pos": "n.", "ja": "（個人の）特異性、独特の癖", "syn": ["peculiarity", "eccentricity", "quirk"], "ant": ["conformity"], "ex": "One of her idiosyncrasies is eating pizza with a fork and knife.", "tip": "idio-（独自の：idiom）＋syn（共に）＋crasy（混合）→その人独自の性質。", "q": {"choices": ["ideology", "conformity", "idiocy", "synchrony", "quirk"], "ans": "E"}}, {"w": "illicit", "pos": "adj.", "ja": "不法な、不正な", "syn": ["illegal", "unlawful", "illegitimate"], "ant": ["legal", "lawful"], "ex": "Police discovered an illicit trade in stolen phones.", "tip": "il-（否定）＋licit（許された：license）→許されていない。elicit（引き出す）と混同注意。", "q": {"choices": ["elicit", "unlawful", "legitimate", "explicit", "implicit"], "ans": "B"}}, {"w": "immutable", "pos": "adj.", "ja": "不変の、変えられない", "syn": ["unchangeable", "fixed", "permanent"], "ant": ["changeable", "mutable"], "ex": "Some people believe that the laws of physics are immutable.", "tip": "im-（否定）＋mut（変わる：mutation）→変わらない。mute（無言の）とは別。", "q": {"choices": ["unchangeable", "mute", "volatile", "immaculate", "imitable"], "ans": "A"}}, {"w": "impartial", "pos": "adj.", "ja": "公平な、偏らない", "syn": ["unbiased", "fair", "neutral"], "ant": ["biased", "partisan"], "ex": "A judge must remain impartial throughout the trial.", "tip": "im-（否定）＋partial（一方に偏った）→偏らない。partial は反対語なので注意。", "q": {"choices": ["partial", "biased", "impatient", "imperial", "neutral"], "ans": "E"}}, {"w": "impede", "pos": "v.", "ja": "妨げる、遅らせる", "syn": ["hinder", "block", "obstruct"], "ant": ["facilitate", "expedite"], "ex": "Fallen trees impeded traffic on the highway.", "tip": "im-（中に）＋ped（足）→足をからめて進ませない。expedite（促進する）と対で覚える。", "q": {"choices": ["expedite", "impel", "obstruct", "impose", "stampede"], "ans": "C"}}, {"w": "impetuous", "pos": "adj.", "ja": "衝動的な、性急な", "syn": ["rash", "impulsive", "hasty"], "ant": ["cautious", "deliberate"], "ex": "In an impetuous moment, he quit his job without another one lined up.", "tip": "impetus（勢い）から→勢いにまかせて行動する。impervious（影響されない）と区別。", "q": {"choices": ["impervious", "impulsive", "cautious", "virtuous", "impressive"], "ans": "B"}}, {"w": "implicit", "pos": "adj.", "ja": "暗黙の、それとなく示された", "syn": ["implied", "unspoken", "tacit"], "ant": ["explicit", "stated"], "ex": "There was an implicit agreement that no one would mention the accident.", "tip": "im-（中に）＋plic（折りたたむ）→中に含まれた＝暗に示す。explicit（明示的な）が反対。", "q": {"choices": ["explicit", "illicit", "complicit", "tacit", "simplistic"], "ans": "D"}}, {"w": "incessant", "pos": "adj.", "ja": "絶え間ない、ひっきりなしの", "syn": ["constant", "relentless", "unceasing"], "ant": ["intermittent", "occasional"], "ex": "The incessant barking of the dog kept us awake all night.", "tip": "in-（否定）＋cess（やめる：cease）→やまない。incensed（激怒した）は形の引っ掛け。", "q": {"choices": ["intermittent", "incensed", "unceasing", "innocent", "decent"], "ans": "C"}}, {"w": "incite", "pos": "v.", "ja": "扇動する、駆り立てる", "syn": ["provoke", "instigate", "stir up"], "ant": ["calm", "deter"], "ex": "The speaker was arrested for inciting a riot.", "tip": "in-（中へ）＋cite（呼び起こす：excite）→感情をかき立てる。insight（洞察）は音の引っ掛け。", "q": {"choices": ["instigate", "insight", "pacify", "recite", "invite"], "ans": "A"}}, {"w": "indifferent", "pos": "adj.", "ja": "無関心な、どうでもよい", "syn": ["apathetic", "unconcerned", "detached"], "ant": ["concerned", "eager"], "ex": "He seemed indifferent to the outcome of the election.", "tip": "「違い（different）を感じない」→どちらでもいい＝無関心。different（異なる）とは意味が違う。", "q": {"choices": ["different", "eager", "indignant", "unconcerned", "indulgent"], "ans": "D"}}, {"w": "indolent", "pos": "adj.", "ja": "怠惰な、怠けた", "syn": ["lazy", "idle", "slothful"], "ant": ["industrious", "diligent"], "ex": "The indolent cat spent the whole afternoon napping in the sun.", "tip": "in-（否定）＋dol（痛み）→苦労を嫌う＝怠惰。insolent（横柄な）は形の引っ掛け。", "q": {"choices": ["insolent", "industrious", "indulgent", "redolent", "slothful"], "ans": "E"}}, {"w": "inept", "pos": "adj.", "ja": "不器用な、無能な", "syn": ["clumsy", "incompetent", "unskillful"], "ant": ["skillful", "adept"], "ex": "The inept waiter spilled soup on three customers.", "tip": "in-（否定）＋apt（適した）→能力に欠ける。adept（熟練した）が反対語。inert（不活発な）と区別。", "q": {"choices": ["inert", "incompetent", "adept", "intent", "inane"], "ans": "B"}}, {"w": "innate", "pos": "adj.", "ja": "生まれつきの、生来の", "syn": ["inborn", "inherent", "natural"], "ant": ["acquired", "learned"], "ex": "She has an innate talent for music.", "tip": "in-（中に）＋nat（生まれる：native）→生まれつき内にある。inane（愚かな）と見間違えない。", "q": {"choices": ["inborn", "inane", "acquired", "ornate", "intimate"], "ans": "A"}}, {"w": "insipid", "pos": "adj.", "ja": "味のない、退屈な", "syn": ["tasteless", "dull", "bland"], "ant": ["flavorful", "exciting"], "ex": "The soup was insipid, so I added salt and pepper.", "tip": "in-（否定）＋sipid（味のある：ラテン語 sapidus、savor と同系）→味がしない。insidious（陰険な）・intrepid は形の引っ掛け。", "q": {"choices": ["insidious", "savory", "intrepid", "rapid", "bland"], "ans": "E"}}, {"w": "intrepid", "pos": "adj.", "ja": "恐れを知らない、勇敢な", "syn": ["bold", "fearless", "valiant"], "ant": ["timid", "cowardly"], "ex": "The intrepid explorer crossed Antarctica on foot.", "tip": "in-（否定）＋trepid（震える：trepidation）→震えない＝勇敢。tepid（ぬるい）とは別。", "q": {"choices": ["timid", "insipid", "fearless", "tepid", "intricate"], "ans": "C"}}, {"w": "inundate", "pos": "v.", "ja": "氾濫させる、（大量に）殺到させる", "syn": ["flood", "overwhelm", "deluge"], "ant": ["drain"], "ex": "After the show aired, the station was inundated with phone calls.", "tip": "in-（上に）＋und（波：undulate）→波が押し寄せる。be inundated with〜（〜が殺到する）の形が多い。", "q": {"choices": ["undulate", "overwhelm", "drain", "innovate", "indicate"], "ans": "B"}}, {"w": "irascible", "pos": "adj.", "ja": "怒りっぽい、短気な", "syn": ["short-tempered", "testy", "irritable"], "ant": ["easygoing", "placid"], "ex": "The irascible old man yelled at children who stepped on his lawn.", "tip": uxta（そばに）＋pose（置く）で「横に並べて置く」。", "q": {"choices": ["separate", "contrast", "justify", "jostle", "isolate"], "ans": "B"}}, {"w": "keen", "pos": "adj.", "ja": "鋭い、熱心な", "syn": ["sharp", "eager", "acute"], "ant": ["dull", "indifferent"], "ex": "Owls have keen eyesight that helps them hunt at night.", "tip": "「刃が鋭い」→「感覚が鋭い」→「意欲が強い」と意味が広がる。", "q": {"choices": ["dull", "kind", "weak", "keep", "sharp"], "ans": "E"}}, {"w": "kindle", "pos": "v.", "ja": "（火を）つける、（感情・興味を）かき立てる", "syn": ["ignite", "spark", "arouse"], "ant": ["extinguish", "quench"], "ex": "A visit to the museum kindled his interest in ancient Egypt.", "tip": "電子書籍Kindleは「読書欲に火をつける」という意味から命名。", "q": {"choices": ["extinguish", "kindly", "ignite", "soothe", "kneel"], "ans": "C"}}, {"w": "kinetic", "pos": "adj.", "ja": "運動の、動的な", "syn": ["moving", "dynamic", "active"], "ant": ["static", "stationary"], "ex": "A rolling ball has kinetic energy.", "tip": "ギリシャ語kinein（動かす）。cinema（映画＝動く絵）と同根。", "q": {"choices": ["dynamic", "static", "genetic", "kindred", "frozen"], "ans": "A"}}, {"w": "lackluster", "pos": "adj.", "ja": "精彩を欠く、さえない", "syn": ["dull", "uninspired", "mediocre"], "ant": ["brilliant", "dazzling"], "ex": "The team's lackluster performance disappointed the fans.", "tip": "lack（欠く）＋luster（輝き）で「輝きがない」。", "q": {"choices": ["brilliant", "lacking", "lustrous", "uninspired", "luxurious"], "ans": "D"}}, {"w": "laconic", "pos": "adj.", "ja": "言葉数の少ない、簡潔な", "syn": ["terse", "concise", "brief"], "ant": ["verbose", "loquacious"], "ex": "His laconic reply was simply \"No.\"", "tip": "口数の少ないスパルタ人の地方Laconiaから。loquacious（おしゃべりな）と対で覚える。", "q": {"choices": ["talkative", "lazy", "terse", "iconic", "wordy"], "ans": "C"}}, {"w": "lament", "pos": "v. / n.", "ja": "嘆き悲しむ／嘆き", "syn": ["mourn", "grieve", "bemoan"], "ant": ["rejoice", "celebrate"], "ex": "The villagers lamented the loss of the old oak tree.", "tip": "lam（泣き叫ぶ声）が語源。lamentable（嘆かわしい）も合わせて。", "q": {"choices": ["mourn", "rejoice", "laminate", "praise", "lend"], "ans": "A"}}, {"w": "languid", "pos": "adj.", "ja": "けだるい、元気のない", "syn": ["listless", "sluggish", "lethargic"], "ant": ["energetic", "vigorous"], "ex": "The heat made everyone feel languid and sleepy.", "tip": "languish（衰える）と同根で「力が抜けた」状態。language（言語）とは無関係。", "q": {"choices": ["energetic", "linguistic", "liquid", "vigorous", "sluggish"], "ans": "E"}}, {"w": "latent", "pos": "adj.", "ja": "潜在的な、隠れている", "syn": ["dormant", "hidden", "potential"], "ant": ["manifest", "evident"], "ex": "The coach saw latent talent in the shy young player.", "tip": "ラテン語latere（隠れる）。late（遅い）・latest（最新）と混同しないこと。", "q": {"choices": ["late", "hidden", "obvious", "lateral", "manifest"], "ans": "B"}}, {"w": "laudable", "pos": "adj.", "ja": "称賛に値する、立派な", "syn": ["praiseworthy", "commendable", "admirable"], "ant": ["shameful", "blameworthy"], "ex": "Raising money for the shelter was a laudable effort.", "tip": "laud（称賛する）＋-able（できる）。loud（大声の）との音の引っ掛けに注意。", "q": {"choices": ["loud", "shameful", "laughable", "commendable", "audible"], "ans": "D"}}, {"w": "lavish", "pos": "adj. / v.", "ja": "ぜいたくな、気前のよい／惜しみなく与える", "syn": ["extravagant", "luxurious", "generous"], "ant": ["meager", "frugal"], "ex": "The couple threw a lavish party with a live orchestra.", "tip": "「洗う（lave）ほど大量に注ぐ」イメージで「惜しみない」。", "q": {"choices": ["frugal", "extravagant", "lavender", "lazy", "modest"], "ans": "B"}}, {"w": "lax", "pos": "adj.", "ja": "手ぬるい、ゆるい", "syn": ["lenient", "careless", "slack"], "ant": ["strict", "rigorous"], "ex": "Security at the gate was so lax that anyone could walk in.", "tip": "relax（くつろぐ）の中にlax（ゆるい）が入っている。", "q": {"choices": ["strict", "tax", "rigorous", "taut", "slack"], "ans": "E"}}, {"w": "lenient", "pos": "adj.", "ja": "寛大な、甘い", "syn": ["tolerant", "merciful", "permissive"], "ant": ["strict", "harsh"], "ex": "The teacher was lenient and allowed us to turn in the essay late.", "tip": "ラテン語lenis（柔らかい）から「処分が柔らかい」。lean（傾く）とは無関係。", "q": {"choices": ["harsh", "leaning", "merciful", "severe", "lengthy"], "ans": "C"}}, {" l animals that sleep during the day.", "tip": "noct（夜）。音楽のnocturne（夜想曲）と同根。", "q": {"choices": ["nighttime", "diurnal", "eternal", "nautical", "daily"], "ans": "A"}}, {"w": "nonchalant", "pos": "adj.", "ja": "無頓着な、平然とした", "syn": ["casual", "indifferent", "unconcerned"], "ant": ["anxious", "concerned"], "ex": "She seemed nonchalant about the big test, but she had studied hard.", "tip": "non（ない）＋フランス語chaloir（気にかける）で「気にしない」。", "q": {"choices": ["anxious", "challenging", "eager", "unconcerned", "nonsense"], "ans": "D"}}, {"w": "nostalgia", "pos": "n.", "ja": "郷愁、懐かしさ", "syn": ["longing", "wistfulness", "homesickness"], "ant": [], "ex": "Old cartoons fill my parents with nostalgia.", "tip": "nostos（帰郷）＋algia（痛み）で「故郷を思う心の痛み」。", "q": {"choices": ["neuralgia", "anticipation", "longing", "notice", "indifference"], "ans": "C"}}, {"w": "notorious", "pos": "adj.", "ja": "悪名高い", "syn": ["infamous", "disreputable", "scandalous"], "ant": ["respected", "honorable"], "ex": "The pirate was notorious for attacking merchant ships.", "tip": "famous（有名）と違い悪い意味で有名。noteworthy（注目すべき＝良い意味）の引っ掛けに注意。", "q": {"choices": ["infamous", "respected", "noteworthy", "notional", "laborious"], "ans": "A"}}, {"w": "novice", "pos": "n.", "ja": "初心者、新米", "syn": ["beginner", "newcomer", "apprentice"], "ant": ["expert", "veteran"], "ex": "As a novice skier, she stayed on the easy slopes.", "tip": "nov（新しい）はnovel（斬新な）、renovate（刷新する）と同根。", "q": {"choices": ["expert", "novel", "veteran", "notice", "beginner"], "ans": "E"}}, {"w": "noxious", "pos": "adj.", "ja": "有害な、有毒な", "syn": ["harmful", "toxic", "poisonous"], "ant": ["harmless", "wholesome"], "ex": "The factory released noxious fumes into the air.", "tip": "noc/nox（害）はinnocent（無害＝無罪）と同根。anxious（不安な）と混同注意。", "q": {"choices": ["anxious", "toxic", "harmless", "nervous", "nautical"], "ans": "B"}}, {"w": "nullify", "pos": "v.", "ja": "無効にする、取り消す", "syn": ["invalidate", "void", "negate"], "ant": ["validate", "enforce"], "ex": "The court nullified the unfair contr etual", "pos": "adj.", "ja": "永続的な、絶え間ない", "syn": ["eternal", "constant", "everlasting"], "ant": ["temporary", "fleeting"], "ex": "The city seemed to be in a state of perpetual construction.", "tip": "per（通して）＋pet（求める・進む）で「ずっと続く」。perpetrate（犯す）と混同注意。", "q": {"choices": ["temporary", "everlasting", "punctual", "fleeting", "perceptual"], "ans": "B"}}, {"w": "placate", "pos": "v.", "ja": "なだめる、怒りを鎮める", "syn": ["appease", "pacify", "mollify"], "ant": ["anger", "provoke"], "ex": "The company offered free tickets to placate upset passengers.", "tip": "plac（喜ばせる）はplease、placid（穏やかな）と同根。placard（ポスター）とは無関係。", "q": {"choices": ["provoke", "locate", "anger", "replicate", "appease"], "ans": "E"}}, {"w": "placid", "pos": "adj.", "ja": "穏やかな、落ち着いた", "syn": ["calm", "tranquil", "serene"], "ant": ["turbulent", "agitated"], "ex": "The lake was placid in the early morning.", "tip": "plac（喜ばせる・穏やか）。acid（酸）を含む見た目に惑わされない。", "q": {"choices": ["acidic", "turbulent", "tranquil", "plastic", "agitated"], "ans": "C"}}, {"w": "plausible", "pos": "adj.", "ja": "もっともらしい、妥当な", "syn": ["believable", "credible", "reasonable"], "ant": ["implausible", "unlikely"], "ex": "Her excuse sounded plausible, so the teacher accepted it.", "tip": "plaud（拍手する）から「拍手に値する」→「納得できる」。applause（拍手）と同根。", "q": {"choices": ["credible", "absurd", "audible", "pleasant", "unlikely"], "ans": "A"}}, {"w": "plethora", "pos": "n.", "ja": "過多、過剰", "syn": ["abundance", "excess", "surplus"], "ant": ["paucity", "dearth"], "ex": "The menu offered a plethora of choices.", "tip": "ギリシャ語plethein（満ちる）。plenty（たくさん）と同じple-で「いっぱい」。", "q": {"choices": ["paucity", "shortage", "pleasure", "abundance", "dearth"], "ans": "D"}}, {"w": "poignant", "pos": "adj.", "ja": "心を打つ、痛切な", "syn": ["moving", "touching", "heartrending"], "ant": ["unmoving"], "ex": "The soldier's letter home was a poignant reminder of the war's cost.", "tip": "フランス語poindre（刺す）から「心を刺す」。pointと同根、gは発音しない。", "q": {"choices": ["pointless", "pregnant", "touching", "cheerful", "dull
