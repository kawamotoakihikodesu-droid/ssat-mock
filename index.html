s"], "ans": "B", "expl": "acrimonious は「（言葉・議論が）辛辣な、とげとげしい」（an acrimonious debate）。bitter が同義。harmonious（調和した）は反意語であり -monious も同じ形。criminal（crim-）や acrobatic（acr-）、ceremonious も見た目の引っ掛けです。"}, {"word": "BOMBASTIC", "choices": ["explosive", "modest", "athletic", "sarcastic", "pompous"], "ans": "E", "expl": "bombastic は「（言葉が）大げさな、仰々しい」。pompous（尊大な、もったいぶった）が同義。modest（控えめな）は反意語。bomb（爆弾）から explosive を選ばせるのが典型的な引っ掛けです。"}, {"word": "CIRCUMSPECT", "choices": ["cautious", "suspicious", "round", "reckless", "respectful"], "ans": "A", "expl": "circumspect は「用心深い、慎重な」（circum＝周りを＋spect＝見る）。cautious が同義。reckless（向こう見ずな）は反意語。suspicious（-spect→suspect）、round（circum→circle）、respectful（-spect）は語の一部につられた引っ掛けです。"}, {"word": "DEBILITATE", "choices": ["debate", "strengthen", "weaken", "rehabilitate", "dismiss"], "ans": "C", "expl": "debilitate は「（体力・機能を）衰弱させる、弱める」（a debilitating illness）。weaken が同義。strengthen は反意語。debate（de-b）や rehabilitate（-bilitate、回復させる）は形の似た引っ掛けで、特に rehabilitate は意味が逆なので要注意です。"}, {"word": "EQUANIMITY", "choices": ["equality", "hostility", "agitation", "composure", "unanimity"], "ans": "D", "expl": "equanimity は「（困難な状況でも保たれる）心の平静、落ち着き」（equi＝等しい＋animus＝心）。composure が同義。agitation（動揺）は反意語。equality（equ-）、unanimity（-animity、満場一致）、hostility（animosity＝敵意 と混同）は引っ掛けです。"}], "analogies": [{"prompt": "Petal is to flower as", "choices": ["page is to book", "river is to ocean", "nest is to bird", "rain is to cloud", "pen is to writer"], "ans": "A", "expl": "ブリッジ文：「花びら（petal）は花（flower）の一部である」（部分と全体）。「ページ（page）は本（book）の一部である」が同じ関係。river→ocean は流れ込む先、nest→bird は住む場所の関係で、部分ではありません。"}, {"prompt": "Cub is to bear as fawn is to", "choices": ["fox", "rabbit", "deer", "calf", "forest"], "ans": "C", "expl": "ブリッジ文：「cub（子グマ）はクマ（bear）の子どもである」。fawn は「子ジカ」なので deer が正解。calf は牛などの子どもを表す語で、「子ども」つながりの引っ掛けです。"}, {"prompt": "Generous is to stingy as", "choices": ["kind is to gentle", "angry is to shout", "rude is to impolite", "clever is to student", "brave is to cowardly"], "ans": "E", "expl": "ブリッジ文：「generous（気前のよい）は stingy（けちな）の反対である」（反意語）。brave（勇敢な）と cowardly（臆病な）が反意語の関係。kind/gentle、rude/impolite は同義語なので引っ掛けです。"}, {"prompt": "Hammer is to carpenter as scalpel is to", "choices": ["knife", "surgeon", "hospital", "patient", "cut"], "ans": "B", "expl": "ブリッジ文：「hammer（金づち）は carpenter（大工）が使う道具である」（道具と使い手）。scalpel（メス）を使うのは surgeon（外科医）。cut は道具の「動作」、hospital は「場所」で、関係がずれています。"}, {"prompt": "Damp is to soaked as", "choices": ["cold is to hot", "wet is to rain", "ice is to water", "warm is to scorching", "cloud is to sky"], "ans": "D", "expl": "ブリッジ文：「soaked（びしょぬれの）は damp（湿った）の程度がずっと強い状態である」（程度の差）。warm（暖かい）→ scorching（焼けつくように暑い）が同じ方向の程度の強まり。cold/hot は反意語なので引っ掛けです。"}, {"prompt": "Thermometer is to temperature as barometer is to", "choices": ["weather", "pressure", "height", "rain", "degree"], "ans": "B", "expl": "ブリッジ文：「thermometer（温度計）は temperature（温度）を測る道具である」（道具と機能）。barometer（気圧計）が測るのは pressure（気圧）。気圧から天気を予測しますが、直接測るのは weather ではないので注意。"}, {"prompt": "Spider is to web as", "choices": ["fish is to water", "cow is to grass", "eagle is to sky", "beaver is to dam", "lion is to pride"], "ans": "D", "expl": "ブリッジ文：「spider（クモ）は web（巣）を作る」（作り手と作るもの）。beaver（ビーバー）は dam（ダム）を作る。fish/water、eagle/sky は「すむ場所」、lion/pride（群れ）は「集団」の関係で、作るものではありません。"}, {"prompt": "Timid is to courage as ignorant is to", "choices": ["knowledge", "stupidity", "school", "fear", "silence"], "ans": "A", "expl": "ブリッジ文：「timid（臆病な）人には courage（勇気）が欠けている」（欠如）。ignorant（無知な）人に欠けているのは knowledge（知識）。stupidity は ignorant と近い意味で「持っているもの」なので逆の引っ掛けです。"}, {"prompt": "Seed is to tree as", "choices": ["leaf is to branch", "egg is to nest", "flower is to garden", "acorn is to squirrel", "caterpillar is to butterfly"], "ans": "E", "expl": "ブリッジ文：「seed（種）は成長して tree（木）になる」（成長の順序）。caterpillar（イモムシ）は成長して butterfly（チョウ）になる。leaf/branch は部分と全体、egg/nest は置かれる場所、acorn/squirrel は食べ物と食べる動物の関係です。"}, {"prompt": "Glacier is to ice as dune is to", "choices": ["desert", "wind", "sand", "camel", "hill"], "ans": "C", "expl": "ブリッジ文：「glacier（氷河）は ice（氷）でできている」（物とその材料）。dune（砂丘）は sand（砂）でできている。desert は砂丘のある「場所」、wind は砂丘を作る「原因」なので引っ掛けです。"}, {"prompt": "Shovel is to dig as", "choices": ["broom is to closet", "needle is to thread", "pencil is to eraser", "axe is to tree", "saw is to cut"], "ans": "E", "expl": "ブリッジ文：「shovel（シャベル）は dig（掘る）ために使う」（道具と動作）。saw（のこぎり）は cut（切る）ために使う。axe/tree は「道具と対象物」で、動作ではない点がよくある引っ掛けです。"}, {"prompt": "Honest is to liar as humble is to", "choices": ["servant", "braggart", "coward", "hero", "modest"], "ans": "B", "expl": "ブリッジ文：「liar（うそつき）は honest（正直な）とは正反対の人物である」（性質とそれを欠く人）。humble（謙虚な）の正反対の人物は braggart（自慢屋）。modest は humble の同義語なので逆の関係です。"}, {"prompt": "Flock is to sheep as", "choices": ["herd is to farmer", "kennel is to dogs", "swarm is to bees", "pack is to hunt", "school is to teacher"], "ans": "C", "expl": "ブリッジ文：「flock（群れ）は sheep（ヒツジ）の集団である」（集団と構成員）。swarm（群れ）は bees（ハチ）の集団。school は魚の群れの意味もありますが、ここでは teacher と組んでいるので不可。kennel は犬小屋（場所）です。"}, {"prompt": "Insult is to offense as joke is to", "choices": ["laughter", "comedian", "riddle", "stage", "tears"], "ans": "A", "expl": "ブリッジ文：「insult（侮辱）は offense（立腹、不快感）を引き起こす」（原因と結果）。joke（冗談）が引き起こすのは laughter（笑い）。comedian は冗談を言う「人」、riddle（なぞなぞ）は冗談の「仲間」なので関係が違います。"}, {"prompt": "Bear is to den as", "choices": ["cow is to milk", "bird is to feather", "horse is to saddle", "bee is to hive", "fox is to cunning"], "ans": "D", "expl": "ブリッジ文：「bear（クマ）は den（ほら穴、巣）に住む」（生き物とすみか）。bee（ハチ）は hive（巣箱）に住む。cow/milk は産物、bird/feather は体の一部、fox/cunning（ずる賢い）は性質の関係です。"}, {"prompt": "Stubborn is to obstinate as cheerful is to", "choices": ["gloomy", "tearful", "jovial", "cheerless", "clever"], "ans": "C", "expl": "ブリッジ文：「stubborn と obstinate はどちらも『頑固な』という同義語である」。cheerful（陽気な）の同義語は jovial（陽気で愉快な）。gloomy・cheerless は反意語、cheerless は cheer の形につられる引っ掛けです。"}, {"prompt": "Botanist is to plants as", "choices": ["astronomer is to stars", "doctor is to hospital", "chef is to knife", "author is to fame", "pilot is to sky"], "ans": "A", "expl": "ブリッジ文：「botanist（植物学者）は plants（植物）を研究する人である」（専門家と研究対象）。astronomer（天文学者）は stars（星）を研究する。doctor/hospital は職場、chef/knife は道具の関係です。"}, {"prompt": "Oak is to tree as rose is to", "choices": ["thorn", "petal", "garden", "flower", "red"], "ans": "D", "expl": "ブリッジ文：「oak（オーク）は tree（木）の一種である」（種類とカテゴリー）。rose（バラ）は flower（花）の一種。thorn・petal は部分、garden は場所、red は特徴なので不適切です。"}, {"prompt": "Meticulous is to careful as", "choices": ["lazy is to idle", "angry is to calm", "nervous is to terrified", "curious is to question", "ecstatic is to happy"], "ans": "E", "expl": "ブリッジ文：「meticulous（細心の、極めて綿密な）は careful（注意深い）の程度が非常に強いものである」（強い程度→弱い程度）。ecstatic（有頂天の）は happy の非常に強い形。nervous→terrified は程度の順序が逆（弱→強）なので要注意の引っ掛けです。"}, {"prompt": "Cheetah is to swift as tortoise is to", "choices": ["shell", "slow", "reptile", "ancient", "patient"], "ans": "B", "expl": "ブリッジ文：「cheetah（チーター）の代表的な特徴は swift（速い）ことである」（もの と 特徴）。tortoise（リクガメ）の代表的な特徴は slow（遅い）。shell は体の部分、reptile はカテゴリーで、形容詞の「特徴」ではありません。"}, {"prompt": "Pebble is to boulder as", "choices": ["sand is to beach", "cliff is to valley", "pond is to fish", "hill is to mountain", "rock is to stone"], "ans": "D", "expl": "ブリッジ文：「pebble（小石）と boulder（巨岩）は同じ種類のもので、boulder のほうがずっと大きい」（大きさの程度）。hill（丘）と mountain（山）が同じ関係。sand/beach は部分と全体、rock/stone はほぼ同義語なので不可です。"}, {"prompt": "Prudent is to rash as frugal is to", "choices": ["thrifty", "wealthy", "stingy", "careful", "extravagant"], "ans": "E", "expl": "ブリッジ文：「prudent（慎重な）は rash（軽率な）の反対である」（反意語）。frugal（倹約する）の反意語は extravagant（浪費する）。thrifty は同義語、stingy（けちな）も近い意味なので反対にはなりません。"}, {"prompt": "Antidote is to poison as", "choices": ["snake is to venom", "remedy is to ailment", "vaccine is to needle", "doctor is to patient", "bite is to wound"], "ans": "B", "expl": "ブリッジ文：「antidote（解毒剤）は poison（毒）の作用を打ち消すためのものである」（機能・目的）。remedy（治療薬）は ailment（病気）を治すためのもの。snake/venom は持ち主と産物、bite/wound は原因と結果の関係です。"}, {"prompt": "Poet is to sonnet as composer is to", "choices": ["orchestra", "piano", "symphony", "audience", "conductor"], "ans": "C", "expl": "ブリッジ文：「poet（詩人）は sonnet（ソネット）という作品を作る」（作り手と作品）。composer（作曲家）が作る作品は symphony（交響曲）。orchestra は演奏する集団、piano は楽器、conductor は指揮者で、作品ではありません。"}, {"prompt": "Lethargic is to energy as", "choices": ["apathetic is to interest", "wealthy is to money", "curious is to question", "generous is to gift", "fragile is to glass"], "ans": "A", "expl": "ブリッジ文：「lethargic（無気力な、だるい）人には energy（活力）が欠けている」（欠如）。apathetic（無関心な）人には interest（関心）が欠けている。wealthy/money は逆に「持っている」関係なので引っ掛けです。"}, {"prompt": "Archipelago is to islands as constellation is to", "choices": ["stars", "sky", "astronomy", "planets", "night"], "ans": "A", "expl": "ブリッジ文：「archipelago（群島）は多くの islands（島々）が集まったものである」（集合体と構成要素）。constellation（星座）は stars（恒星）の集まり。sky・night は見える場所や時間、planets（惑星）は星座を構成しないので誤りです。"}, {"prompt": "Sage is to wisdom as", "choices": ["hermit is to company", "amateur is to expertise", "miser is to greed", "pilot is to airplane", "judge is to court"], "ans": "C", "expl": "ブリッジ文：「sage（賢者）を特徴づける性質は wisdom（知恵）である」（人物と特徴的な性質）。miser（守銭奴）を特徴づけるのは greed（強欲）。hermit（隠者）は company（人付き合い）を、amateur は expertise（専門技術）を「欠く」ので逆の関係です。"}, {"prompt": "Placate is to anger as quench is to", "choices": ["water", "drink", "satisfy", "hunger", "thirst"], "ans": "E", "expl": "ブリッジ文：「placate（なだめる）は anger（怒り）を鎮めることである」（動作とそれが和らげる対象）。quench（〈渇きを〉いやす）が和らげるのは thirst（のどの渇き）。water・drink は手段、satisfy は動詞で同義語に近く、hunger は quench と組まない語です。"}, {"prompt": "Taciturn is to chatter as", "choices": ["timid is to tremble", "generous is to share", "garrulous is to talk", "frugal is to squander", "stern is to frown"], "ans": "D", "expl": "ブリッジ文：「taciturn（無口な）人は chatter（おしゃべりする）ことをしない」（性格としない行動）。frugal（倹約家の）人は squander（浪費する）ことをしない。他の選択肢はすべて「その性格の人がする行動」で、特に garrulous（おしゃべりな）/talk は taciturn の反対語を使った引っ掛けです。"}, {"prompt": "Prologue is to novel as overture is to", "choices": ["finale", "opera", "curtain", "composer", "encore"], "ans": "B", "expl": "ブリッジ文：「prologue（序章、プロローグ）は novel（小説）の冒頭に置かれる導入部である」（導入部と作品全体）。overture（序曲）は opera（オペラ）の冒頭で演奏される導入部。finale（終曲）・encore（アンコール）は最後に来るもので順序が逆です。"}], "writing": {"A": {"label": "Option A (Creative Prompt)", "text": "<i>“The fog rolled in so quickly that by the time I reached the old lighthouse, I could no longer see the path behind me.”<\/i><br>Use this sentence as the first line of a story. Develop your characters, setting, and plot, and bring the story to a clear ending."}, "B": {"label": "Option B (Essay Prompt)", "text": "Some people believe that natural talent is the key to success, while others argue that persistence and hard work matter more. Which do you think is more important? Support your position with specific examples from your own experience, your reading, or your observations of others."}}}}, {"quant": {"quant1": [{"topic": "比例・分数", "prompt": "A recipe calls for {{frac:3|4}} cup of sugar to make 12 cookies. At this rate, how many cups of sugar are needed to make 36 cookies?", "choices": ["1{{frac:1|2}}", "2{{frac:1|4}}", "2{{frac:3|4}}", "3", "3{{frac:3|4}}"], "ans": "B", "expl": "36 ÷ 12 = 3 倍の量を作るので、砂糖も 3 倍。{{frac:3|4}} × 3 = {{frac:9|4}} = 2{{frac:1|4}} カップ。"}, {"topic": "小数の計算", "prompt": "What is the value of 4.2 × 0.05 ?", "choices": ["21", "2.1", "0.021", "0.21", "0.0021"], "ans": "D", "expl": "42 × 5 = 210。小数点以下の桁数は 4.2（1桁）と 0.05（2桁）で合計3桁なので 0.210 = 0.21。桁数の数え間違いに注意。"}, {"topic": "素数", "prompt": "Which of the following numbers is prime?", "choices": ["53", "51", "57", "91", "87"], "ans": "A", "expl": "51 = 3 × 17、57 = 3 × 19、91 = 7 × 13、87 = 3 × 29 はすべて合成数。53 は 2, 3, 5, 7 のどれでも割り切れないので素数。91 は素数に見えやすい典型的な引っ掛け。"}, {"topic": "割引・百分率", "prompt": "A travel backpack originally priced at $80 is on sale for 25% off. What is the sale price?", "choices": ["$20", "$55", "$56", "$64", "$60"], "ans": "E", "expl": "25% 引きは元の値段の 75%。80 × 0.75 = 60 ドル。$20 は割引額そのもので、答えではない（引っ掛け）。"}, {"topic": "一次方程式", "prompt": "If 3<i>x<\/i> − 7 = 20, what is the value of <i>x<\/i>?", "choices": ["{{frac:13|3}}", "6", "9", "11", "27"], "ans": "C", "expl": "両辺に 7 を足して 3<i>x<\/i> = 27、3 で割って <i>x<\/i> = 9。7 を引いてしまうと 3<i>x<\/i> = 13 となり {{frac:13|3}} を選ぶミスになる。"}, {"topic": "平均", "prompt": "In a science lab, a student recorded the following temperatures, in degrees Celsius: 18, 22, 25, 19, 21. What is the mean of these temperatures?", "choices": ["21", "22", "20", "19", "25"], "ans": "A", "expl": "合計は 18 + 22 + 25 + 19 + 21 = 105。データ数 5 で割って 105 ÷ 5 = 21。"}, {"topic": "角度", "prompt": "Two angles are supplementary. The measure of one angle is 4 times the measure of the other. What is the measure of the larger angle?", "choices": ["36°", "72°", "108°", "144°", "150°"], "ans": "D", "expl": "supplementary（補角）は和が 180°。小さい角を <i>x<\/i> とすると <i>x<\/i> + 4<i>x<\/i> = 180、<i>x<\/i> = 36。大きい角は 4 × 36 = 144°。和を 90°（complementary, 余角）と混同すると 72° を選んでしまう。36° は小さい方の角。"}, {"topic": "指数", "prompt": "What is the value of 2<sup>3<\/sup> × 2<sup>4<\/sup> ÷ 2<sup>5<\/sup> ?", "choices": ["2", "4", "8", "16", "32"], "ans": "B", "expl": "同じ底の掛け算は指数を足し、割り算は引く。2<sup>3+4−5<\/sup> = 2<sup>2<\/sup> = 4。"}, {"topic": "比", "prompt": "A bread dough uses flour and water in a ratio of 5 to 2 by volume. If a baker uses a total of 28 cups of flour and water, how many cups of flour are used?", "choices": ["8", "10", "14", "16", "20"], "ans": "E", "expl": "全体は 5 + 2 = 7 つ分。1 つ分は 28 ÷ 7 = 4 カップ。小麦粉は 5 × 4 = 20 カップ。8 は水の量なので注意。"}, {"topic": "速さ", "prompt": "A train travels 240 miles in 3 hours and 20 minutes. What is the train's average speed, in miles per hour?", "choices": ["60", "70", "72", "75", "80"], "ans": "C", "expl": "3 時間 20 分 = 3{{frac:1|3}} 時間 = {{frac:10|3}} 時間。240 ÷ {{frac:10|3}} = 240 × {{frac:3|10}} = 72 mph。20 分を 0.2 時間と考えて 240 ÷ 3.2 = 75 とするのが典型的な引っ掛け。"}, {"topic": "式の値", "prompt": "If <i>x<\/i> = −3, what is the value of <i>x<\/i><sup>2<\/sup> − 4<i>x<\/i> + 1 ?", "choices": ["−20", "22", "−2", "4", "10"], "ans": "B", "expl": "<i>x<\/i><sup>2<\/sup> = (−3)<sup>2<\/sup> = 9、−4<i>x<\/i> = −4 × (−3) = +12。よって 9 + 12 + 1 = 22。符号ミスで −2 や 4 を選ばないように。"}, {"topic": "約数", "prompt": "How many positive integers are factors of 36 ?", "choices": ["9", "8", "6", "10", "12"], "ans": "A", "expl": "36 の約数は 1, 2, 3, 4, 6, 9, 12, 18, 36 の 9 個。平方数なので 6 は一度だけ数える（ペアで数えて 10 としないこと）。別解：36 = 2<sup>2<\/sup> × 3<sup>2<\/sup> なので (2+1)(2+1) = 9 個。"}, {"topic": "余り", "prompt": "When the positive integer <i>n<\/i> is divided by 6, the remainder is 4. What is the remainder when 3<i>n<\/i> is divided by 6 ?", "choices": ["4", "3", "2", "1", "0"], "ans": "E", "expl": "<i>n<\/i> = 6<i>k<\/i> + 4 とおくと 3<i>n<\/i> = 18<i>k<\/i> + 12 = 6(3<i>k<\/i> + 2)。6 で割り切れるので余りは 0。具体例 <i>n<\/i> = 4 なら 3<i>n<\/i> = 12 で確認できる。"}, {"topic": "資料の読み取り", "prompt": "The table below shows the number of visitors to a travel museum on five days.<br><table class=\"dt\"><tr><th>Day<\/th><th>Visitors<\/th><\/tr><tr><td>Monday<\/td><td>120<\/td><\/tr><tr><td>Tuesday<\/td><td>80<\/td><\/tr><tr><td>Wednesday<\/td><td>130<\/td><\/tr><tr><td>Thursday<\/td><td>120<\/td><\/tr><tr><td>Friday<\/td><td>150<\/td><\/tr><\/table>What percent of the total number of visitors for the five days came on Friday?", "choices": ["15%", "20%", "22.5%", "25%", "30%"], "ans": "D", "expl": "合計は 120 + 80 + 130 + 120 + 150 = 600 人。金曜日は 150 ÷ 600 = {{frac:1|4}} = 25%。"}, {"topic": "不等式", "prompt": "Which of the following describes all values of <i>x<\/i> for which 5 − 2<i>x<\/i> > 11 ?", "choices": ["<i>x<\/i> > −3", "<i>x<\/i> < 3", "<i>x<\/i> < −3", "<i>x<\/i> > 3", "<i>x<\/i> < −8"], "ans": "C", "expl": "両辺から 5 を引いて −2<i>x<\/i> > 6。負の数 −2 で割ると不等号の向きが逆になり <i>x<\/i> < −3。向きを変え忘れると <i>x<\/i> > −3 を選んでしまう（典型的な引っ掛け）。"}, {"topic": "円の面積", "prompt": "A circular pizza has a circumference of 10<i>π<\/i> inches. What is the area of the pizza, in square inches?", "choices": ["25<i>π<\/i>", "10<i>π<\/i>", "100<i>π<\/i>", "5<i>π<\/i>", "50<i>π<\/i>"], "ans": "A", "expl": "円周 = 2<i>πr<\/i> = 10<i>π<\/i> より半径 <i>r<\/i> = 5。面積 = <i>πr<\/i><sup>2<\/sup> = 25<i>π<\/i>。直径 10 を半径と勘違いすると 100<i>π<\/i> になる。"}, {"topic": "三平方の定理", "prompt": "The two legs of a right triangle have lengths 9 and 12. What is the length of the hypotenuse?", "choices": ["10.5", "13", "18", "21", "15"], "ans": "E", "expl": "斜辺<sup>2<\/sup> = 9<sup>2<\/sup> + 12<sup>2<\/sup> = 81 + 144 = 225 なので斜辺 = 15。（3 : 4 : 5 の 3 倍）。21 は単純に足しただけの誤り。"}, {"topic": "定義された演算", "prompt": "For all numbers <i>a<\/i> and <i>b<\/i>, let <i>a<\/i> ◆ <i>b<\/i> = <i>a<\/i><sup>2<\/sup> − 2<i>b<\/i>. What is the value of (3 ◆ 1) ◆ 4 ?", "choices": ["33", "41", "45", "57", "7"], "ans": "B", "expl": "まず括弧内：3 ◆ 1 = 3<sup>2<\/sup> − 2 × 1 = 7。次に 7 ◆ 4 = 7<sup>2<\/sup> − 2 × 4 = 49 − 8 = 41。7 は途中の値なので注意。"}, {"topic": "連立方程式", "prompt": "If <i>x<\/i> + <i>y<\/i> = 14 and <i>x<\/i> − <i>y<\/i> = 4, what is the value of <i>xy<\/i> ?", "choices": ["36", "40", "18", "45", "49"], "ans": "D", "expl": "2式を足すと 2<i>x<\/i> = 18 で <i>x<\/i> = 9、よって <i>y<\/i> = 5。<i>xy<\/i> = 9 × 5 = 45。"}, {"topic": "傾き", "prompt": "What is the slope of the line that passes through the points (−2, 5) and (4, −7) ?", "choices": ["2", "−{{frac:1|2}}", "−2", "{{frac:1|2}}", "−6"], "ans": "C", "expl": "傾き = (<i>y<\/i> の変化) ÷ (<i>x<\/i> の変化) = (−7 − 5) ÷ (4 − (−2)) = −12 ÷ 6 = −2。分母と分子を逆にすると −{{frac:1|2}} になる。"}, {"topic": "確率", "prompt": "A bag contains 4 red, 5 blue, and 3 green marbles. Two marbles are drawn at random, one after the other, without replacement. What is the probability that both marbles are blue?", "choices": ["{{frac:25|144}}", "{{frac:5|12}}", "{{frac:1|6}}", "{{frac:10|33}}", "{{frac:5|33}}"], "ans": "E", "expl": "全部で 12 個。1個目が青：{{frac:5|12}}、残り 11 個中 青は 4 個なので2個目も青：{{frac:4|11}}。{{frac:5|12}} × {{frac:4|11}} = {{frac:20|132}} = {{frac:5|33}}。戻す場合（with replacement）と混同すると {{frac:25|144}} になる。"}, {"topic": "直方体の体積", "prompt": "A rectangular fish tank in a science lab is 30 cm long, 20 cm wide, and 25 cm tall. It is filled with water to a depth of 20 cm. How many more liters of water are needed to fill the tank completely? (1 liter = 1,000 cubic centimeters)", "choices": ["3", "12", "15", "30", "0.3"], "ans": "A", "expl": "あと 25 − 20 = 5 cm 分の水が必要。30 × 20 × 5 = 3,000 cm³ = 3 リットル。12 は今入っている水（12,000 cm³）、15 は満水時の量なので注意。"}, {"topic": "数列", "prompt": "The first term of a sequence is 3. Each term after the first is found by multiplying the previous term by 2 and then subtracting 1. What is the 6th term of the sequence?", "choices": ["33", "63", "65", "129", "64"], "ans": "C", "expl": "3 → 3×2−1 = 5 → 9 → 17 → 33 → 65。第6項は 65。33 は第5項、129 は第7項なので数え間違いに注意。"}, {"topic": "仕事算", "prompt": "Working alone, Chef Maria can prepare a large banquet order in 4 hours. Working alone, Chef Tom can prepare the same order in 6 hours. If they work together at these rates, how long will it take them to prepare the order?", "choices": ["2 hours", "2 hours 24 minutes", "2 hours 30 minutes", "5 hours", "10 hours"], "ans": "B", "expl": "1時間あたりの仕事量はマリア {{frac:1|4}}、トム {{frac:1|6}}。合計 {{frac:3|12}} + {{frac:2|12}} = {{frac:5|12}}。かかる時間は {{frac:12|5}} 時間 = 2.4 時間 = 2 時間 24 分。5 時間（平均）や 10 時間（和）は典型的な誤り。"}, {"topic": "円と正方形の面積", "prompt": "A square is inscribed in a circle of radius 6, so that all four vertices of the square lie on the circle. What is the area of the region inside the circle but outside the square?", "choices": ["36<i>π<\/i> − 144", "36<i>π<\/i> − 36", "144 − 36<i>π<\/i>", "36<i>π<\/i> − 72", "12<i>π<\/i> − 72"], "ans": "D", "expl": "円の面積は <i>π<\/i> × 6<sup>2<\/sup> = 36<i>π<\/i>。正方形の対角線は円の直径 12。正方形の面積 = 対角線<sup>2<\/sup> ÷ 2 = 144 ÷ 2 = 72。求める面積は 36<i>π<\/i> − 72。一辺を 12 と誤解すると 144 を引いてしまう（負の値になり不自然）。"}], "quant2": [{"topic": "分数の計算", "prompt": "What is the value of {{frac:2|3}} + {{frac:3|4}} − {{frac:1|2}} ?", "choices": ["{{frac:4|5}}", "{{frac:5|6}}", "{{frac:11|12}}", "1{{frac:1|12}}", "{{frac:5|12}}"], "ans": "C", "expl": "通分して {{frac:8|12}} + {{frac:9|12}} − {{frac:6|12}} = {{frac:11|12}}。分子同士・分母同士をそのまま計算すると {{frac:4|5}} になる典型的なミス。"}, {"topic": "百分率", "prompt": "What is 30% of 250 ?", "choices": ["75", "80", "7.5", "175", "750"], "ans": "A", "expl": "250 × 0.3 = 75。175 は残りの 70% の値、7.5 や 750 は小数点の位置のミス。"}, {"topic": "最小公倍数", "prompt": "What is the smallest positive integer that is divisible by 4, 6, and 10 ?", "choices": ["240", "120", "30", "20", "60"], "ans": "E", "expl": "4 = 2<sup>2<\/sup>、6 = 2 × 3、10 = 2 × 5。最小公倍数は 2<sup>2<\/sup> × 3 × 5 = 60。単純に掛けた 240 は公倍数だが最小ではない。30 は 4 で割り切れない。"}, {"topic": "単位換算", "prompt": "A lab technician pours 2.5 liters of a solution equally into beakers that each hold 250 milliliters. How many beakers can be completely filled? (1 liter = 1,000 milliliters)", "choices": ["4", "10", "25", "100", "1,000"], "ans": "B", "expl": "2.5 L = 2,500 mL。2,500 ÷ 250 = 10 個。単位をそろえずに計算すると桁を誤る。"}, {"topic": "中央値", "prompt": "What is the median of the following data set?<br>7, 3, 9, 3, 12, 5, 8", "choices": ["3", "5", "6", "7", "9"], "ans": "D", "expl": "小さい順に並べると 3, 3, 5, 7, 8, 9, 12。7個の真ん中（4番目）は 7。並べ替えずに真ん中を取ると 3 になる（引っ掛け）。3 は最頻値（mode）。"}, {"topic": "平方根", "prompt": "What is the value of √50 + √18 ?", "choices": ["√68", "8√2", "2√17", "15√2", "34"], "ans": "B", "expl": "√50 = √(25 × 2) = 5√2、√18 = √(9 × 2) = 3√2。合わせて 8√2。√a + √b = √(a + b) とするのは誤り（√68 の引っ掛け）。"}, {"topic": "比例", "prompt": "At a farmers' market, 5 pounds of apples cost $7.50. At the same price per pound, how much do 8 pounds of apples cost?", "choices": ["$10.50", "$11.00", "$12.50", "$13.00", "$12.00"], "ans": "E", "expl": "1 ポンドあたり 7.50 ÷ 5 = 1.50 ドル。8 ポンドで 1.50 × 8 = 12.00 ドル。"}, {"topic": "式の展開", "prompt": "Which of the following is equivalent to (<i>x<\/i> + 3)(<i>x<\/i> − 5) ?", "choices": ["<i>x<\/i><sup>2<\/sup> − 2<i>x<\/i> − 15", "<i>x<\/i><sup>2<\/sup> + 2<i>x<\/i> − 15", "<i>x<\/i><sup>2<\/sup> − 15", "<i>x<\/i><sup>2<\/sup> − 8<i>x<\/i> − 15", "<i>x<\/i><sup>2<\/sup> − 2<i>x<\/i> + 15"], "ans": "A", "expl": "<i>x<\/i><sup>2<\/sup> − 5<i>x<\/i> + 3<i>x<\/i> − 15 = <i>x<\/i><sup>2<\/sup> − 2<i>x<\/i> − 15。真ん中の項（−5<i>x<\/i> + 3<i>x<\/i>）を忘れると <i>x<\/i><sup>2<\/sup> − 15 になる。"}, {"topic": "2点間の距離", "prompt": "What is the distance between the points (1, 2) and (7, 10) in the coordinate plane?", "choices": ["6", "8", "10", "14", "100"], "ans": "C", "expl": "<i>x<\/i> の差 6、<i>y<\/i> の差 8。距離 = √(6<sup>2<\/sup> + 8<sup>2<\/sup>) = √100 = 10。√ を取り忘れると 100、差を足すと 14 になる。"}, {"topic": "中点", "prompt": "What is the midpoint of the line segment with endpoints (−4, 7) and (10, −3) ?", "choices": ["(7, −5)", "(6, 4)", "(3, 5)", "(3, 2)", "(−7, 5)"], "ans": "D", "expl": "中点 = ((−4 + 10) ÷ 2, (7 + (−3)) ÷ 2) = (6 ÷ 2, 4 ÷ 2) = (3, 2)。2 で割り忘れると (6, 4) になる。"}, {"topic": "資料の読み取り", "prompt": "The table below shows the ingredients for a vegetable soup recipe that serves 4 people.<br><table class=\"dt\"><tr><th>Ingredient<\/th><th>Amount (serves 4)<\/th><\/tr><tr><td>Carrots<\/td><td>2<\/td><\/tr><tr><td>Potatoes<\/td><td>3<\/td><\/tr><tr><td>Onions<\/td><td>1<\/td><\/tr><tr><td>Broth<\/td><td>6 cups<\/td><\/tr><tr><td>Salt<\/td><td>2 teaspoons<\/td><\/tr><\/table>How many cups of broth are needed to make this soup for 10 people?", "choices": ["15", "12", "18", "24", "60"], "ans": "A", "expl": "4人分で 6 カップなので 1 人分は 6 ÷ 4 = 1.5 カップ。10 人分で 1.5 × 10 = 15 カップ。（10 ÷ 4 = 2.5 倍と考えても 6 × 2.5 = 15）"}, {"topic": "関数", "prompt": "If <i>f<\/i>(<i>x<\/i>) = 3<i>x<\/i> − 4 and <i>f<\/i>(<i>a<\/i>) = 11, what is the value of <i>a<\/i> ?", "choices": ["29", "3", "5", "{{frac:7|3}}", "15"], "ans": "C", "expl": "3<i>a<\/i> − 4 = 11 より 3<i>a<\/i> = 15、<i>a<\/i> = 5。<i>f<\/i>(11) = 29 を計算してしまうのが典型的な引っ掛け。"}, {"topic": "円周", "prompt": "A bicycle wheel has a diameter of 28 inches. How many inches does the bicycle travel when the wheel makes exactly 10 complete turns without slipping?", "choices": ["140<i>π<\/i>", "280<i>π<\/i>", "560<i>π<\/i>", "28<i>π<\/i>", "196<i>π<\/i>"], "ans": "B", "expl": "1回転で進む距離は円周 = <i>π<\/i> × 直径 = 28<i>π<\/i>。10回転で 280<i>π<\/i> インチ。直径を半径と思って 2<i>π<\/i> × 28 を使うと 560<i>π<\/i> になる。"}, {"topic": "三角形の角", "prompt": "The measures of the three angles of a triangle are in the ratio 2 : 3 : 4. What is the measure of the largest angle?", "choices": ["20°", "40°", "60°", "90°", "80°"], "ans": "E", "expl": "内角の和は 180°。2 + 3 + 4 = 9 つ分なので 1 つ分は 20°。最大の角は 4 × 20 = 80°。20° は 1 つ分の値。"}, {"topic": "不等式と整数", "prompt": "How many integers <i>x<\/i> satisfy −3 ≤ 2<i>x<\/i> + 1 < 9 ?", "choices": ["3", "4", "5", "6", "7"], "ans": "D", "expl": "各辺から 1 を引くと −4 ≤ 2<i>x<\/i> < 8、2 で割ると −2 ≤ <i>x<\/i> < 4。整数は −2, −1, 0, 1, 2, 3 の 6 個。端の −2 は含み（≤）、4 は含まない（<）ことに注意。"}, {"topic": "立方体の表面積", "prompt": "A cube-shaped storage box has a volume of 64 cubic centimeters. What is the total surface area of the box, in square centimeters?", "choices": ["16", "24", "64", "84", "96"], "ans": "E", "expl": "4 × 4 × 4 = 64 なので一辺は 4 cm。1 面の面積は 16 cm²、6 面で 16 × 6 = 96 cm²。16 は 1 面だけの面積。"}, {"topic": "場合の数", "prompt": "A café's lunch special includes one soup, one sandwich, and one drink. There are 3 soups, 4 sandwiches, and 2 drinks to choose from. How many different lunch specials are possible?", "choices": ["9", "24", "12", "48", "18"], "ans": "B", "expl": "積の法則：3 × 4 × 2 = 24 通り。足し算（3 + 4 + 2 = 9）にしないこと。"}, {"topic": "平均の応用", "prompt": "The average (arithmetic mean) of Ken's first five test scores is 84. After his sixth test, the average of all six scores is 85. What was Ken's score on the sixth test?", "choices": ["90", "85", "86", "89", "95"], "ans": "A", "expl": "5回の合計は 84 × 5 = 420、6回の合計は 85 × 6 = 510。6回目は 510 − 420 = 90 点。平均が 1 上がっただけなので 85 や 86 と考えるのは誤り。"}, {"topic": "連立方程式の文章題", "prompt": "A science museum sold 120 tickets in one day. Adult tickets cost $15 each and child tickets cost $8 each. If the total ticket sales were $1,450, how many adult tickets were sold?", "choices": ["50", "60", "65", "70", "80"], "ans": "D", "expl": "大人を <i>a<\/i> 枚とすると子どもは 120 − <i>a<\/i> 枚。15<i>a<\/i> + 8(120 − <i>a<\/i>) = 1,450 → 7<i>a<\/i> + 960 = 1,450 → 7<i>a<\/i> = 490 → <i>a<\/i> = 70。50 は子どもの枚数なので注意。検算：15 × 70 + 8 × 50 = 1,050 + 400 = 1,450。"}, {"topic": "指数方程式", "prompt": "If 3<sup><i>x<\/i> + 1<\/sup> = 81, what is the value of 2<sup><i>x<\/i><\/sup> ?", "choices": ["4", "6", "8", "9", "16"], "ans": "C", "expl": "81 = 3<sup>4<\/sup> なので <i>x<\/i> + 1 = 4、<i>x<\/i> = 3。よって 2<sup>3<\/sup> = 8。<i>x<\/i> = 4 と勘違いすると 16 を選んでしまう。"}, {"topic": "百分率の増減", "prompt": "The price of a plane ticket was increased by 20%. Later, the new price was decreased by 20%. Compared with the original price, the final price is", "choices": ["4% less", "the same", "4% more", "2% less", "40% less"], "ans": "A", "expl": "元の価格を 100 とすると、20% 増で 120、そこから 20% 減で 120 × 0.8 = 96。元より 4% 安い。「+20% と −20% で元に戻る」と考えるのが典型的な引っ掛け。"}, {"topic": "一の位の規則性", "prompt": "What is the units (ones) digit of 7<sup>42<\/sup> ?", "choices": ["1", "3", "4", "7", "9"], "ans": "E", "expl": "7 の累乗の一の位は 7, 9, 3, 1 の 4 つで繰り返す。42 ÷ 4 = 10 余り 2 なので、周期の 2 番目の 9。"}, {"topic": "座標と台形の面積", "prompt": "In the coordinate plane, a quadrilateral has vertices at (0, 0), (10, 0), (7, 4), and (1, 4). What is the area of the quadrilateral?", "choices": ["24", "28", "32", "40", "64"], "ans": "C", "expl": "上の辺（<i>y<\/i> = 4）と下の辺（<i>y<\/i> = 0）が平行な台形。下底 10、上底 7 − 1 = 6、高さ 4。面積 = (10 + 6) × 4 ÷ 2 = 32。2 で割り忘れると 64 になる。"}, {"topic": "確率", "prompt": "Two fair six-sided number cubes, each numbered 1 through 6, are rolled. What is the probability that the product of the two numbers rolled is even?", "choices": ["{{frac:1|2}}", "{{frac:1|4}}", "{{frac:2|3}}", "{{frac:3|4}}", "{{frac:5|6}}"], "ans": "D", "expl": "積が奇数になるのは両方とも奇数のときだけで、確率は {{frac:1|2}} × {{frac:1|2}} = {{frac:1|4}}。よって積が偶数の確率は 1 − {{frac:1|4}} = {{frac:3|4}}。{{frac:1|4}} は奇数になる確率なので注意。"}, {"topic": "円柱の体積", "prompt": "A cylindrical container with a radius of 4 inches and a height of 9 inches is completely filled with water. All of the water is poured into an empty cylindrical container with a radius of 6 inches. How high, in inches, will the water rise in the second container?", "choices": ["6", "4", "3", "13.5", "2"], "ans": "B", "expl": "水の体積は <i>π<\/i> × 4<sup>2<\/sup> × 9 = 144<i>π<\/i>。2つ目の容器で <i>π<\/i> × 6<sup>2<\/sup> × <i>h<\/i> = 36<i>π h<\/i> = 144<i>π<\/i> より <i>h<\/i> = 4 インチ。半径の比 4 : 6 だけで 9 × {{frac:4|6}} = 6 とするのは誤り（面積は半径の2乗に比例）。"}]}, "reading": {"passages": [{"id": "p1", "title": "Passage 1: Literary Fiction", "jp": "異国の学校での初日", "html": "<p>On her first morning at Lakeview High, Yui Sato carried her schedule the way some people carry a map in a city they do not trust. The paper had grown soft at the folds by second period. Every hallway looked like the one she had just left, lined with the same gray lockers and the same posters urging students to join clubs whose names she could pronounce but not quite understand.<\/p><p>In Osaka, she had known exactly where to stand, when to speak, and how loudly to laugh. Here, the rules seemed to be written in invisible ink. Students joked with their teachers, interrupted one another cheerfully, and ate lunch wherever they pleased. When Mr. Delgado asked the class a question about the novel they were reading, a dozen hands shot up before Yui had finished translating the question in her head. By the time she had assembled an answer, the discussion had moved on, like a train pulling away from a platform.<\/p><p>At lunch she sat at the end of a long table and unwrapped the rice balls her mother had packed. A girl with paint-stained fingers glanced over. “Are those onigiri?” she asked. Yui nodded, surprised. “My grandmother used to make them,” the girl said. “She lived in Hawaii. I haven’t had one in years.”<\/p><p>Yui hesitated, then held one out. The girl, whose name was Priya, accepted it with both hands, almost formally, as if she understood that something more than food was being offered.<\/p><p>That afternoon, in art class, Priya waved her over to an empty stool. They did not talk much. Yui’s English still felt like a coat a size too large, and Priya seemed content to sketch in silence. But when the bell rang, Yui realized she had not looked at her schedule once in the last hour.<\/p><p>Walking home under the enormous Minnesota sky, she unfolded the paper one more time. Then, deliberately, she folded it smaller and put it in her pocket, where she would not need to see it.<\/p>", "questions": [{"prompt": "The passage primarily describes", "choices": ["a student’s struggle to master English before her first exam", "a newcomer’s first day at an unfamiliar school and a small connection that eases her anxiety", "the differences between the Japanese and American school systems in detail", "a friendship between two girls that develops over an entire school year", "a teacher’s efforts to help a foreign student join class discussions"], "ans": "B", "expl": "物語全体は、大阪から来たユイの「初日」の戸惑いと、昼食時のプリヤとの小さな交流で気持ちが和らぐ様子を描いています。Cは日米の違いに触れてはいるものの「詳細な比較」が目的ではなく、Dは「1年間」が誤り（話は1日の出来事）。Eの先生（Mr. Delgado）は少し登場するだけです。"}, {"prompt": "The comparison “like a train pulling away from a platform” in the second paragraph suggests that Yui", "choices": ["was eager to leave the classroom", "found the discussion loud and unpleasant", "thought Mr. Delgado was impatient with slow students", "felt left behind because the conversation moved faster than she could respond", "missed riding trains in Osaka"], "ans": "D", "expl": "直前に「答えを組み立てた頃には議論は先へ進んでいた」とあり、ホームに取り残される乗客のように、ユイが会話に置いていかれた感覚を表す比喩です。Eは「電車」という語に引っ張られた引っ掛け。先生が苛立っていた（C）という記述はありません。"}, {"prompt": "Priya’s accepting the rice ball “with both hands, almost formally” most likely indicates that she", "choices": ["recognized that Yui’s offer was a meaningful gesture", "was afraid of dropping the rice ball", "had been taught Japanese customs by Yui earlier that day", "was reluctant to accept food from a stranger", "wanted to impress the other students at the table"], "ans": "A", "expl": "本文に as if she understood that something more than food was being offered（食べ物以上のものが差し出されたと理解しているかのように）とあり、友情のしるしとして受け取ったことがわかります。D「しぶしぶ」は逆。Cの「ユイから習った」という根拠はありません。"}, {"prompt": "The statement that “Yui’s English still felt like a coat a size too large” suggests that Yui", "choices": ["was embarrassed by her clothing", "knew more English words than she needed", "found the Minnesota weather colder than expected", "had given up trying to speak English", "was not yet comfortable or at ease using English"], "ans": "E", "expl": "「ワンサイズ大きいコート」＝体に合わず、着こなせていない状態。英語がまだ自分のものになっておらず、使いこなせない居心地の悪さを表す比喩です。A・Cは「coat」から連想させる引っ掛け。Bは「大きい」を語彙量と取り違えさせる罠です。"}, {"prompt": "In the final paragraph, Yui’s folding the schedule smaller and putting it away most likely signals that she", "choices": ["plans to throw it away because she dislikes her classes", "has memorized the location of every room in the building", "is beginning to feel less lost and less dependent on guidance", "wants to hide the schedule from her mother", "regrets having made a friend so quickly"], "ans": "C", "expl": "冒頭で時間割は「信用できない町の地図」のように握りしめられていました。最後にそれを小さく畳んで「見なくてもいい」ポケットにしまう行為は、少し居場所を見つけ、不安が和らいだことの象徴です。Bの「全教室を暗記した」は言い過ぎ。deliberately（意図的に）がポイントです。"}]}, {"id": "p2", "title": "Passage 2: Poetry", "jp": "詩：真夜中の街", "html": "<p><b>The City After Midnight<\/b><br><br>The city does not sleep; it only lowers its voice.<br>The traffic lights keep blinking their patient code<br>to streets that have no one left to tell.<br>A bakery on Fifth Street breathes warm bread<br>into the cold, a secret meant for no one,<br>and steam climbs from the gratings like the ghosts<br>of all the conversations of the day.<br><br>High up, a single window holds its square of gold—<br>someone awake with a fever or a book,<br>someone writing a letter they won’t send.<br>The river, black as a piano’s lid,<br>carries the bridge’s lamps downstream in pieces<br>and never once complains about the weight.<br><br>I used to think the dark was emptiness,<br>a pause between the louder, brighter hours.<br>But walking home tonight, I hear the hum<br>of furnaces and footsteps, trains below,<br>the slow heart of the city keeping time—<br>and I understand: the night is not the absence<br>of the day. It is the city, listening.<br><\/p>", "questions": [{"prompt": "The poem as a whole suggests that", "choices": ["cities become dangerous places after dark", "the speaker would rather live in the countryside", "a city at night is quietly alive rather than empty", "nighttime workers in the city are overworked and lonely", "night is a time best spent asleep"], "ans": "C", "expl": "第1行「街は眠らない、声を落とすだけ」と最終行「夜は昼の不在ではなく、耳を澄ます街そのもの」が主題。静かでも生きている夜の街を描いています。Aの「危険」、Bの「田舎」は本文にありません。Dは窓の人物などから連想させる引っ掛けです。"}, {"prompt": "The first line of the poem relies mainly on which literary device?", "choices": ["personification", "hyperbole", "onomatopoeia", "rhyme", "alliteration"], "ans": "A", "expl": "「街が眠る・声を落とす」と、人間の行為を街に当てはめているので personification（擬人法）。hyperbole は誇張、onomatopoeia は擬音語、alliteration は頭韻です。"}, {"prompt": "The comparison “black as a piano’s lid” in the second stanza mainly emphasizes the river’s", "choices": ["loud, rushing sound", "great depth", "dangerous current", "musical rhythm", "dark, smooth, reflective surface"], "ans": "E", "expl": "ピアノのふたは黒く光沢があり、物を映します。直後に「橋の灯りを（映して）切れ切れに運ぶ」とあるので、暗く滑らかで光を映す川面を強調しています。D「音楽的なリズム」は piano から連想させる引っ掛けです。"}, {"prompt": "In the final stanza, the speaker’s view of the night changes from", "choices": ["love of the city to fear of it", "seeing the night as empty to recognizing it as alive and attentive", "loneliness to joy at meeting a friend", "wakefulness to sleepiness", "admiration of the day to boredom with the night"], "ans": "B", "expl": "I used to think the dark was emptiness（かつては闇を空っぽだと思っていた）→ It is the city, listening（耳を澄ます街だ）。「空虚」から「生きて耳を傾ける存在」への認識の変化です。友人に会う場面（C）はありません。"}, {"prompt": "The poem mentions all of the following as signs of activity in the city at night EXCEPT", "choices": ["a bakery producing bread", "a lighted window high above the street", "trains moving below ground", "a crowded restaurant", "blinking traffic lights"], "ans": "D", "expl": "パン屋（第1連）、高い窓の灯り（第2連）、trains below（第3連）、点滅する信号（第1連）はすべて登場します。にぎわうレストランは出てきません。むしろ「誰もいない通り」が描かれています。"}]}, {"id": "p3", "title": "Passage 3: Earth Science", "jp": "火山と肥沃な土壌", "html": "<p>To people who live near them, volcanoes can seem like purely destructive forces. Eruptions bury villages under ash, send rivers of lava across farmland, and fill the sky with gas. Yet many of the world’s most productive agricultural regions lie in the shadow of volcanoes—on the slopes of Mount Etna in Sicily, across the islands of Indonesia, and in the coffee-growing highlands of Central America. This apparent paradox has a geological explanation: over time, volcanic material breaks down into some of the most fertile soil on Earth.<\/p><p>The key lies in what volcanic rock contains. Lava and ash are rich in minerals such as potassium, phosphorus, calcium, and magnesium—nutrients that plants need to grow. When fresh volcanic material is first deposited, however, these nutrients are locked inside glassy particles and solid rock, unavailable to roots. Only through weathering—the slow process by which rain, temperature changes, and living organisms break rock apart—are the minerals gradually released.<\/p><p>Volcanic ash weathers far more quickly than solid lava. Its fine, porous particles offer an enormous surface area to water and air, so chemical reactions proceed rapidly. In a warm, wet climate, a layer of ash can begin supporting plant life within a few years, whereas a thick lava flow may remain largely barren for centuries. Soils formed from volcanic ash, known as andisols, also have a remarkable ability to hold water and organic matter, which further benefits crops.<\/p><p>Still, the relationship between volcanoes and farming involves trade-offs. The same eruptions that eventually enrich the land can destroy harvests overnight, and farmers who settle on fertile slopes accept a degree of risk in exchange for abundance. Modern monitoring has reduced that risk considerably: scientists now track ground swelling, small earthquakes, and gas emissions to warn communities before many eruptions.<\/p><p>In the long view, volcanoes are not simply agents of destruction but participants in a cycle of renewal. What they bury, they eventually help to nourish.<\/p>", "questions": [{"prompt": "The primary purpose of the passage is to", "choices": ["warn readers about the dangers of living near volcanoes", "describe how scientists predict volcanic eruptions", "compare farming methods in Sicily, Indonesia, and Central America", "argue that people should not settle near volcanoes", "explain why volcanic regions, despite their dangers, often have very fertile soil"], "ans": "E", "expl": "第1段落の「一見矛盾（paradox）に見えるが、火山物質は地球上で最も肥沃な土壌になる」が主題で、以降その仕組みを説明しています。Bの噴火予測は第4段落の一部にすぎず、Cの地名は例として挙がっただけ。"}, {"prompt": "According to the passage, the nutrients in freshly deposited volcanic material are at first unavailable to plants because they", "choices": ["are washed away by flowing lava", "are locked inside glassy particles and solid rock", "are destroyed by volcanic gases", "exist only in cold, dry climates", "are absent from volcanic ash"], "ans": "B", "expl": "第2段落に these nutrients are locked inside glassy particles and solid rock, unavailable to roots とあります。風化（weathering）によって初めて放出されます。Eは「灰にはミネラルが豊富」という記述と矛盾します。"}, {"prompt": "As used in the third paragraph, the word “barren” most nearly means", "choices": ["heated", "crowded", "dangerous", "unable to support much plant life", "hidden"], "ans": "D", "expl": "「灰は数年で植物を支え始める一方（whereas）、厚い溶岩流は何世紀も barren のまま」という対比から、「不毛な・植物が育たない」の意味。barren land（不毛の地）は頻出です。"}, {"prompt": "It can be inferred that, in a warm and rainy region, a field covered by a recent ash fall, compared with a field covered by a thick lava flow, would most likely", "choices": ["become able to support crops much sooner", "remain barren for a longer time", "contain fewer useful minerals", "be less able to hold water", "be permanently unsafe for farming"], "ans": "A", "expl": "第3段落「灰は溶岩よりはるかに速く風化し、温暖湿潤な気候なら数年で植物を支え始める」より、灰の畑のほうがずっと早く作物を育てられると推論できます。Dは「アンディソルは保水力が高い」と逆です。"}, {"prompt": "The fourth paragraph functions mainly to", "choices": ["introduce a new theory of how soil forms", "contradict the claim that volcanic soil is fertile", "acknowledge the risks of farming near volcanoes and note how they have been reduced", "list the most famous eruptions in history", "explain the chemistry of weathering"], "ans": "C", "expl": "Still（それでも）で始まり、「豊かさと引き換えにリスクを受け入れている」「現代の監視でリスクは大幅に減った」と述べています。肥沃さを否定（B）しているのではなく、トレードオフを認めて補足している段落です。"}]}, {"id": "p4", "title": "Passage 4: American History", "jp": "大陸横断鉄道", "html": "<p>On May 10, 1869, at Promontory Summit in the Utah Territory, a ceremonial golden spike was tapped into place, joining two railroad lines that had been racing toward each other for six years. A telegraph operator sent a single word to waiting crowds across the country: “Done.” For the first time, the Atlantic and Pacific coasts of the United States were linked by a continuous line of rail.<\/p><p>The project had begun in 1862, when Congress passed the Pacific Railway Act in the middle of the Civil War. The law granted two companies land and government loans for every mile of track they laid. The Central Pacific built eastward from Sacramento, California, while the Union Pacific built westward from the Missouri River. Because payment depended on mileage, each company had a strong incentive to build as quickly as possible—sometimes at the expense of quality.<\/p><p>The Central Pacific faced the more forbidding terrain. Its crews had to blast tunnels through the granite of the Sierra Nevada, often working through winters in which snow buried camps entirely. Unable to attract enough workers, the company hired thousands of Chinese immigrants, who eventually made up most of its labor force. They were paid less than white workers and performed some of the most dangerous tasks, yet their contribution was largely left out of the celebrations at Promontory. The Union Pacific, crossing the flatter Great Plains, relied heavily on Irish immigrants and veterans of the Civil War.<\/p><p>The railroad’s effects were enormous. A journey across the continent that once took months by wagon could now be completed in about a week. Goods, mail, and settlers flowed west, and new towns sprang up along the line. For Native American nations of the Plains, however, the railroad brought devastation. It carried settlers onto their lands and hunters who slaughtered the bison herds on which many tribes depended.<\/p><p>The Transcontinental Railroad is often remembered as a triumph of engineering and national ambition. It was both of those things. But a full account must also include the people whose labor built it and the people whose lives it upended.<\/p>", "questions": [{"prompt": "The passage is mainly concerned with", "choices": ["the building of the Transcontinental Railroad and its mixed consequences", "the role of the telegraph in American history", "the causes of the Civil War", "the engineering methods used to blast tunnels", "a rivalry between Irish and Chinese workers"], "ans": "A", "expl": "建設の経緯・労働者・影響を述べ、最終段落で「工学的偉業だが、建設した人々と生活を覆された人々も含めて語るべき」とまとめています。功罪両面＝mixed consequences。電信（B）やトンネル技術（D）は細部です。"}, {"prompt": "According to the passage, each railroad company had an incentive to build quickly because", "choices": ["the army needed to move troops during the war", "winter snow threatened to stop construction", "land and loans were awarded according to the number of miles of track laid", "Native American nations demanded a fast route", "the telegraph lines had to be finished first"], "ans": "C", "expl": "第2段落 Because payment depended on mileage（支払いが距離次第だったので）とあります。直前の「敷設1マイルごとに土地と融資を与えた」が根拠。Bの雪は中央太平洋鉄道の苦労として出てくるだけです。"}, {"prompt": "The author’s discussion of Chinese workers in the third paragraph suggests that they", "choices": ["were the highest-paid workers on the project", "made an essential contribution that did not receive proper recognition", "worked mainly on the flat Great Plains", "were responsible for the poor quality of some track", "organized the ceremony at Promontory Summit"], "ans": "B", "expl": "「労働力の大半を占め、最も危険な作業をしたのに、プロモントリーの祝典ではほぼ無視された」とあり、不可欠な貢献が正当に評価されなかったことを示唆。Aは「白人より低賃金」と逆、Cの大平原はユニオン・パシフィック（アイルランド系など）です。"}, {"prompt": "As used in the final paragraph, the word “upended” most nearly means", "choices": ["celebrated", "lifted", "recorded", "disrupted dramatically", "supported"], "ans": "D", "expl": "upend は「ひっくり返す・根底から覆す」。第4段落で先住民にとって鉄道は devastation（壊滅）をもたらしたとあるので、「生活を大きく混乱させた」の意。B「持ち上げた」は up から連想させる引っ掛けです。"}, {"prompt": "The author’s attitude toward the Transcontinental Railroad can best be described as", "choices": ["purely celebratory", "bitterly hostile", "indifferent", "lightly humorous", "balanced, recognizing both its achievements and its costs"], "ans": "E", "expl": "It was both of those things（偉業でもあった）と認めつつ、But a full account must also include...と犠牲も語るべきとしています。称賛一辺倒（A）でも敵意（B）でもなく、バランスの取れた態度です。"}]}, {"id": "p5", "title": "Passage 5: Biography", "jp": "植物学者エレノア・ハート", "html": "<p>Eleanor Hart was born in 1838 in a small town in western Massachusetts, the daughter of a schoolteacher who believed, unusually for his time, that his daughters deserved the same education as his sons. By the age of ten, Eleanor could identify nearly every wildflower in the surrounding hills, and she kept a pressed specimen of each in a leather-bound book that she called her “silent library.”<\/p><p>As a young woman, Hart hoped to study botany at a university, but none in her region admitted women. Rather than abandon her ambitions, she pursued them by other means. She corresponded with established naturalists, mailing them carefully labeled specimens and detailed notes. Many replies were dismissive; one professor suggested she confine herself to “the decorative arts of the flower garden.” But a few correspondents recognized the precision of her observations and began to rely on her collections.<\/p><p>Hart’s most important work concerned mosses and lichens, tiny organisms that most botanists of her day considered unworthy of serious attention. Over two decades, she documented how certain lichens disappeared from tree bark near factory towns while flourishing in cleaner, rural air. She did not have the chemical tools to explain why. Yet her meticulous records, which noted locations, dates, and weather conditions, anticipated by many years the modern understanding that lichens are sensitive indicators of air pollution.<\/p><p>Recognition came slowly. Her first scientific paper was published under her initials alone, “E. Hart,” at the suggestion of an editor who feared readers would dismiss a woman’s work. Only in her fifties was she invited to address a scientific society in Boston, where, according to one listener, she spoke “without notes and without apology.”<\/p><p>Hart died in 1911, leaving more than nine thousand specimens to a university herbarium—an institution that, during most of her life, would not have admitted her as a student. Today, researchers still consult her collection to compare past and present plant life in New England, a reminder that careful observation can outlast the barriers placed in its way.<\/p>", "questions": [{"prompt": "The primary purpose of the passage is to", "choices": ["argue that every university should offer botany courses", "explain the chemistry that makes lichens sensitive to pollution", "criticize nineteenth-century editors", "describe the career of a botanist who made lasting contributions despite being excluded", "compare the structures of mosses and lichens"], "ans": "D", "expl": "生い立ちから、大学に入れない中での研究、遅い評価、死後も使われる標本まで、障壁を越えて功績を残した生涯を描く伝記です。Bは「化学的な手段はなかった」とあり説明されていません。Cは一部の細部です。"}, {"prompt": "According to the passage, Hart pursued botany without attending a university by", "choices": ["disguising herself in order to attend lectures", "teaching botany at her father’s school", "traveling to study in Europe", "founding a college for women", "corresponding with established naturalists and sending them specimens"], "ans": "E", "expl": "第2段落 She corresponded with established naturalists, mailing them carefully labeled specimens and detailed notes とあります。correspond＝文通する。他の選択肢はどれも本文にありません。"}, {"prompt": "The detail that Hart’s first paper was published under “E. Hart” suggests that", "choices": ["Hart wished to remain anonymous out of modesty", "the paper was written by more than one author", "women’s scientific work was often taken less seriously at the time", "the editor disagreed with Hart’s conclusions", "her full name was too long to print"], "ans": "C", "expl": "「読者が女性の研究を軽視することを恐れた編集者の提案で」イニシャルにしたとあり、当時女性の研究が軽んじられていたことがわかります。Aの「謙遜」は本人の意思ではないので誤り。"}, {"prompt": "As used in the third paragraph, the word “meticulous” most nearly means", "choices": ["extremely careful and detailed", "secret", "hurried", "colorful", "controversial"], "ans": "A", "expl": "meticulous＝「細心の、きわめて綿密な」。直後に「場所・日付・天候まで記録した」とあり、緻密さが裏付けられています。"}, {"prompt": "The description of Hart speaking “without notes and without apology” suggests that she", "choices": ["had not prepared for the event", "spoke with confidence and did not downplay her work", "offended many members of the audience", "forgot most of her prepared speech", "refused to answer questions afterward"], "ans": "B", "expl": "「原稿なしで」＝内容を熟知、「謝罪なしで」＝女性だからと遠慮・卑下しない、つまり自信をもって堂々と語ったということ。A・Dは without notes を「準備不足」と誤読させる引っ掛けです。"}]}, {"id": "p6", "title": "Passage 6: Technology and Ethics", "jp": "アルゴリズムとプライバシー", "html": "<p>Every time you search for a product, watch a video, or tap “like” on a photo, you leave behind a small trace of information. Individually, these traces seem trivial. But companies increasingly use algorithms—sets of step-by-step instructions carried out by computers—to combine millions of such traces into detailed profiles. An algorithm might infer your age, your income, your political leanings, or even your health from patterns you never knowingly revealed.<\/p><p>Supporters argue that this kind of analysis makes daily life more convenient. Streaming services recommend shows you are likely to enjoy; map applications predict traffic; online stores remind you of items you need. In medicine, algorithms that analyze large sets of anonymized records have helped doctors spot early warning signs of disease. From this perspective, data is simply a resource, and using it well benefits everyone.<\/p><p>Critics respond that convenience can conceal a cost. One concern is that people rarely understand what they have agreed to share. Privacy policies are often long, technical, and written in ways that discourage careful reading. Another concern is that inferences can be wrong, or right in ways that cause harm. A system that predicts which applicants are “risky” for a loan, for instance, may rely on data that reflects past discrimination, quietly repeating old injustices under the appearance of objective calculation.<\/p><p>There is also the question of who controls the information once it is gathered. Data collected for one purpose can be sold, combined with other databases, or exposed in a security breach. Once released, it is nearly impossible to recall.<\/p><p>None of this means that algorithms are inherently harmful. Like any tool, they reflect the choices of the people who design and deploy them. The challenge for societies is to decide—through law, design, and public debate—which uses of personal data are acceptable, and to ensure that individuals have a meaningful say in how information about them is used. Privacy, in this view, is not about having something to hide; it is about having the power to decide what to reveal.<\/p>", "questions": [{"prompt": "Which of the following best states the main idea of the passage?", "choices": ["Algorithms are dangerous and should be banned.", "The use of personal data by algorithms offers benefits but raises serious concerns that societies must address.", "Privacy policies should be made longer and more detailed.", "Medical uses of algorithms are the only valuable ones.", "People who care about privacy usually have something to hide."], "ans": "B", "expl": "賛成派（利便性・医療）と批判派（同意の不透明さ・差別の再生産・管理）を紹介し、最終段落で「本質的に有害ではないが、社会が法・設計・議論で決める必要がある」とまとめています。Aは inherently harmful ではないと明言されており誤り。Eは最終文と逆です。"}, {"prompt": "According to the passage, supporters of data analysis cite which of the following as a benefit?", "choices": ["Helping doctors detect early warning signs of disease", "Eliminating discrimination in lending decisions", "Making privacy policies easier to read", "Preventing all security breaches", "Allowing users to recall data that has been released"], "ans": "A", "expl": "第2段落に「匿名化された記録を分析するアルゴリズムが病気の初期兆候の発見を助けた」とあります。Bは逆に批判派が「差別を繰り返す」と懸念している点。Eは「一度出たデータは回収ほぼ不可能」と矛盾します。"}, {"prompt": "As used in the third paragraph, the word “conceal” most nearly means", "choices": ["increase", "reveal", "justify", "hide", "reduce"], "ans": "D", "expl": "conceal＝「隠す」。「便利さがコストを隠すことがある」という意味です。B reveal は反意語の引っ掛け。"}, {"prompt": "Which of the following situations best illustrates the concern, described in the third paragraph, that an algorithm may repeat “old injustices”?", "choices": ["A map application sends a driver on a slower route because of a software error.", "A user agrees to a long privacy policy without reading it.", "A hiring program trained on a company’s past hiring records ranks applicants from certain neighborhoods lower, just as the company once did.", "A hacker steals a store’s list of customers.", "An online store reminds a customer to buy more coffee."], "ans": "C", "expl": "本文の例は「過去の差別を反映したデータに頼り、客観的計算の装いのもとで古い不正を繰り返す」こと。過去の偏った採用記録で学習し、同じ偏りを再現するCがぴったりです。Bは「同意内容を理解していない」という別の懸念、Dは第4段落の情報漏えいの話です。"}, {"prompt": "In the final sentence, the author defines privacy primarily as", "choices": ["keeping one’s wrongdoing secret", "refusing to use modern technology", "a law that forbids all data collection", "the ability to delete one’s online accounts", "the power to choose what personal information to share"], "ans": "E", "expl": "最終文 it is about having the power to decide what to reveal（何を明かすかを決める力）。not about having something to hide とあるので A は否定されています。"}]}, {"id": "p7", "title": "Passage 7: Humanities", "jp": "言語はどう言葉を借りるか", "html": "<p>English is sometimes described as a language that has never met a word it did not want to keep. A quick look at an ordinary sentence proves the point. “The chef took a siesta after serving ketchup with the tea” contains words borrowed from French, Spanish, and two different Chinese sources. Linguists call such words loanwords, though the term is a little misleading: languages almost never give them back.<\/p><p>Borrowing usually follows contact between peoples—through trade, conquest, migration, or cultural exchange. After the Norman Conquest of 1066, French became the language of England’s ruling class for several centuries, and thousands of French words entered English. The results can still be seen in pairs of words for animals and their meat: English farmers raised “cows” and “pigs,” while French-speaking nobles dined on “beef” (from <i>boeuf<\/i>) and “pork” (from <i>porc<\/i>). The vocabulary of the kitchen table preserves a history of social class.<\/p><p>Languages also borrow when they encounter something new. When Europeans first came across foods, animals, and objects from the Americas, they often adopted local names for them: “tomato” and “chocolate” come, through Spanish, from Nahuatl, the language of the Aztecs. In more recent times, Japanese has absorbed hundreds of English words, such as <i>konpyūtā<\/i> (computer), while English has adopted “tsunami,” “emoji,” and “karaoke” from Japanese.<\/p><p>Borrowed words rarely arrive unchanged. They are reshaped to fit the sounds and grammar of their new home. Japanese, which typically alternates consonants and vowels, adds vowels to English words, turning “strike” into <i>sutoraiku<\/i>. Meanings can shift as well: in English, a “pundit” is a commentator, but the Hindi word from which it comes, <i>pandit<\/i>, refers to a learned scholar.<\/p><p>Some people worry that borrowing threatens a language’s purity, and several countries have established official bodies to propose native alternatives to foreign terms. Yet the history of English suggests that borrowing is less a sign of weakness than of vitality. A language that borrows is a language in contact with the world—and its dictionary becomes a record of every encounter.<\/p>", "questions": [{"prompt": "The primary purpose of the passage is to", "choices": ["argue that English should stop borrowing words", "trace the political history of the Norman Conquest", "explain how and why languages adopt words from other languages", "teach readers basic Japanese vocabulary", "compare the grammar of French and Spanish"], "ans": "C", "expl": "借用が起こる理由（接触・新しい物との出会い）、借用語の変化（音・意味）、借用への評価を順に説明しています。ノルマン征服（B）や日本語（D）は例にすぎません。Aは筆者の肯定的な立場と逆です。"}, {"prompt": "The author mentions the words “beef” and “pork” in the second paragraph in order to", "choices": ["show that French nobles ate more meat than English farmers", "prove that English has no native words for animals", "argue that farmers should have learned French", "explain how Japanese adapts English sounds", "show how borrowed words can preserve evidence of social class differences"], "ans": "E", "expl": "段落最後の The vocabulary of the kitchen table preserves a history of social class が答え。動物名は英語（農民）、肉の名はフランス語（貴族）という対比が階級の歴史を残している例です。Bは cow や pig という英語本来の語があるので誤り。"}, {"prompt": "The passage mentions all of the following as circumstances that lead to borrowing EXCEPT", "choices": ["a government order requiring citizens to use foreign words", "conquest", "trade", "encountering unfamiliar foods or objects", "migration"], "ans": "A", "expl": "第2段落に trade, conquest, migration, cultural exchange、第3段落に「新しいものに出会ったとき」とあります。政府が外国語使用を命じる話はなく、むしろ第5段落では外来語の代わりに自国語を提案する機関が紹介されています（逆向きの引っ掛け）。"}, {"prompt": "The example of the word “pundit” in the fourth paragraph is used to show that", "choices": ["Hindi has borrowed many English words", "a borrowed word’s meaning may change in its new language", "all commentators are learned scholars", "Japanese adds vowels to borrowed words", "English words are seldom borrowed by other languages"], "ans": "B", "expl": "Meanings can shift as well に続く例で、ヒンディー語の「学者」が英語では「評論家」に意味が変わったことを示しています。Dは同じ段落の strike の例の説明なので混同注意。"}, {"prompt": "The author’s attitude toward linguistic borrowing is best described as", "choices": ["alarmed", "indifferent", "mocking", "appreciative, viewing borrowing as a sign of a language’s vitality", "confused and uncertain"], "ans": "D", "expl": "最終段落で「借用は弱さではなく活力（vitality）のしるし」「辞書はあらゆる出会いの記録になる」と述べ、肯定的に評価しています。Aの alarmed は「純粋性を心配する人々」の態度で、筆者のものではありません。"}]}, {"id": "p8", "title": "Passage 8: Physical Science", "jp": "氷はなぜ浮くのか", "html": "<p>Drop an ice cube into a glass of water and it bobs at the surface. The sight is so familiar that few people stop to wonder about it. Yet it is genuinely unusual. For nearly all substances, the solid form is denser than the liquid form: solid wax sinks in melted wax, and a chunk of solid iron sinks in molten iron. Water is one of the rare exceptions, and the reason lies in the shape of its molecules.<\/p><p>A water molecule consists of one oxygen atom bonded to two hydrogen atoms, arranged in a bent shape rather than a straight line. The oxygen end carries a slight negative charge, while the hydrogen ends carry slight positive charges. As a result, the hydrogen of one molecule is attracted to the oxygen of a neighboring molecule. These attractions, called hydrogen bonds, are much weaker than the bonds within a molecule, but they strongly influence how water behaves.<\/p><p>In liquid water, hydrogen bonds constantly form, break, and re-form as molecules tumble past one another. Because the molecules are free to move, they can crowd closely together. When water freezes, however, each molecule becomes locked into hydrogen bonds with four neighbors, forming a rigid, six-sided lattice. This orderly structure holds the molecules slightly farther apart than they are in the liquid, leaving open spaces within the crystal. Consequently, ice is about 9 percent less dense than liquid water—and anything less dense than the liquid around it floats.<\/p><p>This molecular quirk has consequences on a planetary scale. When a lake freezes in winter, the ice forms at the surface and acts as an insulating lid, slowing the cooling of the water beneath. Fish and other organisms survive the season in the liquid water below. If ice were denser than water, it would sink as it formed, and many lakes might gradually freeze solid from the bottom up, with devastating effects on aquatic life.<\/p><p>The floating ice cube, then, is more than a curiosity. It is a small, everyday demonstration of a property that helps make life on Earth possible.<\/p>", "questions": [{"prompt": "The passage is primarily concerned with", "choices": ["proving that water is the most common substance on Earth", "describing the unusual behavior of wax and iron", "explaining why lakes freeze from the bottom up", "showing that hydrogen bonds are stronger than the bonds within a molecule", "explaining why ice floats and why this property matters"], "ans": "E", "expl": "分子の形・水素結合・結晶格子から氷が浮く理由を説明し、湖の生物を守るという重要性まで述べています。Cは「もし氷が重ければ」という仮定の話で事実ではありません。Dは much weaker（はるかに弱い）と逆です。"}, {"prompt": "According to the passage, ice is less dense than liquid water because", "choices": ["air bubbles are trapped in it as it freezes", "hydrogen bonds stop forming when water freezes", "water molecules lose hydrogen atoms when frozen", "a rigid lattice holds the molecules slightly farther apart than in the liquid", "frozen molecules move faster than liquid ones"], "ans": "D", "expl": "第3段落「凍ると各分子が4つの隣と水素結合で固定され六角形の格子を作り、液体より少し離れて並ぶ」が根拠。Bは逆で、氷では水素結合が「固定される」。Aの気泡は日常の連想を利用した引っ掛けです。"}, {"prompt": "As used in the fourth paragraph, the word “quirk” most nearly means", "choices": ["danger", "unusual characteristic", "mistake", "natural law", "experiment"], "ans": "B", "expl": "quirk＝「奇妙な特徴・癖」。第1段落で「水は稀な例外」と述べた性質を指しています。C「誤り」は「変なもの」というイメージから選ばせる引っ掛けです。"}, {"prompt": "According to the fourth paragraph, the layer of ice on a frozen lake helps aquatic life mainly by", "choices": ["providing food for fish", "allowing more sunlight to reach the bottom", "acting as an insulating lid that slows the cooling of the water below", "adding oxygen to the water", "raising the level of the lake"], "ans": "C", "expl": "the ice ... acts as an insulating lid, slowing the cooling of the water beneath とあり、断熱の「ふた」として下の水が冷えるのを遅らせ、生物が液体の水の中で冬を越せます。他の選択肢は本文にありません。"}, {"prompt": "The author mentions wax and iron in the first paragraph primarily to", "choices": ["show that water’s behavior is unusual compared with that of most substances", "explain how metals are manufactured", "suggest that solid wax and iron float", "introduce the concept of hydrogen bonds", "describe a simple kitchen experiment"], "ans": "A", "expl": "「ほぼすべての物質では固体のほうが重い（ろうも鉄も沈む）」と例を挙げ、Water is one of the rare exceptions（水は稀な例外）と対比させています。Cは「沈む」と逆。水素結合（D）は第2段落で初登場です。"}]}]}, "verbal": {"synonyms": [{"word": "FRAGILE", "choices": ["sturdy", "breakable", "fragrant", "flexible", "ancient"], "ans": "B", "expl": "fragile は「壊れやすい・もろい」。正解は breakable（壊れやすい）。sturdy（頑丈な）は反意語、fragrant（香りのよい）は綴りが似た引っ掛けです。"}, {"word": "GENUINE", "choices": ["generous", "gentle", "false", "authentic", "genius"], "ans": "D", "expl": "genuine は「本物の・誠実な」。authentic（本物の）が同義。generous（気前のよい）、genius（天才）は gen- で始まる見た目の引っ掛け、false は反意語です。"}, {"word": "HOSTILE", "choices": ["unfriendly", "hospitable", "hesitant", "hollow", "careless"], "ans": "A", "expl": "hostile は「敵意のある・非友好的な」。unfriendly が正解。hospitable（もてなしのよい）は綴りが似ていますがほぼ反意語なので要注意。"}, {"word": "IMMENSE", "choices": ["tiny", "intense", "immediate", "dense", "huge"], "ans": "E", "expl": "immense は「巨大な・莫大な」。huge が同義。tiny は反意語、intense（強烈な）や dense（密な）は語尾 -ense が同じ音の引っ掛けです。"}, {"word": "LOYAL", "choices": ["legal", "royal", "faithful", "fickle", "lonely"], "ans": "C", "expl": "loyal は「忠実な・誠実な」。faithful が正解。royal（王の）は韻が同じ引っ掛け、fickle（気まぐれな・移り気な）は反意語です。"}, {"word": "MERIT", "choices": ["worth", "fault", "mercy", "wage", "memory"], "ans": "A", "expl": "merit は名詞で「価値・長所・功績」。worth（価値）が同義。fault（欠点）は反意語、mercy（慈悲）は mer- で始まる見た目の引っ掛けです。"}, {"word": "FEEBLE", "choices": ["foolish", "fierce", "weak", "sad", "flexible"], "ans": "C", "expl": "feeble は「弱々しい・かすかな」。weak が正解。fierce（獰猛な）は反対のイメージ、foolish は f で始まる音の引っ掛けです。"}, {"word": "GRATITUDE", "choices": ["greed", "resentment", "attitude", "gravity", "thankfulness"], "ans": "E", "expl": "gratitude は「感謝の気持ち」（grat- = 喜ばしい、grateful と同語源）。thankfulness が同義。resentment（恨み）はほぼ反意語、attitude は -titude の語尾が同じ引っ掛けです。"}, {"word": "HUMBLE", "choices": ["proud", "modest", "humid", "gloomy", "friendly"], "ans": "B", "expl": "humble は「謙虚な・控えめな」。modest が同義。proud（高慢な）は反意語、humid（湿気の多い）は綴りの引っ掛けです。"}, {"word": "IMPARTIAL", "choices": ["incomplete", "prejudiced", "impatient", "unbiased", "important"], "ans": "D", "expl": "impartial は im-（否定）+ partial（えこひいきの）で「公平な・偏りのない」。unbiased が正解。partial を「部分的」と捉えて incomplete を選ぶのが典型的な引っ掛け。prejudiced（偏見のある）は反意語です。"}, {"word": "MELANCHOLY", "choices": ["angry", "melodious", "calm", "cheerful", "sorrowful"], "ans": "E", "expl": "melancholy は「憂うつな・物悲しい」。sorrowful（悲しげな）が同義。cheerful は反意語、melodious（旋律の美しい）は mel- の見た目の引っ掛けです。"}, {"word": "LEGISLATE", "choices": ["make laws", "enforce laws", "interpret laws", "elect officials", "break laws"], "ans": "A", "expl": "legislate は「法律を制定する」（legislature = 立法府）。make laws が正解。enforce（執行する＝行政）、interpret（解釈する＝司法）は三権分立の他の役割で、紛らわしい引っ掛けです。"}, {"word": "FURTIVE", "choices": ["angry", "furious", "open", "sneaky", "fertile"], "ans": "D", "expl": "furtive は「こそこそした・人目を盗む」。sneaky が同義。furious（激怒した）、fertile（肥沃な）は音が似た引っ掛け、open（公然の）は反意語です。"}, {"word": "GRIEVANCE", "choices": ["sorrow", "complaint", "celebration", "pardon", "gravity"], "ans": "B", "expl": "grievance は「不満・苦情（の種）」。complaint が正解。grief（深い悲しみ）と似ているので sorrow を選びがちですが、grievance は「不当な扱いへの不平」です。"}, {"word": "HAUGHTY", "choices": ["naughty", "humble", "arrogant", "hasty", "cheerful"], "ans": "C", "expl": "haughty は「傲慢な・横柄な」。arrogant が同義。naughty（いたずらな）は韻の引っ掛け、humble（謙虚な）は反意語です。"}, {"word": "INCITE", "choices": ["provoke", "insight", "calm", "include", "invite"], "ans": "A", "expl": "incite は「（暴動・感情などを）あおる・扇動する」。provoke が同義。insight（洞察）は同音異義の引っ掛け、calm（なだめる）は反意語です。"}, {"word": "JUBILANT", "choices": ["jealous", "youthful", "sorrowful", "judicial", "overjoyed"], "ans": "E", "expl": "jubilant は「歓喜に満ちた」（jubilee = 祝典）。overjoyed が正解。sorrowful は反意語、jealous や judicial は j で始まる見た目の引っ掛けです。"}, {"word": "KINDLE", "choices": ["extinguish", "soothe", "ignite", "gather", "bundle"], "ans": "C", "expl": "kindle は「火をつける・（感情を）かき立てる」。ignite が同義。extinguish（消す）は反意語。kind（親切な）を連想して soothe を選ばないよう注意。"}, {"word": "MANDATE", "choices": ["suggestion", "holiday", "rebellion", "official order", "partnership"], "ans": "D", "expl": "mandate は「（公式の）命令・指令／（選挙で与えられた）権限」。official order が正解。suggestion（提案）は強制力がない点で異なる引っ掛けです。"}, {"word": "FRIVOLOUS", "choices": ["serious", "trivial", "frightened", "generous", "fruitful"], "ans": "B", "expl": "frivolous は「くだらない・軽薄な」。trivial（ささいな）が同義。serious は反意語、frightened や fruitful は fr- の見た目の引っ掛けです。"}, {"word": "GULLIBLE", "choices": ["skeptical", "easily fooled", "greedy", "guilty", "capable"], "ans": "B", "expl": "gullible は「だまされやすい」。easily fooled が正解。skeptical（疑い深い）は反意語、guilty（有罪の）は gu- で始まる音の引っ掛けです。"}, {"word": "INDIGNANT", "choices": ["poor", "dignified", "indifferent", "satisfied", "resentful"], "ans": "E", "expl": "indignant は「（不正・侮辱に）憤慨した」。resentful が最も近い意味。indigent（貧しい）と混同して poor を、dignity から dignified を選ぶのが典型的な引っ掛けです。"}, {"word": "LETHARGIC", "choices": ["sluggish", "lethal", "energetic", "logical", "forgetful"], "ans": "A", "expl": "lethargic は「無気力な・だるい」。sluggish（のろのろした）が同義。lethal（致命的な）は綴りの引っ掛け、energetic は反意語です。"}, {"word": "MAGNANIMOUS", "choices": ["enormous", "petty", "generous and forgiving", "magnetic", "boastful"], "ans": "C", "expl": "magnanimous は magna（大きな）+ animus（心）で「度量の大きい・寛大な」。generous and forgiving が正解。magna- から enormous（巨大な）を選ぶのは引っ掛け。petty（心の狭い）は反意語です。"}, {"word": "HEGEMONY", "choices": ["harmony", "rebellion", "alliance", "dominance", "neutrality"], "ans": "D", "expl": "hegemony は「（国家などによる）覇権・支配」。dominance が同義。harmony は語尾 -mony が同じ引っ掛け、alliance（同盟）は対等な関係なので異なります。"}, {"word": "IMPETUOUS", "choices": ["cautious", "impervious", "stubborn", "gloomy", "rash"], "ans": "E", "expl": "impetuous は「衝動的な・性急な」（impetus = 勢い）。rash（軽率な）が同義。cautious は反意語、impervious（影響されない）は im-…-ous の見た目の引っ掛けです。"}, {"word": "FASTIDIOUS", "choices": ["meticulous", "speedy", "careless", "festive", "stubborn"], "ans": "A", "expl": "fastidious は「細部にこだわる・好みのうるさい」。meticulous（細心の）が同義。fast から speedy を選ぶ、festive（お祝いの）と音で混同するのが引っ掛け。careless は反意語です。"}, {"word": "LACONIC", "choices": ["talkative", "lazy", "lyrical", "terse", "ironic"], "ans": "D", "expl": "laconic は「言葉数の少ない・簡潔な」（古代スパルタのラコニア地方の人々の話し方に由来）。terse が同義。talkative は反意語、ironic は語尾 -onic が似た引っ掛けです。"}, {"word": "INTRANSIGENT", "choices": ["flexible", "uncompromising", "temporary", "transparent", "wandering"], "ans": "B", "expl": "intransigent は「妥協しない・頑固な」。uncompromising が同義。flexible は反意語。trans- から transparent（透明な）や transient（一時的な）＝temporary を連想させる引っ掛けに注意。"}, {"word": "MENDACIOUS", "choices": ["needy", "repairing", "dishonest", "generous", "sincere"], "ans": "C", "expl": "mendacious は「うそつきの・虚偽の」（mendacity = 虚偽）。dishonest が同義。mend（修理する）から repairing、mendicant（物乞い）から needy を選ぶのが引っ掛け。sincere は反意語です。"}], "analogies": [{"prompt": "Happy is to ecstatic as", "choices": ["sad is to joyful", "cold is to wet", "warm is to scorching", "quick is to slow", "loud is to noisy"], "ans": "C", "expl": "ブリッジ文：ecstatic（有頂天の）は happy の程度が極端に強いもの。→ scorching（焼けつくように暑い）は warm の極端な程度。loud / noisy は同程度の類義語なので不可。"}, {"prompt": "Senator is to legislature as juror is to", "choices": ["jury", "verdict", "judge", "courtroom", "trial"], "ans": "A", "expl": "ブリッジ文：上院議員は議会という集団の一員である。→ 陪審員は jury（陪審団）の一員。verdict（評決）は陪審の出すもの、courtroom は場所なので関係が違います。"}, {"prompt": "Fear is to tremble as", "choices": ["smile is to joy", "laugh is to cry", "anger is to calm", "sorrow is to happiness", "embarrassment is to blush"], "ans": "E", "expl": "ブリッジ文：恐怖という感情は体を震えさせる（感情→身体反応）。→ 恥ずかしさは顔を赤らめさせる。smile is to joy は順序が逆（反応→感情）なので引っ掛けです。"}, {"prompt": "Ballot is to voter as gavel is to", "choices": ["courtroom", "judge", "hammer", "verdict", "wood"], "ans": "B", "expl": "ブリッジ文：投票用紙は有権者が使う道具である（道具→使用者）。→ gavel（木槌）は judge（裁判官）が使う道具。hammer は gavel の種類、courtroom は場所です。"}, {"prompt": "Generous is to stingy as", "choices": ["brave is to bold", "honest is to truthful", "kind is to gentle", "humble is to arrogant", "calm is to quiet"], "ans": "D", "expl": "ブリッジ文：generous（気前のよい）と stingy（けちな）は反意語。→ humble（謙虚な）と arrogant（傲慢な）も反意語。他はすべて類義語のペアです。"}, {"prompt": "Constitution is to nation as rulebook is to", "choices": ["referee", "game", "page", "author", "law"], "ans": "B", "expl": "ブリッジ文：憲法は国家のあり方を定める基本ルールである。→ ルールブックは game（競技）のルールを定める。referee はルールを適用する人、law は constitution の連想による引っ掛けです。"}, {"prompt": "Tyrant is to cruelty as", "choices": ["coward is to bravery", "judge is to crime", "miser is to generosity", "citizen is to vote", "optimist is to hopefulness"], "ans": "E", "expl": "ブリッジ文：暴君の特徴は残酷さである（人物→特徴）。→ 楽観主義者の特徴は希望を持つこと。coward / bravery や miser / generosity は「欠けているもの」の関係なので逆です。"}, {"prompt": "Hopeless is to hope as fearless is to", "choices": ["fear", "courage", "danger", "hero", "fearful"], "ans": "A", "expl": "ブリッジ文：hopeless とは hope が欠けている状態である（-less = 欠如）。→ fearless は fear が欠けている状態。courage は fearless の類義語なので引っ掛けです。"}, {"prompt": "Chapter is to novel as", "choices": ["reader is to magazine", "author is to biography", "stanza is to poem", "ink is to pen", "library is to book"], "ans": "C", "expl": "ブリッジ文：章は小説を構成する一部分である（部分→全体）。→ stanza（連）は詩を構成する一部分。library / book は場所の関係、ink / pen は中身と容器の関係です。"}, {"prompt": "Mayor is to city as governor is to", "choices": ["country", "council", "election", "state", "capital"], "ans": "D", "expl": "ブリッジ文：市長は市の行政の長である。→ 州知事は state（州）の長。capital（州都）は都市なので市長の範囲と重なり、引っ掛けになります。"}, {"prompt": "Thermometer is to temperature as", "choices": ["scale is to weight", "clock is to alarm", "ruler is to king", "map is to journey", "calendar is to holiday"], "ans": "A", "expl": "ブリッジ文：温度計は温度を測る道具である。→ はかりは重さを測る道具。ruler is to king は ruler の「支配者」の意味を使った引っ掛けです。"}, {"prompt": "Anxious is to calm as rash is to", "choices": ["hasty", "skin", "reckless", "prudent", "angry"], "ans": "D", "expl": "ブリッジ文：anxious（不安な）は calm（落ち着いた）の反意語である。→ rash（軽率な）の反意語は prudent（慎重な）。hasty・reckless は類義語、skin は rash の「発疹」の意味を狙った引っ掛けです。"}, {"prompt": "Architect is to blueprint as", "choices": ["builder is to hammer", "composer is to symphony", "teacher is to school", "patient is to doctor", "pilot is to airport"], "ans": "B", "expl": "ブリッジ文：建築家は設計図を作り出す（作り手→作品）。→ 作曲家は交響曲を作り出す。builder / hammer は道具、teacher / school は職場の関係です。"}, {"prompt": "Monarchy is to government as sonnet is to", "choices": ["rhyme", "poet", "line", "Shakespeare", "poem"], "ans": "E", "expl": "ブリッジ文：君主制は政治体制の一種である（種類→カテゴリー）。→ ソネットは poem（詩）の一種。line や rhyme は詩の部分・要素、Shakespeare は作者の例なので関係が違います。"}, {"prompt": "Irritation is to rage as", "choices": ["fury is to anger", "joy is to sorrow", "fondness is to adoration", "fear is to courage", "grief is to tears"], "ans": "C", "expl": "ブリッジ文：rage（激怒）は irritation（いら立ち）の程度が非常に強いもの（弱→強）。→ adoration（熱愛）は fondness（好意）の強いもの。fury / anger は強→弱で順序が逆の引っ掛けです。"}, {"prompt": "Veto is to bill as overrule is to", "choices": ["judge", "law", "court", "agree", "objection"], "ans": "E", "expl": "ブリッジ文：veto（拒否権の行使）は bill（法案）を退ける行為である。→ overrule（却下する）は objection（異議）を退ける行為。judge は overrule する人であって退けられる対象ではありません。"}, {"prompt": "Campaign is to election as", "choices": ["vote is to ballot", "inauguration is to election", "rehearsal is to performance", "audience is to concert", "winner is to loser"], "ans": "C", "expl": "ブリッジ文：選挙運動は選挙に先立って行われる準備である（順序：準備→本番）。→ リハーサルは本番の公演に先立つ準備。inauguration（就任式）は選挙の後なので順序が逆の引っ掛けです。"}, {"prompt": "Embassy is to diplomat as studio is to", "choices": ["artist", "painting", "easel", "gallery", "camera"], "ans": "A", "expl": "ブリッジ文：大使館は外交官が働く場所である（場所→働く人）。→ スタジオは artist が働く場所。painting は作品、easel は道具、gallery は作品を展示する別の場所です。"}, {"prompt": "Lenient is to strictness as", "choices": ["wise is to wisdom", "angry is to temper", "humble is to modesty", "apathetic is to interest", "curious is to question"], "ans": "D", "expl": "ブリッジ文：lenient（寛大な・甘い）な人には strictness（厳しさ）が欠けている（欠如）。→ apathetic（無関心な）な人には interest が欠けている。wise / wisdom や humble / modesty は「持っている」関係なので逆です。"}, {"prompt": "Censor is to suppress as diplomat is to", "choices": ["argue", "negotiate", "travel", "embassy", "vote"], "ans": "B", "expl": "ブリッジ文：検閲官の役割は（情報を）抑え込むことである（人→職務）。→ 外交官の役割は negotiate（交渉する）こと。travel は付随することが多い行為にすぎず、embassy は場所です。"}, {"prompt": "Eulogy is to praise as", "choices": ["sermon is to sleep", "apology is to blame", "lullaby is to wake", "satire is to ridicule", "elegy is to celebrate"], "ans": "D", "expl": "ブリッジ文：eulogy（追悼演説・賛辞）の目的は称賛することである。→ satire（風刺）の目的は ridicule（あざける）こと。lullaby は眠らせるもので wake は逆、elegy（哀歌）は悼むもので celebrate は逆です。"}, {"prompt": "Anarchy is to order as poverty is to", "choices": ["poor", "wealth", "hunger", "charity", "debt"], "ans": "B", "expl": "ブリッジ文：anarchy（無政府状態）とは order（秩序）が欠けた状態である。→ poverty（貧困）とは wealth（富）が欠けた状態。hunger や debt は貧困の結果・関連語にすぎません。"}, {"prompt": "Commiserate is to sympathy as", "choices": ["apologize is to pride", "sulk is to joy", "flatter is to honesty", "frown is to delight", "rejoice is to happiness"], "ans": "E", "expl": "ブリッジ文：commiserate（同情する・慰め合う）とは sympathy（同情）を表す行為である。→ rejoice（喜ぶ）とは happiness を表す行為。sulk / joy、frown / delight は表す感情が逆です。"}, {"prompt": "Edict is to decree as pact is to", "choices": ["dispute", "nation", "treaty", "signature", "enemy"], "ans": "C", "expl": "ブリッジ文：edict（勅令）と decree（布告）は同義語である。→ pact（協定）の同義語は treaty（条約）。signature は協定を結ぶ手段、dispute は協定の反対概念です。"}, {"prompt": "Despot is to oppressive as", "choices": ["demagogue is to manipulative", "statesman is to corrupt", "martyr is to cowardly", "pacifist is to violent", "skeptic is to gullible"], "ans": "A", "expl": "ブリッジ文：despot（専制君主）は定義上 oppressive（抑圧的）である（人物→本質的特徴）。→ demagogue（扇動政治家）は manipulative（人心を操る）。他はすべて人物と正反対の性質の組み合わせです。"}, {"prompt": "Placate is to anger as console is to", "choices": ["joy", "grief", "comfort", "ally", "pride"], "ans": "B", "expl": "ブリッジ文：placate（なだめる）とは anger（怒り）を和らげることである。→ console（慰める）とは grief（悲しみ）を和らげること。comfort は console の類義語なので引っ掛けです。"}, {"prompt": "Insurrection is to authority as", "choices": ["heresy is to doctrine", "obedience is to law", "loyalty is to king", "treaty is to peace", "ballot is to election"], "ans": "A", "expl": "ブリッジ文：insurrection（反乱）とは authority（権威・当局）に逆らう行為である。→ heresy（異端）とは doctrine（教義）に背くこと。obedience / law や loyalty / king は「従う」関係で逆です。"}, {"prompt": "Gregarious is to sociable as reticent is to", "choices": ["talkative", "regretful", "retired", "reserved", "reckless"], "ans": "D", "expl": "ブリッジ文：gregarious（社交的な）と sociable は同義語である。→ reticent（口数が少ない・控えめな）の同義語は reserved。talkative は反意語、retired や regretful は re- で始まる見た目の引っ掛けです。"}, {"prompt": "Ingrate is to gratitude as", "choices": ["zealot is to passion", "cynic is to doubt", "sage is to wisdom", "braggart is to boasting", "philistine is to culture"], "ans": "E", "expl": "ブリッジ文：ingrate（恩知らず）とは gratitude（感謝の心）を欠いた人である（欠如）。→ philistine（教養のない俗物）とは culture（教養・芸術への理解）を欠いた人。他の選択肢はすべて「その性質を過剰に持つ人」なので逆の関係です。"}, {"prompt": "Pariah is to ostracism as celebrity is to", "choices": ["movie", "fortune", "adulation", "obscurity", "paparazzi"], "ans": "C", "expl": "ブリッジ文：pariah（のけ者）は周囲から ostracism（排斥）を受ける人である（人→周囲から受ける扱い）。→ 有名人は adulation（熱烈な称賛）を受ける。obscurity（無名）は反対、paparazzi は追いかける人で「扱い」そのものではありません。"}], "writing": {"A": {"label": "Option A (Creative Prompt)", "text": "<i>“When the votes were finally counted, no one in the room could believe the result.”<\/i><br>Use this sentence as the first line of a story. Develop your story with vivid details, believable characters, and a clear ending."}, "B": {"label": "Option B (Essay Prompt)", "text": "Some people believe the voting age should be lowered to sixteen so that young people have a greater voice in decisions that affect their future. Others argue that sixteen-year-olds are not yet ready for this responsibility. What is your opinion? Support your position with specific reasons and examples from your own experience, your reading, or current events."}}}}, {"quant": {"quant1": [{"topic": "割合", "prompt": "A community garden has 40 plants, and 25% of them are tomato plants. How many of the plants are NOT tomato plants?", "choices": ["10", "15", "25", "30", "35"], "ans": "D", "expl": "トマトは 40 × 0.25 = 10 株。トマト<b>以外<\/b>を聞いているので 40 − 10 = 30 株。10 を選ぶのは「NOT」を読み落とした典型的な引っ掛けです。"}, {"topic": "分数の計算", "prompt": "What is the value of {{frac:2|3}} + {{frac:1|4}} ?", "choices": ["{{frac:3|7}}", "{{frac:3|12}}", "{{frac:11|12}}", "1", "{{frac:5|6}}"], "ans": "C", "expl": "通分して {{frac:8|12}} + {{frac:3|12}} = {{frac:11|12}}。分子同士・分母同士を足して {{frac:3|7}} とするのはよくあるミスです。"}, {"topic": "素数", "prompt": "Which of the following numbers is prime?", "choices": ["89", "51", "57", "87", "91"], "ans": "A", "expl": "51 = 3 × 17、57 = 3 × 19、87 = 3 × 29、91 = 7 × 13 はすべて合成数。89 は 2, 3, 5, 7 のどれでも割り切れない（√89 < 10）ので素数です。各位の和が 3 の倍数なら 3 で割り切れる、という判定法が便利。91 は素数に見える引っ掛けの定番です。"}, {"topic": "速さ・割合（作業率）", "prompt": "A gardener plants 18 tulip bulbs every 12 minutes. At this rate, how many bulbs can the gardener plant in 1 hour?", "choices": ["36", "54", "72", "80", "90"], "ans": "E", "expl": "1 時間 = 60 分 = 12 分 × 5。よって 18 × 5 = 90 個。1 分あたり 1.5 個 × 60 = 90 と考えても同じです。"}, {"topic": "一次方程式", "prompt": "If 3<i>x<\/i> − 7 = 14, what is the value of <i>x<\/i> ?", "choices": ["3", "7", "9", "14", "21"], "ans": "B", "expl": "両辺に 7 を足して 3<i>x<\/i> = 21、3 で割って <i>x<\/i> = 7。21 は 3<i>x<\/i> の値で止めてしまった引っ掛けです。"}, {"topic": "比", "prompt": "The r
