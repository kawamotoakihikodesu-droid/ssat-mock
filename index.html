<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SSAT 模擬試験（Upper Level 対策）</title>
<style>
  :root{
    --navy:#1f3a5f; --navy2:#2c5282; --bg:#f4f6f9; --card:#fff; --line:#d5dbe3;
    --text:#1f2933; --muted:#5f6b7a; --ok:#1e8e3e; --ng:#d93025; --warn:#e37400;
    --sel:#e3edfb; --selb:#2c5282; --hl:#fff176;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:"Helvetica Neue",Arial,"Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
  button{font:inherit;cursor:pointer}
  a{color:var(--navy2)}
  /* top nav */
  #topbar{background:var(--navy);color:#fff;display:flex;align-items:center;gap:8px;padding:0 16px;height:52px;position:sticky;top:0;z-index:20}
  #topbar .brand{font-weight:700;margin-right:16px;white-space:nowrap}
  #topbar nav{display:flex;gap:4px;overflow-x:auto}
  #topbar nav a{color:#dbe6f5;text-decoration:none;padding:6px 12px;border-radius:6px;white-space:nowrap;font-size:14px}
  #topbar nav a.active,#topbar nav a:hover{background:rgba(255,255,255,.15);color:#fff}
  body.in-exam #topbar{display:none}
  main{max-width:1000px;margin:0 auto;padding:24px 16px 80px}
  body.in-exam main{max-width:none;padding:0}
  h1{font-size:24px;margin:0 0 8px} h2{font-size:20px;margin:28px 0 12px} h3{font-size:17px;margin:20px 0 8px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;margin:14px 0}
  .muted{color:var(--muted)} .small{font-size:13px}
  .btn{background:var(--navy2);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-weight:600}
  .btn:hover{filter:brightness(1.1)}
  .btn.sec{background:#fff;color:var(--navy2);border:1px solid var(--navy2)}
  .btn.danger{background:#fff;color:var(--ng);border:1px solid var(--ng)}
  .btn.big{padding:14px 26px;font-size:17px}
  .btn:disabled{opacity:.4;cursor:default}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
  table{border-collapse:collapse;width:100%;font-size:14px}
  th,td{border:1px solid var(--line);padding:8px 10px;text-align:center}
  th{background:#eef2f7}
  td.l,th.l{text-align:left}
  .tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;background:#eef2f7;color:var(--muted);margin-right:4px}
  .tag.ok{background:#e6f4ea;color:var(--ok)} .tag.ng{background:#fce8e6;color:var(--ng)} .tag.om{background:#fef7e0;color:var(--warn)}
  .frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px;line-height:1.25}
  .frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}
  .bar{height:12px;background:#e8ecf1;border-radius:6px;overflow:hidden;min-width:80px}
  .bar>div{height:100%;background:var(--navy2)}
  input[type=text]{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;width:260px;max-width:100%}

  /* ===== exam (CBT-like) ===== */
  .exam{display:flex;flex-direction:column;height:100vh}
  .examhead{background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:8px 16px;flex-wrap:wrap}
  .examhead .sec{font-weight:700}
  .examhead .qpos{opacity:.9}
  .examhead .sp{flex:1}
  .timer{font-family:Menlo,Consolas,monospace;font-size:20px;font-weight:700;background:rgba(255,255,255,.12);padding:2px 12px;border-radius:6px;min-width:90px;text-align:center}
  .timer.warn{background:var(--warn)} .timer.crit{background:var(--ng)}
  .hbtn{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:6px;padding:4px 10px;font-size:13px}
  .exambody{flex:1;display:flex;min-height:0;background:#fff}
  .pane{overflow:auto;padding:24px 32px}
  .passage{flex:1;border-right:4px solid var(--line);background:#fcfcfa}
  .passage p{font-size:16.5px;line-height:1.9}
  .passage mark{background:var(--hl);padding:0}
  .qpane{flex:1;max-width:900px;margin:0 auto;width:100%}
  .split .qpane{max-width:none;margin:0}
  .partlabel{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .directions{font-size:13.5px;color:var(--muted);background:#f6f8fb;border-left:3px solid var(--line);padding:8px 12px;margin:8px 0 16px}
  .qnum{font-weight:700;color:var(--navy2);margin:6px 0}
  .prompt{font-size:18px;margin-bottom:18px}
  .prompt .word{font-size:26px;font-weight:700;letter-spacing:.04em}
  .choice{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;margin:9px 0;cursor:pointer;user-select:none;background:#fff;font-size:17px}
  .choice:hover{border-color:#9fb3cc}
  .choice .letter{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid #8b98a8;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
  .choice.sel{background:var(--sel);border-color:var(--selb)}
  .choice.sel .letter{background:var(--selb);border-color:var(--selb);color:#fff}
  .choice .ctext{flex:1}
  .choice.elim .ctext{text-decoration:line-through;color:#a0a8b3}
  .choice .x{flex:none;border:0;background:transparent;color:#a0a8b3;font-size:16px;padding:2px 6px;border-radius:4px}
  .choice .x:hover{background:#f1f3f4;color:var(--ng)}
  .confrow{margin-top:20px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
  .confrow button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 14px}
  .confrow button.on{background:var(--navy2);color:#fff;border-color:var(--navy2)}
  .examfoot{display:flex;gap:10px;align-items:center;padding:10px 16px;border-top:1px solid var(--line);background:#f1f4f8;flex-wrap:wrap}
  .examfoot .sp{flex:1}
  .flagbtn.on{background:#fef7e0;color:var(--warn);border-color:var(--warn)}
  .center-card{max-width:760px;margin:40px auto;padding:0 16px}
  .hlpop{position:fixed;z-index:50;background:var(--navy);color:#fff;border:0;border-radius:6px;padding:6px 12px;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
  textarea.essay{width:100%;min-height:52vh;font:16px/1.7 Georgia,"Times New Roman",serif;padding:16px;border:1px solid var(--line);border-radius:8px;resize:vertical}
  .pausecover{position:fixed;inset:0;background:rgba(31,58,95,.97);color:#fff;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
  /* modal */
  #modal .back{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:70;display:flex;align-items:center;justify-content:center;padding:16px}
  #modal .box{background:#fff;border-radius:10px;padding:22px;max-width:620px;width:100%;max-height:90vh;overflow:auto}
  .navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;margin:14px 0}
  .navgrid button{border:1.5px solid var(--line);background:#fff;border-radius:6px;padding:8px 0;font-weight:600;position:relative}
  .navgrid button.ans{background:var(--sel);border-color:var(--selb)}
  .navgrid button.cur{outline:3px solid var(--warn)}
  .navgrid button .f{position:absolute;top:-6px;right:-4px;font-size:13px}
  /* review cards */
  .qcard{border:1px solid var(--line);border-radius:10px;background:#fff;margin:10px 0;overflow:hidden}
  .qcard>summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .qcard>summary::-webkit-details-marker{display:none}
  .qcard[open]>summary{border-bottom:1px solid var(--line);background:#fafbfc}
  .qcard .body{padding:14px 18px}
  .qcard .rchoice{padding:6px 10px;border-radius:6px;margin:4px 0;border:1px solid transparent}
  .qcard .rchoice.correct{background:#e6f4ea;border-color:#a8dab5}
  .qcard .rchoice.wrong{background:#fce8e6;border-color:#f4b6b0}
  .expl{background:#f6f8fb;border-left:4px solid var(--navy2);padding:10px 14px;margin-top:12px;border-radius:4px}
  .filters button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:4px 14px;margin:3px 2px;font-size:14px}
  .filters button.on{background:var(--navy2);color:#fff;border-color:var(--navy2)}
  .passbox{background:#fcfcfa;border:1px solid var(--line);border-radius:6px;padding:10px 14px;font-size:14.5px;margin-bottom:10px}
  .kpi{display:flex;gap:14px;flex-wrap:wrap}
  .kpi>div{flex:1;min-width:140px;background:#f6f8fb;border-radius:8px;padding:12px 14px}
  .kpi b{display:block;font-size:24px;color:var(--navy)}
  @media (max-width:760px){
    .exambody.split{flex-direction:column}
    .passage{border-right:0;border-bottom:4px solid var(--line);max-height:45vh}
    .pane{padding:16px}
  }

  table.dt{width:auto;margin:10px 0;font-size:15px} table.dt th,table.dt td{padding:5px 12px}
  .flash{text-align:center;min-height:260px;cursor:pointer;display:flex;flex-direction:column;justify-content:center;align-items:center}
  .flash .fw{font-size:40px;font-weight:700;letter-spacing:.03em;color:var(--navy)}
  .flash .wd{max-width:640px}
  .choice.vq.correct{background:#e6f4ea;border-color:var(--ok)} .choice.vq.correct .letter{background:var(--ok);border-color:var(--ok);color:#fff}
  .choice.vq.wrong{background:#fce8e6;border-color:var(--ng)} .choice.vq.wrong .letter{background:var(--ng);border-color:var(--ng);color:#fff}
</style>
</head>
<body>
<header id="topbar">
  <div class="brand">📝 SSAT 模擬試験</div>
  <nav>
    <a href="#/home" data-r="home">模試を受ける</a>
    <a href="#/history" data-r="history">テスト結果・解説</a>
    <a href="#/review" data-r="review">問題と解説一覧</a>
    <a href="#/vocab" data-r="vocab">単語ドリル</a>
    <a href="#/guide" data-r="guide">本番情報</a>
  </nav>
</header>
<main id="app"></main>
<div id="modal"></div>

<script>
/* =====================================================================
 *  DATA  (出典: SSAT問題集 ver. 1)
 * ===================================================================== */
const F = (a, b) => `<span class="frac"><span>${a}</span><span>${b}</span></span>`;
const L = ['A','B','C','D','E'];

const SECTION_INFO = {
  verbal:  {name:'Verbal Section', jp:'語彙・類推', time:12,
            directions:'<b>Part A: Synonyms</b> — Each of the following questions consists of one word in capital letters followed by five words or phrases. Select the one word or phrase whose meaning is closest to the word in capital letters.<br><b>Part B: Analogies</b> — The following questions ask you to find relationships between words. For each question, select the answer choice that best completes the meaning of the sentence.'},
  quant:   {name:'Quantitative (Math) Section', jp:'数学', time:20,
            directions:'Solve each problem and select the one correct answer from the five choices given. (Note: Calculators are NOT permitted on the SSAT.)'},
  reading: {name:'Reading Section', jp:'長文読解', time:20,
            directions:'Read each passage carefully and answer the questions that follow based on what is stated or implied in the passage.'},
  writing: {name:'Writing Sample', jp:'エッセイ', time:25,
            directions:'Choose ONE of the two prompts below and write a well-organized essay (Introduction, Body Paragraphs, Conclusion). Although the Writing Sample is not scored, a copy is sent directly to the admissions office of the schools to which you apply.'}
};
const PART_DIR = {
  'Synonyms':'Select the one word or phrase whose meaning is closest to the word in capital letters.',
  'Analogies':'Select the answer choice that best completes the meaning of the sentence.'
};

const PASSAGES = {
  p1:{title:'Passage 1: Architecture & Society', jp:'都市建築とバイオフィリック・デザイン', html:`<p>For decades, urban architecture treated nature as an ornamental afterthought—a row of neatly trimmed shrubs beside a concrete lobby or a solitary tree confined to a sidewalk planter. In recent years, however, a paradigm shift known as <i>biophilic design</i> has begun to reshape city skylines. Rather than merely decorating steel-and-glass towers with greenery, biophilic architects weave living ecosystems directly into the structural fabric of buildings. Vertical forests, daylight-flooded atriums, and natural ventilation corridors are no longer seen as aesthetic luxuries; empirical studies demonstrate that they significantly reduce urban heat-island effects, lower energy consumption, and measurably improve the cognitive function and emotional well-being of occupants. Yet, despite these clear benefits, widespread adoption remains hindered by high upfront construction costs and the specialized maintenance required to keep elevated ecosystems thriving in harsh wind and temperature conditions.</p>`},
  p2:{title:'Passage 2: Literary Fiction / Narrative', jp:'文学・小説「画家のクララ」', html:`<p>Clara stood before the tall studio window, watching the afternoon rain blur the brick facades of the city below. On her easel rested the canvas she had repainted four times that week. Her instructor, Monsieur Laurent, had praised the first version for its technical precision—every shadow measured, every perspective line obeying the strict geometry of the academy. Yet Clara had scraped the palette knife across it the moment she returned to her room. Accuracy, she realized, was not what she was chasing. What she wanted was the <i>hum</i> of the street at dusk: the way wet cobblestones caught the amber glow of streetlamps, not as sharp reflections, but as restless ribbons of warmth. Picking up a wide, coarse brush, she dipped it into cadmium yellow and struck the canvas with a bold, uncalculated sweep. For the first time all week, her shoulders dropped, and she began to breathe.</p>`},
  p3:{title:'Passage 3: History / Social Studies', jp:'歴史・社会「グーテンベルクの活版印刷」', html:`<p>Before the mid-fifteenth century, the production of books in Europe was an arduous craft confined largely to monastic scriptoriums, where scribes copied texts by hand onto parchment. A single volume could take months to complete, rendering books rare symbols of elite wealth. When Johannes Gutenberg introduced his movable-type printing press in Mainz, Germany, around 1440, he did not merely accelerate a manufacturing process; he catalyzed an information revolution. By combining durable metal alloy type, oil-based inks, and a wooden screw press adapted from agricultural wine-making, Gutenberg made the mass reproduction of texts economically viable. Within five decades, millions of books were circulating across Europe. This sudden democratization of knowledge weakened traditional monopolies on learning, fueled the scientific inquiry of the Renaissance, and laid the groundwork for widespread vernacular literacy.</p>`},
  p4:{title:'Passage 4: Natural Science', jp:'自然科学「深海生物の生物発光」', html:`<p>In the sunless depths of the ocean's <i>bathypelagic zone</i>—stretching from 1,000 to 4,000 meters below the surface—sunlight is entirely absent, yet the darkness is frequently pierced by flashes of living light. This phenomenon, known as <i>bioluminescence</i>, is produced through a chemical reaction within an organism's cells, wherein a light-emitting compound called luciferin is oxidized by the enzyme luciferase. Remarkably, evolutionary biologists estimate that bioluminescence has evolved independently at least forty times across diverse marine lineages, from bacteria and jellyfish to deep-sea anglerfish. Such striking <i>convergent evolution</i> underscores the immense survival value of light in the abyss: species wield it to lure unsuspecting prey, startle predators with blinding decoys, or signal potential mates through species-specific blinking patterns.</p>`}
};

const Q = [];
const add = o => Q.push(o);

/* ---- Verbal: Synonyms (Q1–10) ---- */
[
 ['CANDID',['sweet','frank','secretive','anxious','careful'],'B','<b>candid</b> は「率直な、包み隠さない」。類義語は (B) frank（率直な）。(A) sweet は <i>candy</i> と見た目が似た引っ掛け選択肢です。'],
 ['EPHEMERAL',['eternal','fragile','short-lived','dramatic','mysterious'],'C','<b>ephemeral</b> は「つかの間の、短命な（short-lived）」。SSAT最頻出単語の一つ。(A) eternal（永遠の）は対義語。'],
 ['MITIGATE',['aggravate','alleviate','investigate','imitate','congregate'],'B','<b>mitigate</b> は「（痛みや被害を）和らげる、軽減する（alleviate）」。(A) aggravate（悪化させる）は対義語。'],
 ['PRAGMATIC',['idealistic','practical','stubborn','ancient','dramatic'],'B','<b>pragmatic</b> は「実用的な、現実的な（practical）」。(A) idealistic（理想主義的な）は対義語。'],
 ['NOVICE',['expert','novel','beginner','judge','messenger'],'C','語根 <i>nov-</i> は「新しい（new）」。<b>novice</b> は「初心者、新米（beginner）」。(B) novel は同じ語源を使った見た目引っ掛けです。'],
 ['OBSCURE',['unclear','obvious','stubborn','tidy','cheerful'],'A','<b>obscure</b> は「曖昧な、分かりにくい（unclear）、無名の」。(B) obvious（明白な）は対義語。'],
 ['BENEVOLENT',['violent','charitable','wealthy','reluctant','solitary'],'B','接頭辞 <i>bene-</i> は「良い（good）」。<b>benevolent</b> は「慈悲深い、慈善的な（charitable）」。'],
 ['ZEALOUS',['jealous','lazy','enthusiastic','cautious','comical'],'C','<b>zealous</b> は「熱狂的な、極めて熱心な（enthusiastic）」。発音が似た (A) jealous（嫉妬深い）は定番の引っ掛けです。'],
 ['SUPERFLUOUS',['superior','flowing','unnecessary','essential','rapid'],'C','語源は <i>super-</i>（超えて）＋ <i>flu-</i>（流れる＝溢れ出る）。「余分な、不必要な（unnecessary）」。'],
 ['VINDICATE',['accuse','justify','indicate','destroy','surrender'],'B','<b>vindicate</b> は「無実を証明する、正当性を立証する（justify）」。(A) accuse（非難する）は対義語。']
].forEach((r,i)=>add({n:i+1, sec:'verbal', part:'Synonyms', topic:'Synonyms', prompt:`<span class="word">${r[0]}</span>`, short:r[0], choices:r[1], ans:r[2], expl:r[3]}));

/* ---- Verbal: Analogies (Q11–20) ---- */
[
 ['Sketch is to painting as',['frame is to museum','chisel is to sculpture','outline is to essay','melody is to instrument','actor is to script'],'C','「Sketch（下描き）は Painting（絵画）の事前の構成案である」→「Outline（アウトライン）は Essay（エッセイ）の事前の構成案である」。'],
 ['Frugal is to miser as',['generous is to philanthropist','timid is to leader','wealthy is to banker','strict is to student','clumsy is to athlete'],'A','「Frugal（倹約・ケチ）は Miser（守銭奴）の特徴である」→「Generous（寛大）は Philanthropist（慈善家）の特徴である」。'],
 ['Drought is to rain as',['hurricane is to wind','famine is to food','flood is to river','harvest is to crop','winter is to snow'],'B','「Drought（干ばつ）は Rain（雨）が極端に不足した状態である」→「Famine（飢饉）は Food（食料）が極端に不足した状態である」。'],
 ['Whisper is to shout as',['walk is to run','smile is to cry','listen is to hear','sleep is to dream','read is to write'],'A','「Whisper（ささやく）より強度が大きいのが Shout（叫ぶ）である」→「Walk（歩く）より速度・強度が大きいのが Run（走る）である」。'],
 ['Stanza is to poem as',['page is to paper','verse is to rhyme','act is to play','author is to novel','brush is to canvas'],'C','「Stanza（詩の連）は Poem（詩）を構成する単位である」→「Act（幕）は Play（演劇）を構成する単位である」。'],
 ['Scalpel is to surgeon as',['stethoscope is to patient','symptom is to doctor','gavel is to judge','telescope is to star','tractor is to harvest'],'C','「Scalpel（メス）は Surgeon（外科医）が使う専門道具である」→「Gavel（木槌）は Judge（裁判官）が使う専門道具である」。'],
 ['Hermit is to solitary as',['nomad is to wandering','athlete is to polite','scholar is to wealthy','coward is to brave','guest is to permanent'],'A','「Hermit（隠者）は定義上 Solitary（孤独な）人である」→「Nomad（遊牧民）は定義上 Wandering（放浪する）人である」。'],
 ['Transparent is to opaque as',['fragile is to delicate','hollow is to empty','turbulent is to calm','ancient is to historical','damp is to wet'],'C','「Transparent（透明）と Opaque（不透明）は対義語である」→「Turbulent（荒れ狂う）と Calm（穏やかな）は対義語である」。'],
 ['Catalyst is to reaction as',['brake is to vehicle','spark is to fire','umbrella is to rain','anchor is to ship','shadow is to light'],'B','「Catalyst（触媒）は Reaction（反応）を引き起こすきっかけである」→「Spark（火花）は Fire（火事・炎）を引き起こすきっかけである」。'],
 ['Sonnet is to poetry as',['biography is to nonfiction','dictionary is to alphabet','symphony is to conductor','portrait is to frame','newspaper is to journalist'],'A','「Sonnet（14行詩）は Poetry（詩）という大分類の1ジャンルである」→「Biography（伝記）は Nonfiction（ノンフィクション）という大分類の1ジャンルである」。']
].forEach((r,i)=>add({n:i+11, sec:'verbal', part:'Analogies', topic:'Analogies', prompt:r[0], short:r[0], choices:r[1], ans:r[2], expl:'<b>ブリッジ文：</b>'+r[3]}));

/* ---- Quantitative (Q21–36) ---- */
[
 ['連続割引','A jacket originally priced at $120 is placed on sale at a 20% discount. Later, the discounted price is reduced by an additional 10% for a weekend promotion. What is the final price of the jacket?',['$84.00','$86.40','$88.00','$90.00','$96.00'],'B','最初の20%オフで $120×0.8=$96.00。そこからさらに10%オフなので $96.00×0.9=$86.40。（※30%オフにして $84 を選ばないよう注意）'],
 ['一次方程式',`If ${F('3<i>x</i> − 5','4')} = ${F('<i>x</i> + 3','2')}, what is the value of <i>x</i>?`,['2','4','8','11','13'],'D','両辺を4倍して分母を払うと 3<i>x</i>−5=2(<i>x</i>+3) → 3<i>x</i>−5=2<i>x</i>+6 → <i>x</i>=11。'],
 ['平均と合計','The average (arithmetic mean) of five numbers is 18. When a sixth number is added to the group, the new average of the six numbers becomes 21. What is the sixth number?',['24','30','33','36','39'],'D','5つの数の合計は 18×5=90。6つの数の合計は 21×6=126。差は 126−90=36。'],

, "4", "5", "6"], "ans": "D", "expl": "<i>n<\/i> = 7<i>k<\/i> + 4 とおくと 3<i>n<\/i> = 21<i>k<\/i> + 12 = 7(3<i>k<\/i> + 1) + 5。余りは5。具体的に <i>n<\/i> = 4 で試しても 12 ÷ 7 = 1余り5。"}, {"topic": "三角形の角", "prompt": "The measures of the three angles of a triangle are in the ratio 2 : 3 : 4. What is the measure of the largest angle?", "choices": ["40°", "60°", "80°", "90°", "100°"], "ans": "C", "expl": "三角形の内角の和は180°。2 + 3 + 4 = 9 パートなので1パート = 20°。最大の角は 4 × 20° = 80°。"}, {"topic": "速さ", "prompt": "A tour bus traveled 180 miles in 3 hours and 36 minutes. What was the bus's average speed, in miles per hour?", "choices": ["40", "45", "48", "50", "60"], "ans": "D", "expl": "36分 = {{frac:36|60}} 時間 = 0.6時間なので、3時間36分 = 3.6時間。180 ÷ 3.6 = 50 mph。「3.36時間」や「3時間」として計算するミスに注意。"}, {"topic": "指数法則", "prompt": "What is the value of {{frac:2<sup>5<\/sup> × 4<sup>3<\/sup>|8<sup>2<\/sup>}} ?", "choices": ["2", "4", "8", "16", "32"], "ans": "E", "expl": "底を2にそろえる。4<sup>3<\/sup> = 2<sup>6<\/sup>、8<sup>2<\/sup> = 2<sup>6<\/sup>。よって 2<sup>5<\/sup> × 2<sup>6<\/sup> ÷ 2<sup>6<\/sup> = 2<sup>5<\/sup> = 32。"}, {"topic": "傾き", "prompt": "What is the slope of the line that passes through the points (−2, 5) and (4, −7)?", "choices": ["−6", "−2", "−{{frac:1|2}}", "{{frac:1|2}}", "2"], "ans": "B", "expl": "傾き = (yの変化)/(xの変化) = (−7 − 5)/(4 − (−2)) = −12/6 = −2。分母と分子を逆にすると −{{frac:1|2}} になる引っ掛け。"}, {"topic": "定義された演算", "prompt": "For all numbers <i>a<\/i> and <i>b<\/i>, let <i>a<\/i> ◆ <i>b<\/i> = <i>a<\/i><sup>2<\/sup> − 2<i>b<\/i>. What is the value of (3 ◆ 1) ◆ 4 ?", "choices": ["23", "25", "33", "39", "41"], "ans": "E", "expl": "かっこの中から。3 ◆ 1 = 9 − 2 = 7。次に 7 ◆ 4 = 49 − 8 = 41。3 ◆ (1 ◆ 4) と順番を変えると 23 になってしまうので注意。"}, {"topic": "不等式", "prompt": "If −3<i>x<\/i> + 5 > 17, which of the following could be the value of <i>x<\/i>?", "choices": ["−5", "−4", "−3", "0", "4"], "ans": "A", "expl": "−3<i>x<\/i> > 12。両辺を負の数 −3 で割ると不等号の向きが逆になり <i>x<\/i> < −4。選択肢で −4 より小さいのは −5 のみ。−4 自体は含まれない点、向きを変え忘れる点が引っ掛け。"}, {"topic": "円の面積と円周", "prompt": "A circular garden has an area of 36<i>π<\/i> square meters. What is the circumference of the garden, in meters?", "choices": ["6<i>π<\/i>", "12<i>π<\/i>", "18<i>π<\/i>", "36<i>π<\/i>", "72<i>π<\/i>"], "ans": "B", "expl": "面積 <i>πr<\/i><sup>2<\/sup> = 36<i>π<\/i> より <i>r<\/i> = 6。円周 = 2<i>πr<\/i> = 12<i>π<\/i>。半径をそのまま使った 6<i>π<\/i> に注意。"}, {"topic": "資料の読み取り", "prompt": "The table below shows the number of goals scored by a school soccer team in four months.<br><table class=\"dt\"><tr><th>Month<\/th><th>Goals<\/th><\/tr><tr><td>September<\/td><td>12<\/td><\/tr><tr><td>October<\/td><td>18<\/td><\/tr><tr><td>November<\/td><td>9<\/td><\/tr><tr><td>December<\/td><td>15<\/td><\/tr><\/table>By what percent did the number of goals increase from September to October?", "choices": ["6%", "25%", "33{{frac:1|3}}%", "40%", "50%"], "ans": "E", "expl": "増加率 = 増えた量 ÷ 元の量。(18 − 12) ÷ 12 = 6/12 = 50%。後の値18で割ると 33{{frac:1|3}}% になる典型的な引っ掛け。6%は増えた「数」を%と取り違えたもの。"}, {"topic": "連立方程式（文章題）", "prompt": "For a school play, adult tickets cost $12 each and student tickets cost $7 each. A total of 30 tickets were sold for $290. How many adult tickets were sold?", "choices": ["12", "14", "15", "16", "18"], "ans": "D", "expl": "大人を <i>a<\/i> 枚とすると学生は 30 − <i>a<\/i> 枚。12<i>a<\/i> + 7(30 − <i>a<\/i>) = 290 → 5<i>a<\/i> + 210 = 290 → <i>a<\/i> = 16。14は学生券の枚数なので注意。"}, {"topic": "三平方の定理", "prompt": "A rectangular field has a length of 24 meters and a diagonal of 26 meters. What is the area of the field, in square meters?", "choices": ["120", "240", "260", "312", "624"], "ans": "B", "expl": "幅を <i>w<\/i> とすると <i>w<\/i><sup>2<\/sup> + 24<sup>2<\/sup> = 26<sup>2<\/sup> → <i>w<\/i><sup>2<\/sup> = 676 − 576 = 100 → <i>w<\/i> = 10。面積 = 24 × 10 = 240。(5, 12, 13) の2倍の (10, 24, 26) と気づけば速い。"}, {"topic": "直方体の体積", "prompt": "A rectangular fish tank is 10 centimeters long and 8 centimeters wide. It contains water to a depth of 15 centimeters. When a stone is placed in the tank and is completely underwater, the water level rises to 17.5 centimeters. What is the volume of the stone, in cubic centimeters?", "choices": ["80", "160", "200", "250", "1400"], "ans": "C", "expl": "石の体積 = 上昇した水の体積。底面積 10 × 8 = 80 cm<sup>2<\/sup>、上昇は 17.5 − 15 = 2.5 cm。80 × 2.5 = 200 cm<sup>3<\/sup>。1400は17.5cm分すべての水の体積なので誤り。"}, {"topic": "確率", "prompt": "A bag contains 4 red marbles and 6 blue marbles. Two marbles are drawn at random, one after the other, without replacement. What is the probability that both marbles are blue?", "choices": ["{{frac:1|3}}", "{{frac:9|25}}", "{{frac:2|5}}", "{{frac:3|5}}", "{{frac:2|3}}"], "ans": "A", "expl": "1個目が青：{{frac:6|10}}。戻さないので2個目が青：{{frac:5|9}}。{{frac:6|10}} × {{frac:5|9}} = {{frac:30|90}} = {{frac:1|3}}。「戻す」場合の ({{frac:3|5}})<sup>2<\/sup> = {{frac:9|25}} が引っ掛け。"}, {"topic": "中央値・最頻値・平均", "prompt": "A set of five positive integers has a median of 8, a unique mode of 10, and a mean of 7. What is the greatest possible range of the set?", "choices": ["6", "7", "8", "9", "10"], "ans": "D", "expl": "小さい順に <i>a<\/i>, <i>b<\/i>, 8, <i>d<\/i>, <i>e<\/i>。最頻値10が唯一なので10は2回以上必要で、中央値より上の2つが10, 10。合計 = 7 × 5 = 35 より <i>a<\/i> + <i>b<\/i> = 35 − 28 = 7。<i>a<\/i> ≠ <i>b<\/i>（同じだと最頻値が2つになる）かつ正の整数なので、<i>a<\/i> を最小にすると <i>a<\/i> = 1, <i>b<\/i> = 6。範囲 = 10 − 1 = 9。"}, {"topic": "等差数列", "prompt": "In an arithmetic sequence, the 4th term is 17 and the 9th term is 42. What is the 20th term?", "choices": ["92", "97", "100", "102", "107"], "ans": "B", "expl": "4番目から9番目までは5ステップで 42 − 17 = 25 増えるので公差 <i>d<\/i> = 5。初項 = 17 − 3 × 5 = 2。20番目 = 2 + 19 × 5 = 97。「20 × 5」や「18ステップ」と数え間違えないこと。"}, {"topic": "割合（連続した増減）", "prompt": "The price of a pair of sneakers was increased by 20%. Later, the new price was decreased by 20%. How does the final price compare with the original price?", "choices": ["There is no change.", "It increased by 4%.", "It decreased by 2%.", "It decreased by 40%.", "It decreased by 4%."], "ans": "E", "expl": "元を100とすると、20%増で120、その20%減で 120 × 0.8 = 96。元より4%安い。+20%と−20%で「変化なし」と考えるのが最大の引っ掛け（減る基準の120の方が大きい）。"}, {"topic": "中点と距離", "prompt": "In the <i>xy<\/i>-plane, the midpoint of segment <i>AB<\/i> is (3, −1). If point <i>A<\/i> is at (−2, 4), what is the length of segment <i>AB<\/i>?", "choices": ["5", "5√2", "10", "5√5", "10√2"], "ans": "E", "expl": "B = (2×3 − (−2), 2×(−1) − 4) = (8, −6)。距離 = √(10<sup>2<\/sup> + (−10)<sup>2<\/sup>) = √200 = 10√2。5√2 はAから中点までの長さ（半分）なので注意。"}, {"topic": "円と正方形の面積", "prompt": "A square has a side length of 10. At each of its four corners, a quarter circle with a radius of 5 is drawn inside the square, centered at that corner. What is the area of the region inside the square that lies outside all four quarter circles?", "choices": ["100 − 25<i>π<\/i>", "100 − 10<i>π<\/i>", "100 − 20<i>π<\/i>", "25<i>π<\/i> − 50", "400 − 100<i>π<\/i>"], "ans": "A", "expl": "半径5の四分円は各辺の中点で接するだけで重ならない。4つ合わせると半径5の円1個分：25<i>π<\/i>。正方形の面積100から引いて 100 − 25<i>π<\/i>。"}, {"topic": "仕事算", "prompt": "Ana can paint a fence alone in 6 hours, and Ben can paint the same fence alone in 4 hours. Ana works alone for 1 hour, and then Ben joins her and they finish the job together. What is the total time spent painting the fence, starting when Ana began?", "choices": ["2 hours", "2.4 hours", "3 hours", "3 hours 24 minutes", "5 hours"], "ans": "C", "expl": "1時間あたり Ana は {{frac:1|6}}、Ben は {{frac:1|4}}。Ana が1時間で {{frac:1|6}} 終え、残り {{frac:5|6}}。2人の速さは {{frac:1|6}} + {{frac:1|4}} = {{frac:5|12}}。{{frac:5|6}} ÷ {{frac:5|12}} = 2時間。合計 1 + 2 = 3時間。2時間（共同作業の部分だけ）や2.4時間（最初から2人の場合）に注意。"}], "quant2": [{"topic": "小数の計算", "prompt": "What is the value of 0.4 × 0.25 ?", "choices": ["0.01", "0.025", "0.1", "0.65", "1"], "ans": "C", "expl": "4 × 25 = 100。小数点以下の桁数は合計3桁なので 0.100 = 0.1。0.65は足し算した値（引っ掛け）。"}, {"topic": "約数", "prompt": "How many positive integers are factors of 36?", "choices": ["9", "10", "12", "18", "36"], "ans": "A", "expl": "ペアで数える：1×36, 2×18, 3×12, 4×9, 6×6。6は1回だけ数えるので 1, 2, 3, 4, 6, 9, 12, 18, 36 の9個。"}, {"topic": "式の値", "prompt": "If <i>x<\/i> = −3, what is the value of 2<i>x<\/i><sup>2<\/sup> − <i>x<\/i> ?", "choices": ["−21", "−15", "15", "21", "39"], "ans": "D", "expl": "2<i>x<\/i><sup>2<\/sup> = 2 × 9 = 18（2乗が先）。−<i>x<\/i> = −(−3) = +3。18 + 3 = 21。符号を間違えると15、(2<i>x<\/i>)<sup>2<\/sup> と計算すると39になる。"}, {"topic": "割合", "prompt": "30 is 40% of what number?", "choices": ["12", "42", "75", "90", "120"], "ans": "C", "expl": "0.4 × <i>n<\/i> = 30 → <i>n<\/i> = 30 ÷ 0.4 = 75。12は「30の40%」を計算したもので逆。"}, {"topic": "比例", "prompt": "A recipe uses 3 cups of flour to make 24 cookies. At this rate, how many cups of flour are needed to make 40 cookies?", "choices": ["4", "5", "5.5", "6", "8"], "ans": "B", "expl": "クッキー1枚あたり 3/24 = {{frac:1|8}} カップ。40枚なら 40 × {{frac:1|8}} = 5カップ。"}, {"topic": "中央値", "prompt": "Six bowling scores are listed below.<br>120, 135, 120, 150, 145, 110<br>What is the median of the scores?", "choices": ["120", "130", "135", "140", "127.5"], "ans": "E", "expl": "小さい順に並べる：110, 120, 120, 135, 145, 150。個数が偶数なので真ん中2つの平均 (120 + 135) ÷ 2 = 127.5。並べ替えずに真ん中を取ると135、130は平均値、120は最頻値（いずれも引っ掛け）。"}, {"topic": "長方形の周と面積", "prompt": "A rectangle has a perimeter of 46 inches and a length of 15 inches. What is its area, in square inches?", "choices": ["120", "180", "240", "345", "690"], "ans": "A", "expl": "周 = 2 × (縦 + 横) より 縦 + 横 = 23、幅 = 23 − 15 = 8。面積 = 15 × 8 = 120。周の半分23を幅と勘違いすると345になる。"}, {"topic": "平方根", "prompt": "What is the value of √50 + √18 ?", "choices": ["4√2", "√68", "6√2", "2√30", "8√2"], "ans": "E", "expl": "√50 = √(25×2) = 5√2、√18 = √(9×2) = 3√2。合計 8√2。√50 + √18 = √68 とルートの中を足すのは誤り。"}, {"topic": "関数", "prompt": "If <i>f<\/i>(<i>x<\/i>) = 3<i>x<\/i> − 4 and <i>f<\/i>(<i>a<\/i>) = 11, what is the value of <i>f<\/i>(2<i>a<\/i>)?", "choices": ["22", "26", "29", "30", "34"], "ans": "B", "expl": "3<i>a<\/i> − 4 = 11 → <i>a<\/i> = 5。<i>f<\/i>(10) = 30 − 4 = 26。<i>f<\/i>(2<i>a<\/i>) = 2<i>f<\/i>(<i>a<\/i>) = 22 とするのは誤り（−4 は2倍されない）。"}, {"topic": "場合の数", "prompt": "A school cafeteria offers 3 kinds of sandwiches, 4 kinds of drinks, and 2 kinds of desserts. A lunch special includes exactly one sandwich, one drink, and one dessert. How many different lunch specials are possible?", "choices": ["9", "12", "18", "24", "36"], "ans": "D", "expl": "積の法則：3 × 4 × 2 = 24通り。足し算の9は誤り。"}, {"topic": "単価の比較", "prompt": "Store A sells 6 pens for $4.50, and Store B sells 10 of the same pens for $7.00. How much money would a shopper save by buying 30 pens at Store B instead of Store A?", "choices": ["$1.50", "$2.00", "$2.50", "$3.00", "$4.50"], "ans": "A", "expl": "1本あたり A：4.50 ÷ 6 = 0.75ドル、B：7.00 ÷ 10 = 0.70ドル。30本では A：22.50ドル、B：21.00ドル。差は1.50ドル。"}, {"topic": "絶対値の不等式", "prompt": "How many integers <i>x<\/i> satisfy |<i>x<\/i> − 3| < 5 ?", "choices": ["7", "8", "9", "10", "11"], "ans": "C", "expl": "|<i>x<\/i> − 3| < 5 ⇔ −5 < <i>x<\/i> − 3 < 5 ⇔ −2 < <i>x<\/i> < 8。整数は −1, 0, 1, …, 7 の9個。両端の −2 と 8 は含まない（不等号に「＝」がない）点に注意。"}, {"topic": "平行線と角", "prompt": "Two parallel lines are cut by a transversal. Two interior angles on the same side of the transversal measure (3<i>x<\/i> + 10)° and (2<i>x<\/i> + 20)°. What is the measure of the larger of these two angles?", "choices": ["30°", "70°", "80°", "90°", "100°"], "ans": "E", "expl": "平行線の同側内角の和は180°。5<i>x<\/i> + 30 = 180 → <i>x<\/i> = 30。角は 3(30) + 10 = 100° と 2(30) + 20 = 80°。大きい方は100°。<i>x<\/i> の値30°や小さい方の80°は引っ掛け。"}, {"topic": "資料の読み取り", "prompt": "The table below shows the items sold at a school store in one week.<br><table class=\"dt\"><tr><th>Item<\/th><th>Price per Item<\/th><th>Number Sold<\/th><\/tr><tr><td>Notebook<\/td><td>$3.00<\/td><td>40<\/td><\/tr><tr><td>Pen<\/td><td>$1.50<\/td><td>60<\/td><\/tr><tr><td>Folder<\/td><td>$2.00<\/td><td>15<\/td><\/tr><tr><td>Calculator<\/td><td>$12.00<\/td><td>5<\/td><\/tr><\/table>What percent of the store's total sales (in dollars) that week came from pens?", "choices": ["25%", "30%", "40%", "50%", "60%"], "ans": "B", "expl": "売上：ノート 3×40 = 120、ペン 1.5×60 = 90、フォルダー 2×15 = 30、電卓 12×5 = 60、合計300ドル。ペンは 90 ÷ 300 = 30%。個数（60 ÷ 120 = 50%）で計算する引っ掛けに注意。"}, {"topic": "指数方程式", "prompt": "If 3<sup><i>x<\/i> + 1<\/sup> = 81<sup>2<\/sup>, what is the value of <i>x<\/i>?", "choices": ["3", "4", "5", "7", "8"], "ans": "D", "expl": "81 = 3<sup>4<\/sup> なので 81<sup>2<\/sup> = 3<sup>8<\/sup>。<i>x<\/i> + 1 = 8 → <i>x<\/i> = 7。8を選ぶのは「+1」を忘れたミス。"}, {"topic": "円柱の体積", "prompt": "A cylindrical can has a diameter of 6 inches and a height of 10 inches. What is the volume of the can, in cubic inches?", "choices": ["90<i>π<\/i>", "120<i>π<\/i>", "180<i>π<\/i>", "300<i>π<\/i>", "360<i>π<\/i>"], "ans": "A", "expl": "直径6なので半径3。体積 = <i>πr<\/i><sup>2<\/sup><i>h<\/i> = <i>π<\/i> × 9 × 10 = 90<i>π<\/i>。直径をそのまま半径に使うと360<i>π<\/i>になる引っ掛け。"}, {"topic": "確率（サイコロ）", "prompt": "Two fair six-sided dice are rolled. What is the probability that the sum of the numbers rolled is 8?", "choices": ["{{frac:1|9}}", "{{frac:5|36}}", "{{frac:1|6}}", "{{frac:7|36}}", "{{frac:2|9}}"], "ans": "B", "expl": "全部で 6 × 6 = 36通り。和が8：(2,6), (3,5), (4,4), (5,3), (6,2) の5通り。確率 {{frac:5|36}}。(2,6)と(6,2)を別々に数えるのがポイント。"}, {"topic": "立方体の表面積", "prompt": "A cube has a volume of 64 cubic centimeters. What is the total surface area of the cube, in square centimeters?", "choices": ["16", "24", "64", "80", "96"], "ans": "E", "expl": "4<sup>3<\/sup> = 64 なので1辺4cm。1面 4 × 4 = 16、6面で 96 cm<sup>2<\/sup>。16は1面だけ、80は5面分。"}, {"topic": "連立方程式", "prompt": "If <i>x<\/i> + <i>y<\/i> = 10 and <i>x<\/i> − <i>y<\/i> = 4, what is the value of <i>x<\/i><sup>2<\/sup> − <i>y<\/i><sup>2<\/sup> ?", "choices": ["6", "21", "40", "58", "100"], "ans": "C", "expl": "<i>x<\/i><sup>2<\/sup> − <i>y<\/i><sup>2<\/sup> = (<i>x<\/i> + <i>y<\/i>)(<i>x<\/i> − <i>y<\/i>) = 10 × 4 = 40。解いて <i>x<\/i> = 7, <i>y<\/i> = 3 とし 49 − 9 = 40 と確かめてもよい。58は <i>x<\/i><sup>2<\/sup> + <i>y<\/i><sup>2<\/sup>。"}, {"topic": "資料の読み取り（加重平均）", "prompt": "The table below shows the three field-trip options chosen by the students in one grade.<br><table class=\"dt\"><tr><th>Destination<\/th><th>Cost per Student<\/th><th>Number of Students<\/th><\/tr><tr><td>Museum<\/td><td>$20<\/td><td>25<\/td><\/tr><tr><td>Aquarium<\/td><td>$24<\/td><td>30<\/td><\/tr><tr><td>Zoo<\/td><td>$14<\/td><td>45<\/td><\/tr><\/table>What was the average (arithmetic mean) cost per student for all the students in the grade?", "choices": ["$18.00", "$18.50", "$19.00", "$19.33", "$20.00"], "ans": "B", "expl": "総額：20×25 + 24×30 + 14×45 = 500 + 720 + 630 = 1850ドル。生徒数 25 + 30 + 45 = 100人。1850 ÷ 100 = 18.50ドル。料金3つを単純平均した (20 + 24 + 14) ÷ 3 ≈ 19.33 は人数を無視した引っ掛け。"}, {"topic": "速さ（追いつき）", "prompt": "A van carrying a soccer team leaves the school at 9:00 a.m. and travels at a constant 40 miles per hour. A car leaves the school at 10:30 a.m. and follows the same route at a constant 60 miles per hour. At what time will the car catch up with the van?", "choices": ["12:00 p.m.", "12:30 p.m.", "1:00 p.m.", "1:30 p.m.", "3:00 p.m."], "ans": "D", "expl": "10:30の時点でバンは 40 × 1.5 = 60マイル先。差が縮む速さは 60 − 40 = 20 mph。60 ÷ 20 = 3時間なので 10:30 + 3時間 = 午後1:30。9:00から3時間と数えると12:00になる引っ掛け。"}, {"topic": "一の位の周期", "prompt": "What is the units digit of 7<sup>2026<\/sup> ?", "choices": ["0", "1", "3", "7", "9"], "ans": "E", "expl": "7の累乗の一の位は 7, 9, 3, 1 の4つで繰り返す。2026 ÷ 4 = 506 余り2 なので、周期の2番目の9。"}, {"topic": "直角三角形の高さ", "prompt": "A right triangle has legs of length 6 and 8. What is the length of the altitude drawn from the right angle to the hypotenuse?", "choices": ["4.8", "5", "6", "7", "8"], "ans": "A", "expl": "斜辺 = √(36 + 64) = 10。面積を2通りで表す：{{frac:1|2}} × 6 × 8 = 24 = {{frac:1|2}} × 10 × <i>h<\/i> → <i>h<\/i> = 4.8。5は斜辺の中点までの長さ（中線）で、高さではない。"}, {"topic": "定義された演算", "prompt": "For any positive even integer <i>n<\/i>, let <i>n<\/i>★ be defined as the product of all the positive even integers less than or equal to <i>n<\/i>. For example, 6★ = 2 × 4 × 6 = 48. What is the value of {{frac:10★|6★}} ?", "choices": ["18", "48", "80", "90", "3840"], "ans": "C", "expl": "10★ = 2 × 4 × 6 × 8 × 10、6★ = 2 × 4 × 6。共通部分が約分されて 8 × 10 = 80。3840は10★そのもの。"}, {"topic": "濃度（混合）", "prompt": "A pitcher contains 20 liters of a drink that is 30% juice and 70% water. How many liters of water must be added so that the drink is 20% juice?", "choices": ["2", "5", "8", "10", "12"], "ans": "D", "expl": "ジュースの量は 20 × 0.3 = 6リットルで、水を加えても変わらない。6 ÷ (20 + <i>w<\/i>) = 0.2 → 20 + <i>w<\/i> = 30 → <i>w<\/i> = 10リットル。「30%−20%=10%なので2リットル」などの短絡的な計算は誤り。"}]}, "reading": {"passages": [{"id": "p1", "title": "Passage 1: Literary Fiction", "jp": "時計職人の祖父と孫娘", "html": "<p>Every Saturday that winter, Nora took the 8:15 bus across town to her grandfather's apartment, though she would not have admitted to anyone at school that she looked forward to it. Officially, she was there because her mother worried about him living alone since Grandma died. Unofficially, she went because of the workbench.<\/p><p>It stood beneath the only window in the cramped back room, crowded with tiny screwdrivers, jars of springs no bigger than eyelashes, and the disassembled bodies of watches that neighbors had given up for dead. Grandpa Leo had repaired clocks for forty-one years before his eyes began to fail, and now he could no longer see the gears clearly enough to set them himself. So he talked, and Nora's fingers did the work.<\/p><p>“Patience,” he would say whenever she forced a pin. “A watch tells you what it needs. You only have to stop shouting at it long enough to listen.”<\/p><p>At first Nora found this maddening. She was used to answers that arrived instantly on a screen, and the idea that a machine might “tell” her anything struck her as one of those things old people said. But by February she had begun to notice how a balance wheel hesitated when something was wrong, how a mainspring resisted before it slipped. She was learning, she realized, to pay a kind of attention she had never been asked for.<\/p><p>One afternoon she finished reassembling a battered pocket watch that had belonged to the man downstairs. She wound it, held her breath, and heard it begin to tick. Grandpa Leo leaned close, not to look, since looking did him little good now, but to listen.<\/p><p>“There,” he said quietly. “Now you hear it too.”<\/p><p>Nora did not answer. She was thinking that it was the first time all winter he had sounded completely happy, and that she was the reason.<\/p>", "questions": [{"prompt": "Which of the following best describes the passage as a whole?", "choices": ["A girl reluctantly obeys her mother by checking on a lonely relative.", "A retired craftsman tries to persuade his granddaughter to take over his business.", "A teenager's weekly visits with her grandfather teach her a new kind of attentiveness and bring them closer.", "A young woman discovers that modern technology is superior to old-fashioned skills.", "A grandfather regains his eyesight with the help of his granddaughter."], "ans": "C", "expl": "ノーラが祖父の作業台で時計修理を手伝ううちに「今まで求められたことのない種類の注意力（a kind of attention she had never been asked for）」を身につけ、最後には祖父を幸せにしたと気づく話。(A)「しぶしぶ」は誤り（本当は楽しみにしていた）。(B)店を継ぐ話は無い。(D)は逆。(E)視力は回復していない。"}, {"prompt": "The contrast between “Officially” and “Unofficially” in the first paragraph suggests that", "choices": ["Nora's real reason for visiting differs from the reason others assume", "Nora's mother has forbidden her to use the workbench", "Nora visits her grandfather only because she is required to", "Nora's grandfather does not actually need any help", "Nora is embarrassed by her grandfather's poverty"], "ans": "A", "expl": "表向き（officially）は母親の心配が理由だが、本当の（unofficially）理由は作業台＝時計修理が好きだから。つまり周囲が思う理由と本当の理由が違う。(C)は「表向きの理由」だけを見た引っ掛け。"}, {"prompt": "As used in the fourth paragraph, the word “maddening” most nearly means", "choices": ["insane", "terrifying", "amusing", "mysterious", "exasperating"], "ans": "E", "expl": "maddening は「腹立たしい・イライラさせる」。直後に「すぐ答えが出る画面に慣れていた」とあり、祖父の「時計の声を聞け」という言葉にじれったさを感じた場面。exasperating＝「いら立たせる」。mad＝「狂った」から(A) insane を選ぶのが典型的な引っ掛け。"}, {"prompt": "Grandpa Leo leans close to the pocket watch in the fifth paragraph primarily because he", "choices": ["wants to check whether Nora assembled it incorrectly", "intends to return the watch to its owner himself", "is surprised that the watch still belongs to his neighbor", "relies on hearing rather than sight because his vision has failed", "is unable to believe that the watch is worth repairing"], "ans": "D", "expl": "本文に not to look, since looking did him little good now, but to listen（見るためではなく—見てももう役に立たないから—聞くために）とある。第2段落の his eyes began to fail とも一致。"}, {"prompt": "The final paragraph primarily reveals Nora's", "choices": ["disappointment that her grandfather did not praise her more", "quiet realization that her help has brought her grandfather joy", "decision to stop visiting her grandfather in the spring", "frustration that she cannot hear what her grandfather hears", "worry that the watch will soon break again"], "ans": "B", "expl": "最終段落：祖父がこの冬初めて心から幸せそうな声を出した、そしてその理由は自分だ、とノーラは考えている。言葉にしない（did not answer）静かな気づき。(D)は「Now you hear it too」と矛盾。"}]}, {"id": "p2", "title": "Passage 2: Poetry", "jp": "詩「引き潮」", "html": "<p><b>Low Tide<\/b><br><br>The sea goes out the way a breath goes out,<br>unhurried, certain it will come back soon,<br>and leaves the rocks to glisten like old coins<br>spilled underneath a pale, indifferent moon.<br><br>The pools it leaves are small, deliberate worlds:<br>a crab's slow argument with stone, a frond<br>of weed that lifts and settles, lifts and settles,<br>as if rehearsing for the deep beyond.<br><br>When I was small I thought the tide was leaving<br>for good each time it slid back from the sand,<br>and stood there at the edge, a worried keeper,<br>holding the last cold ripple in my hand.<br><br>Now I know better. Nothing here is lost.<br>The water only goes to gather more,<br>and what it takes it carries, turns, returns—<br>the same sea, never the same sea, at the shore.<br><br>So let it go. I've learned to watch it go<br>the way you'd watch a friend walk down the street,<br>not grieving, only waiting, sure the road<br>will curve around and bring them back to meet.<br><\/p>", "questions": [{"prompt": "Over the course of the poem, the speaker's attitude toward the retreating tide changes from", "choices": ["indifference to fascination", "joy to grief", "curiosity to boredom", "anxiety to calm acceptance", "fear to anger"], "ans": "D", "expl": "第3連で子どもの頃は潮が永遠に去ると思い「心配する見張り番（a worried keeper）」だったが、第4・5連で「Nothing here is lost」「not grieving, only waiting」と落ち着いて受け入れるようになる。不安→穏やかな受容。"}, {"prompt": "The phrase “the same sea, never the same sea” in the fourth stanza most directly suggests that the sea", "choices": ["remains continuous even as it constantly changes", "is dangerous because it cannot be predicted", "has been damaged by human activity", "looks different only at night", "will eventually disappear entirely"], "ans": "A", "expl": "直前の「運び、向きを変え、戻ってくる（carries, turns, returns）」を受け、海は同じ海として戻るが中身は常に入れ替わっている、という逆説。連続性と変化の両立。(B)(E)は本文に根拠なし。"}, {"prompt": "The comparison in the first line of the poem primarily emphasizes that the tide's retreat is", "choices": ["sudden and violent", "a sign of the sea's exhaustion", "difficult for the speaker to observe", "a cause of lasting damage to the shore", "natural and only temporary"], "ans": "E", "expl": "潮が引くのを「息を吐くように」と喩え、続けて unhurried, certain it will come back soon（急がず、すぐ戻ると確信して）。吐いた息は必ずまた吸われる＝自然で一時的なもの。(B)「疲れ」は喩えの読み過ぎ。"}, {"prompt": "The second stanza, which describes the tide pools, serves mainly to", "choices": ["warn readers about the dangers of the shoreline", "show that life and movement continue even after the sea withdraws", "explain why the speaker feared the tide as a child", "describe the moon's influence on the ocean", "contrast the beauty of the sea with the ugliness of the land"], "ans": "B", "expl": "潮だまりは「小さく、意図的な世界（small, deliberate worlds）」で、カニが動き、海藻が「lifts and settles」と揺れている。海が引いても生命と動きが残ることを示し、「何も失われない」という後半のテーマにつながる。"}, {"prompt": "As used in the third stanza, the word “keeper” most nearly means", "choices": ["a person who saves money", "a prisoner", "one who watches over something", "a fisherman", "one who keeps a promise"], "ans": "C", "expl": "子どもの話者が波打ち際に立ち、最後の波を手に握りしめて潮を見守っている場面。keeper＝「番人・見張り役」。(E) keep a promise は keep の別の意味からの引っ掛け。"}]}, {"id": "p3", "title": "Passage 3: Natural Science", "jp": "動物の渡りとナビゲーション", "html": "<p>Each autumn, a shorebird called the bar-tailed godwit performs one of the most astonishing feats in the animal kingdom. Leaving the mudflats of Alaska, it flies south across the Pacific Ocean to New Zealand—a journey of more than 11,000 kilometers—without stopping to eat, drink, or rest. Because the godwit cannot land on water, it must stay aloft for over a week, its body consuming the fat it stored during weeks of intensive feeding beforehand.<\/p><p>How such animals find their way has puzzled scientists for centuries. Today, researchers believe that migrating animals rely not on a single “compass” but on several overlapping systems. Many songbirds, for instance, orient themselves by the stars, a skill that young birds appear to learn by watching the night sky rotate around a fixed point. Others use the position of the sun, adjusting for its movement across the sky with the help of an internal clock. Sea turtles and some birds can apparently detect Earth's magnetic field, sensing both its direction and its strength, which varies from place to place and can therefore serve as a rough map.<\/p><p>These systems are not merely redundant. Each has weaknesses: clouds hide the stars, and the sun's position is useless without an accurate sense of time. By drawing on multiple cues, an animal can check one against another and correct its course when a single signal becomes unreliable. Some experiments suggest that birds periodically recalibrate their magnetic sense using the sunset, much as a sailor might confirm a compass reading against a landmark.<\/p><p>Migration is also increasingly threatened. Bright city lights can disorient birds that navigate at night, and the loss of coastal wetlands removes the feeding grounds that make long flights possible. For the godwit, whose entire journey depends on the fat it gains before departure, the loss of the mudflats where it feeds before departure could be disastrous. Understanding how animals migrate, scientists argue, is the first step toward protecting the routes they have followed for thousands of years.<\/p>", "questions": [{"prompt": "The primary purpose of the passage is to", "choices": ["argue that the bar-tailed godwit is the strongest bird in the world", "explain how migrating animals navigate and why their journeys are becoming vulnerable", "compare the migration of birds with that of sea turtles", "describe a single experiment on the magnetic sense of songbirds", "criticize scientists for failing to protect wetlands"], "ans": "B", "expl": "第2・3段落で複数の手がかり（星・太陽・磁場）によるナビゲーション、第4段落で渡りへの脅威を説明。全体をカバーするのは(B)。(A)はオオソリハシシギは導入の例にすぎない。(E)「批判」は本文にない。"}, {"prompt": "According to the passage, the bar-tailed godwit must remain in the air for more than a week because it", "choices": ["is chased by predators during the journey", "has no internal clock to tell it when to rest", "loses its sense of direction whenever it lands", "prefers to fly only at night", "is unable to land on water"], "ans": "E", "expl": "第1段落 Because the godwit cannot land on water, it must stay aloft for over a week. aloft＝「空中に」。他の選択肢は本文に記述なし。"}, {"prompt": "As used in the third paragraph, the word “redundant” most nearly means", "choices": ["unnecessarily repetitive", "highly accurate", "recently discovered", "dangerously unreliable", "completely unrelated"], "ans": "A", "expl": "redundant＝「余分な・重複していて不要な」。「These systems are not merely redundant（単なる重複ではない）」→各システムに弱点があり、互いに補い合うから意味がある、という流れ。"}, {"prompt": "The passage mentions all of the following as cues that animals may use to navigate EXCEPT", "choices": ["the stars", "the position of the sun", "Earth's magnetic field", "the scent of the ocean", "the sunset"], "ans": "D", "expl": "星（第2段落）、太陽の位置（第2段落）、地磁気（第2段落）、夕日（第3段落：磁気感覚の再調整に使う）はすべて登場。「海の匂い」は一切書かれていない。"}, {"prompt": "Which of the following is most similar to the way birds are said to use the sunset in the third paragraph?", "choices": ["A student memorizing a map before a trip", "A runner increasing speed near the end of a race", "A hiker checking a GPS reading against a familiar mountain peak", "A pilot flying above the clouds to avoid a storm", "A traveler buying extra food before a long journey"], "ans": "C", "expl": "鳥は夕日を使って磁気感覚を再調整（recalibrate）する＝「船乗りがコンパスの読みを目印で確認する」のと同じ。計器の値を確かな目印で照合する(C)が最も近い。(E)は脂肪を蓄える話と混同させる引っ掛け。"}]}, {"id": "p4", "title": "Passage 4: History", "jp": "シルクロードの実像", "html": "<p>The name “Silk Road” suggests a single highway along which caravans of camels carried bolts of Chinese silk to eager buyers in Rome. The reality was far more complicated. The term itself was coined only in 1877, by the German geographer Ferdinand von Richthofen, and it describes not one road but a shifting web of overland and sea routes that connected East Asia, Central Asia, India, Persia, and the Mediterranean world for more than fifteen centuries.<\/p><p>Few merchants traveled the entire length of these routes. Instead, goods typically passed from hand to hand, moving a few hundred kilometers at a time between oasis towns such as Samarkand, Kashgar, and Dunhuang. A bale of silk might change owners a dozen times before reaching the Mediterranean, its price rising at every stage. Silk was only one of many commodities; horses, glass, paper, spices, jade, and precious metals moved in both directions.<\/p><p>Perhaps more important than the goods, however, were the ideas that traveled with them. Buddhism spread from India into China largely along these routes, carried by monks who accompanied merchant caravans. Techniques for making paper moved westward from China, eventually transforming record-keeping in the Islamic world and later in Europe. Musical instruments, artistic styles, foods, and even diseases followed the same paths. The plague that devastated Europe in the fourteenth century is thought by many historians to have traveled partly along trade networks that linked Asia to the Black Sea.<\/p><p>The fortunes of the routes rose and fell with the political conditions along them. When powerful empires—such as China's Tang dynasty or, later, the Mongol Empire—kept the roads secure, trade flourished. When those empires weakened, bandits and local wars made travel dangerous, and commerce declined. By the fifteenth century, improved ships allowed European and Asian traders to move goods more cheaply by sea, and the great overland routes gradually lost their importance.<\/p><p>Today, historians tend to view the Silk Road less as a trade route than as a vast conversation among cultures, one conducted over centuries by people who rarely met face to face.<\/p>", "questions": [{"prompt": "The first paragraph primarily serves to", "choices": ["correct a common misconception about the Silk Road", "praise the achievements of Ferdinand von Richthofen", "describe the daily life of camel drivers", "argue that silk was the most valuable good in the ancient world", "explain why Rome declined"], "ans": "A", "expl": "「一本の大通りをラクダの隊商が絹を運んだ」というイメージを示した後、The reality was far more complicated と否定し、実際は「変化し続ける陸路・海路の網」だと説明。よくある誤解を正す働き。"}, {"prompt": "According to the passage, the price of silk increased as it moved west because", "choices": ["the Roman government taxed it heavily", "silk became rarer after the fourteenth century", "it passed through the hands of many different traders", "merchants had to pay monks for protection", "it was damaged during long sea voyages"], "ans": "C", "expl": "第2段落：絹は地中海に着くまでに a dozen times（12回ほど）持ち主が変わり、its price rising at every stage（段階ごとに値が上がった）。中継交易による値上がり。"}, {"prompt": "The author would most likely agree that the Silk Road's most lasting significance was", "choices": ["the wealth it brought to individual merchants", "the military power it gave the Mongol Empire", "the spread of the plague to Europe", "the development of better ships", "the exchange of ideas and culture among distant peoples"], "ans": "E", "expl": "第3段落 Perhaps more important than the goods ... were the ideas、最終段落「文化間の壮大な対話（a vast conversation among cultures）」から。(C)ペストは伝わったものの一例にすぎず、「最も重要」とは言っていない。"}, {"prompt": "As used in the fourth paragraph, the word “fortunes” most nearly means", "choices": ["large sums of money", "levels of success or prosperity", "predictions about the future", "lucky accidents", "inherited property"], "ans": "B", "expl": "The fortunes of the routes rose and fell with the political conditions＝交易路の「盛衰・繁栄の度合い」が政治状況で上下した。(A)「大金」や(C)「運勢占い」は fortune の別の意味を使った引っ掛け。"}, {"prompt": "The phrase “people who rarely met face to face” in the final paragraph most likely refers to the fact that", "choices": ["most traders on the routes spoke different languages", "the Silk Road was used mainly at night", "merchants were forbidden to meet foreigners", "goods and ideas passed through many intermediaries over long distances", "historians have never interviewed Silk Road travelers"], "ans": "D", "expl": "第2段落の「全行程を旅する商人はほとんどおらず、物は人から人へリレーされた」を受けた表現。両端の文化の人々は直接会わずに、仲介者を通じて物と思想をやり取りした。"}]}, {"id": "p5", "title": "Passage 5: Argumentative Essay", "jp": "高校の始業時刻を遅らせるべきか", "html": "<p>Every weekday morning, millions of American teenagers stumble onto school buses in the dark, many of them having slept six hours or less. We tend to blame them for staying up too late, scrolling through their phones. But the evidence suggests that the real problem lies not in teenagers' habits but in our schedules—and that it is time for high schools to start later.<\/p><p>During adolescence, the body's internal clock shifts. The hormone melatonin, which signals the brain that it is time to sleep, is released roughly two hours later in teenagers than in younger children or adults. A sixteen-year-old who lies down at ten o'clock may simply lie awake. Asking that student to be alert in a classroom at 7:30 a.m. is, biologically speaking, a little like asking an adult to take a math test at 5:30.<\/p><p>The consequences are not trivial. Chronic sleep deprivation has been linked to lower grades, higher rates of depression, and more car accidents among teenage drivers. When some districts have pushed their start times back by even forty-five minutes, researchers have reported improved attendance, fewer tardies, and modest gains in test scores.<\/p><p>Critics raise legitimate concerns. Later start times can complicate bus schedules, cut into after-school sports and jobs, and create difficulties for parents whose workdays begin early. These objections deserve serious answers, not dismissal. Yet they are, fundamentally, problems of logistics, and logistics can be solved. Districts that have made the change have staggered bus routes, adjusted practice schedules, and opened school buildings early for students who need supervision. No comparable adjustment can change the biology of adolescence.<\/p><p>We would never design a school day around the assumption that students could ignore hunger or cold. We should not design one that requires them to ignore their own internal clocks. Starting high school later is not a matter of coddling teenagers; it is a matter of taking seriously what we know about how they learn.<\/p>", "questions": [{"prompt": "Which of the following best states the author's main argument?", "choices": ["Teenagers should be required to put away their phones at night.", "Parents are responsible for making sure their children get enough sleep.", "School bus schedules are the main cause of poor test scores.", "High schools should start later because early start times conflict with teenagers' biology.", "After-school sports should be eliminated to allow more time for sleep."], "ans": "D", "expl": "第1段落 it is time for high schools to start later が主張、第2段落以降でその根拠（思春期の体内時計のずれ）を示す。(A)(B)は筆者が「本当の問題は習慣ではなくスケジュール」と否定している考え。"}, {"prompt": "The comparison to “asking an adult to take a math test at 5:30” in the second paragraph is intended to", "choices": ["show that adults are better at math than teenagers", "help readers understand how unnatural an early start is for teenagers", "suggest that tests should be given later in the day", "prove that melatonin affects adults more than teenagers", "criticize teachers who schedule early exams"], "ans": "B", "expl": "10代のメラトニン分泌は約2時間遅いので、朝7:30の授業は大人にとっての朝5:30のテストに相当する、という類推。大人の読者に10代の感覚を実感させるための比喩。"}, {"prompt": "The author's attitude toward the critics described in the fourth paragraph can best be described as", "choices": ["openly hostile", "completely persuaded", "indifferent", "sarcastic and mocking", "respectful but ultimately unconvinced"], "ans": "E", "expl": "Critics raise legitimate concerns（正当な懸念）、deserve serious answers, not dismissal と敬意を示しつつ、Yet they are ... problems of logistics, and logistics can be solved と反論。「敬意はあるが最終的には納得していない」。"}, {"prompt": "As used in the final paragraph, the word “coddling” most nearly means", "choices": ["overindulging", "punishing", "educating", "ignoring", "examining"], "ans": "A", "expl": "coddle＝「甘やかす」。「始業を遅らせるのは10代を甘やかすことではなく、学び方に関する知見を真剣に受け止めることだ」。overindulge＝「甘やかしすぎる」。"}, {"prompt": "Which of the following is NOT mentioned in the passage as a concern raised by critics of later start times?", "choices": ["Complications with bus schedules", "Less time for after-school jobs", "Higher costs for teachers' salaries", "Interference with after-school sports", "Difficulties for parents who start work early"], "ans": "C", "expl": "第4段落の批判はバスの日程、放課後のスポーツとアルバイト、朝早く出勤する親の困難の4つ。教員の給与コストは書かれていない。NOT問題は本文と1つずつ照合すること。"}]}, {"id": "p6", "title": "Passage 6: Social Science", "jp": "行動経済学――人は合理的か", "html": "<p>For much of the twentieth century, economists built their models on a convenient assumption: people are rational. Faced with a choice, the theory went, a person weighs costs and benefits carefully and selects whichever option best serves his or her interests. This imaginary decision-maker, sometimes nicknamed <i>Homo economicus<\/i>, never forgets, never panics, and is never swayed by the way a question happens to be worded.<\/p><p>Beginning in the 1970s, a group of psychologists and economists started to test this assumption, and the results were humbling. Real people, they found, depart from rationality in ways that are not random but predictable. One of the best-documented patterns is <i>loss aversion<\/i>: losing fifty dollars feels roughly twice as painful as gaining fifty dollars feels pleasant. As a result, people will often take irrational risks to avoid a loss while passing up good bets that might bring a gain.<\/p><p>Another pattern is <i>anchoring<\/i>. In one well-known type of experiment, participants are shown an arbitrary number—say, the last two digits of their phone number—and then asked to estimate the price of an object. Those who saw high numbers consistently give higher estimates, even though the number obviously has nothing to do with the object's value. The first figure we encounter, it seems, quietly tugs our judgment toward it.<\/p><p>Perhaps the most practical discovery concerns <i>defaults<\/i>, the option that takes effect if a person does nothing. When companies automatically enroll employees in retirement savings plans, allowing them to opt out if they wish, participation rates soar compared with plans that require employees to sign up. The choices available are identical; only the starting point has changed.<\/p><p>These findings have given rise to the idea of the “nudge”: designing choices so that people are gently steered toward decisions that benefit them, without removing their freedom to choose otherwise. Supporters see nudges as a humane application of science. Critics worry about who decides which direction counts as “better.” Either way, the field has permanently altered how economists picture the human mind.<\/p>", "questions": [{"prompt": "The passage is primarily concerned with", "choices": ["proving that economists of the twentieth century were careless", "explaining how to save money for retirement", "arguing that governments should ban nudges", "describing a single famous experiment on phone numbers", "describing research showing that people depart from rational decision-making in predictable ways"], "ans": "E", "expl": "合理的人間（Homo economicus）という前提に対し、損失回避・アンカリング・デフォルト効果という「予測可能な非合理性」を紹介する文章。(D)は一例にすぎない。(A)(C)は言い過ぎ。"}, {"prompt": "Which of the following situations best illustrates “anchoring” as described in the passage?", "choices": ["An investor refuses to sell a stock at a loss, hoping its price will recover.", "An employee stays in a health plan simply because she was enrolled automatically.", "A shopper judges a $200 jacket a bargain because its tag says it originally cost $400.", "A student studies harder after receiving a poor grade.", "A driver chooses the cheaper of two identical cars."], "ans": "C", "expl": "アンカリング＝最初に見た数字に判断が引っ張られること（The first figure we encounter ... tugs our judgment toward it）。「元値400ドル」が基準となり200ドルが安く感じる(C)。(A)は損失回避、(B)はデフォルト効果の例で、別概念を混ぜた引っ掛け。"}, {"prompt": "As used in the second paragraph, the word “humbling” most nearly means", "choices": ["lowering one's sense of certainty or importance", "extremely encouraging", "poorly organized", "difficult to measure", "kind and gentle"], "ans": "A", "expl": "humbling＝「謙虚にさせる・自信をくじく」。「人間は合理的」という前提を検証したら、それが崩れた＝経済学者の自信が揺らいだ、という文脈。(E)「優しい」は humble（謙虚な）からの連想による引っ掛け。"}, {"prompt": "The example of retirement savings plans in the fourth paragraph suggests that", "choices": ["employees generally dislike saving for retirement", "companies should offer more investment choices", "people always choose the option that benefits them most", "a small change in how a choice is presented can greatly affect behavior", "automatic enrollment removes employees' freedom to choose"], "ans": "D", "expl": "選択肢の中身は同じ（The choices available are identical）で、初期設定が変わっただけなのに加入率が急上昇（soar）。提示の仕方の小さな違いが行動を大きく変える。(E)は allowing them to opt out（脱退は自由）と矛盾。(C)は合理性の前提そのもので本文と逆。"}, {"prompt": "In the final paragraph, the author's attitude toward nudges is best described as", "choices": ["enthusiastic support", "balanced and noncommittal", "strong disapproval", "confused and uncertain", "mocking"], "ans": "B", "expl": "支持者の見方（humane application of science）と批判者の懸念（誰が「より良い」を決めるのか）の両方を示し、Either way で自分の立場を明言しない。noncommittal＝「どっちつかずの、態度を明確にしない」。"}]}, {"id": "p7", "title": "Passage 7: Arts", "jp": "ジャズ即興演奏の歴史", "html": "<p>To many listeners, jazz improvisation sounds like pure spontaneity—musicians inventing melodies out of thin air. In fact, improvisation in jazz has always been a disciplined art, and its character has changed dramatically over the music's roughly century-long history.<\/p><p>In the early jazz of New Orleans in the 1910s and 1920s, improvisation was largely collective. A trumpet or cornet stated the melody while a clarinet wove decorative lines above it and a trombone supplied a sliding counterpoint below. Each player embellished freely, but always within a shared texture; the goal was a lively ensemble sound rather than individual display.<\/p><p>That changed in large part because of Louis Armstrong. His recordings of the late 1920s showed that a single soloist could build a long, coherent statement full of rhythmic daring and emotional drama. After Armstrong, the improvised solo became the centerpiece of jazz performance, and audiences increasingly came to hear particular soloists.<\/p><p>In the 1940s, bebop musicians such as Charlie Parker and Dizzy Gillespie pushed the solo further. They played at blistering tempos and based their improvisations on complex chord progressions, often borrowing the harmonies of popular songs and writing new, intricate melodies over them. Bebop demanded enormous technical skill and a deep knowledge of harmony; to its admirers it was thrilling, while some older fans found it bewildering.<\/p><p>Later musicians looked for ways to loosen these harmonic constraints. In the late 1950s, modal jazz, associated with Miles Davis's album <i>Kind of Blue<\/i>, based improvisation on scales rather than rapidly changing chords, giving soloists more space to develop a mood. Around the same time, players such as Ornette Coleman experimented with “free jazz,” abandoning fixed chord structures almost entirely.<\/p><p>Yet across all these styles, improvisers have relied on long preparation. Musicians memorize phrases, practice scales for hours, and study recordings of earlier players note by note. The apparent freedom of a great solo rests on years of absorbing a musical language—much as a fluent speaker can talk spontaneously only because he or she has mastered vocabulary and grammar.<\/p>", "questions": [{"prompt": "Which of the following best expresses the main idea of the passage?", "choices": ["Louis Armstrong was the greatest jazz musician who ever lived.", "Bebop was more popular than any other style of jazz.", "Jazz improvisation, though it seems spontaneous, is a disciplined art that has evolved through several distinct styles.", "Free jazz rejected all of the traditions of earlier jazz.", "Jazz musicians rarely practice because they prefer to improvise."], "ans": "C", "expl": "第1段落の In fact, improvisation in jazz has always been a disciplined art, and its character has changed dramatically がテーマ文。その後ニューオーリンズ→アームストロング→ビバップ→モード/フリーと変遷を追い、最終段落で鍛錬の重要性に戻る。(E)は最終段落と正反対。"}, {"prompt": "According to the passage, improvisation in early New Orleans jazz differed from later jazz improvisation in that it", "choices": ["emphasized a shared group sound over individual display", "was performed only by trumpet players", "was based entirely on scales rather than chords", "was played at extremely fast tempos", "rejected melody altogether"], "ans": "A", "expl": "第2段落 improvisation was largely collective ... the goal was a lively ensemble sound rather than individual display。その後アームストロング以降ソロ中心になった。(C)はモード・ジャズ、(D)はビバップの特徴で、時代を混同させる引っ掛け。"}, {"prompt": "As used in the fourth paragraph, the word “bewildering” most nearly means", "choices": ["delightful", "old-fashioned", "loud", "confusing", "dull"], "ans": "D", "expl": "bewildering＝「当惑させる・わけがわからない」。ファンには thrilling（ゾクゾクする）だったが、一部の古いファンには難解で戸惑うものだった、という対比（while）。"}, {"prompt": "The comparison to “a fluent speaker” in the final paragraph primarily serves to", "choices": ["suggest that jazz should be taught in language classes", "argue that jazz lyrics are more important than melodies", "show that most jazz musicians speak several languages", "criticize musicians who imitate earlier players", "illustrate that apparent spontaneity depends on mastery gained through study"], "ans": "E", "expl": "流暢な話し手は語彙と文法を習得しているから即興で話せる＝ジャズの即興の「自由」も長年の練習で音楽の言語を身につけた結果。(D)は「録音を一音ずつ研究する」ことを肯定的に述べているので誤り。"}, {"prompt": "It can be inferred from the passage that modal jazz differed from bebop chiefly in that modal jazz", "choices": ["required no technical skill from its players", "gave soloists more room by basing improvisation on scales instead of rapidly changing chords", "was performed without any soloists", "abandoned fixed chord structures entirely", "returned to the collective style of New Orleans jazz"], "ans": "B", "expl": "第5段落：ビバップの和声的制約（harmonic constraints）を緩めるため、モード・ジャズは based improvisation on scales rather than rapidly changing chords, giving soloists more space。(D)はフリー・ジャズの説明で引っ掛け。"}]}, {"id": "p8", "title": "Passage 8: Physical Science", "jp": "系外惑星の見つけ方", "html": "<p>Until the 1990s, astronomers could only speculate about whether planets orbited stars other than the Sun. Today, more than five thousand such worlds, known as exoplanets, have been confirmed. Yet almost none of them have been seen directly. A planet is tiny and dim compared with its star—often billions of times fainter—so its light is usually lost in the glare. Astronomers have therefore learned to detect planets indirectly, by observing their effects on the stars they orbit.<\/p><p>One of the earliest successful techniques is the <i>radial velocity<\/i> method. Although we say that a planet orbits a star, in fact both objects orbit their shared center of mass. As a result, the star wobbles slightly, moving toward Earth and then away from it. When the star approaches, its light waves are compressed and shift toward the blue end of the spectrum; when it recedes, the waves stretch toward the red. By measuring these tiny shifts, astronomers can infer the presence of a planet and estimate its minimum mass.<\/p><p>The most productive method, however, has been the <i>transit<\/i> method. If a planet's orbit happens to be aligned so that it passes in front of its star as seen from Earth, it blocks a small fraction of the star's light, causing a slight, regular dip in brightness. Space telescopes such as NASA's Kepler, which monitored roughly 150,000 stars at once, have found thousands of planets this way. The amount of dimming reveals the planet's size, and the time between dips reveals the length of its year.<\/p><p>Each method has limitations. The transit method works only for the minority of systems whose orbits are aligned edge-on to us, and both techniques detect large planets close to their stars far more easily than small, distant ones. For this reason, the known population of exoplanets is not a perfect sample of what actually exists; it is skewed toward the planets that are easiest to find.<\/p><p>When the two methods are combined, however, they become especially powerful. Size from a transit and mass from radial velocity together yield a planet's density, allowing astronomers to judge whether it is rocky like Earth or gaseous like Jupiter—an essential step in the search for worlds that might support life.<\/p>", "questions": [{"prompt": "According to the passage, astronomers usually detect exoplanets indirectly because", "choices": ["exoplanets move too quickly to be photographed", "planets are extremely faint compared with the stars they orbit", "telescopes were not invented until the 1990s", "most exoplanets are hidden behind clouds of gas", "exoplanets give off only red light"], "ans": "B", "expl": "第1段落：惑星は恒星に比べて often billions of times fainter（何十億倍も暗い）ため、その光は恒星のまぶしさ（glare）にかき消される。だから間接的に検出する。"}, {"prompt": "According to the second paragraph, a shift of a star's light toward the blue end of the spectrum indicates that the star is", "choices": ["growing larger", "being orbited by a rocky planet", "moving away from Earth", "moving toward Earth", "becoming dimmer"], "ans": "D", "expl": "When the star approaches, its light waves are compressed and shift toward the blue。近づく→青方偏移、遠ざかる→赤方偏移。(C)は逆で典型的な引っ掛け。"}, {"prompt": "As used in the fourth paragraph, the word “skewed” most nearly means", "choices": ["biased", "enlarged", "destroyed", "hidden", "measured"], "ans": "A", "expl": "skewed＝「偏った・ゆがんだ」。既知の系外惑星は実際の分布を正確に反映せず「見つけやすい惑星の方に偏っている」。biased＝「偏った」。"}, {"prompt": "Based on the fourth paragraph, which type of planet is most likely to be underrepresented among known exoplanets?", "choices": ["A large planet orbiting very close to its star", "A gas giant whose orbit is aligned edge-on to Earth", "A planet that causes a large dip in its star's brightness", "A massive planet that makes its star wobble noticeably", "A small planet orbiting far from its star"], "ans": "E", "expl": "both techniques detect large planets close to their stars far more easily than small, distant ones。小さく恒星から遠い惑星は見つけにくい＝既知のリストでは実際より少なく（underrepresented）なる。(A)〜(D)はすべて「見つけやすい」側。"}, {"prompt": "The final paragraph primarily serves to", "choices": ["argue that the transit method should be abandoned", "describe the history of the Kepler telescope", "explain how combining the two methods provides information that neither gives alone", "prove that life exists on another planet", "compare the size of Earth with that of Jupiter"], "ans": "C", "expl": "トランジット法で大きさ、視線速度法で質量がわかり、組み合わせると密度が求まり岩石惑星かガス惑星か判断できる。単独では得られない情報が得られるという説明。(D)「生命の存在を証明」は言い過ぎ（might support life の探索の一歩にすぎない）。"}]}]}, "verbal": {"synonyms": [{"word": "ABUNDANT", "choices": ["scarce", "plentiful", "abandoned", "costly", "sturdy"], "ans": "B", "expl": "abundant は「豊富な、たくさんある」。plentiful（たっぷりある）が同義。scarce（乏しい）は反意語、abandoned（見捨てられた）は綴りが似ているだけの引っ掛けです。"}, {"word": "BRISK", "choices": ["lazy", "brittle", "lively", "fragrant", "silent"], "ans": "C", "expl": "brisk は「きびきびした、活発な」（a brisk walk＝早足の散歩）。lively（元気な、活発な）が正解。lazy は反意語、brittle（もろい）は br- で始まる見た目の引っ掛けです。"}, {"word": "CEASE", "choices": ["stop", "seize", "begin", "grieve", "release"], "ans": "A", "expl": "cease は「やめる、終わる」（cease-fire＝停戦）。stop が同義。seize（つかむ）は発音が似た引っ掛け、begin は反意語です。"}, {"word": "DILIGENT", "choices": ["delicate", "careless", "intelligent", "hardworking", "elegant"], "ans": "D", "expl": "diligent は「勤勉な、こつこつ努力する」。hardworking が正解。delicate（繊細な）は音の似た引っ掛け、intelligent（賢い）は語尾 -igent が同じだけで意味は別です。"}, {"word": "EVADE", "choices": ["invade", "confront", "evaluate", "fade", "avoid"], "ans": "E", "expl": "evade は「（巧みに）避ける、逃れる」（tax evasion＝脱税）。avoid が同義。invade（侵略する）は綴りが似た引っ掛け、confront（立ち向かう）は反意語です。"}, {"word": "ARID", "choices": ["humid", "fertile", "dry", "acid", "airy"], "ans": "C", "expl": "arid は「（土地・気候が）乾燥した」（arid desert）。dry が正解。humid（湿った）、fertile（肥沃な）は反意語、acid（酸性の）や airy（風通しのよい）は見た目・音の引っ掛けです。"}, {"word": "BLEAK", "choices": ["dreary", "bright", "bleached", "weak", "crisp"], "ans": "A", "expl": "bleak は「荒涼とした、わびしい、（見通しが）暗い」。dreary（陰気な、わびしい）が同義。bright は反意語、bleached（漂白された）は綴りの引っ掛けです。"}, {"word": "CONCEAL", "choices": ["reveal", "cancel", "congeal", "freeze", "hide"], "ans": "E", "expl": "conceal は「隠す」。hide が同義。reveal（明らかにする）は反意語。cancel や congeal（凝固する）は音が似ているだけの引っ掛けで、freeze は congeal の意味につられた人を狙った選択肢です。"}, {"word": "DEPLETE", "choices": ["complete", "use up", "refill", "delete", "defeat"], "ans": "B", "expl": "deplete は「（資源などを）使い果たす、激減させる」（ozone depletion＝オゾン層破壊）。use up が正解。refill は反意語、complete・delete は -plete / -lete の形が似た引っ掛けです。"}, {"word": "ELATED", "choices": ["belated", "related", "dejected", "overjoyed", "inflated"], "ans": "D", "expl": "elated は「大喜びの、有頂天の」。overjoyed が同義。dejected（落胆した）は反意語。belated（遅れた）、related（関係のある）、inflated（膨らんだ）はいずれも -lated / -flated の見た目の引っ掛けです。"}, {"word": "AMIABLE", "choices": ["friendly", "capable", "hostile", "amusing", "ample"], "ans": "A", "expl": "amiable は「感じのよい、人当たりのよい」。ラテン語 amicus（友）が語源で、friendly が正解。hostile（敵意のある）は反意語、capable（-able つながり）、amusing・ample（am- つながり）は形の引っ掛けです。"}, {"word": "BOISTEROUS", "choices": ["timid", "boastful", "sturdy", "rowdy", "bitter"], "ans": "D", "expl": "boisterous は「騒々しい、にぎやかで乱暴な」。rowdy（騒がしい、乱暴な）が同義。timid（内気な）は反意語。boastful（自慢する）は bo- の音につられやすい引っ掛けです。"}, {"word": "COHERENT", "choices": ["colorful", "logical", "confused", "inherent", "obedient"], "ans": "B", "expl": "coherent は「（話・考えが）筋の通った、一貫した」。logical が正解。confused（混乱した）は反意語、inherent（本来備わっている）は -herent が同じ形の引っ掛けです。"}, {"word": "DOCILE", "choices": ["fragile", "stubborn", "dormant", "educational", "obedient"], "ans": "E", "expl": "docile は「従順な、おとなしい（扱いやすい）」。obedient が同義。stubborn（頑固な）は反意語。語源はラテン語 docere（教える）で、educational はその知識を逆手に取った引っ掛けです。"}, {"word": "ERRATIC", "choices": ["steady", "exotic", "unpredictable", "mistaken", "dramatic"], "ans": "C", "expl": "erratic は「不規則な、気まぐれな、予測できない」。unpredictable が正解。steady は反意語。err（間違える）から mistaken を選ばせる引っ掛けに注意。exotic・dramatic は語尾 -tic の見た目だけです。"}, {"word": "ADVERSITY", "choices": ["variety", "advertisement", "prosperity", "hardship", "opponent"], "ans": "D", "expl": "adversity は「逆境、苦難」。hardship が同義。prosperity（繁栄）は反意語。opponent は adversary（敵）と混同させる引っ掛け、variety・advertisement は形の引っ掛けです。"}, {"word": "BRUSQUE", "choices": ["polite", "curt", "rustic", "brilliant", "bruised"], "ans": "B", "expl": "brusque は「（態度・言葉が）ぶっきらぼうな、無愛想な」。curt（そっけない）が同義。polite は反意語。rustic（田舎風の）は -us- の綴り、bruised（あざになった）・brilliant は br- の音の引っ掛けです。"}, {"word": "CREDULOUS", "choices": ["believable", "skeptical", "gullible", "generous", "incredible"], "ans": "C", "expl": "credulous は「信じやすい、だまされやすい」。gullible が同義。skeptical（疑い深い）は反意語。最大の引っ掛けは believable で、これは credible（信用できる）の意味。人が「信じやすい」のが credulous、物事が「信じられる」のが credible です。"}, {"word": "DEARTH", "choices": ["scarcity", "death", "abundance", "ground", "expense"], "ans": "A", "expl": "dearth は「不足、欠乏」（a dearth of evidence＝証拠不足）。scarcity が同義。abundance（豊富）は反意語。death や earth→ground は綴りからの連想を狙った引っ掛けです。"}, {"word": "ECCENTRIC", "choices": ["central", "ordinary", "electric", "excessive", "peculiar"], "ans": "E", "expl": "eccentric は「風変わりな、常軌を逸した」（ec-＝外へ＋center＝中心から外れた）。peculiar（変わった）が正解。ordinary は反意語、central は center から連想させる引っ掛けです。"}, {"word": "AUSTERE", "choices": ["lavish", "ancient", "southern", "anxious", "severe"], "ans": "E", "expl": "austere は「（人が）厳格な、（生活・装飾が）質素で飾り気のない」。severe（厳しい、簡素な）が最も近い。lavish（ぜいたくな）は反意語。southern は austral（南の）と混同させる引っ掛けです。"}, {"word": "BELLIGERENT", "choices": ["hostile", "graceful", "peaceful", "beloved", "gigantic"], "ans": "A", "expl": "belligerent は「好戦的な、けんか腰の」（ラテン語 bellum＝戦争）。hostile（敵意のある）が同義。peaceful は反意語。beloved は bel- で「美しい・愛される」を連想させる引っ掛け、gigantic は語尾の -gerent→giant の連想狙いです。"}, {"word": "CAPRICIOUS", "choices": ["stubborn", "capable", "precious", "fickle", "spacious"], "ans": "D", "expl": "capricious は「気まぐれな、移り気な」。fickle が同義。stubborn（頑固で変わらない）はむしろ反対。capable（cap-）、precious・spacious（-cious）は形の引っ掛けです。"}, {"word": "DIFFIDENT", "choices": ["different", "confident", "shy", "defiant", "diffuse"], "ans": "C", "expl": "diffident は「自信のない、内気な、遠慮がちな」（dis-＝否定＋fidere＝信じる）。shy が正解。confident は反意語。different・defiant（反抗的な）・diffuse（拡散した）はすべて綴りの似た引っ掛けです。"}, {"word": "EBULLIENT", "choices": ["sullen", "exuberant", "bulky", "fluent", "eloquent"], "ans": "B", "expl": "ebullient は「（喜び・熱意が）あふれんばかりの、元気いっぱいの」（ラテン語で「沸き立つ」）。exuberant（活気にあふれた）が同義。sullen（不機嫌な）は反意語。bulky は -bull- の綴り、fluent・eloquent は -ent の語尾の引っ掛けです。"}, {"word": "ACRIMONIOUS", "choices": ["harmonious", "bitter", "acrobatic", "criminal", "ceremoniou
