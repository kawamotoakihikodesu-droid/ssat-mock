["aversion", "property", "density", "intensity", "tendency"], "ans": "E"}}, {"w": "prosaic", "pos": "adj.", "ja": "平凡な、退屈な", "syn": ["dull", "mundane", "ordinary"], "ant": ["imaginative", "poetic"], "ex": "He gave the prosaic reason that he was simply tired.", "tip": "prose（散文）から「詩的でない」→「味気ない」。mosaic（モザイク）との見た目の引っ掛け。", "q": {"choices": ["poetic", "mosaic", "mundane", "imaginative", "prosperous"], "ans": "C"}}, {"w": "prudent", "pos": "adj.", "ja": "慎重な、分別のある", "syn": ["wise", "cautious", "judicious"], "ant": ["reckless", "rash"], "ex": "It is prudent to save some money for emergencies.", "tip": "provident（先見の明がある）の短縮形。prude（お堅い人）とは別語。", "q": {"choices": ["cautious", "reckless", "prudish", "student", "rash"], "ans": "A"}}, {"w": "pungent", "pos": "adj.", "ja": "（においや味が）刺激の強い、辛辣な", "syn": ["sharp", "acrid", "spicy"], "ant": ["mild", "bland"], "ex": "The pungent smell of garlic filled the kitchen.", "tip": "ラテン語pungere（刺す）。puncture（穴を開ける）と同根で「鼻を刺す」。", "q": {"choices": ["mild", "pudgy", "bland", "acrid", "pleasant"], "ans": "D"}}, {"w": "quaint", "pos": "adj.", "ja": "古風で趣のある、風変わりな", "syn": ["old-fashioned", "picturesque", "charming"], "ant": ["modern"], "ex": "We stayed in a quaint village where the houses still had thatched roofs.", "tip": "「古くて可愛らしい」というプラスの響き。quiet（静かな）と見間違えないこと。", "q": {"choices": ["old-fashioned", "futuristic", "quiet", "faint", "hostile"], "ans": "A"}}, {"w": "qualm", "pos": "n.", "ja": "不安、良心のとがめ", "syn": ["misgiving", "scruple", "doubt"], "ant": ["confidence", "assurance"], "ex": "She had no qualms about telling the coach that the drill was unsafe.", "tip": "have no qualms about ～（～に何のためらいもない）の形でよく出る。calm（落ち着き）とは無関係。", "q": {"choices": ["calm", "certainty", "misgiving", "claim", "delight"], "ans": "C"}}, {"w": "quandary", "pos": "n.", "ja": "困惑、苦境（どうすべきか迷う状態）", "syn": ["dilemma", "predicament", "plight"], "ant": ["solution"], "ex": "Offered two scholarships at once, Mia was in a quandary about which school to choose.", "tip": "in a quandary（途方に暮れて）で覚える。boundary（境界）と音が似ているので注意。", "q": {"choices": ["quarry", "boundary", "certainty", "celebration", "predicament"], "ans": "E"}}, {"w": "quell", "pos": "v.", "ja": "（反乱などを）鎮める、（不安を）抑える", "syn": ["suppress", "subdue", "quash"], "ant": ["provoke", "incite"], "ex": "The principal's calm announcement helped quell the students' fears.", "tip": "古英語「殺す」が語源で「力で押さえ込む」イメージ。quell a riot（暴動を鎮圧する）。", "q": {"choices": ["incite", "subdue", "swell", "quest", "reveal"], "ans": "B"}}, {"w": "querulous", "pos": "adj.", "ja": "不平ばかり言う、愚痴っぽい", "syn": ["complaining", "peevish", "petulant"], "ant": ["contented"], "ex": "The querulous passenger complained about every detail of the flight.", "tip": "ラテン語 queri（嘆く）が語源。query（質問）や curious（好奇心の強い）と混同しやすい。", "q": {"choices": ["curious", "cheerful", "serene", "peevish", "generous"], "ans": "D"}}, {"w": "quibble", "pos": "v.", "ja": "つまらないことに文句を言う、屁理屈をこねる", "syn": ["nitpick", "cavil", "carp"], "ant": ["agree"], "ex": "Let's not quibble over a few cents when the whole project is at stake.", "tip": "quibble over/about ～（～について細かく文句を言う）。nibble（かじる）と見た目が似ている引っ掛けに注意。", "q": {"choices": ["agree", "nitpick", "quiver", "nibble", "praise"], "ans": "B"}}, {"w": "quiescent", "pos": "adj.", "ja": "静止した、活動休止中の", "syn": ["dormant", "inactive", "latent"], "ant": ["active"], "ex": "The volcano has been quiescent for centuries, but scientists still monitor it.", "tip": "quiet と同じ語根 qui-（静か）。「今は静かだが後で動くかも」というニュアンス。", "q": {"choices": ["quarrelsome", "frantic", "questioning", "vigorous", "dormant"], "ans": "E"}}, {"w": "quixotic", "pos": "adj.", "ja": "非現実的なほど理想主義の、空想的な", "syn": ["idealistic", "impractical", "romantic"], "ant": ["pragmatic", "realistic"], "ex": "His quixotic plan to end world hunger by himself impressed everyone but convinced no one.", "tip": "『ドン・キホーテ（Don Quixote）』が語源。風車に突撃する騎士のイメージ。", "q": {"choices": ["idealistic", "pragmatic", "quick", "toxic", "cynical"], "ans": "A"}}, {"w": "rancor", "pos": "n.", "ja": "深い恨み、敵意", "syn": ["resentment", "animosity", "bitterness"], "ant": ["goodwill"], "ex": "Even after losing the election, she spoke of her opponent without rancor.", "tip": "rancid（腐った・悪臭のする）と同語源で「心の中で腐った怒り」。candor（率直さ）と混同しない。", "q": {"choices": ["ranch", "goodwill", "rank", "animosity", "candor"], "ans": "D"}}, {"w": "ratify", "pos": "v.", "ja": "批准する、正式に承認する", "syn": ["approve", "endorse", "sanction"], "ant": ["reject", "veto"], "ex": "The treaty must be ratified by the Senate before it takes effect.", "tip": "条約・協定に使う公式な「承認」。rectify（正す）と1文字違いなので要注意。", "q": {"choices": ["ration", "veto", "endorse", "rattle", "falsify"], "ans": "C"}}, {"w": "raze", "pos": "v.", "ja": "（建物・町を）完全に破壊する、取り壊す", "syn": ["demolish", "level", "flatten"], "ant": ["build", "erect"], "ex": "The old factory was razed to make room for a public park.", "tip": "razor（かみそり）と同語源で「削り取って更地にする」。同音の raise（上げる・建てる）は反対の意味になる引っ掛け。", "q": {"choices": ["demolish", "raise", "erect", "praise", "gaze"], "ans": "A"}}, {"w": "rebuke", "pos": "v.", "ja": "厳しく叱る、非難する", "syn": ["reprimand", "scold", "chastise"], "ant": ["praise", "commend"], "ex": "The teacher rebuked the students for copying each other's homework.", "tip": "名詞でも使える（a sharp rebuke＝厳しい叱責）。rebuild（再建する）と見間違えない。", "q": {"choices": ["rebuild", "commend", "scold", "revoke", "soothe"], "ans": "C"}}, {"w": "recalcitrant", "pos": "adj.", "ja": "反抗的な、手に負えない", "syn": ["defiant", "unruly", "obstinate"], "ant": ["compliant", "docile"], "ex": "The recalcitrant mule refused to move no matter how hard the farmer pulled.", "tip": "re（後ろへ）＋calc（かかと）で「かかとで蹴り返す」→反抗的。calculating（計算高い）とは無関係。", "q": {"choices": ["recurring", "docile", "calculating", "obedient", "defiant"], "ans": "E"}}, {"w": "reclusive", "pos": "adj.", "ja": "世間から引きこもった、隠遁した", "syn": ["withdrawn", "solitary", "secluded"], "ant": ["sociable", "gregarious"], "ex": "The reclusive author rarely left her mountain cabin or gave interviews.", "tip": "re（離れて）＋clus（閉じる）で「閉じこもる」。名詞 recluse（隠遁者）。inclusive（包括的な）と混同注意。", "q": {"choices": ["inclusive", "withdrawn", "gregarious", "conclusive", "outgoing"], "ans": "B"}}, {"w": "rectify", "pos": "v.", "ja": "（誤りを）正す、修正する", "syn": ["correct", "remedy", "amend"], "ant": ["worsen"], "ex": "The company quickly rectified the billing error and apologized to its customers.", "tip": "rect-は「まっすぐ」（rectangle＝直角の四角形）。「まっすぐに直す」と覚える。ratify（批准する）は別語。", "q": {"choices": ["ratify", "worsen", "recite", "correct", "testify"], "ans": "D"}}, {"w": "redundant", "pos": "adj.", "ja": "余分な、冗長な（重複していて不要な）", "syn": ["superfluous", "unnecessary", "repetitive"], "ant": ["essential", "necessary"], "ex": "The editor cut several redundant sentences that repeated the same point.", "tip": "re（再び）＋und（波）で「あふれ出る」→余分。abundant（豊富な）と語形が似ているが意味は別。", "q": {"choices": ["essential", "superfluous", "redolent", "resonant", "concise"], "ans": "B"}}, {"w": "refute", "pos": "v.", "ja": "論破する、誤りを証明する", "syn": ["disprove", "rebut", "discredit"], "ant": ["confirm", "prove"], "ex": "The scientist refuted the rumor with clear experimental data.", "tip": "単に「否定する（deny）」ではなく「証拠で誤りを示す」。refuse（拒む）と見間違えやすい。", "q": {"choices": ["refuse", "confirm", "reflect", "endorse", "disprove"], "ans": "E"}}, {"w": "relinquish", "pos": "v.", "ja": "（権利・地位などを）手放す、放棄する", "syn": ["surrender", "renounce", "abandon"], "ant": ["retain", "seize"], "ex": "The aging king finally relinquished the throne to his daughter.", "tip": "re（後ろに）＋linqu（残す）で「置いていく」。relish（楽しむ）と頭が同じなので注意。", "q": {"choices": ["surrender", "retain", "relish", "grasp", "replenish"], "ans": "A"}}, {"w": "remorse", "pos": "n.", "ja": "深い後悔、自責の念", "syn": ["regret", "contrition", "guilt"], "ant": ["indifference"], "ex": "He felt deep remorse for the unkind words he had said to his friend.", "tip": "re（再び）＋mors（かむ）で「良心が何度もかみつく」。morsel（一口分）も同じ語根。", "q": {"choices": ["remote", "pride", "morsel", "contrition", "recourse"], "ans": "D"}}, {"w": "renounce", "pos": "v.", "ja": "（公式に）放棄する、断念する", "syn": ["relinquish", "forswear", "abandon"], "ant": ["claim", "embrace"], "ex": "She renounced her claim to the family fortune and became a teacher.", "tip": "re（反対に）＋nounce（告げる）で「やめると宣言する」。announce（発表する）とは逆向き。", "q": {"choices": ["announce", "embrace", "forswear", "pronounce", "renew"], "ans": "C"}}, {"w": "replenish", "pos": "v.", "ja": "補充する、再び満たす", "syn": ["refill", "restock", "renew"], "ant": ["deplete", "drain"], "ex": "Hikers stopped at the stream to replenish their water bottles.", "tip": "re（再び）＋plen（満ちた：plenty）で「再び満たす」。deplete（使い果たす）が反意語の定番。", "q": {"choices": ["restock", "deplete", "punish", "polish", "diminish"], "ans": "A"}}, {"w": "reprimand", "pos": "v.", "ja": "（公式に）叱責する、戒める", "syn": ["rebuke", "admonish", "censure"], "ant": ["praise"], "ex": "The officer was reprimanded for arriving late to his post.", "tip": "上司や機関による「正式な叱責」。reprieve（刑の執行猶予）と見た目が似ている引っ掛けに注意。", "q": {"choices": ["reprieve", "applaud", "admonish", "remand", "reward"], "ans": "C"}}, {"w": "repudiate", "pos": "v.", "ja": "拒絶する、否認する", "syn": ["reject", "disown", "deny"], "ant": ["accept", "embrace"], "ex": "The senator repudiated the extreme views expressed by some of his supporters.", "tip": "「自分とは関係ないと突き放す」イメージ。reputation（評判）とは無関係。", "q": {"choices": ["repeat", "accept", "endorse", "appreciate", "disown"], "ans": "E"}}, {"w": "resilient", "pos": "adj.", "ja": "回復力のある、立ち直りが早い", "syn": ["hardy", "buoyant", "tough"], "ant": ["fragile", "vulnerable"], "ex": "Children are often surprisingly resilient after a difficult experience.", "tip": "re（後ろへ）＋sili（跳ぶ）で「跳ね返る」。日本語の「レジリエンス」と同じ。", "q": {"choices": ["fragile", "hardy", "reluctant", "resident", "brittle"], "ans": "B"}}, {"w": "resolute", "pos": "adj.", "ja": "断固とした、決意の固い", "syn": ["determined", "steadfast", "firm"], "ant": ["irresolute", "wavering"], "ex": "Despite the storm, the resolute climbers pressed on toward the summit.", "tip": "resolve（決心する）の形容詞。dissolute（ふしだらな）や absolute（絶対の）と語尾が同じ引っ掛けに注意。", "q": {"choices": ["dissolute", "hesitant", "absolute", "determined", "wavering"], "ans": "D"}}, {"w": "reticent", "pos": "adj.", "ja": "口数が少ない、（話すのを）控えめな", "syn": ["reserved", "taciturn", "quiet"], "ant": ["talkative", "forthcoming"], "ex": "Grandpa was reticent about his years in the army and seldom discussed them.", "tip": "ラテン語 tacere（黙る）が語源で taciturn と親戚。recent（最近の）と見間違えない。", "q": {"choices": ["recent", "reserved", "talkative", "reckless", "candid"], "ans": "B"}}, {"w": "revere", "pos": "v.", "ja": "崇敬する、深く敬う", "syn": ["venerate", "worship", "honor"], "ant": ["despise", "scorn"], "ex": "The villagers revered the old healer for her wisdom and kindness.", "tip": "名詞 reverence（崇敬）、形容詞 reverent。reverse（逆にする）や revert（戻る）とは別語。", "q": {"choices": ["reverse", "despise", "revert", "sever", "venerate"], "ans": "E"}}, {"w": "rudimentary", "pos": "adj.", "ja": "初歩的な、基本の；未発達の", "syn": ["elementary", "basic", "fundamental"], "ant": ["advanced", "sophisticated"], "ex": "I have only a rudimentary knowledge of Spanish, enough to order food.", "tip": "rude（未熟な・粗い）が語源。sedimentary（堆積の）と語尾が同じなので注意。", "q": {"choices": ["elementary", "advanced", "rude", "sedimentary", "complimentary"], "ans": "A"}}, {"w": "ruthless", "pos": "adj.", "ja": "冷酷な、無慈悲な", "syn": ["merciless", "cruel", "pitiless"], "ant": ["compassionate", "merciful"], "ex": "The ruthless dictator silenced anyone who criticized him.", "tip": "ruth（哀れみ：古語）＋less（ない）で「哀れみがない」。truthful（正直な）と見た目が似ている。", "q": {"choices": ["truthful", "compassionate", "restless", "merciless", "careless"], "ans": "D"}}, {"w": "sagacious", "pos": "adj.", "ja": "賢明な、洞察力の鋭い", "syn": ["wise", "shrewd", "astute"], "ant": ["foolish"], "ex": "The sagacious judge saw through the witness's carefully rehearsed story.", "tip": "sage（賢者）と同じ語根。spacious（広々とした）など -acious 語との混同に注意。", "q": {"choices": ["spacious", "foolish", "astute", "sagging", "voracious"], "ans": "C"}}, {"w": "salient", "pos": "adj.", "ja": "顕著な、最も重要で目立つ", "syn": ["prominent", "conspicuous", "noticeable"], "ant": ["inconspicuous", "minor"], "ex": "Please summarize only the salient points of the article.", "tip": "ラテン語 salire（跳ぶ）から「飛び出して目立つ」。silent（静かな）と見間違えない。", "q": {"choices": ["prominent", "silent", "salty", "obscure", "resilient"], "ans": "A"}}, {"w": "sanguine", "pos": "adj.", "ja": "楽観的な、自信に満ちた", "syn": ["optimistic", "hopeful", "confident"], "ant": ["pessimistic", "gloomy"], "ex": "The coach remained sanguine about the team's chances despite two early losses.", "tip": "ラテン語 sanguis（血）→「血色が良く陽気」。genuine（本物の）と音が似ている引っ掛けに注意。", "q": {"choices": ["genuine", "gloomy", "optimistic", "sanitary", "despondent"], "ans": "C"}}, {"w": "scrupulous", "pos": "adj.", "ja": "綿密な、良心的で几帳面な", "syn": ["meticulous", "conscientious", "careful"], "ant": ["careless", "unscrupulous"], "ex": "The accountant kept scrupulous records of every transaction.", "tip": "scruple（良心のとがめ）の形容詞。否定形 unscrupulous は「悪辣な」。scrumptious（おいしい）と混同注意。", "q": {"choices": ["scrumptious", "careless", "suspicious", "negligent", "meticulous"], "ans": "E"}}, {"w": "scrutinize", "pos": "v.", "ja": "精査する、細かく調べる", "syn": ["examine", "inspect", "analyze"], "ant": ["ignore", "overlook"], "ex": "The jeweler scrutinized the diamond under a magnifying glass.", "tip": "名詞 scrutiny（精査）。overlook（見落とす）が反意語。scribble（走り書きする）とは無関係。", "q": {"choices": ["overlook", "inspect", "scribble", "summarize", "scramble"], "ans": "B"}}, {"w": "sedentary", "pos": "adj.", "ja": "座りがちの、あまり体を動かさない", "syn": ["inactive", "sitting", "stationary"], "ant": ["active"], "ex": "Doctors warn that a sedentary lifestyle can lead to health problems.", "tip": "sed-（座る）は sedan（座席付きの乗り物）と同じ。sedimentary（堆積の）と1語違いの引っ掛けが頻出。", "q": {"choices": ["sedimentary", "energetic", "secondary", "inactive", "sentimental"], "ans": "D"}}, {"w": "serene", "pos": "adj.", "ja": "穏やかな、落ち着いた", "syn": ["tranquil", "calm", "peaceful"], "ant": ["agitated", "turbulent"], "ex": "The lake was serene at dawn, without a single ripple.", "tip": "名詞 serenity（静けさ）。severe（厳しい）と見た目が似ているので注意。", "q": {"choices": ["severe", "tranquil", "agitated", "serial", "frantic"], "ans": "B"}}, {"w": "servile", "pos": "adj.", "ja": "卑屈な、こびへつらう", "syn": ["subservient", "obsequious", "fawning"], "ant": ["domineering", "assertive"], "ex": "The servile assistant agreed with everything his boss said, however foolish.", "tip": "serv-（仕える）＋-ile で「奴隷のように従う」。マイナスの意味の語。", "q": {"choices": ["sterile", "domineering", "versatile", "hostile", "subservient"], "ans": "E"}}, {"w": "skeptical", "pos": "adj.", "ja": "懐疑的な、疑い深い", "syn": ["doubtful", "dubious", "incredulous"], "ant": ["gullible", "credulous"], "ex": "Many scientists were skeptical of the company's miraculous claims.", "tip": "be skeptical of/about ～（～を疑っている）。gullible（だまされやすい）が反意語の定番。", "q": {"choices": ["doubtful", "gullible", "skeletal", "spherical", "trusting"], "ans": "A"}}, {"w": "slander", "pos": "n.", "ja": "中傷、（口頭の）名誉毀損", "syn": ["defamation", "libel", "smear"], "ant": ["praise"], "ex": "The actor sued the magazine for slander after it printed false rumors.", "tip": "動詞でも使う（slander a rival）。厳密には口頭が slander、文書が libel。slender（ほっそりした）と混同注意。", "q": {"choices": ["slant", "flattery", "splendor", "defamation", "slumber"], "ans": "D"}}, {"w": "solemn", "pos": "adj.", "ja": "厳粛な、まじめな", "syn": ["grave", "serious", "somber"], "ant": ["frivolous", "lighthearted"], "ex": "The ceremony began with a solemn moment of silence.", "tip": "最後の n は発音しない（ソレム）。solitary（孤独な）とは別語。", "q": {"choices": ["solitary", "frivolous", "grave", "swollen", "solvent"], "ans": "C"}}, {"w": "sparse", "pos": "adj.", "ja": "まばらな、乏しい", "syn": ["scanty", "thin", "meager"], "ant": ["dense", "abundant"], "ex": "Vegetation is sparse in the desert, where rain rarely falls.", "tip": "「点々と散らばっている」イメージ。sparkling（きらめく）など sp- で始まる語に惑わされない。", "q": {"choices": ["scanty", "dense", "sparkling", "plentiful", "parched"], "ans": "A"}}, {"w": "spurious", "pos": "adj.", "ja": "偽の、もっともらしいが誤った", "syn": ["false", "fake", "bogus"], "ant": ["genuine", "authentic"], "ex": "The lawyer exposed the spurious argument as a mix of half-truths.", "tip": "spurious claim（根拠のない主張）の形で頻出。curious / furious と語尾が同じ引っ掛けに注意。", "q": {"choices": ["curious", "genuine", "bogus", "furious", "spacious"], "ans": "C"}}, {"w": "squander", "pos": "v.", "ja": "浪費する、無駄遣いする", "syn": ["waste", "fritter", "dissipate"], "ant": ["save", "conserve"], "ex": "He squandered his entire allowance on video games in one weekend.", "tip": "お金・時間・チャンスを「無駄にする」。wander（さまよう）と音が似ているが無関係。", "q": {"choices": ["wander", "conserve", "squabble", "hoard", "waste"], "ans": "E"}}, {"w": "stagnant", "pos": "adj.", "ja": "（水が）よどんだ；停滞した", "syn": ["motionless", "still", "sluggish"], "ant": ["flowing", "thriving"], "ex": "Mosquitoes breed in the stagnant water of the abandoned pond.", "tip": "stagnation（停滞）。水にも経済にも使える。staggering（驚異的な）と見間違えない。", "q": {"choices": ["flowing", "motionless", "stringent", "vibrant", "staggering"], "ans": "B"}}, {"w": "staunch", "pos": "adj.", "ja": "忠実な、断固とした", "syn": ["loyal", "steadfast", "faithful"], "ant": ["disloyal", "unreliable"], "ex": "She has been a staunch supporter of the library for thirty years.", "tip": "a staunch ally / supporter（忠実な味方・支持者）の形で覚える。stench（悪臭）と混同注意。", "q": {"choices": ["stench", "fickle", "launch", "loyal", "haughty"], "ans": "D"}}, {"w": "steadfast", "pos": "adj.", "ja": "不動の、揺るぎない", "syn": ["unwavering", "resolute", "constant"], "ant": ["fickle", "wavering"], "ex": "The dog remained steadfast at his owner's side throughout the storm.", "tip": "stead（場所）＋fast（しっかり固定）で「その場から動かない」。fast は「速い」ではない点が引っ掛け。", "q": {"choices": ["fickle", "unwavering", "speedy", "stealthy", "faltering"], "ans": "B"}}, {"w": "stoic", "pos": "adj.", "ja": "禁欲的な、感情を表に出さない", "syn": ["impassive", "unemotional", "stolid"], "ant": ["emotional", "excitable"], "ex": "He remained stoic even as the doctor stitched his wound.", "tip": "痛みや苦しみに耐えるストア派（Stoics）哲学者が語源。日本語の「ストイック」と同じ。", "q": {"choices": ["stormy", "emotional", "heroic", "toxic", "impassive"], "ans": "E"}}, {"w": "stringent", "pos": "adj.", "ja": "（規則などが）厳しい、厳格な", "syn": ["rigorous", "strict", "severe"], "ant": ["lenient", "lax"], "ex": "The lab follows stringent safety rules to prevent contamination.", "tip": "string（ひも）をきつく締める→「厳しい」。strident（耳障りな）と見た目が似ているので注意。", "q": {"choices": ["rigorous", "lenient", "strident", "relaxed", "fragrant"], "ans": "A"}}, {"w": "subtle", "pos": "adj.", "ja": "微妙な、かすかな、さりげない", "syn": ["faint", "delicate", "understated"], "ant": ["obvious", "blatant"], "ex": "There is a subtle difference between the two shades of blue.", "tip": "b は発音しない（サトル）。obvious（明らかな）が反意語。supple（しなやかな）と混同注意。", "q": {"choices": ["obvious", "supple", "settle", "understated", "blatant"], "ans": "D"}}, {"w": "succinct", "pos": "adj.", "ja": "簡潔な、要を得た", "syn": ["concise", "brief", "terse"], "ant": ["verbose", "wordy"], "ex": "Her succinct summary covered the whole chapter in three sentences.", "tip": "短くても要点を押さえている、というプラスの語。succulent（多汁の）と頭が同じ引っ掛けに注意。", "q": {"choices": ["succulent", "verbose", "concise", "distinct", "extinct"], "ans": "C"}}, {"w": "superfluous", "pos": "adj.", "ja": "余分な、不必要な", "syn": ["excessive", "unnecessary", "redundant"], "ant": ["essential"], "ex": "Remove any superfluous words to make your essay clearer.", "tip": "super（超えて）＋flu（流れる）で「あふれ出た」→余分。superior（優れた）とは無関係。", "q": {"choices": ["excessive", "essential", "superior", "fluent", "superb"], "ans": "A"}}, {"w": "surreptitious", "pos": "adj.", "ja": "こそこそした、内密の", "syn": ["stealthy", "secret", "clandestine"], "ant": ["open", "overt"], "ex": "He cast a surreptitious glance at his phone during the meeting.", "tip": "sur（下で）＋rept（つかむ）で「こっそり奪う」。repetitious（繰り返しの）と語尾が似ているので注意。", "q": {"choices": ["repetitious", "overt", "stealthy", "superstitious", "nutritious"], "ans": "C"}}, {"w": "sycophant", "pos": "n.", "ja": "おべっか使い、ごますり", "syn": ["flatterer", "toady", "bootlicker"], "ant": ["critic"], "ex": "The king surrounded himself with sycophants who never told him the truth.", "tip": "権力者にこびる人。形容詞は sycophantic。psychic（超能力者）と発音が似ているので注意。", "q": {"choices": ["critic", "saxophone", "psychic", "rebel", "flatterer"], "ans": "E"}}, {"w": "taciturn", "pos": "adj.", "ja": "無口な、寡黙な", "syn": ["reticent", "reserved", "silent"], "ant": ["talkative", "loquacious"], "ex": "The taciturn farmer answered most questions with a simple nod.", "tip": "tacit（暗黙の）と同語源で「黙っている」性格。tactful（如才ない）と混同しない。", "q": {"choices": ["loquacious", "reserved", "tactical", "nocturnal", "tactful"], "ans": "B"}}, {"w": "tangible", "pos": "adj.", "ja": "触れられる、具体的な、明白な", "syn": ["concrete", "palpable", "real"], "ant": ["intangible", "abstract"], "ex": "The new policy has produced tangible improvements in student attendance.", "tip": "tang-（触れる）は tangent（接線）と同じ。tangled（もつれた）は無関係の引っ掛け。", "q": {"choices": ["tangled", "abstract", "tangential", "palpable", "edible"], "ans": "D"}}, {"w": "tedious", "pos": "adj.", "ja": "退屈な、うんざりするほど長い", "syn": ["monotonous", "boring", "tiresome"], "ant": ["exciting", "engaging"], "ex": "Copying the list by hand was a tedious task that took all afternoon.", "tip": "名詞 tedium（退屈）。studious（勉強熱心な）や odious（憎むべき）と語尾が似ている。", "q": {"choices": ["tidy", "monotonous", "thrilling", "odious", "studious"], "ans": "B"}}, {"w": "temperate", "pos": "adj.", "ja": "穏やかな（気候）、節度のある", "syn": ["moderate", "mild", "restrained"], "ant": ["extreme", "excessive"], "ex": "Japan has a temperate climate with four distinct seasons.", "tip": "temperate zone（温帯）。tempestuous（大荒れの）は反対に近い意味なので注意。", "q": {"choices": ["temporary", "extreme", "tempestuous", "desperate", "moderate"], "ans": "E"}}, {"w": "tenacious", "pos": "adj.", "ja": "粘り強い、しつこい", "syn": ["persistent", "determined", "dogged"], "ant": ["irresolute", "yielding"], "ex": "The tenacious reporter called the mayor's office every day until she got an interview.", "tip": "ten-（つかむ）で「しっかりつかんで離さない」。tenuous（薄弱な）や tentative（仮の）と混同注意。", "q": {"choices": ["persistent", "tentative", "tenuous", "yielding", "contentious"], "ans": "A"}}, {"w": "tentative", "pos": "adj.", "ja": "仮の、暫定的な；ためらいがちな", "syn": ["provisional", "hesitant", "uncertain"], "ant": ["definite", "decisive"], "ex": "We made tentative plans to meet on Saturday, depending on the weather.", "tip": "tent-（試す）＝attempt と同系。tenacious（粘り強い）は全く別の意味。", "q": {"choices": ["attentive", "definite", "tenacious", "provisional", "festive"], "ans": "D"}}, {"w": "terse", "pos": "adj.", "ja": "簡潔な；（言葉が）そっけない", "syn": ["curt", "concise", "brief"], "ant": ["wordy", "verbose"], "ex": "His terse reply, \"No,\" made it clear he did not want to discuss it.", "tip": "succinct より「冷たい・ぶっきらぼう」の響きがある。tense（緊張した）と1文字違い。", "q": {"choices": ["tense", "verbose", "curt", "diverse", "rambling"], "ans": "C"}}, {"w": "timid", "pos": "adj.", "ja": "臆病な、内気な", "syn": ["shy", "fearful", "timorous"], "ant": ["bold", "confident"], "ex": "The timid kitten hid under the bed whenever visitors arrived.", "tip": "ラテン語 timere（恐れる）が語源。tepid（ぬるい）や humid（湿った）と語尾が同じ引っ掛け。", "q": {"choices": ["shy", "bold", "tepid", "humid", "daring"], "ans": "A"}}, {"w": "tirade", "pos": "n.", "ja": "長い非難演説、激しい罵倒", "syn": ["diatribe", "harangue", "rant"], "ant": ["praise", "eulogy"], "ex": "The coach launched into a tirade about the referee's poor calls.", "tip": "「怒って長々とまくしたてる」こと。tribute（賛辞）は正反対。trade（貿易）と見た目が似ている。", "q": {"choices": ["trade", "tribute", "diatribe", "parade", "cascade"], "ans": "C"}}, {"w": "torpid", "pos": "adj.", "ja": "無気力な、不活発な", "syn": ["sluggish", "lethargic", "inert"], "ant": ["energetic", "lively"], "ex": "The heat left everyone feeling torpid and unwilling to move.", "tip": "torpor（無気力・冬眠状態）の形容詞。torrid（灼熱の）と1文字違いなので注意。", "q": {"choices": ["torrid", "vigorous", "timid", "rapid", "lethargic"], "ans": "E"}}, {"w": "tranquil", "pos": "adj.", "ja": "静かな、穏やかな", "syn": ["calm", "serene", "placid"], "ant": ["turbulent", "agitated"], "ex": "They spent a tranquil afternoon fishing by the quiet pond.", "tip": "tranquilizer（鎮静剤）から連想。turbulent（荒れた）が反意語の定番。", "q": {"choices": ["turbulent", "placid", "tangible", "trivial", "frenzied"], "ans": "B"}}, {"w": "transient", "pos": "adj.", "ja": "一時的な、はかない", "syn": ["temporary", "fleeting", "ephemeral"], "ant": ["permanent", "enduring"], "ex": "Fame on social media is often transient, lasting only a few days.", "tip": "trans（越えて）＋i（行く）で「通り過ぎていく」。transparent（透明な）と頭が同じ引っ掛け。", "q": {"choices": ["transparent", "permanent", "translucent", "fleeting", "lenient"], "ans": "D"}}, {"w": "trepidation", "pos": "n.", "ja": "恐怖、不安、おののき", "syn": ["apprehension", "dread", "anxiety"], "ant": ["confidence", "calm"], "ex": "With some trepidation, Ken stepped onto the stage for his first recital.", "tip": "intrepid（勇敢な）の in- は否定。intrepidity（大胆さ）は反意語なので引っ掛けに注意。", "q": {"choices": ["intrepidity", "apprehension", "precipitation", "confidence", "dedication"], "ans": "B"}}, {"w": "trite", "pos": "adj.", "ja": "陳腐な、ありふれた", "syn": ["hackneyed", "clichéd", "banal"], "ant": ["original", "fresh"], "ex": "The essay was full of trite phrases like \"at the end of the day.\"", "tip": "使い古されて新鮮味のない表現に使う。contrite（悔いている）は語形が似ているだけで別語。", "q": {"choices": ["contrite", "original", "tight", "novel", "hackneyed"], "ans": "E"}}, {"w": "truculent", "pos": "adj.", "ja": "好戦的な、けんか腰の", "syn": ["belligerent", "combative", "aggressive"], "ant": ["gentle", "peaceable"], "ex": "The truculent customer shouted at the cashier over a small mistake.", "tip": "ラテン語 trux（獰猛な）が語源。truck（トラック）とは無関係。translucent / succulent と語尾が似ている。", "q": {"choices": ["belligerent", "gentle", "translucent", "succulent", "truthful"], "ans": "A"}}, {"w": "turbulent", "pos": "adj.", "ja": "荒れ狂う、騒然とした", "syn": ["tumultuous", "stormy", "chaotic"], "ant": ["calm", "tranquil"], "ex": "The plane shook violently as it flew through turbulent air.", "tip": "turbine（タービン）と同じ turb-（かき乱す）。飛行機の「タービュランス（乱気流）」で覚える。", "q": {"choices": ["tranquil", "opulent", "turgid", "tumultuous", "durable"], "ans": "D"}}, {"w": "ubiquitous", "pos": "adj.", "ja": "至る所にある、遍在する", "syn": ["omnipresent", "pervasive", "universal"], "ant": ["rare", "scarce"], "ex": "Smartphones have become ubiquitous in modern life.", "tip": "ラテン語 ubique（どこにでも）。「ユビキタス」として日本語にもなっている。ambiguous（曖昧な）と混同注意。", "q": {"choices": ["iniquitous", "rare", "omnipresent", "ambiguous", "obsequious"], "ans": "C"}}, {"w": "unassuming", "pos": "adj.", "ja": "気取らない、控えめな", "syn": ["modest", "humble", "unpretentious"], "ant": ["arrogant", "pretentious"], "ex": "Despite her fame, the scientist was quiet and unassuming.", "tip": "assuming（出しゃばりな）の否定。unsuspecting（疑わない）と見た目が似ている引っ掛け。", "q": {"choices": ["modest", "arrogant", "unsuspecting", "presumptuous", "amusing"], "ans": "A"}}, {"w": "undermine", "pos": "v.", "ja": "（徐々に）弱める、ひそかに損なう", "syn": ["weaken", "sabotage", "erode"], "ant": ["strengthen", "bolster"], "ex": "Constant criticism can undermine a child's confidence.", "tip": "under（下を）＋mine（掘る）で「土台を掘り崩す」。underline（下線を引く）と見間違えない。", "q": {"choices": ["underline", "bolster", "sabotage", "determine", "undertake"], "ans": "C"}}, {"w": "unkempt", "pos": "adj.", "ja": "（髪・服装が）だらしない、手入れされていない", "syn": ["disheveled", "messy", "untidy"], "ant": ["neat", "tidy"], "ex": "After camping for a week, the boys came home looking unkempt.", "tip": "kempt は古語で「くしでとかした」。unkind（不親切な）とは無関係。", "q": {"choices": ["unkind", "tidy", "unspent", "attempted", "disheveled"], "ans": "E"}}, {"w": "unprecedented", "pos": "adj.", "ja": "前例のない、空前の", "syn": ["unparalleled", "novel", "unheard-of"], "ant": ["common", "routine"], "ex": "The city experienced an unprecedented heat wave last summer.", "tip": "un（ない）＋precedent（前例）。preceding（前の）は語根が同じだけで別の意味。", "q": {"choices": ["routine", "unparalleled", "preceding", "presidential", "customary"], "ans": "B"}}, {"w": "unscrupulous", "pos": "adj.", "ja": "不道徳な、手段を選ばない", "syn": ["unprincipled", "dishonest", "corrupt"], "ant": ["scrupulous", "ethical"], "ex": "Unscrupulous dealers sold fake tickets outside the stadium.", "tip": "scrupulous（良心的な）の否定。meticulous（綿密な）は scrupulous の類義語なので逆の引っ掛け。", "q": {"choices": ["meticulous", "ethical", "unscathed", "unprincipled", "unconscious"], "ans": "D"}}, {"w": "upbraid", "pos": "v.", "ja": "厳しく叱る、とがめる", "syn": ["berate", "scold", "reproach"], "ant": ["praise", "commend"], "ex": "The captain upbraided the crew for leaving the deck dirty.", "tip": "braid（三つ編み）とは関係なく、古語で「投げつける」から「非難を浴びせる」。uphold（支持する）と混同しない。", "q": {"choices": ["praise", "berate", "upgrade", "uphold", "uplift"], "ans": "B"}}, {"w": "urbane", "pos": "adj.", "ja": "洗練された、都会的で上品な", "syn": ["suave", "sophisticated", "refined"], "ant": ["boorish", "crude"], "ex": "The urbane host made every guest feel welcome and at ease.", "tip": "urban（都市の）から派生したが、意味は「物腰が洗練された」。urban そのものは類義語ではない引っ掛け。", "q": {"choices": ["urban", "boorish", "suburban", "mundane", "suave"], "ans": "E"}}, {"w": "usurp", "pos": "v.", "ja": "（権力・地位を）奪う、強奪する", "syn": ["seize", "commandeer", "appropriate"], "ant": ["relinquish", "surrender"], "ex": "The general usurped power from the elected president.", "tip": "正当な権利なしに奪うこと。abdicate（退位する）は反対の意味。", "q": {"choices": ["seize", "surrender", "slurp", "usher", "abdicate"], "ans": "A"}}, {"w": "utilitarian", "pos": "adj.", "ja": "実用本位の、功利的な", "syn": ["functional", "practical", "pragmatic"], "ant": ["decorative", "impractical"], "ex": "The office furniture was utilitarian, with no decoration at all.", "tip": "utility（有用性）から。見た目より役に立つことを重視。authoritarian（権威主義の）と語尾が同じ引っ掛け。", "q": {"choices": ["authoritarian", "ornamental", "egalitarian", "functional", "unitary"], "ans": "D"}}, {"w": "vacillate", "pos": "v.", "ja": "（意見・決心が）揺れ動く、迷う", "syn": ["waver", "fluctuate", "hesitate"], "ant": ["decide", "persist"], "ex": "She vacillated between studying art and studying medicine.", "tip": "vacillate between A and B（AとBの間で迷う）。vaccinate（予防接種する）と見た目が似ている。", "q": {"choices": ["vaccinate", "persevere", "waver", "ventilate", "validate"], "ans": "C"}}, {"w": "vague", "pos": "adj.", "ja": "漠然とした、曖昧な", "syn": ["ambiguous", "unclear", "indistinct"], "ant": ["clear", "precise"], "ex": "The directions were so vague that we got lost twice.", "tip": "ue は発音しない（ヴェイグ）。vogue（流行）と1文字違いの引っ掛けに注意。", "q": {"choices": ["ambiguous", "precise", "vogue", "vain", "explicit"], "ans": "A"}}, {"w": "valor", "pos": "n.", "ja": "（特に戦場での）勇気、武勇", "syn": ["courage", "bravery", "gallantry"], "ant": ["cowardice"], "ex": "The firefighter received a medal for valor after the rescue.", "tip": "valiant（勇敢な）と同語源。value（価値）や vapor（蒸気）と見た目が似ている。", "q": {"choices": ["value", "cowardice", "bravery", "vapor", "velocity"], "ans": "C"}}, {"w": "vapid", "pos": "adj.", "ja": "退屈な、気の抜けた、中身のない", "syn": ["insipid", "dull", "bland"], "ant": ["lively", "stimulating"], "ex": "The movie's vapid dialogue made the two hours feel endless.", "tip": "vapor（蒸気）と同語源で「気が抜けた」。rapid（速い）や valid（妥当な）と1文字違い。", "q": {"choices": ["rapid", "vivid", "valid", "stimulating", "insipid"], "ans": "E"}}, {"w": "venerate", "pos": "v.", "ja": "崇める、深く尊敬する", "syn": ["revere", "worship", "honor"], "ant": ["despise", "scorn"], "ex": "In many cultures, people venerate their ancestors.", "tip": "形容詞 venerable（尊敬すべき）。generate（生み出す）と語尾が同じなので注意。", "q": {"choices": ["generate", "revere", "ventilate", "scorn", "venture"], "ans": "B"}}, {"w": "verbose", "pos": "adj.", "ja": "冗長な、言葉数が多すぎる", "syn": ["wordy", "long-winded", "prolix"], "ant": ["concise", "succinct"], "ex": "The verbose report could have been half as long.", "tip": "verb-（言葉）＋-ose（多い）。verbal（言葉の・口頭の）は類義語ではない引っ掛け。", "q": {"choices": ["verbal", "concise", "morose", "wordy", "succinct"], "ans": "D"}}, {"w": "vex", "pos": "v.", "ja": "いらだたせる、悩ませる", "syn": ["irritate", "annoy", "exasperate"], "ant": ["soothe", "please"], "ex": "The constant noise from the construction site vexed the neighbors.", "tip": "a vexing problem（厄介な問題）、vexation（いらだち）。短い語なので vow や wax との見間違いに注意。", "q": {"choices": ["soothe", "irritate", "vow", "wax", "flex"], "ans": "B"}}, {"w": "viable", "pos": "adj.", "ja": "実行可能な、存続できる", "syn": ["feasible", "workable", "practicable"], "ant": ["impractical", "unworkable"], "ex": "Solar power has become a viable alternative to fossil fuels.", "tip": "vi-（命）から「生き延びられる」→「実現可能な」。visible（見える）や liable（責任がある）と混同注意。", "q": {"choices": ["visible", "liable", "impractical", "variable", "feasible"], "ans": "E"}}, {"w": "vigilant", "pos": "adj.", "ja": "用心深い、油断のない", "syn": ["watchful", "alert", "attentive"], "ant": ["careless", "negligent"], "ex": "Lifeguards must remain vigilant while swimmers are in the water.", "tip": "vigil（徹夜の見張り）から。vigorous（精力的な）と頭が同じ引っ掛けに注意。", "q": {"choices": ["watchful", "negligent", "vigorous", "violent", "elegant"], "ans": "A"}}, {"w": "vilify", "pos": "v.", "ja": "中傷する、けなす", "syn": ["malign", "defame", "disparage"], "ant": ["praise", "glorify"], "ex": "The politician was vilified in the press for a decision that later proved wise.", "tip": "vile（卑しい）＋-ify（～にする）で「悪者扱いする」。verify（確かめる）と見間違えない。", "q": {"choices": ["verify", "glorify", "vivify", "malign", "clarify"], "ans": "D"}}, {"w": "vindicate", "pos": "v.", "ja": "（嫌疑を）晴らす、正しさを証明する", "syn": ["exonerate", "justify", "clear"], "ant": ["accuse", "incriminate"], "ex": "New DNA evidence vindicated the man who had been wrongly convicted.", "tip": "vindictive（復讐心のある）と語根が同じだが意味は別。indicate（示す）とも混同しない。", "q": {"choices": ["indicate", "incriminate", "exonerate", "dedicate", "vacate"], "ans": "C"}}, {"w": "virtuoso", "pos": "n.", "ja": "（特に音楽の）名人、名手", "syn": ["maestro", "master", "expert"], "ant": ["novice", "amateur"], "ex": "The young violin virtuoso performed with the city orchestra at age twelve.", "tip": "イタリア語由来。日本語でも「ヴィルトゥオーゾ」。virtue（美徳）とは意味が異なる。", "q": {"choices": ["maestro", "novice", "virtue", "volunteer", "villain"], "ans": "A"}}, {"w": "vivacious", "pos": "adj.", "ja": "快活な、生き生きとした", "syn": ["lively", "spirited", "animated"], "ant": ["listless", "lethargic"], "ex": "Her vivacious personality made her the center of every party.", "tip": "viv-（生きる）は vivid と同じ。voracious（貪欲な）や vicious（悪意のある）との混同が頻出の引っ掛け。", "q": {"choices": ["voracious", "listless", "spirited", "vicious", "gracious"], "ans": "C"}}, {"w": "volatile", "pos": "adj.", "ja": "変わりやすい、不安定な；揮発性の", "syn": ["unstable", "erratic", "explosive"], "ant": ["stable", "steady"], "ex": "The stock market was volatile, rising and falling sharply each day.", "tip": "vol-（飛ぶ）から「すぐ飛び散る」。voluble（口達者な）や versatile（多才な）と混同注意。", "q": {"choices": ["voluble", "stable", "versatile", "valuable", "unstable"], "ans": "E"}}, {"w": "voracious", "pos": "adj.", "ja": "貪欲な、食欲旺盛な", "syn": ["ravenous", "insatiable", "greedy"], "ant": ["satiated"], "ex": "A voracious reader, Emma finished three novels a week.", "tip": "vor-（むさぼる）は carnivore（肉食動物）と同じ。veracious（正直な）や vivacious（快活な）は引っ掛け。", "q": {"choices": ["veracious", "insatiable", "vivacious", "satiated", "spacious"], "ans": "B"}}, {"w": "wane", "pos": "v.", "ja": "衰える、弱まる；（月が）欠ける", "syn": ["decline", "diminish", "ebb"], "ant": ["wax", "increase"], "ex": "Interest in the fad began to wane after a few months.", "tip": "wax and wane（月が満ち欠けする／盛衰する）のセットで覚える。wax は反意語。", "q": {"choices": ["wax", "want", "wade", "diminish", "flourish"], "ans": "D"}}, {"w": "wary", "pos": "adj.", "ja": "用心深い、警戒している", "syn": ["cautious", "guarded", "leery"], "ant": ["reckless", "trusting"], "ex": "Be wary of emails that ask for your password.", "tip": "be wary of ～（～に用心する）。weary（疲れた）と1文字違いの引っ掛けが頻出。", "q": {"choices": ["weary", "cautious", "reckless", "wavy", "varied"], "ans": "B"}}, {"w": "whimsical", "pos": "adj.", "ja": "気まぐれな、奇抜で遊び心のある", "syn": ["fanciful", "capricious", "playful"], "ant": ["serious", "sober"], "ex": "The children's book was full of whimsical drawings of talking teapots.", "tip": "whim（気まぐれ・思いつき）の形容詞。wistful（物思いに沈んだ）とは別の意味。", "q": {"choices": ["whispering", "sober", "musical", "wistful", "fanciful"], "ans": "E"}}, {"w": "wily", "pos": "adj.", "ja": "ずる賢い、狡猾な", "syn": ["crafty", "cunning", "sly"], "ant": ["naive", "artless"], "ex": "The wily fox found a way into the henhouse despite the new fence.", "tip": "wile（策略）の形容詞。wiry（針金のように引き締まった）と1文字違い。", "q": {"choices": ["crafty", "naive", "wiry", "willing", "wobbly"], "ans": "A"}}, {"w": "zealous", "pos": "adj.", "ja": "熱心な、熱狂的な", "syn": ["fervent", "ardent", "passionate"], "ant": ["apathetic", "indifferent"], "ex": "The zealous volunteers worked through the night to fill sandbags.", "tip": "名詞 zeal（熱意）、zealot（狂信者）。jealous（嫉妬深い）と同語源だが意味は異なる引っ掛け。", "q": {"choices": ["jealous", "apathetic", "zany", "fervent", "cautious"], "ans": "D"}}, {"w": "zenith", "pos": "n.", "ja": "頂点、絶頂；天頂", "syn": ["peak", "pinnacle", "apex"], "ant": ["nadir"], "ex": "At the zenith of her career, she performed in over fifty countries.", "tip": "反意語 nadir（どん底）とセットで覚える。アナロジー問題でも zenith : nadir が頻出。", "q": {"choices": ["nadir", "zero", "pinnacle", "zephyr", "zigzag"], "ans": "C"}}], "analogy": {"types": [{"id": "synonym", "name": "Synonym", "ja": "類義語", "bridge": "AとBはほぼ同じ意味である", "example": "happy : glad"}, {"id": "antonym", "name": "Antonym", "ja": "反意語", "bridge": "AとBは反対の意味である", "example": "generous : stingy"}, {"id": "part_whole", "name": "Part to Whole", "ja": "部分と全体", "bridge": "AはBの一部である", "example": "petal : flower"}, {"id": "type_category", "name": "Type to Category", "ja": "種類とカテゴリー", "bridge": "AはBの一種である", "example": "oak : tree"}, {"id": "tool_user", "name": "Tool to User", "ja": "道具と使用者", "bridge": "AはBが使う道具である", "example": "scalpel : surgeon"}, {"id": "tool_action", "name": "Tool to Action", "ja": "道具と動作", "bridge": "AはBするために使う道具である", "example": "scissors : cut"}, {"id": "degree", "name": "Degree / Intensity", "ja": "程度の差", "bridge": "BはAの程度をさらに強めたものである", "example": "annoyed : furious"}, {"id": "cause_effect", "name": "Cause and Effect", "ja": "原因と結果", "bridge": "AはBを引き起こす（Aの結果Bが生じる）", "example": "virus : illness"}, {"id": "characteristic", "name": "Characteristic", "ja": "特徴・性質", "bridge": "Aの典型的な特徴（性質）はBである", "example": "sugar : sweet"}, {"id": "lack", "name": "Lack", "ja": "欠如", "bridge": "A（の人・もの）にはBが欠けている", "example": "coward : courage"}, {"id": "worker_product", "name": "Worker to Product", "ja": "作り手と作品", "bridge": "AはBを作る（生み出す）人・生き物である", "example": "poet : poem"}, {"id": "function", "name": "Function / Purpose", "ja": "機能・目的", "bridge": "Aの役割（目的）はBすることである", "example": "heart : pump"}], "questions": [{"type": "synonym", "prompt": "Big is to large as", "choices": ["happy : sad", "quick : fast", "run : walk", "kitten : cat", "bright : dark"], "ans": "B", "expl": "ブリッジ文：「big」と「large」はどちらも「大きい」で同じ意味。quick と fast も「速い」で同義語。A・Eは反意語、Cは別の動作（走る・歩く）、Dは「子ども：大人」の関係なので不正解。"}, {"type": "synonym", "prompt": "Begin is to start as end is to", "choices": ["finish", "open", "commence", "continue", "early"], "ans": "A", "expl": "ブリッジ文：begin と start は同じ「始める」。end と同じ意味は finish（終える）。引っ掛け：commence は「始める」で begin の類義語なので、end とは反対。open も「開始」寄りで逆。"}, {"type": "synonym", "prompt": "Brave is to courageous as", "choices": ["timid : bold", "angry : calm", "wealthy : rich", "hungry : starving", "smart : foolish"], "ans": "C", "expl": "ブリッジ文：brave と courageous はどちらも「勇敢な」で同義。wealthy と rich も「裕福な」で同義。引っ掛け：D hungry : starving は「空腹 → 飢えている」という程度の差の関係。A・B・Eは反意語。"}, {"type": "synonym", "prompt": "Error is to mistake as fortune is to", "choices": ["misfortune", "gamble", "poverty", "luck", "future"], "ans": "D", "expl": "ブリッジ文：error と mistake は「誤り」で同義。fortune（幸運・運）と同義なのは luck。misfortune は反意語。fortune には「財産」の意味もあるが、poverty（貧困）はその反対。future は fortune-teller（占い師）からの連想の引っ掛け。"}, {"type": "synonym", "prompt": "Reluctant is to unwilling as", "choices": ["eager : hesitant", "generous : greedy", "lazy : exhausted", "curious : bored", "frugal : thrifty"], "ans": "E", "expl": "ブリッジ文：reluctant（気が進まない）と unwilling（したくない）は同義。frugal と thrifty はどちらも「倹約的な」で同義。A・B・Dは反意語。C lazy（怠惰な）と exhausted（疲れ切った）は意味が異なる。"}, {"type": "synonym", "prompt": "Candid is to frank as obscure is to", "choices": ["famous", "honest", "vague", "clear", "brief"], "ans": "C", "expl": "ブリッジ文：candid と frank はどちらも「率直な」。obscure（不明瞭な、はっきりしない）の同義語は vague（あいまいな）。引っ掛け：obscure には「無名の」の意味もあり、famous はその反対。clear も反意語。honest は candid からの連想。"}, {"type": "synonym", "prompt": "Diligent is to industrious as", "choices": ["meticulous : careless", "ambiguous : unclear", "fragile : sturdy", "arrogant : humble", "prudent : reckless"], "ans": "B", "expl": "ブリッジ文：diligent と industrious はどちらも「勤勉な」。ambiguous（あいまいな）と unclear（不明確な）も同義。他はすべて反意語のペア（meticulous 几帳面な⇔careless、fragile 壊れやすい⇔sturdy 頑丈な、arrogant 傲慢な⇔humble 謙虚な、prudent 慎重な⇔reckless 無謀な）。"}, {"type": "synonym", "prompt": "Benevolent is to kind as tenacious is to", "choices": ["fickle", "gentle", "cruel", "tense", "persistent"], "ans": "E", "expl": "ブリッジ文：benevolent（慈悲深い）は kind と同義。tenacious（粘り強い、執拗な）の同義語は persistent。引っ掛け：tense（緊張した）は綴りが似ているだけ。fickle（気まぐれな）は反意語。gentle・cruel は benevolent からの連想。"}, {"type": "synonym", "prompt": "Placate is to appease as", "choices": ["provoke : soothe", "praise : criticize", "hasten : delay", "exacerbate : worsen", "scrutinize : ignore"], "ans": "D", "expl": "ブリッジ文：placate と appease はどちらも「なだめる」。exacerbate と worsen はどちらも「悪化させる」で同義。他は反意語（provoke 挑発する⇔soothe なだめる、hasten 急がせる⇔delay、scrutinize 精査する⇔ignore）。"}, {"type": "synonym", "prompt": "Ephemeral is to fleeting as ubiquitous is to", "choices": ["rare", "omnipresent", "mysterious", "eternal", "unique"], "ans": "B", "expl": "ブリッジ文：ephemeral と fleeting はどちらも「はかない、つかの間の」。ubiquitous（至る所にある）の同義語は omnipresent。rare・unique は反対方向。引っ掛け：eternal（永遠の）は ephemeral の反意語なので連想で選ばないこと。"}, {"type": "antonym", "prompt": "Hot is to cold as", "choices": ["wet : dry", "warm : hot", "rain : cloud", "sun : bright", "ice : water"], "ans": "A", "expl": "ブリッジ文：hot と cold は反対の意味。wet（ぬれた）と dry（乾いた）も反意語。引っ掛け：B warm : hot は温度の「程度の差」。Dは「太陽の特徴」、Eは状態変化の関係。"}, {"type": "antonym", "prompt": "Ancient is to modern as shallow is to", "choices": ["narrow", "thin", "deep", "low", "puddle"], "ans": "C", "expl": "ブリッジ文：ancient（古代の）と modern（現代の）は反対。shallow（浅い）の反対は deep（深い）。narrow・thin は「浅い」と同じく“小さい”方向の語で反意語ではない。puddle（水たまり）は浅いものの例。"}, {"type": "antonym", "prompt": "Generous is to stingy as", "choices": ["kind : nice", "humble : arrogant", "angry : furious", "honest : truthful", "rich : wealthy"], "ans": "B", "expl": "ブリッジ文：generous（気前のよい）と stingy（けちな）は反意語。humble（謙虚な）と arrogant（傲慢な）も反意語。A・D・Eは類義語、Cは程度の差（怒っている→激怒している）。"}, {"type": "antonym", "prompt": "Praise is to criticize as accept is to", "choices": ["receive", "except", "admit", "welcome", "reject"], "ans": "E", "expl": "ブリッジ文：praise（ほめる）と criticize（批判する）は反対。accept（受け入れる）の反対は reject（拒絶する）。引っ掛け：except は発音が似ているだけ。receive・admit・welcome は accept の類義語。"}, {"type": "antonym", "prompt": "Scarce is to abundant as", "choices": ["rare : uncommon", "timid : shy", "noisy : deafening", "vivid : dull", "sturdy : strong"], "ans": "D", "expl": "ブリッジ文：scarce（乏しい）と abundant（豊富な）は反意語。vivid（鮮やかな）と dull（くすんだ）も反意語。A・B・Eは類義語。C noisy → deafening（耳をつんざく）は程度の差。"}, {"type": "antonym", "prompt": "Expand is to contract as ascend is to", "choices": ["descend", "climb", "rise", "extend", "soar"], "ans": "A", "expl": "ブリッジ文：expand（膨張する）と contract（収縮する）は反対。ascend（上る）の反対は descend（下る）。climb・rise・soar は ascend の類義語、extend は expand の類義語という引っ掛け。"}, {"type": "antonym", "prompt": "Novice is to expert as", "choices": ["amateur : beginner", "coach : athlete", "student : pupil", "apprentice : trainee", "rookie : veteran"], "ans": "E", "expl": "ブリッジ文：novice（初心者）は expert（熟練者）の反対。rookie（新人）と veteran（ベテラン）も反対。A・C・Dは類義語のペア。B coach : athlete は「指導者と選手」の関係で反意語ではない。"}, {"type": "antonym", "prompt": "Candid is to deceptive as frugal is to", "choices": ["thrifty", "poor", "extravagant", "careful", "wealthy"], "ans": "C", "expl": "ブリッジ文：candid（率直な）と deceptive（人を欺く）は反対。frugal（倹約的な）の反対は extravagant（浪費的な）。thrifty は類義語。引っ掛け：poor・wealthy はお金の「量」の話で、frugal は「お金の使い方」の性質なので反意語にならない。"}, {"type": "antonym", "prompt": "Conceal is to reveal as", "choices": ["hide : disguise", "augment : diminish", "confirm : verify", "hinder : obstruct", "mimic : imitate"], "ans": "B", "expl": "ブリッジ文：conceal（隠す）と reveal（明らかにする）は反意語。augment（増やす）と diminish（減らす）も反意語。他はすべて類義語のペア（hinder・obstruct＝妨げる、mimic・imitate＝まねる など）。"}, {"type": "antonym", "prompt": "Verbose is to concise as lethargic is to", "choices": ["sluggish", "drowsy", "apathetic", "energetic", "lazy"], "ans": "D", "expl": "ブリッジ文：verbose（冗長な）と concise（簡潔な）は反対。lethargic（無気力な、だるい）の反対は energetic（活発な）。sluggish・drowsy・lazy・apathetic はいずれも lethargic に近い意味の引っ掛け。"}, {"type": "part_whole", "prompt": "Page is to book as", "choices": ["pen : paper", "key : piano", "reader : novel", "cover : color", "word : speak"], "ans": "B", "expl": "ブリッジ文：page（ページ）は book の一部。key（鍵盤）は piano の一部。A pen と paper は一緒に使う道具同士、C reader は読む人、Eは「単語を話す」という動作の関係。"}, {"type": "part_whole", "prompt": "Finger is to hand as toe is to", "choices": ["foot", "shoe", "leg", "nail", "sock"], "ans": "A", "expl": "ブリッジ文：finger は hand の一部、toe（足の指）は foot の一部。shoe・sock は身に着けるもの。引っ掛け：nail（爪）は toe の一部で関係が逆。leg は foot より上の部位で、hand に対応するのは foot。"}, {"type": "part_whole", "prompt": "Wheel is to bicycle as", "choices": ["driver : car", "road : truck", "wing : airplane", "sail : wind", "fuel : engine"], "ans": "C", "expl": "ブリッジ文：wheel（車輪）は bicycle の部品。wing（翼）は airplane の部品。A driver は乗り物を使う人（部品ではない）、B road は走る場所、D sail は風を受けるもの、E fuel は engine を動かすもの（機能の関係）。"}, {"type": "part_whole", "prompt": "Branch is to tree as tributary is to", "choices": ["ocean", "lake", "stream", "river", "bank"], "ans": "D", "expl": "ブリッジ文：branch（枝）は tree の一部、tributary（支流）は river の一部。stream は「小川」で tributary とほぼ同類の語。bank は川岸。ocean・lake は川の水が流れ込む先。"}, {"type": "part_whole", "prompt": "Stanza is to poem as", "choices": ["poet : verse", "rhyme : song", "author : novel", "actor : stage", "act : play"], "ans": "E", "expl": "ブリッジ文：stanza（詩の連）は poem の一部。act（幕）は play（劇）の一部。A・Cは「作り手と作品」の引っ掛け。D actor は舞台で演じる人。B rhyme（韻）は歌の技法であって区切られた一部分ではない。"}, {"type": "part_whole", "prompt": "Keyboard is to computer as lens is to", "choices": ["light", "camera", "photograph", "focus", "picture"], "ans": "B", "expl": "ブリッジ文：keyboard は computer の部品、lens は camera の部品。photograph・picture はカメラが生み出すもの、focus はレンズの働き、light はレンズを通るもの。"}, {"type": "part_whole", "prompt": "Chapter is to novel as", "choices": ["composer : sonata", "violin : bow", "lyric : singer", "movement : symphony", "rehearsal : concert"], "ans": "D", "expl": "ブリッジ文：chapter（章）は novel（小説）を構成する一部分。movement（楽章）は symphony（交響曲）を構成する一部分。A は作り手と作品、B は一緒に使う道具、C は歌詞と歌う人、E rehearsal は concert の前に行うもので一部ではない。"}, {"type": "part_whole", "prompt": "Rung is to ladder as spoke is to", "choices": ["speak", "hub", "wheel", "axle", "rim"], "ans": "C", "expl": "ブリッジ文：rung（はしごの横木）は ladder の一部、spoke（車輪の輻＝スポーク）は wheel の一部。hub・axle・rim も車輪に関係する「部品」であって全体ではない。speak は spoke（speak の過去形）からの引っ掛け。"}, {"type": "part_whole", "prompt": "Island is to archipelago as", "choices": ["star : constellation", "ocean : continent", "peninsula : coast", "volcano : lava", "mountain : valley"], "ans": "A", "expl": "ブリッジ文：island は archipelago（群島、列島）を構成する一つ。star は constellation（星座）を構成する一つ。B・Eは地形同士の別物、C peninsula（半島）は海岸の一部とは言えない、D volcano は lava を生む（原因と結果）。"}, {"type": "part_whole", "prompt": "Frond is to fern as keel is to", "choices": ["ocean", "anchor", "sail", "captain", "ship"], "ans": "E", "expl": "ブリッジ文：frond（シダなどの葉）は fern（シダ）の一部。keel（竜骨、船底の背骨）は ship の一部。sail も船の一部だが「全体」ではない。anchor は船が使う道具、captain は船長、ocean は船が進む場所。"}, {"type": "type_category", "prompt": "Robin is to bird as", "choices": ["nest : egg", "wing : feather", "salmon : fish", "cat : mouse", "farm : cow"], "ans": "C", "expl": "ブリッジ文：robin（コマドリ）は bird の一種。salmon（サケ）は fish の一種。A は「巣と卵」（入れ物と中身）、B は体の部分同士、D は捕食関係、E は飼われる場所。"}, {"type": "type_category", "prompt": "Rose is to flower as hammer is to", "choices": ["nail", "tool", "carpenter", "pound", "wood"], "ans": "B", "expl": "ブリッジ文：rose は flower の一種、hammer は tool（道具）の一種。引っ掛け：nail は打つ対象、carpenter は使用者（道具と使用者）、pound は動作（道具と動作）で、どれも別の関係。"}, {"type": "type_category", "prompt": "Soccer is to sport as", "choices": ["ball : goal", "coach : team", "song : sing", "player : game", "piano : instrument"], "ans": "E", "expl": "ブリッジ文：soccer は sport の一種。piano は instrument（楽器）の一種。A は用具とゴール、B は指導者と集団、C は「歌を歌う」という目的語と動作、D は参加者と試合の関係。"}, {"type": "type_category", "prompt": "Mercury is to planet as Pacific is to", "choices": ["ocean", "island", "water", "wave", "continent"], "ans": "A", "expl": "ブリッジ文：Mercury（水星）は planet（惑星）の一つ、Pacific（太平洋）は ocean の一つ。water は海を構成する物質で範囲が広すぎる、wave は海の現象、island・continent は別の地形。"}, {"type": "type_category", "prompt": "Sonnet is to poem as", "choices": ["novel : chapter", "painter : canvas", "stanza : verse", "waltz : dance", "rhyme : word"], "ans": "D", "expl": "ブリッジ文：sonnet（十四行詩）は poem の一種。waltz（ワルツ）は dance の一種。引っ掛け：A novel : chapter は「全体と部分」（しかも逆順）。B は使用者と道具、C・E は詩の構成要素の関係。"}, {"type": "type_category", "prompt": "Cobra is to snake as granite is to", "choices": ["marble", "mountain", "rock", "hard", "quarry"], "ans": "C", "expl": "ブリッジ文：cobra は snake の一種、granite（花崗岩）は rock の一種。marble（大理石）も岩石の一種だが、カテゴリーではなく同列の「別の種類」なので不可。hard は特徴、quarry（採石場）は採れる場所。"}, {"type": "type_category", "prompt": "Influenza is to disease as", "choices": ["doctor : hospital", "democracy : government", "vaccine : virus", "germ : infection", "patient : cure"], "ans": "B", "expl": "ブリッジ文：influenza（インフルエンザ）は disease の一種。democracy（民主制）は government（政治体制）の一種。引っ掛け：D germ : infection は「原因と結果」。C vaccine は virus に対抗するもの、A は働く場所。"}, {"type": "type_category", "prompt": "Satire is to humor as epic is to", "choices": ["hero", "ballad", "length", "Homer", "poetry"], "ans": "E", "expl": "ブリッジ文：satire（風刺）は humor の一種、epic（叙事詩）は poetry の一種。ballad（バラッド）も詩の一種で、epic と同列の「別の種類」なので不可。hero は登場人物、Homer は作者、length は特徴。"}, {"type": "type_category", "prompt": "Mahogany is to wood as", "choices": ["cotton : fabric", "oak : acorn", "silk : worm", "lumber : sawmill", "leather : shoe"], "ans": "A", "expl": "ブリッジ文：mahogany（マホガニー）は wood（木材）の一種。cotton（綿）は fabric（布地）の一種。B は木と実、C は製品とそれを作る生き物、D は製品と作る場所、E は素材と製品の関係。"}, {"type": "type_category", "prompt": "Oligarchy is to government as sonata is to", "choices": ["pianist", "movement", "symphony", "composition", "melody"], "ans": "D", "expl": "ブリッジ文：oligarchy（寡頭政治）は government の一形態、sonata（ソナタ）は composition（楽曲・作品）の一種。引っ掛け：movement（楽章）はソナタの部分、symphony は同列の別の種類、pianist は演奏者、melody は構成要素。"}, {"type": "tool_user", "prompt": "Brush is to painter as", "choices": ["paint : wall", "needle : tailor", "canvas : frame", "baker : bread", "shoe : foot"], "ans": "B", "expl": "ブリッジ文：brush は painter が使う道具。needle（針）は tailor（仕立屋）が使う道具。D baker : bread は「作り手と作品」の引っ掛け。A は塗るものと塗る対象、E は身に着けるものと体の部位。"}, {"type": "tool_user", "prompt": "Stethoscope is to doctor as wrench is to", "choices": ["bolt", "pipe", "tighten", "plumber", "toolbox"], "ans": "D", "expl": "ブリッジ文：stethoscope（聴診器）は doctor が使う道具。wrench（レンチ）は plumber（配管工）が使う道具。tighten は動作（道具と動作の関係）、bolt・pipe は対象物、toolbox は収納場所。"}, {"type": "tool_user", "prompt": "Baton is to conductor as", "choices": ["gavel : judge", "orchestra : music", "stage : actor", "whistle : blow", "court : lawyer"], "ans": "A", "expl": "ブリッジ文：baton（指揮棒）は conductor（指揮者）が使う道具。gavel（小槌）は judge（裁判官）が使う道具。C・E は「働く場所と人」の引っ掛け。D は道具と動作、B は集団と生み出すもの。"}, {"type": "tool_user", "prompt": "Chisel is to sculptor as loom is to", "choices": ["thread", "fabric", "weaver", "knit", "tailor"], "ans": "C", "expl": "ブリッジ文：chisel（のみ）は sculptor（彫刻家）が使う道具。loom（織機）は weaver（織工）が使う道具。thread は材料、fabric は製品。引っ掛け：tailor は布を扱うが、使う道具は針やはさみで織機ではない。"}, {"type": "tool_user", "prompt": "Trowel is to mason as", "choices": ["ladder : roof", "hammer : nail", "brick : wall", "saw : cut", "easel : painter"], "ans": "E", "expl": "ブリッジ文：trowel（こて）は mason（石工、れんが職人）が使う道具。easel（イーゼル）は painter が使う道具。B hammer : nail は道具と対象、D saw : cut は「道具と動作」の引っ掛け。C は材料と完成物。"}, {"type": "tool_user", "prompt": "Telescope is to astronomer as microscope is to", "choices": ["lens", "biologist", "cell", "magnify", "laboratory"], "ans": "B", "expl": "ブリッジ文：telescope は astronomer（天文学者）が使う道具。microscope は biologist（生物学者）が使う道具。lens は部品、cell は観察対象、magnify は機能、laboratory は使う場所。"}, {"type": "tool_user", "prompt": "Palette is to artist as", "choices": ["pencil : eraser", "stethoscope : heartbeat", "script : play", "ledger : accountant", "menu : restaurant"], "ans": "D", "expl": "ブリッジ文：palette（パレット）は artist が使う道具。ledger（元帳、帳簿）は accountant（会計士）が使う道具。B は道具とそれで聞く対象、A は一緒に使う道具同士、C・E は場所や作品に属するもの。"}, {"type": "tool_user", "prompt": "Plow is to farmer as anvil is to", "choices": ["iron", "hammer", "forge", "horseshoe", "blacksmith"], "ans": "E", "expl": "ブリッジ文：plow（すき）は farmer が使う道具。anvil（金床）は blacksmith（鍛冶屋）が使う道具。hammer は一緒に使う別の道具、forge は鍛冶場（炉）、iron は材料、horseshoe は作品。"}, {"type": "tool_user", "prompt": "Scythe is to reaper as", "choices": ["harvest : grain", "barn : hay", "awl : cobbler", "tractor : field", "sickle : cut"], "ans": "C", "expl": "ブリッジ文：scythe（大鎌）は reaper（刈り取る人）が使う道具。awl（突き錐）は cobbler（靴職人）が使う道具。E sickle : cut は「道具と動作」の典型的な引っ掛け。B は保管場所、D は使う場所。"}, {"type": "tool_user", "prompt": "Theodolite is to surveyor as sextant is to", "choices": ["navigator", "angle", "star", "compass", "ship"], "ans": "A", "expl": "ブリッジ文：theodolite（経緯儀）は surveyor（測量士）が使う道具。sextant（六分儀）は navigator（航海士）が使う道具。angle は測るもの、star は観測対象、compass は別の航海道具、ship は使う場所。"}, {"type": "tool_action", "prompt": "Knife is to slice as", "choices": ["fork : plate", "spoon : soup", "broom : sweep", "chef : cook", "table : eat"], "ans": "C", "expl": "ブリッジ文：knife は slice（薄く切る）するための道具。broom（ほうき）は sweep（掃く）ための道具。D chef : cook は「人と動作」で道具ではない。A・B は道具と一緒に使う物、E table は食事をする場所。"}, {"type": "tool_action", "prompt": "Pen is to write as shovel is to", "choices": ["dirt", "dig", "garden", "gardener", "hole"], "ans": "B", "expl": "ブリッジ文：pen は write するための道具。shovel は dig（掘る）ための道具。dirt は対象、hole は結果、gardener は使用者（道具と使用者の引っ掛け）、garden は使う場所。"}, {"type": "tool_action", "prompt": "Needle is to sew as", "choices": ["ruler : measure", "thread : spool", "tailor : cloth", "button : shirt", "sharp : point"], "ans": "A", "expl": "ブリッジ文：needle は sew（縫う）ための道具。ruler は measure（測る）ための道具。B は糸と糸巻き、C は人と材料、D は部分と全体、E は特徴の関係。"}, {"type": "tool_action", "prompt": "Saw is to cut as drill is to", "choices": ["wood", "carpenter", "screw", "noise", "bore"], "ans": "E", "expl": "ブリッジ文：saw は cut するための道具、drill は bore（穴をあける）ための道具。bore には「退屈させる」の意味もあるが、ここでは「穴をあける」。wood は対象、carpenter は使用者、screw は一緒に使う部品。"}, {"type": "tool_action", "prompt": "Sieve is to strain as", "choices": ["bowl : soup", "oven : bread", "cook : kitchen", "whisk : beat", "flour : bake"], "ans": "D", "expl": "ブリッジ文：sieve（ふるい、こし器）は strain（こす）ための道具。whisk（泡立て器）は beat（かき混ぜる、泡立てる）ための道具。A は器と中身、B は道具と作られる物、C は人と場所、E は材料と調理法。"}, {"type": "tool_action", "prompt": "Thermometer is to measure as magnet is to", "choices": ["metal", "north", "attract", "iron", "compass"], "ans": "C", "expl": "ブリッジ文：thermometer は（温度を）measure するための道具。magnet は（鉄を）attract（引き寄せる）もの。iron・metal は引き寄せられる対象、north は磁極、compass は磁石を使った別の道具。"}, {"type": "tool_action", "prompt": "Pestle is to grind as", "choices": ["mortar : bowl", "lever : pry", "pharmacist : medicine", "powder : crush", "grain : mill"], "ans": "B", "expl": "ブリッジ文：pestle（すりこぎ）は grind（すりつぶす）ための道具。lever（てこ）は pry（こじ開ける）ための道具。A mortar（すり鉢）は pestle と組で使う器、C は人と作る物、D・E は対象物と動作の関係で道具ではない。"}, {"type": "tool_action", "prompt": "Plane is to smooth as awl is to", "choices": ["leather", "cobbler", "sharpen", "pierce", "handle"], "ans": "D", "expl": "ブリッジ文：plane（かんな）は（木材を）smooth（なめらかにする）ための道具。awl（突き錐）は pierce（穴をあける、突き通す）ための道具。leather は対象、cobbler は使用者、handle は部分。sharpen は錐の「形状」からの連想の引っ掛け。"}, {"type": "tool_action", "prompt": "Rake is to gather as", "choices": ["leaf : fall", "gardener : yard", "seed : sow", "soil : enrich", "hoe : cultivate"], "ans": "E", "expl": "ブリッジ文：rake（熊手）は（落ち葉を）gather（集める）ための道具。hoe（くわ）は cultivate（耕す）ための道具。引っ掛け：C seed : sow は「種をまく」で、seed は動作の対象であって道具ではない。A は物とその動き、B は人と場所。"}, {"type": "tool_action", "prompt": "Lever is to pry as winch is to", "choices": ["hoist", "rope", "crane", "sailor", "pulley"], "ans": "A", "expl": "ブリッジ文：lever は pry（こじ開ける）ための道具。winch（巻き上げ機）は hoist（重い物を巻き上げる、持ち上げる）ための道具。rope は部品、crane・pulley は似た別の機械、sailor は使用者。"}, {"type": "degree", "prompt": "Warm is to hot as", "choices": ["ice : water", "cool : cold", "summer : winter", "sun : heat", "wet : dry"], "ans": "B", "expl": "ブリッジ文：hot は warm の程度を強めたもの。cold は cool の程度を強めたもの。C・E は反意語、D は原因と結果、A は状態変化の関係。"}, {"type": "degree", "prompt": "Big is to huge as small is to", "choices": ["tiny", "large", "short", "little", "narrow"], "ans": "A", "expl": "ブリッジ文：huge（巨大な）は big を強めたもの。small を強めたものは tiny（ごく小さい）。引っ掛け：little は small とほぼ同程度の類義語で「強め」になっていない。large は反意語。"}, {"type": "degree", "prompt": "Drizzle is to downpour as", "choices": ["rain : cloud", "snow : cold", "thunder : lightning", "breeze : gale", "flood : river"], "ans": "D", "expl": "ブリッジ文：downpour（土砂降り）は drizzle（霧雨）を強めたもの。gale（強風）は breeze（そよ風）を強めたもの。A は雨とそれを生む雲、B は雪の特徴、C は一緒に起こる現象、E は川があふれた結果。"}, {"type": "degree", "prompt": "Like is to adore as dislike is to", "choices": ["enjoy", "ignore", "loathe", "prefer", "disagree"], "ans": "C", "expl": "ブリッジ文：adore（大好きだ）は like を強めたもの。dislike を強めたものは loathe（ひどく嫌う）。enjoy・prefer は好意側、ignore は無関心、disagree は「意見が合わない」で感情の強さではない。"}, {"type": "degree", "prompt": "Annoyed is to furious as", "choices": ["sad : happy", "calm : peaceful", "angry : mad", "bored : interested", "content : ecstatic"], "ans": "E", "expl": "ブリッジ文：furious（激怒した）は annoyed（いらいらした）を強めたもの。ecstatic（有頂天の）は content（満足した）を強めたもの。B・C は同程度の類義語、A・D は反意語。"}, {"type": "degree", "prompt": "Nibble is to devour as sip is to", "choices": ["taste", "gulp", "drink", "chew", "spill"], "ans": "B", "expl": "ブリッジ文：devour（むさぼり食う）は nibble（少しずつかじる）を強めたもの。gulp（ごくごく飲む）は sip（ちびちび飲む）を強めたもの。drink は中立的な語で「強め」ではない。taste はむしろ弱い方向、chew は食べる動作。"}, {"type": "degree", "prompt": "Damp is to saturated as", "choices": ["chilly : frigid", "wet : dry", "humid : rain", "soaked : drenched", "fog : mist"], "ans": "A", "expl": "ブリッジ文：saturated（びしょぬれの、飽和した）は damp（湿った）を強めたもの。frigid（極寒の）は chilly（肌寒い）を強めたもの。引っ掛け：D soaked と drenched はどちらも「ずぶぬれ」で同程度。B は反意語、E はほぼ同類の現象。"}, {"type": "degree", "prompt": "Pleased is to elated as frightened is to", "choices": ["nervous", "brave", "startled", "calm", "terrified"], "ans": "E", "expl": "ブリッジ文：elated（大喜びの）は pleased を強めたもの。terrified（恐怖におののく）は frightened を強めたもの。nervous・startled は frightened より弱い。brave・calm は反対方向。"}, {"type": "degree", "prompt": "Glance is to scrutinize as", "choices": ["whisper : murmur", "stare : peek", "jog : sprint", "speak : talk", "see : blind"], "ans": "C", "expl": "ブリッジ文：scrutinize（じっくり精査する）は glance（ちらっと見る）の程度を強めたもの。sprint（全力疾走する）は jog（ゆっくり走る）を強めたもの。A・D は同程度の類義語。引っ掛け：B stare（じっと見る）: peek（ちらっとのぞく）は強→弱で順序が逆。E は欠如の関係。"}, {"type": "degree", "prompt": "Frugal is to miserly as confident is to", "choices": ["shy", "humble", "certain", "arrogant", "timid"], "ans": "D", "expl": "ブリッジ文：miserly（けちな）は frugal（倹約的な）が度を越したもの。arrogant（傲慢な）は confident（自信のある）が度を越したもの。certain は同程度の類義語。shy・humble・timid は反対方向。"}, {"type": "cause_effect", "prompt": "Fire is to smoke as", "choices": ["cold : winter", "tree : leaf", "cloud : sky", "rain : flood", "wind : air"], "ans": "D", "expl": "ブリッジ文：fire は smoke を引き起こす。rain（大雨）は flood（洪水）を引き起こす。引っ掛け：A は「冬の特徴が寒さ」で順序も逆。B は全体と部分、C は存在する場所、E は風が空気の動きであるという関係。"}, {"type": "cause_effect", "prompt": "Exercise is to fitness as study is to", "choices": ["school", "knowledge", "book", "teacher", "homework"], "ans": "B", "expl": "ブリッジ文：exercise の結果 fitness（健康、体力）が得られる。study の結果 knowledge が得られる。school は場所、book は道具、teacher は人、homework は勉強の一種。"}, {"type": "cause_effect", "prompt": "Joke is to laughter as", "choices": ["clown : circus", "story : book", "smile : face", "comedian : stage", "insult : anger"], "ans": "E", "expl": "ブリッジ文：joke は laughter を引き起こす。insult（侮辱）は anger を引き起こす。A・D は「人と働く場所」、B は内容と入れ物、C は表情と体の部位。"}, {"type": "cause_effect", "prompt": "Drought is to famine as earthquake is to", "choices": ["rain", "seismograph", "tsunami", "fault", "crop"], "ans": "C", "expl": "ブリッジ文：drought（干ばつ）は famine（飢饉）を引き起こす。earthquake は tsunami を引き起こす。引っ掛け：fault（断層）は地震の「原因」側で順序が逆。seismograph（地震計）は地震を測る道具。"}, {"type": "cause_effect", "prompt": "Germ is to infection as", "choices": ["spark : explosion", "medicine : pharmacy", "doctor : patient", "symptom : disease", "bandage : wound"], "ans": "A", "expl": "ブリッジ文：germ（病原菌）は infection（感染）を引き起こす。spark（火花）は explosion を引き起こす。引っ掛け：D symptom（症状）は disease の結果なので順序が逆。B は売られる場所、E は傷を覆うもの（機能）。"}, {"type": "cause_effect", "prompt": "Neglect is to decay as nourishment is to", "choices": ["food", "hunger", "meal", "growth", "starvation"], "ans": "D", "expl": "ブリッジ文：neglect（放置）は decay（腐朽、荒廃）を引き起こす。nourishment（栄養）は growth（成長）をもたらす。food・meal は nourishment の類義語に近い。hunger・starvation は栄養不足の結果。"}, {"type": "cause_effect", "prompt": "Erosion is to canyon as", "choices": ["river : ocean", "friction : heat", "canyon : river", "wind : kite", "geologist : rock"], "ans": "B", "expl": "ブリッジ文：erosion（浸食）が canyon（峡谷）を生み出す。friction（摩擦）が heat を生み出す。A は流れ込む先、C は場所の関係（しかも原因と結果なら逆）、D は風が凧を揚げるという機能寄りの関係、E は研究者と対象。"}, {"type": "cause_effect", "prompt": "Overwork is to exhaustion as overeating is to", "choices": ["appetite", "hunger", "diet", "restaurant", "indigestion"], "ans": "E", "expl": "ブリッジ文：overwork（働きすぎ）は exhaustion（疲労困憊）を引き起こす。overeating（食べすぎ）は indigestion（消化不良）を引き起こす。appetite・hunger は食べる前の状態（原因側）、diet は対策、restaurant は場所。"}, {"type": "cause_effect", "prompt": "Provocation is to retaliation as", "choices": ["question : interrogation", "revenge : vengeance", "apology : forgiveness", "punishment : crime", "victory : defeat"], "ans": "C", "expl": "ブリッジ文：provocation（挑発）は retaliation（報復）を招く。apology（謝罪）は forgiveness（許し）を招く。A は程度の差、B は類義語、D は結果と原因で順序が逆、E は反意語。"}, {"type": "cause_effect", "prompt": "Deforestation is to erosion as pollution is to", "choices": ["illness", "factory", "chimney", "cleanup", "industry"], "ans": "A", "expl": "ブリッジ文：deforestation（森林伐採）は（土壌の）erosion（浸食）を引き起こす。pollution（汚染）は illness（病気）を引き起こす。factory・industry・chimney（煙突）は汚染の「原因」側・発生源で順序が逆、cleanup は対策。"}, {"type": "characteristic", "prompt": "Sugar is to sweet as", "choices": ["salt : pepper", "lemon : sour", "coffee : cup", "milk : cow", "bread : bake"], "ans": "B", "expl": "ブリッジ文：sugar の特徴は sweet（甘い）。lemon の特徴は sour（酸っぱい）。A は一緒に使う調味料、C は入れ物、D は生み出す動物、E は調理法。"}, {"type": "characteristic", "prompt": "Feather is to light as stone is to", "choices": ["heavy", "rock", "pebble", "throw", "soft"], "ans": "A", "expl": "ブリッジ文：feather の特徴は light（軽い）。stone の特徴は heavy（重い）。rock は類義語、pebble は小石（種類）、throw は動作。soft は石の特徴と逆。"}, {"type": "characteristic", "prompt": "Desert is to dry as", "choices": ["ocean : fish", "forest : tree", "island : boat", "glacier : cold", "river : bridge"], "ans": "D", "expl": "ブリッジ文：desert の特徴は dry（乾燥している）。glacier（氷河）の特徴は cold。A・B は場所とそこにあるもの（形容詞ではなく名詞）。C・E は場所と関連する物。"}, {"type": "characteristic", "prompt": "Giraffe is to tall as cheetah is to", "choices": ["Africa", "cat", "fast", "hunt", "savanna"], "ans": "C", "expl": "ブリッジ文：giraffe の際立った特徴は tall（背が高い）。cheetah の際立った特徴は fast（速い）。cat はカテゴリー（種類とカテゴリー）、Africa・savanna は生息地、hunt は行動。"}, {"type": "characteristic", "prompt": "Miser is to stingy as", "choices": ["coward : courage", "saint : sin", "thief : police", "liar : truth", "hero : brave"], "ans": "E", "expl": "ブリッジ文：miser（守銭奴）の特徴は stingy（けちな）。hero の特徴は brave（勇敢な）。引っ掛け：A coward : courage と D liar : truth は「欠如」の関係（臆病者には勇気が欠けている）。B も欠如寄り、C は対立する立場。"}, {"type": "characteristic", "prompt": "Sloth is to slow as owl is to", "choices": ["nocturnal", "bird", "feather", "tree", "fly"], "ans": "A", "expl": "ブリッジ文：sloth（ナマケモノ）の特徴は slow。owl（フクロウ）の特徴は nocturnal（夜行性の）。bird はカテゴリー、feather は体の一部、tree は止まる場所、fly は動作。"}, {"type": "characteristic", "prompt": "Diamond is to hard as", "choices": ["gold : jewelry", "ring : finger", "glass : brittle", "coal : mine", "silver : gold"], "ans": "C", "expl": "ブリッジ文：diamond の特徴は hard（硬い）。glass の特徴は brittle（もろい、割れやすい）。A は素材と製品、B は身に着ける部位、D は採れる場所、E は同類の金属。"}, {"type": "characteristic", "prompt": "Sage is to wise as zealot is to", "choices": ["indifferent", "prophet", "follower", "fanatical", "belief"], "ans": "D", "expl": "ブリッジ文：sage（賢者）の特徴は wise（賢い）。zealot（狂信者、熱狂者）の特徴は fanatical（熱狂的な）。indifferent（無関心な）は正反対。prophet・follower は関連する人物、belief は名詞で性質を表さない。"}, {"type": "characteristic", "prompt": "Lava is to molten as", "choices": ["volcano : erupt", "ice : frozen", "water : ocean", "steam : kettle", "magma : crust"], "ans": "B", "expl": "ブリッジ文：lava（溶岩）の特徴は molten（溶けた）。ice の特徴は frozen（凍った）。A は火山の動作（機能）、C は全体を構成する物質、D は発生する道具、E は存在場所の関係。"}, {"type": "characteristic", "prompt": "Martinet is to strict as sycophant is to", "choices": ["honest", "critical", "leader", "independent", "obsequious"], "ans": "E", "expl": "ブリッジ文：martinet（規律にうるさい人）の特徴は strict（厳格な）。sycophant（おべっか使い）の特徴は obsequious（こびへつらう）。honest・critical・independent はむしろ反対の性質。leader はおべっかを使われる側。"}, {"type": "lack", "prompt": "Bald is to hair as", "choices": ["tall : height", "barber : scissors", "toothless : teeth", "wig : head", "comb : brush"], "ans": "C", "expl": "ブリッジ文：bald（はげた）人には hair が欠けている。toothless な人には teeth が欠けている。引っ掛け：A tall は height を「たくさん持つ」で逆。B は使用者と道具、D はかぶる部位、E は似た道具同士。"}, {"type": "lack", "prompt": "Blind is to sight as deaf is to", "choices": ["hearing", "ear", "sound", "music", "loud"], "ans": "A", "expl": "ブリッジ文：blind な人には sight（視覚）が欠けている。deaf な人には hearing（聴覚）が欠けている。ear は器官（sight に対応するのは eye ではなく能力）、sound・music は聞く対象。"}, {"type": "lack", "prompt": "Empty is to contents as", "choices": ["full : container", "bright : sun", "wet : water", "cold : ice", "dark : light"], "ans": "E", "expl": "ブリッジ文：empty なものには contents（中身）がない。dark なところには light がない。引っ掛け：C wet は water を「持っている」状態で逆。B・D は原因（太陽が明るさを、氷が冷たさを生む）の関係、A は状態と入れ物。"}, {"type": "lack", "prompt": "Liar is to honesty as stranger is to", "choices": ["danger", "familiarity", "friend", "town", "kindness"], "ans": "B", "expl": "ブリッジ文：liar には honesty が欠けている。stranger（見知らぬ人）には familiarity（なじみ、面識）が欠けている。friend は stranger の反対の「人」だが、欠けている「性質」ではない。danger は連想の引っ掛け。"}, {"type": "lack", "prompt": "Anonymous is to name as", "choices": ["famous : fame", "author : book", "signature : letter", "shapeless : form", "secret : spy"], "ans": "D", "expl": "ブリッジ文：anonymous（匿名の）ものには name が欠けている。shapeless なものには form（形）が欠けている。引っ掛け：A famous は fame を「持つ」で逆。B は作り手と作品、C は部分と全体。"}, {"type": "lack", "prompt": "Novice is to experience as pauper is to", "choices": ["poverty", "beggar", "wealth", "coin", "charity"], "ans": "C", "expl": "ブリッジ文：novice（初心者）には experience が欠けている。pauper（貧困者）には wealth（富）が欠けている。引っ掛け：poverty は pauper が「持っている」状態。beggar は類義語、charity は受けるもの。"}, {"type": "lack", "prompt": "Apathetic is to interest as", "choices": ["arrogant : pride", "impartial : bias", "curious : question", "angry : temper", "cautious : care"], "ans": "B", "expl": "ブリッジ文：apathetic（無関心な）人には interest が欠けている。impartial（公平な）人には bias（偏見）がない。A・D・E はその性質を「たっぷり持つ」関係で逆（arrogant な人は pride が強い、cautious な人は care を払う）。C は特徴的な行動。"}, {"type": "lack", "prompt": "Ignorant is to knowledge as listless is to", "choices": ["list", "sadness", "order", "energy", "sleep"], "ans": "D", "expl": "ブリッジ文：ignorant な人には knowledge が欠けている。listless（元気のない、無気力な）人には energy が欠けている。引っ掛け：list は綴りからの連想で無関係。sadness・sleep は listless な状態に伴いがちなもので、欠けているものではない。"}, {"type": "lack", "prompt": "Amorphous is to shape as", "choices": ["fragrant : scent", "luminous : light", "verbose : words", "melodious : tune", "insipid : flavor"], "ans": "E", "expl": "ブリッジ文：amorphous（不定形の）ものには shape が欠けている。insipid（味のない、つまらない）ものには flavor が欠けている。他はすべて逆の「たっぷり持つ」関係（fragrant 香りのよい、luminous 光る、verbose 言葉が多すぎる、melodious 旋律の美しい）で、典型的な引っ掛け。"}, {"type": "lack", "prompt": "Sterile is to germs as anarchy is to", "choices": ["government", "chaos", "rebellion", "freedom", "crowd"], "ans": "A", "expl": "ブリッジ文：sterile（無菌の）状態には germs がない。anarchy（無政府状態）には government がない。chaos は anarchy に「伴う」状態（特徴）であって欠けているものではない。rebellion・freedom も関連語の引っ掛け。"}, {"type": "worker_product", "prompt": "Baker is to bread as", "choices": ["farmer : tractor", "teacher : school", "pilot : sky", "author : book", "doctor : hospital"], "ans": "D", "expl": "ブリッジ文：baker は bread を作る人。author は book を書く（生み出す）人。A は使用者と道具、B・E は働く場所、C は活動する場所。"}, {"type": "worker_product", "prompt": "Composer is to symphony as architect is to", "choices": ["building", "hammer", "bricklayer", "city", "ruler"], "ans": "A", "expl": "ブリッジ文：composer は symphony を作る人。architect（建築家）は building を設計して生み出す人。hammer・ruler は道具、bricklayer は一緒に働く別の職人、city は建物が集まった場所。"}, {"type": "worker_product", "prompt": "Spider is to web as", "choices": ["cat : mouse", "beaver : dam", "bird : wing", "fish : water", "dog : bone"], "ans": "B", "expl": "ブリッジ文：spider は web（巣）を作る生き物。beaver は dam を作る生き物。A は捕食関係、C は体の一部、D は生息場所、E は好んで食べる物。"}, {"type": "worker_product", "prompt": "Sculptor is to statue as playwright is to", "choices": ["stage", "actor", "theater", "pen", "drama"], "ans": "E", "expl": "ブリッジ文：sculptor は statue（像）を作る人。playwright（劇作家）は drama（戯曲）を書く人。stage・theater は上演場所、actor は演じる人、pen は道具。"}, {"type": "worker_product", "prompt": "Cartographer is to map as", "choices": ["explorer : continent", "librarian : book", "lexicographer : dictionary", "surveyor : land", "traveler : compass"], "ans": "C", "expl": "ブリッジ文：cartographer（地図製作者）は map を作る人。lexicographer（辞書編纂者）は dictionary を作る人。引っ掛け：B librarian は本を「扱う」が作らない。A・D は調べる対象、E は使用者と道具。"}, {"type": "worker_product", "prompt": "Weaver is to tapestry as potter is to", "choices": ["clay", "wheel", "kiln", "vase", "glaze"], "ans": "D", "expl": "ブリッジ文：weaver は tapestry（つづれ織り）を作る人。potter（陶工）は vase（花瓶）を作る人。引っ掛け：clay・glaze は材料、wheel（ろくろ）・kiln（窯）は道具（道具と使用者の関係）。"}, {"type": "worker_product", "prompt": "Choreographer is to dance as", "choices": ["composer : score", "dancer : stage", "audience : applause", "conductor : baton", "ballerina : slipper"], "ans": "A", "expl": "ブリッジ文：choreographer（振付師）は dance（の振り付け）を創作する人。composer は score（楽譜、楽曲）を創作する人。B は演じる場所、C は観客が生むもの、D・E は使用者と道具（身に着けるもの）。"}, {"type": "worker_product", "prompt": "Novelist is to manuscript as cobbler is to", "choices": ["leather", "shoe", "awl", "foot", "store"], "ans": "B", "expl": "ブリッジ文：novelist は manuscript（原稿）を生み出す人。cobbler（靴職人）は shoe を作る人。leather は材料、awl は道具、foot は履く部位、store は売る場所。"}, {"type": "worker_product", "prompt": "Vintner is to wine as", "choices": ["grape : vine", "sommelier : wine", "bartender : glass", "farmer : field", "brewer : beer"], "ans": "E", "expl": "ブリッジ文：vintner（ワイン醸造業者）は wine を作る人。brewer（ビール醸造者）は beer を作る人。引っ掛け：B sommelier はワインを選んで「出す」人で作らない。A は実と植物、C は使う道具、D は働く場所。"}, {"type": "worker_product", "prompt": "Lapidary is to gem as cooper is to", "choices": ["copper", "wood", "barrel", "hoop", "wine"], "ans": "C", "expl": "ブリッジ文：lapidary（宝石細工師）は（カットした）gem を作る人。cooper（樽職人）は barrel（樽）を作る人。copper は綴りの引っ掛け、wood は材料、hoop（たが）は樽の部品、wine は樽に入れる物。"}, {"type": "function", "prompt": "Refrigerator is to cool as", "choices": ["milk : cold", "oven : heat", "freezer : ice", "stove : pot", "food : eat"], "ans": "B", "expl": "ブリッジ文：refrigerator の役割は（食品を）cool（冷やす）こと。oven の役割は heat（加熱する）こと。A は特徴、C は作られる物（名詞）、D は一緒に使う道具、E は目的語と動作。"}, {"type": "function", "prompt": "Umbrella is to protect as lamp is to", "choices": ["illuminate", "bulb", "desk", "dark", "switch"], "ans": "A", "expl": "ブリッジ文：umbrella の役割は（雨から）protect すること。lamp の役割は illuminate（照らす）こと。bulb・switch は部品、desk は置く場所、dark はランプが打ち消す状態。"}, {"type": "function", "prompt": "Heart is to pump as", "choices": ["brain : head", "blood : red", "stomach : digest", "bone : skeleton", "skin : body"], "ans": "C", "expl": "ブリッジ文：heart の役割は（血液を）pump（送り出す）こと。stomach の役割は digest（消化する）こと。A は存在する場所、B は特徴、D・E は部分と全体。"}, {"type": "function", "prompt": "Bridge is to span as dam is to", "choices": ["river", "beaver", "concrete", "block", "flood"], "ans": "D", "expl": "ブリッジ文：bridge の役割は（川や谷を）span（またぐ）こと。dam の役割は（水を）block（せき止める）こと。river は対象、beaver はダムを作る生き物、concrete は材料、flood はダムが防ぐもの（名詞）。"}, {"type": "function", "prompt": "Thermostat is to regulate as", "choices": ["clock : hour", "thermometer : mercury", "furnace : basement", "window : glass", "alarm : alert"], "ans": "E", "expl": "ブリッジ文：thermostat（自動温度調節器）の役割は（温度を）regulate（調節する）こと。alarm の役割は alert（警告する）こと。A は測る単位、B・D は材料、C は置かれる場所。"}, {"type": "function", "prompt": "Anchor is to moor as rudder is to", "choices": ["stern", "steer", "sail", "ship", "water"], "ans": "B", "expl": "ブリッジ文：anchor の役割は（船を）moor（つなぎ留める）こと。rudder（舵）の役割は steer（操縦する、向きを変える）こと。stern（船尾）は舵がある場所、ship は全体。sail は帆で進むことで舵の働きではない。"}, {"type": "function", "prompt": "Vaccine is to immunize as", "choices": ["syringe : needle", "patient : recover", "pill : bottle", "antiseptic : disinfect", "nurse : hospital"], "ans": "D", "expl": "ブリッジ文：vaccine の役割は immunize（免疫をつける）こと。antiseptic（消毒剤）の役割は disinfect（消毒する）こと。A は全体と部分、B は人とその結果、C は中身と容器、E は人と職場。"}, {"type": "function", "prompt": "Moat is to defend as aqueduct is to", "choices": ["water", "Rome", "convey", "arch", "castle"], "ans": "C", "expl": "ブリッジ文：moat（堀）の役割は（城を）defend（守る）こと。aqueduct（水道橋）の役割は（水を）convey（運ぶ）こと。water は運ぶ対象、Rome は有名な場所、arch は構造の一部、castle は堀からの連想の引っ掛け。"}, {"type": "function", "prompt": "Insulation is to retain as", "choices": ["ballast : stabilize", "ship : sea", "fiberglass : wall", "heat : escape", "blanket : bed"], "ans": "A", "expl": "ブリッジ文：insulation（断熱材）の役割は（熱を）retain（保つ）こと。ballast（底荷、バラスト）の役割は（船を）stabilize（安定させる）こと。B は場所、C は素材と使う場所、D は物とその動き、E は物と置く場所。"}, {"type": "function", "prompt": "Catalyst is to accelerate as sedative is to", "choices": ["pharmacy", "patient", "excite", "dose", "soothe"], "ans": "E", "expl": "ブリッジ文：catalyst（触媒）の役割は（反応を）accelerate（加速する）こと。sedative（鎮静剤）の役割は soothe（落ち着かせる）こと。excite は正反対の働き。pharmacy は売る場所、patient は使う人、dose は量。"}]}};

const fmt = sec => { sec = Math.max(0, Math.round(sec)); return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`; };
const fmtDate = t => new Date(t).toLocaleString('ja-JP', {year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
const words = t => (t||'').trim().split(/\s+/).filter(Boolean).length;
const plain = h => h.replace(/<span class="frac"><span>(.*?)<\/span><span>(.*?)<\/span><\/span>/g, '($1)/($2)')
                    .replace(/<sup>(.*?)<\/sup>/g, '^$1').replace(/<[^>]+>/g, ' ').replace(/\s+/g,' ').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').trim();
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const jsArg = v => esc(JSON.stringify(v));
function modal(html){ $('#modal').innerHTML = `<div class="back"><div class="box">${html}</div></div>`; }
function closeModal(){ $('#modal').innerHTML=''; }
function scrollToQ(n){ const el = document.getElementById('q-'+n); if (el) { el.open = true; el.scrollIntoView({behavior:'smooth', block:'start'}); } }

/* =====================================================================
 *  ROUTER
 * ===================================================================== */
function route(){
  const h = location.hash.replace(/^#\/?/, '') || 'home';
  const [r, arg] = h.split('/');
  document.body.classList.toggle('in-exam', r === 'exam');
  document.querySelectorAll('#topbar nav a').forEach(a => a.classList.toggle('active', a.dataset.r === r || (r==='result' && a.dataset.r==='history')));
  closeModal(); hideHlPop(); stopVocabTimer();
  window.scrollTo(0,0);
  if (r === 'exam') { if (!cur) { location.hash = '#/home'; return; } return renderExam(); }
  if (r === 'history') return renderHistory();
  if (r === 'result') return renderResult(arg);
  if (r === 'review') return renderReview(arg);
  if (r === 'vocab') return renderVocab(arg);
  if (r === 'guide') return renderGuide();
  return renderHome();
}
window.addEventListener('hashchange', route);
