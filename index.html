atio of the amount of money Ken has to the amount Aya has is 3 : 5. Together they have $64. How much money does Aya have?", "choices": ["$40", "$24", "$32", "$38", "$48"], "ans": "A", "expl": "比の合計は 3 + 5 = 8。1 単位 = 64 ÷ 8 = 8 ドル。Aya は 5 × 8 = 40 ドル。24 ドルは Ken の金額なので注意。"}, {"topic": "周の長さ", "prompt": "A rectangular vegetable garden is 12 feet long and 8 feet wide. How many feet of fencing are needed to go completely around the garden?", "choices": ["20", "32", "36", "40", "96"], "ans": "D", "expl": "周の長さ = 2 × (12 + 8) = 40 フィート。96 は面積（12 × 8）、20 は縦と横を 1 回ずつ足しただけの値で、どちらも典型的な引っ掛けです。"}, {"topic": "平均・範囲", "prompt": "Maya's scores on five tests were 82, 90, 75, 88, and <i>x<\/i>. If the mean (average) of the five scores is 85, what is the range of the five scores?", "choices": ["13", "15", "17", "85", "90"], "ans": "B", "expl": "合計 = 85 × 5 = 425。82 + 90 + 75 + 88 = 335 なので <i>x<\/i> = 90。範囲（range）は最大値 − 最小値 = 90 − 75 = 15。<i>x<\/i> を求めずに 88 − 75 = 13 とするのは引っ掛け。90 は <i>x<\/i> の値です。"}, {"topic": "指数", "prompt": "What is the value of {{frac:2<sup>5<\/sup> × 2<sup>3<\/sup>|2<sup>4<\/sup>}} ?", "choices": ["2", "4", "8", "12", "16"], "ans": "E", "expl": "同じ底の掛け算は指数を足し、割り算は引く：2<sup>5+3−4<\/sup> = 2<sup>4<\/sup> = 16。指数の 4 を答えにしてしまう（4 を選ぶ）ミスに注意。"}, {"topic": "資料の読み取り", "prompt": "The table below shows the number of seed packets a garden shop sold each day last week.<br><table class=\"dt\"><tr><th>Day<\/th><th>Packets Sold<\/th><\/tr><tr><td>Monday<\/td><td>14<\/td><\/tr><tr><td>Tuesday<\/td><td>22<\/td><\/tr><tr><td>Wednesday<\/td><td>18<\/td><\/tr><tr><td>Thursday<\/td><td>10<\/td><\/tr><tr><td>Friday<\/td><td>16<\/td><\/tr><\/table>What percent of the packets sold during these five days were sold on Friday?", "choices": ["16%", "18%", "20%", "25%", "32%"], "ans": "C", "expl": "合計 = 14 + 22 + 18 + 10 + 16 = 80。金曜は 16 ÷ 80 = 0.2 = 20%。16 個をそのまま 16% としないこと。"}, {"topic": "三角形の角", "prompt": "The measures of the three angles of a triangle are in the ratio 2 : 3 : 4. What is the measure of the largest angle?", "choices": ["80°", "40°", "60°", "90°", "100°"], "ans": "A", "expl": "三角形の内角の和は 180°。比の合計 9 なので 1 単位 = 20°。最大の角は 4 × 20° = 80°。"}, {"topic": "余り", "prompt": "When the positive integer <i>n<\/i> is divided by 6, the remainder is 4. What is the remainder when 2<i>n<\/i> is divided by 6?", "choices": ["0", "1", "2", "4", "8"], "ans": "C", "expl": "<i>n<\/i> = 6<i>k<\/i> + 4 とおくと 2<i>n<\/i> = 12<i>k<\/i> + 8 = 6(2<i>k<\/i> + 1) + 2。余りは 2。具体例 <i>n<\/i> = 4 → 2<i>n<\/i> = 8、8 ÷ 6 の余り 2 でも確認できます。余りは割る数 6 より小さいので 8 はありえません。"}, {"topic": "定義された演算", "prompt": "For all numbers <i>a<\/i> and <i>b<\/i>, let <i>a<\/i> ◆ <i>b<\/i> = <i>a<\/i><sup>2<\/sup> − 2<i>b<\/i>. What is the value of (3 ◆ 1) ◆ 4 ?", "choices": ["1", "7", "25", "33", "41"], "ans": "E", "expl": "まずかっこ内：3 ◆ 1 = 9 − 2 = 7。次に 7 ◆ 4 = 49 − 8 = 41。7 はかっこ内で止めた引っ掛けです。"}, {"topic": "傾き", "prompt": "What is the slope of the line that passes through the points (−2, 5) and (4, −7) ?", "choices": ["−3", "−2", "−{{frac:1|2}}", "{{frac:1|2}}", "2"], "ans": "B", "expl": "傾き = (<i>y<\/i> の変化) ÷ (<i>x<\/i> の変化) = (−7 − 5) ÷ (4 − (−2)) = −12 ÷ 6 = −2。<i>x<\/i> と <i>y<\/i> を逆にすると −{{frac:1|2}} になるので注意。"}, {"topic": "三平方の定理", "prompt": "A 13-foot ladder leans against the vertical wall of a building. The bottom of the ladder is 5 feet from the base of the wall on level ground. How high up the wall does the top of the ladder reach?", "choices": ["8 feet", "9 feet", "10 feet", "12 feet", "14 feet"], "ans": "D", "expl": "はしごが斜辺の直角三角形。高さ<sup>2<\/sup> = 13<sup>2<\/sup> − 5<sup>2<\/sup> = 169 − 25 = 144 より高さ 12 フィート（5-12-13 の三角形）。13 − 5 = 8 と引き算するのは誤りです。"}, {"topic": "増加率", "prompt": "The price of a ceramic planter increased from $40 to $50. By what percent did the price increase?", "choices": ["25%", "20%", "10%", "50%", "80%"], "ans": "A", "expl": "増加率 = 増加分 ÷ 元の値 = 10 ÷ 40 = 0.25 = 25%。新しい値 50 で割ると 20% になる、というのが定番の引っ掛け。"}, {"topic": "確率", "prompt": "A bag contains 4 red, 5 yellow, and 6 white tulip bulbs. If one bulb is chosen at random, what is the probability that it is NOT white?", "choices": ["{{frac:4|15}}", "{{frac:1|3}}", "{{frac:2|5}}", "{{frac:1|2}}", "{{frac:3|5}}"], "ans": "E", "expl": "全部で 15 個、白以外は 4 + 5 = 9 個。確率は {{frac:9|15}} = {{frac:3|5}}。{{frac:2|5}} は「白である」確率なので NOT を見落とさないこと。"}, {"topic": "円の面積", "prompt": "A circular fountain has a circumference of 10<i>π<\/i> meters. What is the area of the fountain, in square meters?", "choices": ["10<i>π<\/i>", "20<i>π<\/i>", "25<i>π<\/i>", "50<i>π<\/i>", "100<i>π<\/i>"], "ans": "C", "expl": "円周 = 2<i>πr<\/i> = 10<i>π<\/i> より半径 <i>r<\/i> = 5。面積 = <i>πr<\/i><sup>2<\/sup> = 25<i>π<\/i>。直径 10 をそのまま使うと 100<i>π<\/i> になる引っ掛けに注意。"}, {"topic": "不等式", "prompt": "Which of the following describes all values of <i>x<\/i> for which −3<i>x<\/i> + 4 > 19 ?", "choices": ["<i>x<\/i> > −5", "<i>x<\/i> < −5", "<i>x<\/i> > 5", "<i>x<\/i> < 5", "<i>x<\/i> < −{{frac:23|3}}"], "ans": "B", "expl": "両辺から 4 を引いて −3<i>x<\/i> > 15。負の数 −3 で割るので不等号の向きが逆になり <i>x<\/i> < −5。向きを変え忘れると <i>x<\/i> > −5 を選んでしまいます。"}, {"topic": "連立方程式", "prompt": "If <i>x<\/i> + <i>y<\/i> = 14 and <i>x<\/i> − <i>y<\/i> = 4, what is the value of <i>xy<\/i> ?", "choices": ["18", "40", "44", "45", "56"], "ans": "D", "expl": "2 式を足すと 2<i>x<\/i> = 18 → <i>x<\/i> = 9、よって <i>y<\/i> = 5。<i>xy<\/i> = 9 × 5 = 45。"}, {"topic": "体積（文章題）", "prompt": "A raised garden bed is shaped like a rectangular box that is 6 feet long, 3 feet wide, and 1.5 feet deep. Soil is sold only in whole bags, and each bag holds 2 cubic feet. What is the least number of bags needed to fill the bed completely?", "choices": ["9", "13", "14", "18", "27"], "ans": "C", "expl": "体積 = 6 × 3 × 1.5 = 27 立方フィート。27 ÷ 2 = 13.5 袋だが、袋は丸ごとしか買えないので切り上げて 14 袋。13 は切り捨てた引っ掛け、27 は体積そのものです。"}, {"topic": "等差数列", "prompt": "The first four terms of a sequence are 3, 7, 11, 15. If the pattern continues, what is the 50th term?", "choices": ["199", "203", "200", "196", "150"], "ans": "A", "expl": "初項 3、公差 4 の等差数列。第 <i>n<\/i> 項 = 3 + 4(<i>n<\/i> − 1) なので第 50 項 = 3 + 4 × 49 = 199。3 + 4 × 50 = 203 とするのは典型的な「1 つずれ」のミスです。"}, {"topic": "円と正方形の面積", "prompt": "A square garden plot measures 10 meters on each side. The largest possible circular flower bed is placed inside the square, and the rest of the plot is planted with grass. What is the area of the grass, in square meters?", "choices": ["100 − 100<i>π<\/i>", "40 − 10<i>π<\/i>", "100 − 10<i>π<\/i>", "100 − 50<i>π<\/i>", "100 − 25<i>π<\/i>"], "ans": "E", "expl": "最大の円は正方形に内接し、直径 10・半径 5。円の面積 25<i>π<\/i>。芝生 = 正方形 − 円 = 100 − 25<i>π<\/i>。半径を 10 とすると 100 − 100<i>π<\/i>（負の値！）、円周を引くと 100 − 10<i>π<\/i> になる引っ掛けです。"}, {"topic": "場合の数", "prompt": "A landscaper will plant 5 different shrubs, one of which is a rosebush, in a straight row. If the rosebush must be at one of the two ends of the row, how many different arrangements are possible?", "choices": ["24", "48", "60", "96", "120"], "ans": "B", "expl": "バラの位置は左端か右端の 2 通り。残り 4 本の並べ方は 4! = 24 通り。合計 2 × 24 = 48 通り。片方の端だけ考えると 24、制限なしだと 5! = 120 になります。"}, {"topic": "仕事算", "prompt": "Ana can weed a garden by herself in 4 hours, and Ben can weed the same garden by himself in 6 hours. They work together for 1 hour, and then Ana leaves. Working alone at his usual rate, how long will it take Ben to finish weeding the garden?", "choices": ["2 hours", "2 hours 24 minutes", "3 hours", "3 hours 30 minutes", "4 hours 30 minutes"], "ans": "D", "expl": "全体を 1 とすると、Ana は 1 時間に {{frac:1|4}}、Ben は {{frac:1|6}}。2 人で 1 時間に {{frac:1|4}} + {{frac:1|6}} = {{frac:5|12}}。残りは {{frac:7|12}}。Ben 1 人では {{frac:7|12}} ÷ {{frac:1|6}} = {{frac:7|2}} = 3.5 時間 = 3 時間 30 分。2 時間 24 分は最初から 2 人で全部やった場合の時間で、引っ掛けです。"}], "quant2": [{"topic": "小数の計算", "prompt": "What is the value of 0.4 × 0.25 ?", "choices": ["0.01", "0.1", "0.65", "1", "10"], "ans": "B", "expl": "4 × 25 = 100。小数点以下の桁数は 1 + 2 = 3 桁なので 0.100 = 0.1。0.65 は足し算をしてしまった引っ掛けです。"}, {"topic": "約数", "prompt": "How many positive integers are factors of 36 ?", "choices": ["4", "6", "7", "8", "9"], "ans": "E", "expl": "36 の約数は 1, 2, 3, 4, 6, 9, 12, 18, 36 の 9 個。ペアで書き出すと (1,36), (2,18), (3,12), (4,9), (6,6)。6 × 6 を 2 個と数えて 10 個、または 6 を落として 8 個としないよう注意。素因数分解 36 = 2<sup>2<\/sup> × 3<sup>2<\/sup> から (2+1)(2+1) = 9 と求めることもできます。"}, {"topic": "お金の計算", "prompt": "Mia buys 3 notebooks that cost $2.75 each. If she pays with a $10 bill, how much change should she receive?", "choices": ["$1.75", "$2.25", "$1.25", "$7.25", "$8.25"], "ans": "A", "expl": "代金は 2.75 × 3 = 8.25 ドル。おつりは 10 − 8.25 = 1.75 ドル。8.25 ドルは代金そのものなので注意。"}, {"topic": "式の計算", "prompt": "Which of the following is equivalent to 3(2<i>x<\/i> − 4) − 2(<i>x<\/i> − 5) ?", "choices": ["4<i>x<\/i> − 22", "8<i>x<\/i> − 2", "4<i>x<\/i> − 2", "4<i>x<\/i> + 2", "4<i>x<\/i> − 9"], "ans": "C", "expl": "展開すると 6<i>x<\/i> − 12 − 2<i>x<\/i> + 10 = 4<i>x<\/i> − 2。−2 × (−5) = +10 の符号を間違えると 4<i>x<\/i> − 22 になる、というのが典型的な引っ掛けです。"}, {"topic": "中央値", "prompt": "What is the median of the following set of numbers?<br>7, 3, 9, 12, 5, 10", "choices": ["7", "7.5", "7{{frac:2|3}}", "8", "10.5"], "ans": "D", "expl": "小さい順に並べると 3, 5, 7, 9, 10, 12。個数が偶数なので真ん中 2 つの平均 (7 + 9) ÷ 2 = 8。並べ替えずに 9 と 12 の平均を取ると 10.5、7{{frac:2|3}} は平均（mean）で、どちらも引っ掛けです。"}, {"topic": "縮尺", "prompt": "On an architect's blueprint, 1 inch represents 4 feet. A rectangular room on the blueprint measures 3.5 inches by 5 inches. What is the actual area of the room, in square feet?", "choices": ["70", "280", "17.5", "140", "1,120"], "ans": "B", "expl": "実際の寸法は 3.5 × 4 = 14 フィート、5 × 4 = 20 フィート。面積 = 14 × 20 = 280 平方フィート。図面上の面積 17.5 に 4 を掛けて 70 とするのは誤り（面積は 4<sup>2<\/sup> = 16 倍になる）。"}, {"topic": "2 点間の距離", "prompt": "What is the distance between the points (1, 2) and (7, 10) in the coordinate plane?", "choices": ["10", "8", "12", "14", "100"], "ans": "A", "expl": "距離 = √((7 − 1)<sup>2<\/sup> + (10 − 2)<sup>2<\/sup>) = √(36 + 64) = √100 = 10。6 + 8 = 14 と足すだけ、またはルートを取り忘れて 100 とするのが引っ掛けです。"}, {"topic": "割引", "prompt": "A gardening jacket originally priced at $80 is marked down 20%. At the register, an additional 10% is taken off the sale price. What is the final price of the jacket?", "choices": ["$22.40", "$54.00", "$56.00", "$57.00", "$57.60"], "ans": "E", "expl": "20% 引きで 80 × 0.8 = 64 ドル。さらにその 10% 引きで 64 × 0.9 = 57.60 ドル。20% + 10% = 30% 引きとして 56 ドルにするのは典型的な引っ掛け（2 回目の割引は値下げ後の価格に対してかかる）。"}, {"topic": "資料の読み取り（平均・中央値）", "prompt": "The table below shows the number of pounds of tomatoes harvested by five members of a garden club.<br><table class=\"dt\"><tr><th>Member<\/th><th>Pounds Harvested<\/th><\/tr><tr><td>Ava<\/td><td>12<\/td><\/tr><tr><td>Ben<\/td><td>8<\/td><\/tr><tr><td>Cara<\/td><td>20<\/td><\/tr><tr><td>Dev<\/td><td>9<\/td><\/tr><tr><td>Eli<\/td><td>11<\/td><\/tr><\/table>By how many pounds does the mean of the harvests exceed the median?", "choices": ["0", "0.5", "1", "2", "4"], "ans": "C", "expl": "合計 = 12 + 8 + 20 + 9 + 11 = 60、平均 = 60 ÷ 5 = 12。小さい順 8, 9, 11, 12, 20 の中央値は 11。差は 12 − 11 = 1。表の真ん中にある 20 を中央値としないこと（必ず並べ替える）。"}, {"topic": "平方根", "prompt": "What is the value of √50 + √18 ?", "choices": ["√68", "4√2", "15√2", "8√2", "34"], "ans": "D", "expl": "√50 = √(25 × 2) = 5√2、√18 = √(9 × 2) = 3√2。足して 8√2。√50 + √18 = √68 とルートの中を足すのは誤りです。"}, {"topic": "文章題（硬貨）", "prompt": "A jar contains only nickels and dimes. There are 30 coins in all, and their total value is $2.20. How many dimes are in the jar?", "choices": ["14", "16", "12", "15", "22"], "ans": "A", "expl": "dime（10 セント）を <i>d<\/i> 枚とすると nickel（5 セント）は 30 − <i>d<\/i> 枚。5(30 − <i>d<\/i>) + 10<i>d<\/i> = 220 → 150 + 5<i>d<\/i> = 220 → <i>d<\/i> = 14。nickel は 16 枚なので、16 を選ばないよう注意。"}, {"topic": "関数", "prompt": "If <i>f<\/i>(<i>x<\/i>) = 2<i>x<\/i><sup>2<\/sup> − 3<i>x<\/i> + 1, what is the value of <i>f<\/i>(−2) ?", "choices": ["3", "15", "−1", "11", "21"], "ans": "B", "expl": "<i>f<\/i>(−2) = 2 × (−2)<sup>2<\/sup> − 3 × (−2) + 1 = 2 × 4 + 6 + 1 = 15。−3 × (−2) を −6 としてしまうと 3 になる引っ掛けに注意。"}, {"topic": "平行線と角", "prompt": "Two parallel lines are cut by a transversal. Two same-side interior angles formed by the transversal measure (3<i>x<\/i> + 10)° and (2<i>x<\/i> + 20)°. What is the value of <i>x<\/i> ?", "choices": ["10", "18", "26", "30", "34"], "ans": "D", "expl": "平行線の同側内角（same-side interior angles）の和は 180°。(3<i>x<\/i> + 10) + (2<i>x<\/i> + 20) = 180 → 5<i>x<\/i> = 150 → <i>x<\/i> = 30。2 つの角を等しいとおいて <i>x<\/i> = 10 とするのが引っ掛け（等しくなるのは錯角・同位角）。"}, {"topic": "表面積", "prompt": "A wooden planter box is shaped like a closed rectangular box that is 5 feet long, 4 feet wide, and 3 feet high. What is the total surface area of the box, in square feet?", "choices": ["47", "60", "64", "78", "94"], "ans": "E", "expl": "表面積 = 2(5 × 4 + 5 × 3 + 4 × 3) = 2(20 + 15 + 12) = 2 × 47 = 94。2 倍し忘れると 47、60 は体積です。"}, {"topic": "確率（サイコロ）", "prompt": "Two fair six-sided dice, each numbered 1 through 6, are rolled. What is the probability that the sum of the two numbers rolled is 8 ?", "choices": ["{{frac:1|9}}", "{{frac:1|6}}", "{{frac:5|36}}", "{{frac:7|36}}", "{{frac:1|11}}"], "ans": "C", "expl": "全 36 通りのうち和が 8 になるのは (2,6), (3,5), (4,4), (5,3), (6,2) の 5 通り。確率 {{frac:5|36}}。和は 2〜12 の 11 種類だからと {{frac:1|11}} にするのは誤り（各和の起こりやすさは等しくない）。"}, {"topic": "中点", "prompt": "Point <i>M<\/i>(2, −1) is the midpoint of segment <i>PQ<\/i>. If point <i>P<\/i> has coordinates (−3, 4), what are the coordinates of point <i>Q<\/i> ?", "choices": ["(7, −6)", "(−0.5, 1.5)", "(5, −5)", "(−8, 9)", "(1, 3)"], "ans": "A", "expl": "<i>Q<\/i> = (<i>x<\/i>, <i>y<\/i>) とすると (−3 + <i>x<\/i>) ÷ 2 = 2 → <i>x<\/i> = 7、(4 + <i>y<\/i>) ÷ 2 = −1 → <i>y<\/i> = −6。よって (7, −6)。(−0.5, 1.5) は <i>P<\/i> と <i>M<\/i> の中点を求めてしまった引っ掛けです。"}, {"topic": "座標と三角形の面積", "prompt": "What is the area of the triangle whose vertices are (0, 0), (8, 0), and (3, 6) in the coordinate plane?", "choices": ["12", "18", "20", "24", "48"], "ans": "D", "expl": "底辺は (0, 0) から (8, 0) までの 8。高さは 3 点目の <i>y<\/i> 座標 6。面積 = {{frac:1|2}} × 8 × 6 = 24。{{frac:1|2}} を掛け忘れると 48。"}, {"topic": "比（混合）", "prompt": "A seed mix contains only sunflower seeds and clover seeds in a ratio of 2 : 3 by weight. The mix weighs 30 ounces. How many ounces of sunflower seeds must be added so that the ratio of sunflower seeds to clover seeds becomes 1 : 1 ?", "choices": ["3", "6", "8", "12", "18"], "ans": "B", "expl": "ひまわり = 30 × {{frac:2|5}} = 12 オンス、クローバー = 18 オンス。1 : 1 にするにはひまわりを 18 にすればよいので 18 − 12 = 6 オンス追加。12 や 18 は元の量で、引っ掛けです。"}, {"topic": "資料の読み取り（買い物）", "prompt": "The table below shows prices at a hardware store. The store takes 10% off the total of any purchase over $40.<br><table class=\"dt\"><tr><th>Item<\/th><th>Price<\/th><\/tr><tr><td>Bag of soil<\/td><td>$6.50<\/td><\/tr><tr><td>Trowel<\/td><td>$12.00<\/td><\/tr><tr><td>Seed packet<\/td><td>$1.25<\/td><\/tr><tr><td>Gloves<\/td><td>$8.00<\/td><\/tr><\/table>Kai buys 4 bags of soil, 1 trowel, and 8 seed packets. How much does he pay?", "choices": ["$27.75", "$38.40", "$40.00", "$48.00", "$43.20"], "ans": "E", "expl": "土 6.50 × 4 = 26、こて 12、種 1.25 × 8 = 10。合計 48 ドルで 40 ドルを超えるので 10% 引き：48 × 0.9 = 43.20 ドル。割引を忘れると 48 ドル。手袋は買っていないので含めないこと。"}, {"topic": "不等式と整数", "prompt": "How many integers <i>x<\/i> satisfy −3 < 2<i>x<\/i> + 1 ≤ 9 ?", "choices": ["4", "5", "6", "7", "8"], "ans": "C", "expl": "各辺から 1 を引くと −4 < 2<i>x<\/i> ≤ 8、2 で割ると −2 < <i>x<\/i> ≤ 4。整数は −1, 0, 1, 2, 3, 4 の 6 個。−2 は含まれない（<）が 4 は含まれる（≤）点に注意。"}, {"topic": "円と内接長方形", "prompt": "A rectangle that measures 6 inches by 8 inches is inscribed in a circle, so that all four vertices of the rectangle lie on the circle. What is the circumference of the circle, in inches?", "choices": ["5<i>π<\/i>", "10<i>π<\/i>", "14<i>π<\/i>", "25<i>π<\/i>", "28<i>π<\/i>"], "ans": "B", "expl": "円に内接する長方形の対角線は円の直径。対角線 = √(6<sup>2<\/sup> + 8<sup>2<\/sup>) = 10。円周 = <i>π<\/i> × 直径 = 10<i>π<\/i>。25<i>π<\/i> は円の面積なので、何を聞かれているか確認しましょう。"}, {"topic": "指数方程式", "prompt": "If 4<sup><i>x<\/i> + 1<\/sup> = 8<sup><i>x<\/i> − 1<\/sup>, what is the value of <i>x<\/i> ?", "choices": ["5", "−1", "1", "3", "7"], "ans": "A", "expl": "底を 2 にそろえる：4<sup><i>x<\/i>+1<\/sup> = 2<sup>2<i>x<\/i>+2<\/sup>、8<sup><i>x<\/i>−1<\/sup> = 2<sup>3<i>x<\/i>−3<\/sup>。指数を等しくして 2<i>x<\/i> + 2 = 3<i>x<\/i> − 3 → <i>x<\/i> = 5。確認：4<sup>6<\/sup> = 8<sup>4<\/sup> = 4096。"}, {"topic": "規則性（一の位）", "prompt": "What is the units digit of 7<sup>42<\/sup> ?", "choices": ["1", "3", "9", "7", "2"], "ans": "C", "expl": "7 の累乗の一の位は 7, 9, 3, 1 の 4 つで循環する。42 ÷ 4 = 10 余り 2 なので、2 番目の 9。"}, {"topic": "平均の応用", "prompt": "The average (arithmetic mean) of five numbers is 18. When one of the numbers is removed, the average of the remaining four numbers is 16. What number was removed?", "choices": ["2", "16", "18", "22", "26"], "ans": "E", "expl": "5 個の合計 = 18 × 5 = 90、残り 4 個の合計 = 16 × 4 = 64。取り除いた数 = 90 − 64 = 26。平均の差 18 − 16 = 2 を答えるのは引っ掛けです。平均の問題は「合計」に直すのがコツ。"}, {"topic": "立体の表面積の変化", "prompt": "A cube-shaped storage block has a volume of 64 cubic feet. If each edge of the cube is increased by 50%, by what percent does the total surface area of the cube increase?", "choices": ["50%", "75%", "100%", "125%", "237.5%"], "ans": "D", "expl": "一辺は 4 フィート → 1.5 倍で 6 フィート。表面積は 6 × 4<sup>2<\/sup> = 96 → 6 × 6<sup>2<\/sup> = 216。増加率 = (216 − 96) ÷ 96 = 120 ÷ 96 = 1.25 = 125%。長さが 1.5 倍なら面積は 1.5<sup>2<\/sup> = 2.25 倍と考えても OK。237.5% は体積の増加率（1.5<sup>3<\/sup> = 3.375 倍）、50% は辺の増加率で、どちらも引っ掛けです。"}]}, "reading": {"passages": [{"id": "p1", "title": "Passage 1: Literary Fiction", "jp": "コンクール直前の若きバイオリニスト", "html": "<p>The waiting room behind the concert hall smelled of rosin and radiator dust. Ellie sat on a folding chair with her violin case across her knees, listening to the muffled sound of the boy before her—a pianist from Ohio—racing through a Chopin étude as if the notes were chasing him. Every few bars, she caught herself counting along, her left fingers twitching against the case lid.<\/p><p>Her teacher, Mr. Okafor, had told her not to listen. “What they play has nothing to do with what you play,” he had said that morning, adjusting his scarf in the hotel lobby. “You are not running a race against anyone. You are telling a story to people who have never heard it.” Ellie had nodded, the way she always did, but now the words seemed thin, like paper held up against a storm.<\/p><p>She opened the case. The violin lay in its velvet hollow, amber and calm, indifferent to the judges and the folding chairs and the pianist's thundering finale. It had belonged to her grandmother, who had played in a dance band in Manila and never once, as far as Ellie knew, entered a competition. Her grandmother used to say that a violin remembers every hand that has held it. As a child, Ellie had taken this literally and whispered apologies to the instrument whenever she played out of tune.<\/p><p>Applause rose and fell beyond the door. A woman with a clipboard leaned in. “Eleanor Reyes? Two minutes.”<\/p><p>Ellie tightened her bow and drew it once, silently, above the strings, the way Mr. Okafor had taught her to rehearse the first stroke without sound. Her hands were cold. She pressed them together, then thought of her grandmother's hands—spotted, quick, tapping rhythms on the kitchen table while the rice cooked.<\/p><p>The door opened onto a wash of light. Ellie stood, tucked the violin beneath her chin, and realized, with a small shock, that she was no longer counting the seconds. She was thinking about the first phrase of the Bach, the way it climbed and then hesitated, as if asking a question. She walked toward the stage to answer it.<\/p>", "questions": [{"prompt": "The passage is primarily concerned with", "choices": ["a bitter rivalry between two young performers", "a young musician's shift from nervousness to focus just before she performs", "a teacher's harsh criticism of his student's technique", "the history of a dance band in Manila", "the judges' decision at the end of a music competition"], "ans": "B", "expl": "冒頭でエリーは前の演奏者の音を数えてしまうほど緊張していますが、最後の段落では「no longer counting the seconds」となり、バッハの最初のフレーズに意識が向いています。「緊張→集中」への変化が中心なのでB。Aの「rivalry（対抗意識）」はエリーが一方的に気にしているだけで「bitter（激しい）」対立はありません。Dは背景情報にすぎず、Eの審査結果は書かれていません。"}, {"prompt": "In the second paragraph, the description of Mr. Okafor's words as seeming “thin, like paper held up against a storm” suggests that", "choices": ["Ellie has completely forgotten what her teacher told her", "Mr. Okafor spoke too quietly for Ellie to hear him", "Ellie believes her teacher's advice is simply wrong", "the advice now feels too weak to protect Ellie from her anxiety", "a storm is approaching the concert hall"], "ans": "D", "expl": "「嵐に向かってかざした紙のように薄い」という比喩は、先生の言葉が今の強い不安（storm）に対して頼りなく感じられる、という意味なのでD。エリーは言葉を覚えているのでAは誤り。「間違っている」と考えているわけではないのでCも誤り（引っ掛け）。Eは比喩を文字通りに取った誤答です。"}, {"prompt": "It can most reasonably be inferred from the third paragraph that Ellie's grandmother", "choices": ["played music for its own sake rather than to win contests", "gave Ellie formal violin lessons for many years", "strongly disapproved of music competitions", "was a famous concert soloist in the Philippines", "bought the violin from a pianist in Ohio"], "ans": "A", "expl": "祖母は「played in a dance band in Manila」で、「never once ... entered a competition」とあります。勝つためではなく音楽そのもの（for its own sake）のために演奏していたと推測できるのでA。コンクールに出なかっただけで「反対していた」とは書かれていないのでCは言い過ぎ（典型的な引っ掛け）。B・D・Eは本文に根拠がありません。"}, {"prompt": "Ellie's action of drawing her bow “once, silently, above the strings” in the fifth paragraph primarily serves to show that she", "choices": ["has forgotten how the piece begins", "is worried that her violin is out of tune", "has decided to ignore her teacher's instructions", "fears that her violin has been damaged", "is using a technique her teacher taught her to prepare herself"], "ans": "E", "expl": "本文に「the way Mr. Okafor had taught her to rehearse the first stroke without sound」とあり、先生に教わった「音を出さずに最初の一弓を練習する」方法で準備しているのでE。むしろ先生の教えに従っているのでCは逆。A・B・Dを示す記述はありません。"}, {"prompt": "The final sentence of the passage (“She walked toward the stage to answer it”) suggests that Ellie", "choices": ["plans to respond to questions from the judges", "intends to reply to the woman with the clipboard", "now thinks of her performance as a response to the music rather than as a contest", "doubts that she will be able to finish the piece", "wants to apologize to her violin for playing out of tune"], "ans": "C", "expl": "直前でバッハの最初のフレーズが「as if asking a question（問いかけるように）」とあり、「it」はその「問い」を指します。つまり演奏を音楽への「応答」として捉えるようになったということでC。これは先生の「競争ではなく物語を語るのだ」という助言とも呼応します。Aの審査員の質問は文字通りの読み違いの引っ掛けです。"}]}, {"id": "p2", "title": "Passage 2: Poetry", "jp": "詩「十月の棚卸し」――秋と変化", "html": "<p><b>October Inventory<\/b><br><br>The maple does not argue with the cold.<br>It simply lets the green go, leaf by leaf,<br>as though it had been lending out its gold<br>all summer, and now calls back, in brief,<br>the borrowed brightness. Down along the creek<br>the cattails rattle like a ring of keys<br>to rooms that no one enters. Wild geese streak<br>the sky in long, uneven V's<br>and leave. I used to think that fall was loss,<br>a shuttering of windows on the year.<br>But look: the bare limbs let the moonlight cross<br>a field it never reached in June. How clear<br>the distance is, how far that I can see!<br>The garden, stripped, reveals its crooked bones—<br>the trellis and the stakes, the honest tree<br>of wire and twine, the path of buried stones.<br>What summer covered, autumn names aloud.<br>I count what's left: a pumpkin, three late pears,<br>my father's rake, a single drifting cloud—<br>and find that less is lighter. Something wears<br>away, but something else is shown instead:<br>not what the year has lost, but what it said.<br><\/p>", "questions": [{"prompt": "Over the course of the poem, the speaker's view of autumn changes from", "choices": ["excitement to boredom", "admiration to fear", "seeing it as a time of loss to seeing it as a time of revelation", "indifference to deep grief", "fond nostalgia to anger"], "ans": "C", "expl": "「I used to think that fall was loss（以前は秋を喪失だと思っていた）」の後、「But look」で転換し、葉が落ちて遠くまで見えること、庭の骨組みが現れることを述べ、「What summer covered, autumn names aloud（夏が隠したものを秋ははっきり名指す）」と結びます。「喪失→現れること（revelation）」なのでC。Dは方向が逆です。"}, {"prompt": "The image of the maple “lending out its gold / all summer” and calling back “the borrowed brightness” suggests that the tree's summer color was", "choices": ["temporary, like something that must eventually be returned", "stolen from other trees in the forest", "more valuable than real gold", "a disguise meant to fool the geese", "permanent and unaffected by the cold"], "ans": "A", "expl": "「lend（貸す）」「borrowed（借りた）」という語から、夏の輝きは一時的なもので、いずれ返されるもの、というイメージになるのでA。Bの「stolen」は「borrowed」と混同させる引っ掛け。Eは秋に色が失われる内容と矛盾します。"}, {"prompt": "The comparison of the cattails to “a ring of keys / to rooms that no one enters” mainly creates a mood of", "choices": ["joyful celebration", "immediate danger", "playful humor", "anxious urgency", "quiet emptiness"], "ans": "E", "expl": "「誰も入らない部屋の鍵束」は、使われない・人のいない寂しさを表す比喩で、静かな空虚感（quiet emptiness）を生み出しているのでE。直後に雁が飛び去る（and leave）描写も寂しさを強めています。危険や緊迫感（B・D）はありません。"}, {"prompt": "As used in the poem, the word “honest” in “the honest tree / of wire and twine” most nearly means", "choices": ["law-abiding", "plain and undisguised", "generous", "talkative", "fragile"], "ans": "B", "expl": "葉や作物に覆われていた庭が「stripped（はぎ取られ）」、針金やひもの支柱がむき出しになった様子です。ここでの honest は「飾らない、隠されていない」の意味なのでB。honest の一般的な意味「正直な・法を守る」に近いAは文脈に合わない引っ掛けです。"}, {"prompt": "Which statement best expresses the central idea of the poem?", "choices": ["Nature is cruel to those who depend on it.", "Summer is the only season worth celebrating.", "Memories of childhood fade as people grow older.", "Change and loss can reveal things that abundance once concealed.", "People should work harder to protect their gardens from the cold."], "ans": "D", "expl": "落葉で遠くまで見え、庭の骨組みが現れ、最終行で「not what the year has lost, but what it said（失ったものではなく、一年が語ったもの）」と締めくくります。「変化や喪失が、豊かさが隠していたものを明らかにする」というDが主題。Bは詩の結論と逆、A・C・Eは根拠がありません。"}]}, {"id": "p3", "title": "Passage 3: Ecology", "jp": "キーストーン種――ラッコとケルプの森", "html": "<p>In the cold coastal waters of the North Pacific, forests grow underwater. Giant kelp, a brown alga that can lengthen by more than half a meter in a single day, rises from the rocky seafloor toward the surface, forming dense canopies that shelter fish, crabs, snails, and countless smaller organisms. Yet these forests are surprisingly fragile, and their fate depends to a remarkable degree on a single animal: the sea otter.<\/p><p>Sea otters eat sea urchins, spiny grazers that feed on kelp. When otters are present, urchin populations stay in check, and the urchins that survive tend to hide in crevices, feeding on drifting scraps of kelp rather than on living plants. When otters disappear, however, urchins multiply and move into the open, chewing through the anchoring holdfasts of kelp until the forest collapses. What remains is known as an “urchin barren”—a stretch of bare rock carpeted with urchins and little else.<\/p><p>Ecologists call animals like the sea otter keystone species, borrowing a term from architecture. A keystone is the wedge-shaped stone at the top of an arch; though it is only one stone among many, removing it causes the whole structure to fall. Similarly, a keystone species has an effect on its ecosystem far out of proportion to its abundance. Sea otters are never the most numerous animals in a kelp forest, but their presence shapes the entire community.<\/p><p>The evidence for this relationship is unusually clear because of a tragic natural experiment. During the eighteenth and nineteenth centuries, fur traders hunted sea otters nearly to extinction across much of their range. Where otters vanished, kelp forests gave way to barrens. After international protections took effect in 1911, otters slowly returned to some coastlines, and researchers watched the kelp return with them.<\/p><p>The story is not entirely simple. In some regions, warming waters and disease among sea stars—another urchin predator—have complicated the picture, and otter recovery alone has not restored every forest. Still, the sea otter remains one of the clearest examples of how the loss of a single species can unravel an ecosystem, and how its return can help knit one back together.<\/p>", "questions": [{"prompt": "The primary purpose of the passage is to", "choices": ["argue that the fur trade should be banned once again", "describe the complete life cycle of giant kelp", "compare the hunting habits of sea otters and sea stars", "explain how sea otters function as a keystone species in kelp forests", "propose a new method for restoring urchin barrens"], "ans": "D", "expl": "ラッコ→ウニ→ケルプの関係を説明し、第3段落で「keystone species」という概念を定義、第4段落で歴史的証拠を示しています。全体として「ラッコがキーストーン種としてどう働くか」の説明なのでD。毛皮取引は証拠として触れられるだけでAは誤り。Eの「新しい方法の提案」はありません。"}, {"prompt": "According to the passage, when sea otters are present, sea urchins tend to", "choices": ["move into the open and eat living kelp", "hide in crevices and feed on drifting scraps of kelp", "multiply rapidly and form urchin barrens", "migrate to warmer waters farther south", "compete with sea stars for living space"], "ans": "B", "expl": "第2段落「the urchins that survive tend to hide in crevices, feeding on drifting scraps of kelp」に一致するのでB。AとCはラッコが「いなくなったとき」の様子で、条件を入れ替えた典型的な引っ掛けです。"}, {"prompt": "The author describes the keystone of an arch in the third paragraph primarily in order to", "choices": ["show that ecologists were originally trained as architects", "suggest that kelp forests are shaped like arches", "clarify how a species that is not numerous can still have an enormous influence", "argue that sea otters are the most common animals in kelp forests", "describe the rocky seafloor where kelp grows"], "ans": "C", "expl": "アーチの要石は「only one stone among many」なのに、取り除くと全体が崩れます。これにより「数は少なくても生態系への影響が非常に大きい（far out of proportion to its abundance）」ことを分かりやすく説明しているのでC。本文は「Sea otters are never the most numerous」と述べているのでDは逆です。"}, {"prompt": "As used in the second paragraph, the phrase “stay in check” most nearly means", "choices": ["remain under control", "are carefully examined", "are marked as completed", "are paid for in advance", "stop existing entirely"], "ans": "A", "expl": "in check は「抑制されて、制御されて」の意味。ラッコがいるとウニの数が増えすぎずに抑えられる、という文脈なのでA。check の別の意味（調べる・チェック印・小切手）を使ったB・C・Dは引っ掛け。Eは「全滅」で言い過ぎです（生き残ったウニも描かれている）。"}, {"prompt": "The final paragraph suggests that the author", "choices": ["believes sea otters cannot restore kelp forests anywhere", "considers sea stars more important than sea otters", "thinks warming waters have destroyed all remaining kelp", "doubts that the idea of keystone species is valid", "recognizes that factors other than sea otters also affect kelp forests"], "ans": "E", "expl": "「The story is not entirely simple」として、海水温の上昇やヒトデの病気も影響し「otter recovery alone has not restored every forest」と述べています。ラッコ以外の要因も認めているのでE。ただし「Still」以下でラッコが明確な例であることは維持しているので、AやDは言い過ぎ。Cの「all」も極端です。"}]}, {"id": "p4", "title": "Passage 4: World History", "jp": "江戸時代の飛脚と宿場リレー", "html": "<p>Long before telegraph wires or trains crossed Japan, news traveled on foot. During the Edo period (1603–1868), the Tokugawa shogunate governed from Edo, the city now called Tokyo, while the emperor's court remained in Kyoto and the great merchant houses thrived in Osaka. Holding such a spread-out country together required a reliable way to move information, and the answer was the <i>hikyaku<\/i>, or relay courier.<\/p><p>The system depended on the highways the shogunate maintained, above all the Tokaido, which ran roughly five hundred kilometers along the Pacific coast between Edo and Kyoto. Along these roads stood official post stations, fifty-three of them on the Tokaido alone. Each station was required to keep a supply of porters and horses ready for official business. A courier carrying government documents would run to the next station, hand off his load to a fresh runner, and rest, so that the message itself never stopped moving even though no single person carried it far.<\/p><p>The results were impressive. Urgent shogunate dispatches could reach Kyoto from Edo in only a few days, a journey that took ordinary travelers about two weeks on foot. Runners typically carried letters in a box slung from a pole over the shoulder, and travelers on the road were expected to step aside when they passed.<\/p><p>At first, these services were reserved for the government and for the regional lords, or daimyo, who ran their own courier networks. But as commerce grew, private businesses saw an opportunity. By the late seventeenth century, merchant courier companies were carrying letters, money, and goods for paying customers between the three great cities. Merchants who could learn rice prices in Osaka before their rivals did held a real advantage, and they were willing to pay well for speed.<\/p><p>The <i>hikyaku<\/i> system lasted until the Meiji government introduced a modern, Western-style postal service in 1871. Yet the older network had already accomplished something important: it had accustomed people across Japan to the idea that a letter sent from one end of the country could arrive, reliably, at the other.<\/p>", "questions": [{"prompt": "Which of the following best states the main idea of the passage?", "choices": ["Japan's Edo-period relay couriers moved information efficiently and helped prepare the country for modern communication.", "The Tokaido was the longest highway in the world during the Edo period.", "Merchants in Osaka controlled the shogunate through their courier companies.", "The Meiji government's postal service was slower than the older courier system.", "Ordinary travelers in Edo-period Japan were forbidden to use the highways."], "ans": "A", "expl": "飛脚のリレーの仕組み、その速さ、商人への広がり、そして最終段落で「人々に手紙が確実に届くという考えを根付かせた」と後世への意義を述べています。全体をまとめたAが正解。Bの「世界最長」、Cの「支配」、Dの比較は本文にありません。Eは旅人が道を譲ったとあるだけで、使用禁止ではありません。"}, {"prompt": "According to the passage, all of the following were true of the Edo-period courier system EXCEPT:", "choices": ["Post stations kept porters and horses ready for official business.", "Runners often carried letters in a box hung from a pole.", "Travelers were expected to step aside for passing couriers.", "Some daimyo operated their own courier networks.", "Each courier carried his message the entire distance from Edo to Kyoto."], "ans": "E", "expl": "EXCEPT問題なので本文と「合わない」ものを選びます。第2段落に「hand off his load to a fresh runner ... no single person carried it far」とあり、一人が全行程を運んだわけではないのでEが誤り＝正解。A・B・C・Dはそれぞれ第2〜4段落に記述があります。"}, {"prompt": "The fourth paragraph suggests that merchants valued fast courier service mainly because", "choices": ["the government required them to report their profits quickly", "timely information about prices could give them a business advantage", "they wanted to send personal letters to the emperor", "the official post stations refused to carry their goods at any price", "rice could spoil if it was not delivered within a few days"], "ans": "B", "expl": "「Merchants who could learn rice prices in Osaka before their rivals did held a real advantage」とあり、相場情報をいち早く得ることが利益につながったのでB。Eは「rice」という語につられた引っ掛けで、運んでいたのは米そのものではなく価格情報の話です。"}, {"prompt": "As used in the third paragraph, the word “dispatches” most nearly means", "choices": ["killings", "departures", "shipments of rice", "official messages", "bursts of speed"], "ans": "D", "expl": "「Urgent shogunate dispatches could reach Kyoto」――幕府の急ぎの「公文書・公式の知らせ」が京都に届く、という意味なのでD。dispatch には「殺害」「迅速さ」などの意味もありますが文脈に合いません（A・Eは引っ掛け）。"}, {"prompt": "The final paragraph primarily serves to", "choices": ["describe the daily routine of a typical courier", "criticize the Meiji government for ending the old system", "assess the lasting significance of the courier system after it was replaced", "explain how the modern postal service was financed", "introduce a new topic unrelated to the rest of the passage"], "ans": "C", "expl": "1871年に近代郵便に置き換えられたと述べた後、「Yet the older network had already accomplished something important」と、旧制度が残した意義を評価しているのでC。明治政府を批判してはいないのでBは誤り。"}]}, {"id": "p5", "title": "Passage 5: Psychology", "jp": "成長マインドセットと記憶", "html": "<p>Most students have had the experience of rereading a chapter the night before a test and feeling confident—only to find, the next morning, that the material has mysteriously evaporated. Psychologists who study learning have a name for part of this problem: the illusion of fluency. When information looks familiar, we mistake that familiarity for mastery. Rereading feels productive precisely because it is easy, but ease is often a poor sign that anything has been stored for the long term.<\/p><p>Research on memory suggests that the strategies that work best tend to feel worst while we use them. Testing yourself, spacing study sessions over several days, and mixing different types of problems all require more effort than rereading, and they often produce more mistakes along the way. Yet those very struggles appear to strengthen memory. The psychologist Robert Bjork has called such obstacles “desirable difficulties”: challenges that slow learning in the moment but make it more durable.<\/p><p>This is where a student's beliefs about ability come in. The psychologist Carol Dweck has described two broad “mindsets.” Students with a fixed mindset tend to see intelligence as a set quantity; for them, struggling with a task is evidence that they lack talent, so they avoid it. Students with a growth mindset see ability as something that develops with effort and good strategies; for them, struggle is simply part of how learning happens.<\/p><p>Put these ideas together, and a pattern emerges. A student who interprets every forgotten answer during a self-quiz as proof of being “bad at science” may abandon the quiz and return to comfortable rereading. A student who interprets the same moment as useful feedback is more likely to keep going—and to remember more as a result.<\/p><p>Researchers continue to debate how large the effects of mindset are, and simply telling students to “believe in themselves” rarely changes much on its own. The more promising lesson may be practical: when studying feels difficult, that difficulty is not necessarily a sign of failure. Often, it is the feeling of memory being built.<\/p>", "questions": [{"prompt": "The primary purpose of the passage is to", "choices": ["prove that rereading is the most effective way to study", "describe Carol Dweck's childhood and education", "argue that intelligence cannot change over a person's lifetime", "criticize teachers for giving too many tests", "explain how students' beliefs about ability may affect whether they use effective but difficult study strategies"], "ans": "E", "expl": "第1・2段落で「効果的な学習法ほど難しく感じる」ことを説明し、第3・4段落でマインドセット（能力観）がその学習法を続けるかどうかに影響すると結びつけています。両者をつなぐEが正解。Aは本文と逆、Cは固定マインドセットの考え方で筆者の主張ではありません。"}, {"prompt": "As described in the first paragraph, the “illusion of fluency” refers to", "choices": ["the ability to speak a foreign language without an accent", "the belief that tests are unfair to most students", "mistaking familiarity with material for genuine mastery of it", "forgetting information immediately after reading it", "the habit of studying with friends instead of alone"], "ans": "C", "expl": "「When information looks familiar, we mistake that familiarity for mastery」と定義されているのでC。fluency を「語学の流暢さ」と取るAは引っ掛け。Dは「錯覚」の結果として起きることで、錯覚そのものの定義ではありません。"}, {"prompt": "Based on the passage, which student most clearly demonstrates a growth mindset combined with an effective study strategy?", "choices": ["A student who rereads her notes five times because doing so feels productive", "A student who stops doing practice problems after a few mistakes, deciding he is “just not a math person”", "A student who studies only the subjects in which she already earns high grades", "A student who misses several questions on a practice quiz, reviews those topics, and quizzes herself again two days later", "A student who stays up all night before an exam reading the textbook"], "ans": "D", "expl": "応用問題。ミスを「useful feedback」と捉えて続けるのが成長マインドセット、自己テスト（testing yourself）と間隔をあけた学習（spacing）が効果的な方法です。両方を満たすのはD。Aは「illusion of fluency」、Bは固定マインドセット、Eは一夜漬けの再読で、いずれも本文が否定的に描いている例です。"}, {"prompt": "In the final paragraph, the author's attitude toward mindset research can best be described as", "choices": ["dismissive and scornful", "cautiously optimistic", "wholeheartedly enthusiastic", "openly hostile", "completely indifferent"], "ans": "B", "expl": "「効果の大きさは議論が続いている」「“自分を信じろ”と言うだけではほとんど変わらない」と限界を認めつつ、「The more promising lesson may be practical」と有益な教訓も示しています。慎重だが肯定的なのでB。限界を認めているのでC（手放しの熱狂）は誤り、有益さも述べているのでA・Dも誤りです。"}, {"prompt": "As used in the second paragraph, the word “durable” most nearly means", "choices": ["long-lasting", "difficult to handle", "physically heavy", "easy to achieve", "clearly visible"], "ans": "A", "expl": "「challenges that slow learning in the moment but make it more durable」――その場では学習を遅くするが、より「長持ちする」ものにする、という対比なのでA。durable は「耐久性のある、長続きする」。「in the moment（その場では）」との対比がヒントです。"}]}, {"id": "p6", "title": "Passage 6: Persuasive Essay", "jp": "公共図書館の価値", "html": "<p>Every few years, someone announces that the public library is obsolete. Why, the argument goes, should a city pay for buildings full of books when nearly everything can be found online? The question sounds reasonable until you spend an afternoon inside an actual library and watch what people are doing there.<\/p><p>On a typical weekday at the branch near my apartment, a retired man reads three newspapers he could not afford to subscribe to. A teenager without a laptop at home types a college application on a public computer. Two toddlers sit on a rug while a librarian reads aloud, and their parents, recent immigrants, pick up a flyer for free English conversation classes. Near the window, a woman applies for jobs using the building's Wi-Fi. None of these people is there out of nostalgia for the smell of paper.<\/p><p>The deeper point is that the library is one of the few places left in American life where no one is expected to buy anything. Cafés charge for coffee; malls exist to sell. The library asks only that you return what you borrow. In a society increasingly divided by what people can afford, that simple rule makes the library quietly radical. It offers the same resources to the wealthy and the struggling, and it treats both as citizens rather than customers.<\/p><p>Critics are right that the internet has changed how we find information. But access to information is not the same as the ability to use it. Librarians help patrons distinguish reliable sources from misleading ones, navigate government forms, and find the right book for a reluctant reader. These skills matter more, not less, in an age of endless and unfiltered content.<\/p><p>Funding a library is not an act of charity or sentimentality. It is an investment in an informed public, in children who learn to love reading, and in adults who get a second chance. Before we decide that libraries are relics, we should ask what—if anything—would replace them. So far, no one has offered a convincing answer.<\/p>", "questions": [{"prompt": "Which of the following best expresses the author's main argument?", "choices": ["Libraries should stop buying printed books and focus entirely on computers.", "Public libraries remain valuable because they offer free access, services, and guidance that the internet alone cannot provide.", "The internet has made it impossible to find reliable information.", "Cafés and malls should be required to offer free services to the public.", "Librarians should be paid more than other public employees."], "ans": "B", "expl": "「図書館は時代遅れ」という主張に反論し、無料で誰にでも開かれていること、司書による支援などネットだけでは代替できない価値を挙げて「投資」だと結論づけています。Bが正解。Cは「impossible」が極端で、筆者は批評家の指摘も一部認めています。A・D・Eは本文にありません。"}, {"prompt": "The second paragraph functions primarily to", "choices": ["provide concrete examples that challenge the claim that libraries are obsolete", "describe the architecture of the author's local library", "suggest that libraries are used mainly by retired people", "admit that libraries have become less popular in recent years", "explain how libraries are funded by city governments"], "ans": "A", "expl": "第1段落で「実際に図書館で人々が何をしているか見てほしい」と述べ、第2段落で新聞を読む退職者、パソコンを使う10代、読み聞かせを聞く幼児、仕事を探す女性など具体例を並べ、「時代遅れ」論に反論しています。A。Cは利用者の一例にすぎず「mainly」は誤りです。"}, {"prompt": "The author describes the library as “quietly radical” in the third paragraph because it", "choices": ["hosts political protests in its reading rooms", "encourages patrons to break rules they disagree with", "has dramatically changed its appearance in recent years", "offers the same resources to everyone without requiring them to pay, which is unusual in a commercial society", "competes aggressively with cafés and malls for customers"], "ans": "D", "expl": "直前で「何も買うことを期待されない数少ない場所」「the same resources to the wealthy and the struggling」「citizens rather than customers」と述べています。お金で分断される社会で全員に平等に無料で提供する点が「静かに急進的」なのでD。radical を「過激な政治活動」と取るAは引っ掛けです。"}, {"prompt": "The author would most likely agree with which of the following statements?", "choices": ["The internet has had no real effect on how people find information.", "Supporting libraries is mainly an act of kindness toward the poor.", "Having access to information does not guarantee that a person can evaluate or use it well.", "Children no longer need help learning to love reading.", "Libraries should charge small fees to cover their costs."], "ans": "C", "expl": "第4段落「access to information is not the same as the ability to use it」に一致するのでC。筆者は「Critics are right that the internet has changed how we find information」と認めているのでAは誤り。「not an act of charity」と明言しているのでBも誤り。Eは「何も買う必要がない」という主張と矛盾します。"}, {"prompt": "The overall tone of the passage is best described as", "choices": ["bitter and resentful", "detached and neutral", "nostalgic and sentimental", "humorous and mocking", "earnest and persuasive"], "ans": "E", "expl": "具体例と論理で読者を説得しようとする真剣な文章なのでE。筆者は「None of these people is there out of nostalgia」「not an act of ... sentimentality」とノスタルジーや感傷を明確に否定しているので、Cは典型的な引っ掛けです。意見を強く主張しているのでBの「中立」も誤り。"}]}, {"id": "p7", "title": "Passage 7: Architecture and Art", "jp": "ゴシック大聖堂と光", "html": "<p>To step into a Romanesque church of the eleventh century is to enter a world of thick walls, rounded arches, and shadow. The heavy stone vaults these churches carried pressed outward on the walls, which had to be massive to resist the force, and windows were kept small for fear of weakening them. The effect could be solemn and protective, like a fortress for the faithful.<\/p><p>Within a few generations, builders in northern France had transformed this architecture. Around 1140, Abbot Suger began rebuilding the choir of the abbey church of Saint-Denis, near Paris, and he wanted something new: a space flooded with what he called “wonderful and uninterrupted light.” Suger believed that light could lift the mind from the material world toward the divine, and he gave his builders a spiritual goal as much as a structural one.<\/p><p>Meeting that goal required engineering ingenuity. Pointed arches directed the weight of the vaults more steeply downward than rounded ones did. Ribbed vaults concentrated that weight onto a few slender piers rather than spreading it along the entire wall. Most dramatically, flying buttresses—stone arms reaching from the outside of the building—caught the remaining outward thrust and carried it to the ground. Freed from their load-bearing duties, the walls could be opened up, and what had been stone became glass.<\/p><p>The results still astonish visitors. At the Sainte-Chapelle in Paris, completed in the 1240s, the upper chapel seems to consist almost entirely of colored windows, so that the stone frame nearly disappears. At Chartres Cathedral, the deep blue glass casts shifting pools of color across the floor as the sun moves through the day. For medieval worshippers, many of whom could not read, the windows also served as books, telling stories from scripture in images.<\/p><p>It is tempting to see Gothic cathedrals as monuments of stone, but in a sense their true material is light. The stone exists to hold the glass, and the glass exists to transform the sun. The builders' achievement was not only to make buildings taller, but to make them glow.<\/p>", "questions": [{"prompt": "Which of the following best states the main idea of the passage?", "choices": ["Romanesque churches were more beautiful than Gothic cathedrals.", "Abbot Suger personally designed every Gothic cathedral in France.", "Gothic builders used engineering innovations to fill churches with light, which carried spiritual meaning.", "Medieval worshippers preferred dark churches because they felt safer.", "Stained glass was invented in Paris during the 1240s."], "ans": "C", "expl": "ロマネスクとの対比→シュジェールの「光」への精神的目標→尖頭アーチ・リブ・ヴォールト・飛び梁による壁の開放→光の効果、と展開し「their true material is light」と結論づけます。技術革新と光の宗教的意味をまとめたCが正解。Bの「every」、Eの「invented」は本文にありません。"}, {"prompt": "According to the passage, windows in Romanesque churches were kept small because", "choices": ["colored glass was too expensive for most churches", "worshippers did not want to be distracted by the outside world", "Abbot Suger forbade large windows", "the builders believed light was harmful to the mind", "large openings might weaken walls that had to resist the outward push of the vaults"], "ans": "E", "expl": "第1段落「The heavy stone vaults ... pressed outward on the walls, which had to be massive ... windows were kept small for fear of weakening them」に一致するのでE。シュジェールはむしろ光を求めた人物なのでCとDは逆。Aの費用の話は書かれていません。"}, {"prompt": "All of the following are described as features that helped Gothic builders open up their walls EXCEPT", "choices": ["massive load-bearing walls", "pointed arches", "ribbed vaults", "flying buttresses", "slender piers that received concentrated weight"], "ans": "A", "expl": "EXCEPT問題。第3段落で、尖頭アーチ（B）、リブ・ヴォールト（C）、飛び梁（D）、重さを集中して受ける細い柱（E）が壁を開放する工夫として挙げられています。「massive（分厚い）耐力壁」はロマネスク建築の特徴で、ゴシックはむしろ壁を荷重から解放した（Freed from their load-bearing duties）ので、Aが正解です。"}, {"prompt": "It can be inferred from the second paragraph that Abbot Suger", "choices": ["was mainly interested in making churches stronger against attack", "had no interest in the religious purpose of architecture", "trained as a stonemason before becoming an abbot", "viewed architecture as a way of expressing religious ideas", "disliked the city of Paris"], "ans": "D", "expl": "シュジェールは「light could lift the mind ... toward the divine」と信じ、「a spiritual goal as much as a structural one」を建築家に与えました。建築を宗教的思想の表現手段と見ていたと推測できるのでD。Bは正反対。Aの「要塞のような防御」はロマネスク教会の印象の描写で、シュジェールの関心ではありません。"}, {"prompt": "In the final paragraph, the statement that the cathedrals' “true material is light” suggests that", "choices": ["Gothic cathedrals were actually built from glass rather than stone", "the stone structure ultimately existed to hold glass and shape the light passing through it", "the cathedrals were lit mainly by candles and lamps", "builders cared more about height than about appearance", "the stone in the cathedrals has worn away over the centuries"], "ans": "B", "expl": "直後に「The stone exists to hold the glass, and the glass exists to transform the sun」とあり、石は光を形づくるための手段にすぎない、という意味なのでB。Aは比喩を文字通りに取った引っ掛け。「not only to make buildings taller, but to make them glow」とあるのでDも逆です。"}]}, {"id": "p8", "title": "Passage 8: Medical Science", "jp": "ワクチンが免疫を「訓練」するしくみ", "html": "<p>Every day, your body encounters millions of microbes, and most of them never make you sick. Credit for this belongs largely to the immune system, a network of cells and proteins that identifies invaders and destroys them. Vaccines work by taking advantage of one of this system's most remarkable abilities: it can remember.<\/p><p>When a new pathogen—a disease-causing virus or bacterium—enters the body, the immune system must first recognize it. Specialized cells detect molecules on the pathogen's surface called antigens, which act something like a uniform identifying an enemy soldier. In response, white blood cells called B cells begin producing antibodies, proteins shaped to latch onto that specific antigen and mark the invader for destruction. Meanwhile, T cells help coordinate the attack, and some kill infected cells directly.<\/p><p>This first response is slow. It may take a week or more for the body to produce enough of the right antibodies, and during that time the pathogen can multiply and cause serious illness. But once the infection is defeated, the immune system keeps a record. Some B and T cells become long-lived memory cells. If the same pathogen appears again, these cells recognize it at once and launch a faster, stronger response, often clearing the infection before any symptoms appear.<\/p><p>A vaccine allows the body to form these memories without having to survive the disease first. Different vaccines accomplish this in different ways. Some contain weakened or inactivated forms of a pathogen; others contain only a harmless piece of it, such as a single surface protein; still others give cells instructions to make that protein themselves for a short time. In each case, the immune system sees the antigen, mounts a response, and stores the memory—essentially rehearsing for a battle it has not yet had to fight.<\/p><p>Because some memories fade over time, and because some pathogens change their antigens, certain vaccines require booster doses. Seasonal flu vaccines, for example, are updated regularly to match the strains expected to circulate. The principle, though, remains the same one that has made vaccines among the most effective tools in the history of medicine: teach the body in advance, and it will be ready.<\/p>", "questions": [{"prompt": "The primary purpose of the passage is to", "choices": ["compare the costs of different types of vaccines", "argue that the immune system is unable to fight most microbes", "describe the history of the first vaccine ever developed", "explain how vaccines use the immune system's ability to remember in order to protect the body", "warn readers about the dangers of booster doses"], "ans": "D", "expl": "第1段落の「it can remember」を軸に、初回の免疫反応、記憶細胞、ワクチンがその記憶を病気にかからずに作らせる仕組みを説明しています。D。Bは「most of them never make you sick」と矛盾。Eのような警告はなく、ブースターは必要な理由として説明されているだけです。"}, {"prompt": "The author compares antigens to “a uniform identifying an enemy soldier” in order to suggest that antigens", "choices": ["protect pathogens from being destroyed", "allow the immune system to recognize a particular invader", "are produced by B cells to fight infection", "change constantly so that they cannot be identified", "are found only on bacteria, not on viruses"], "ans": "B", "expl": "軍服が「敵の兵士」を見分ける目印になるように、抗原は免疫系が特定の侵入者を識別する目印になる、という比喩なのでB。B細胞が作るのは「抗体（antibodies）」であり、抗原（antigens）と混同させるCは定番の引っ掛けです。"}, {"prompt": "According to the passage, the body's first response to a new pathogen can be dangerous because", "choices": ["memory cells attack the body's own healthy tissue", "T cells refuse to cooperate with B cells", "antibodies cause the pathogen to change its antigens", "the pathogen is immediately cleared before symptoms appear", "it may take a week or more to make enough antibodies, giving the pathogen time to multiply"], "ans": "E", "expl": "第3段落「It may take a week or more ... during that time the pathogen can multiply and cause serious illness」に一致するのでE。Dは2回目以降（記憶細胞がある場合）の反応の説明で、条件を入れ替えた引っ掛けです。"}, {"prompt": "The final paragraph suggests that seasonal flu vaccines are updated regularly because", "choices": ["the flu viruses that circulate can change their antigens", "the immune system cannot form memory cells against the flu", "older vaccines become poisonous after one year", "doctors want patients to visit them more often", "flu vaccines contain no antigens at all"], "ans": "A", "expl": "「some pathogens change their antigens, certain vaccines require booster doses」の後に、インフルエンザワクチンが「流行が予想される株に合わせて」更新されると例示しています。ウイルスの抗原が変わるためなのでA。Bは「cannot」が言い過ぎ、C・D・Eは根拠がありません。"}, {"prompt": "Based on the passage, the way a vaccine prepares the body is most similar to", "choices": ["a doctor setting a broken bone after an accident", "a patient taking pain medicine after an injury", "a school holding a fire drill so that students can practice evacuating before a real fire", "a city rebuilding its neighborhoods after an earthquake", "a family installing a lock only after their house has been robbed"], "ans": "C", "expl": "類推問題。ワクチンは「rehearsing for a battle it has not yet had to fight」「teach the body in advance」とあるように、本番の前に安全に予行演習するもの。実際の火事の前に避難訓練をするCが最も近い。A・B・D・Eはいずれも被害が起きた「後」の対応なので、「事前に備える」という本質と合いません。"}]}]}, "verbal": {"synonyms": [{"word": "RIGID", "choices": ["stiff", "rapid", "frigid", "gentle", "hollow"], "ans": "A", "expl": "rigid は「硬くて曲がらない・融通の利かない」。stiff（硬い）が同義。frigid（極寒の・冷淡な）は綴りが似ている引っ掛け。rapid（速い）も音が似ているだけ。"}, {"word": "PROHIBIT", "choices": ["permit", "exhibit", "forbid", "promote", "examine"], "ans": "C", "expl": "prohibit は「禁止する」で forbid と同義。permit（許可する）は反意語の引っ掛け。exhibit（展示する）は語尾 -hibit が同じだけの見た目の罠。"}, {"word": "SCARCE", "choices": ["frightening", "rare", "abundant", "scattered", "harsh"], "ans": "B", "expl": "scarce は「乏しい・まれな」で rare が正解。scare（怖がらせる）と混同して frightening を選ばないこと。abundant（豊富な）は反意語。"}, {"word": "TRANQUIL", "choices": ["anxious", "temporary", "trivial", "noisy", "calm"], "ans": "E", "expl": "tranquil は「静かで穏やかな」で calm が同義。anxious（不安な）、noisy（騒がしい）は反意的な引っ掛け。"}, {"word": "VIVID", "choices": ["divided", "dull", "living", "bright", "faint"], "ans": "D", "expl": "vivid は「（色・記憶などが）鮮やかな」で bright が同義。語根 viv-（生命）から living を選びがちだが「生きている」とは意味が違う。dull・faint（ぼんやりした）は反意語。"}, {"word": "OBSOLETE", "choices": ["absolute", "outdated", "solitary", "modern", "durable"], "ans": "B", "expl": "obsolete は「時代遅れの・廃れた」で outdated が正解。absolute（絶対的な）は発音が似た引っ掛け。modern は反意語。"}, {"word": "NOTORIOUS", "choices": ["observant", "anonymous", "punctual", "infamous", "generous"], "ans": "D", "expl": "notorious は「（悪い意味で）有名な・悪名高い」で infamous が同義。infamous は「無名」ではなく「悪名高い」なので注意。anonymous（匿名の）は反意的。"}, {"word": "PLAUSIBLE", "choices": ["believable", "praiseworthy", "absurd", "pliable", "visible"], "ans": "A", "expl": "plausible は「もっともらしい・信じられる」で believable が正解。praiseworthy は applaud（拍手する）との連想の罠、pliable（曲げやすい）は見た目の罠。absurd（ばかげた）は反意語。"}, {"word": "RESILIENT", "choices": ["silent", "fragile", "resentful", "reluctant", "quick to recover"], "ans": "E", "expl": "resilient は「回復力のある・立ち直りが早い」で quick to recover が正解。中に silent が含まれる見た目の罠、re- で始まる resentful（憤慨した）・reluctant（気が進まない）も引っ掛け。fragile（壊れやすい）は反意的。"}, {"word": "SERENE", "choices": ["severe", "sincere", "peaceful", "agitated", "serious"], "ans": "C", "expl": "serene は「穏やかな・落ち着いた」で peaceful が同義。severe（厳しい）、sincere（誠実な）、serious（真剣な）は綴り・音の似た引っ掛け。agitated（動揺した）は反意語。"}, {"word": "OMINOUS", "choices": ["enormous", "all-knowing", "threatening", "cheerful", "common"], "ans": "C", "expl": "ominous は omen（前兆）から「不吉な・脅かすような」。threatening が正解。omniscient（全知の）と混同して all-knowing を選ぶのが典型的な罠。enormous は語尾が似ているだけ。"}, {"word": "TENACIOUS", "choices": ["tender", "timid", "tense", "yielding", "persistent"], "ans": "E", "expl": "tenacious は「粘り強い・しつこい」で persistent が同義。ラテン語 tenere（つかむ）が語源。yielding（屈しやすい）は反意語、tender・tense は綴りの罠。"}, {"word": "PERPLEX", "choices": ["puzzle", "perfect", "clarify", "persuade", "reflect"], "ans": "A", "expl": "perplex は「当惑させる・困らせる」で puzzle（動詞：悩ませる）が正解。clarify（明らかにする）は反意的。per- で始まる perfect・persuade は見た目の罠。"}, {"word": "RECLUSIVE", "choices": ["reckless", "sociable", "exclusive", "solitary", "recovering"], "ans": "D", "expl": "reclusive は「世間から離れて暮らす・引きこもりがちな」で solitary（孤独を好む）が正解。sociable（社交的な）は反意語。exclusive（排他的な）は -clusive が共通なだけ。"}, {"word": "SQUANDER", "choices": ["wander", "waste", "save", "squeeze", "conquer"], "ans": "B", "expl": "squander は「（お金・時間・才能を）浪費する」で waste が同義。save は反意語。wander（さまよう）は語尾が同じ音の引っ掛け。"}, {"word": "NONCHALANT", "choices": ["nervous", "nonsensical", "enthusiastic", "unconcerned", "noncommittal"], "ans": "D", "expl": "nonchalant は「無頓着な・平然とした」で unconcerned が正解。nervous（神経質な）は反意的。noncommittal（態度をはっきりさせない）は non- が同じだけで意味が違う。"}, {"word": "PRUDENT", "choices": ["wise and careful", "proud", "rash", "prudish", "sudden"], "ans": "A", "expl": "prudent は「慎重で賢明な」。wise and careful が正解。rash（軽率な）は反意語。prudish（お堅い・上品ぶった）は綴りが非常に似た引っ掛け。"}, {"word": "VERBOSE", "choices": ["verbal", "concise", "truthful", "vertical", "wordy"], "ans": "E", "expl": "verbose は「言葉数が多い・冗長な」で wordy が同義。concise（簡潔な）は反意語。verbal（言葉の・口頭の）は語根 verb-（言葉）が同じで最も危険な引っ掛け。"}, {"word": "UBIQUITOUS", "choices": ["unique", "found everywhere", "rare", "ambiguous", "obedient"], "ans": "B", "expl": "ubiquitous は「至る所にある・遍在する」で found everywhere が正解。rare・unique は反意的。ambiguous（あいまいな）は -uous の響きが似ているだけ。"}, {"word": "REPUDIATE", "choices": ["repair", "endorse", "reject", "repeat", "recite"], "ans": "C", "expl": "repudiate は「（主張・関係などを）拒絶する・否認する」で reject が同義。endorse（支持する）は反意語。re- で始まる repair・repeat・recite は見た目の罠。"}, {"word": "TACITURN", "choices": ["talkative", "tactful", "stubborn", "tired", "reserved in speech"], "ans": "E", "expl": "taciturn は「無口な・口数の少ない」で reserved in speech が正解（tacit＝暗黙の、と同語源）。talkative は反意語。tactful（気配りのある）は綴りの罠、語尾 -turn から stubborn を連想しないこと。"}, {"word": "PAUCITY", "choices": ["abundance", "scarcity", "patience", "capacity", "purity"], "ans": "B", "expl": "paucity は「不足・少なさ」で scarcity が同義。abundance（豊富さ）は反意語。capacity・purity は -city/-ity の語尾が似た罠。"}, {"word": "SAGACIOUS", "choices": ["sagging", "talkative", "wise", "gullible", "courageous"], "ans": "C", "expl": "sagacious は「賢明な・洞察力のある」で wise が正解（sage＝賢者）。sagging（たるんだ）は綴りの罠。gullible（だまされやすい）は反意的。"}, {"word": "OSTENTATIOUS", "choices": ["showy", "modest", "obstinate", "cautious", "ostracized"], "ans": "A", "expl": "ostentatious は「見せびらかす・これ見よがしの」で showy が同義。modest（控えめな）は反意語。obstinate（頑固な）・ostracized（仲間外れにされた）は os-/ob- の見た目の罠。"}, {"word": "VACILLATE", "choices": ["vaccinate", "ventilate", "decide firmly", "waver", "validate"], "ans": "D", "expl": "vacillate は「（意見・態度が）揺れ動く・迷う」で waver が同義。decide firmly は反意。vaccinate（予防接種する）は綴りが似た典型的な罠。"}, {"word": "PERFUNCTORY", "choices": ["careless and routine", "thorough", "perfect", "functional", "enthusiastic"], "ans": "A", "expl": "perfunctory は「おざなりの・義務的にこなすだけの」で careless and routine が正解。thorough（徹底的な）・enthusiastic は反意的。perfect・functional は語の一部が含まれるだけの罠。"}, {"word": "RECALCITRANT", "choices": ["calculating", "cooperative", "recurring", "defiant", "recovering"], "ans": "D", "expl": "recalcitrant は「反抗的な・手に負えない」で defiant が同義。cooperative（協力的な）は反意語。calculating（計算高い）は -calc- の見た目の罠。"}, {"word": "QUIXOTIC", "choices": ["speedy", "impractically idealistic", "realistic", "peculiar", "quiet"], "ans": "B", "expl": "quixotic は『ドン・キホーテ（Don Quixote）』に由来し「非現実的なほど理想主義の」。impractically idealistic が正解。realistic は反意語。quick を連想して speedy、quirky を連想して peculiar を選ぶのは罠。"}, {"word": "TRUCULENT", "choices": ["truthful", "transparent", "aggressively hostile", "gentle", "trustworthy"], "ans": "C", "expl": "truculent は「けんか腰の・攻撃的な」で aggressively hostile が正解。gentle は反意語。tru- で始まる truthful・trustworthy は見た目の罠。"}, {"word": "OBSEQUIOUS", "choices": ["obvious", "rebellious", "arrogant", "observant", "excessively eager to please"], "ans": "E", "expl": "obsequious は「こびへつらう・卑屈なほど従順な」で excessively eager to please が正解。rebellious・arrogant は反意的。obvious・observant は ob- が同じだけの罠。"}], "analogies": [{"prompt": "Petal is to flower as", "choices": ["rain is to cloud", "page is to book", "painter is to canvas", "bark is to dog", "author is to novel"], "ans": "B", "expl": "ブリッジ文：花びら（petal）は花（flower）の一部である。→ページは本の一部である。rain と cloud は「雲から雨が降る」で部分ではない。bark（樹皮／犬の鳴き声）は多義語の引っ掛け。"}, {"prompt": "Brave is to courageous as happy is to", "choices": ["sad", "sleepy", "angry", "joyful", "happen"], "ans": "D", "expl": "ブリッジ文：brave と courageous は同義語（勇敢な）。→happy と同義なのは joyful。sad は反意語、happen は綴りの罠。"}, {"prompt": "Telescope is to astronomer as", "choices": ["microscope is to biologist", "star is to sky", "brush is to paint", "scalpel is to hospital", "lens is to camera"], "ans": "A", "expl": "ブリッジ文：望遠鏡は天文学者が使う道具である。→顕微鏡は生物学者が使う道具である。scalpel（メス）の使用者は surgeon で、hospital は場所なので不可。lens と camera は部分と全体。"}, {"prompt": "Ancient is to modern as fiction is to", "choices": ["novel", "story", "nonfiction", "author", "fantasy"], "ans": "C", "expl": "ブリッジ文：ancient（古代の）と modern（現代の）は反意語。→fiction（作り話）の反対は nonfiction（事実に基づく作品）。novel・fantasy は fiction の一種で反対ではない。"}, {"prompt": "Sculptor is to statue as", "choices": ["actor is to stage", "chemist is to laboratory", "reader is to book", "conductor is to orchestra", "poet is to sonnet"], "ans": "E", "expl": "ブリッジ文：彫刻家は彫像を作り出す（職人と作品）。→詩人はソネットを作り出す。stage・laboratory は働く場所、conductor は orchestra を指揮するが作るわけではない。reader は本を作らない。"}, {"prompt": "Thermometer is to temperature as scale is to", "choices": ["weight", "fish", "music", "balance", "height"], "ans": "A", "expl": "ブリッジ文：温度計は温度を測る道具である。→はかり（scale）は重さを測る。scale には「うろこ（fish）」「音階（music）」の意味もある多義語の引っ掛け。height を測るのは ruler など。"}, {"prompt": "Warm is to scorching as", "choices": ["cold is to hot", "damp is to dry", "bright is to sun", "loud is to noise", "chilly is to frigid"], "ans": "E", "expl": "ブリッジ文：scorching（焼けつくような）は warm（暖かい）の程度がずっと強いもの。→frigid（極寒の）は chilly（肌寒い）の強いもの。cold/hot や damp/dry は反意語なので不可。"}, {"prompt": "Sonnet is to poem as mammal is to", "choices": ["whale", "fur", "animal", "milk", "reptile"], "ans": "C", "expl": "ブリッジ文：ソネットは詩の一種である（種類とカテゴリー）。→哺乳類は動物の一種である。whale は哺乳類の一種で向きが逆、reptile は同列の別カテゴリー、fur・milk は特徴。"}, {"prompt": "Archive is to documents as", "choices": ["museum is to curator", "aquarium is to fish", "library is to silence", "garage is to driving", "orchestra is to violin"], "ans": "B", "expl": "ブリッジ文：アーカイブ（記録保管所）は文書を保管する場所である。→水族館は魚を飼育・展示する場所である。museum と curator は「場所と働く人」、orchestra と violin は全体と部分。"}, {"prompt": "Lens is to focus as filter is to", "choices": ["coffee", "camera", "water", "purify", "pour"], "ans": "D", "expl": "ブリッジ文：レンズの役割（機能）は焦点を合わせることである。→フィルターの役割は（不純物を取り除いて）浄化すること。coffee・water はろ過される対象、camera は使われる場所で機能ではない。"}, {"prompt": "Friction is to heat as", "choices": ["water is to ice", "sun is to sky", "rain is to umbrella", "erosion is to canyon", "sound is to ear"], "ans": "D", "expl": "ブリッジ文：摩擦は熱を生み出す（原因と結果）。→浸食は峡谷を生み出す。water と ice は状態変化で「原因」ではない。rain と umbrella は「防ぐ道具」の関係。"}, {"prompt": "Anonymous is to name as amorphous is to", "choices": ["color", "shape", "weight", "love", "sound"], "ans": "B", "expl": "ブリッジ文：anonymous（匿名の）とは名前が欠けていること。→amorphous（無定形の）とは形（shape）が欠けていること。a-（ない）＋morph（形）。amor-（愛）から love を選ぶのは罠。"}, {"prompt": "Glacier is to slow as", "choices": ["mountain is to snow", "river is to bank", "desert is to sand", "volcano is to lava", "cheetah is to swift"], "ans": "E", "expl": "ブリッジ文：氷河の特徴はゆっくり動くことである（もの＋形容詞的特徴）。→チーターの特徴は速いことである。他の選択肢はすべて名詞同士で「構成物・関連物」の関係なので、特徴を表す形容詞ではない。"}, {"prompt": "Hypothesis is to experiment as draft is to", "choices": ["revision", "pencil", "writer", "paper", "idea"], "ans": "A", "expl": "ブリッジ文：仮説を立てた後に実験が行われる（順序）。→下書きの後に推敲（revision）が行われる。idea は draft より前に来るので順序が逆。pencil・paper は道具、writer は人。"}, {"prompt": "Lucid is to clear as", "choices": ["vague is to precise", "lucky is to fortune", "arduous is to difficult", "brilliant is to dim", "ink is to clarity"], "ans": "C", "expl": "ブリッジ文：lucid（明快な）と clear は同義語。→arduous（骨の折れる）と difficult は同義語。vague/precise、brilliant/dim は反意語。lucky は lucid と綴りが似ているだけ。"}, {"prompt": "Stanza is to poem as act is to", "choices": ["actor", "perform", "play", "scene", "stage"], "ans": "C", "expl": "ブリッジ文：連（stanza）は詩を構成する一部分である。→幕（act）は戯曲（play）を構成する一部分である。scene は act のさらに一部なので逆向き。actor・perform は act の別の意味からの引っ掛け。"}, {"prompt": "Diligent is to lazy as", "choices": ["frugal is to wasteful", "timid is to shy", "loyal is to friend", "curious is to question", "generous is to giving"], "ans": "A", "expl": "ブリッジ文：diligent（勤勉な）と lazy（怠惰な）は反意語。→frugal（倹約な）と wasteful（浪費的な）も反意語。timid/shy は同義語、generous/giving も同義的なので不可。"}, {"prompt": "Cartographer is to map as lexicographer is to", "choices": ["language", "word", "library", "dictionary", "grammar"], "ans": "D", "expl": "ブリッジ文：地図製作者（cartographer）は地図を作る（職人と作品）。→辞書編集者（lexicographer）は辞書を作る。word・language は扱う素材であって完成した作品ではない。"}, {"prompt": "Dislike is to loathe as", "choices": ["praise is to criticize", "doubt is to question", "whisper is to hear", "hunger is to food", "like is to adore"], "ans": "E", "expl": "ブリッジ文：loathe（ひどく嫌う）は dislike の程度が強い形。→adore（熱愛する）は like の程度が強い形。praise/criticize は反意語、doubt/question はほぼ同程度の同義語。"}, {"prompt": "Insipid is to flavor as monotonous is to", "choices": ["sound", "variety", "boredom", "color", "speech"], "ans": "B", "expl": "ブリッジ文：insipid（味気ない）とは風味が欠けていること。→monotonous（単調な）とは変化（variety）が欠けていること。boredom は単調さが生む結果で、欠けているものではない。mono-tone から sound を選ぶのは罠。"}, {"prompt": "Chisel is to carve as", "choices": ["hammer is to nail", "pen is to paper", "needle is to thread", "brush is to artist", "loom is to weave"], "ans": "E", "expl": "ブリッジ文：のみ（chisel）は彫る（carve）ための道具である（道具と動作）。→織機（loom）は織る（weave）ための道具である。hammer/nail・pen/paper は「道具と対象物」、brush/artist は「道具と使用者」なので関係がずれる。"}, {"prompt": "Martyr is to selfless as miser is to", "choices": ["wealthy", "generous", "stingy", "poor", "lonely"], "ans": "C", "expl": "ブリッジ文：殉教者（martyr）の本質的な特徴は自己犠牲的（selfless）であること。→守銭奴（miser）の本質的な特徴はけち（stingy）であること。miser は金持ちとは限らないので wealthy は罠。generous は反意語。"}, {"prompt": "Catalyst is to accelerate as", "choices": ["anchor is to sea", "anesthetic is to numb", "fuel is to engine", "poison is to snake", "medicine is to doctor"], "ans": "B", "expl": "ブリッジ文：触媒（catalyst）の目的は（反応を）加速させることである（もの＋機能を表す動詞）。→麻酔薬（anesthetic）の目的は感覚を麻痺させる（numb）こと。他の選択肢は名詞同士で、場所・使われる機械・持ち主などの関係。"}, {"prompt": "Inoculation is to immunity as fertilizer is to", "choices": ["soil", "farmer", "manure", "growth", "weed"], "ans": "D", "expl": "ブリッジ文：予防接種（inoculation）は免疫という結果をもたらす（原因と結果）。→肥料は（植物の）成長という結果をもたらす。soil は肥料を入れる場所、manure は肥料の一種、farmer は使う人。"}, {"prompt": "Composer is to symphony as", "choices": ["choreographer is to dance", "musician is to concert hall", "pianist is to piano", "audience is to theater", "violinist is to bow"], "ans": "A", "expl": "ブリッジ文：作曲家は交響曲を創作する（創作者と作品）。→振付師（choreographer）はダンスを創作する。pianist/piano・violinist/bow は「演奏者と道具」、concert hall・theater は場所。"}, {"prompt": "Laconic is to verbose as placid is to", "choices": ["calm", "turbulent", "plain", "flat", "plastic"], "ans": "B", "expl": "ブリッジ文：laconic（簡潔で口数の少ない）は verbose（冗長な）の反意語。→placid（穏やかな）の反意語は turbulent（荒れ狂う）。calm は同義語の罠、plain・plastic は綴りの罠。"}, {"prompt": "Erudite is to learned as", "choices": ["austere is to severe", "lethargic is to energetic", "garrulous is to silent", "novice is to expert", "pious is to sinful"], "ans": "A", "expl": "ブリッジ文：erudite（博識な）と learned（学識のある）は同義語。→austere（厳格な・質素な）と severe（厳しい）は同義語。他の4つはすべて反意語のペアなので不可。"}, {"prompt": "Impartial is to bias as intrepid is to", "choices": ["courage", "travel", "danger", "boldness", "fear"], "ans": "E", "expl": "ブリッジ文：impartial（公平な）人には偏見（bias）が欠けている。→intrepid（勇猛な・恐れを知らない）人には恐れ（fear）が欠けている。courage・boldness は intrepid な人が「持っている」もので逆。travel は trip からの連想の罠。"}, {"prompt": "Sycophant is to flattery as", "choices": ["hermit is to company", "skeptic is to belief", "braggart is to boasting", "pacifist is to war", "miser is to generosity"], "ans": "C", "expl": "ブリッジ文：おべっか使い（sycophant）は、へつらい（flattery）を特徴として行う人である。→自慢屋（braggart）は自慢（boasting）を特徴として行う人である。他の4つは「その人に欠けている・避けるもの」の関係（hermit には付き合いがない等）なので逆の関係の引っ掛け。"}, {"prompt": "Seismograph is to tremor as barometer is to", "choices": ["storm", "thermometer", "meteorologist", "pressure", "rainfall"], "ans": "D", "expl": "ブリッジ文：地震計（seismograph）は揺れ（tremor）を測定する計器である。→気圧計（barometer）は気圧（pressure）を測定する。storm は気圧から予測されるもので直接測るものではない。meteorologist は使用者、thermometer は別の計器。"}], "writing": {"A": {"label": "Option A (Creative Prompt)", "text": "<i>“When the old telescope in the attic finally focused, I realized the star I was looking at was moving straight toward our town.”<\/i> Use this sentence as the beginning of a story. Develop your characters, setting, and plot, and bring your story to a clear ending."}, "B": {"label": "Option B (Essay Prompt)", "text": "Some people believe that studying science and studying the arts require completely different kinds of thinking, while others argue that the two have more in common than it seems. Which view do you agree with? Support your position with specific examples from your own experience, your studies, or your reading."}}}}], "vocab": [{"w": "abate", "pos": "v.", "ja": "和らぐ、弱まる", "syn": ["lessen", "subside", "diminish"], "ant": ["intensify"], "ex": "The storm finally began to abate after midnight.", "tip": "a+bate（打つ）→勢いを打ち落とすイメージ。bait（えさ）と混同しないこと。", "q": {"choices": ["abet", "amplify", "subside", "abduct", "prolong"], "ans": "C"}}, {"w": "aberration", "pos": "n.", "ja": "逸脱、異常", "syn": ["deviation", "anomaly", "abnormality"], "ant": ["norm"], "ex": "The team's poor showing was an aberration in an otherwise stellar season.", "tip": "ab（離れて）+err（さまよう、errorと同根）→正道から外れること。", "q": {"choices": ["anomaly", "abrasion", "standard", "admiration", "obligation"], "ans": "A"}}, {"w": "abhor", "pos": "v.", "ja": "ひどく嫌う、忌み嫌う", "syn": ["detest", "loathe", "despise"], "ant": ["adore", "cherish"], "ex": "She abhors cruelty to animals.", "tip": "ab（離れて）+hor（身の毛がよだつ、horrorと同根）→ぞっとして身を引く。", "q": {"choices": ["adore", "harbor", "absorb", "honor", "loathe"], "ans": "E"}}, {"w": "abridge", "pos": "v.", "ja": "要約する、短縮する", "syn": ["shorten", "condense", "abbreviate"], "ant": ["expand", "lengthen"], "ex": "The publisher released an abridged version of the novel for young readers.", "tip": "abbreviateと同語源。bridge（橋）とは無関係なので「つなぐ」系の選択肢は引っ掛け。", "q": {"choices": ["connect", "condense", "extend", "abide", "cross"], "ans": "B"}}, {"w": "abstain", "pos": "v.", "ja": "控える、慎む", "syn": ["refrain", "forgo", "avoid"], "ant": ["indulge"], "ex": "He decided to abstain from sweets during exam week.", "tip": "abs（離れて）+tain（保つ）→手を離したままにする。obtain・retainなど-tain語との混同に注意。", "q": {"choices": ["obtain", "indulge", "sustain", "refrain", "retain"], "ans": "D"}}, {"w": "abstract", "pos": "adj.", "ja": "抽象的な", "syn": ["theoretical", "conceptual", "intangible"], "ant": ["concrete"], "ex": "Love and justice are abstract ideas that are hard to define.", "tip": "abs（離れて）+tract（引く）→具体から引き離した。反意語concrete（具体的な）とセットで。", "q": {"choices": ["concrete", "theoretical", "attractive", "tangible", "distracted"], "ans": "B"}}, {"w": "abundant", "pos": "adj.", "ja": "豊富な、たくさんの", "syn": ["plentiful", "ample", "copious"], "ant": ["scarce", "sparse"], "ex": "The region has abundant rainfall in the spring.", "tip": "名詞はabundance。redundant（余分な）と形が似ているので注意。", "q": {"choices": ["scarce", "redundant", "abandoned", "meager", "plentiful"], "ans": "E"}}, {"w": "accolade", "pos": "n.", "ja": "称賛、栄誉", "syn": ["praise", "honor", "tribute"], "ant": ["criticism", "censure"], "ex": "The young scientist received many accolades for her discovery.", "tip": "騎士叙任式で首（col＝neck）を抱いた儀式が語源→栄誉・賛辞。", "q": {"choices": ["tribute", "rebuke", "colleague", "accomplice", "barricade"], "ans": "A"}}, {"w": "acquiesce", "pos": "v.", "ja": "（しぶしぶ）同意する、黙って従う", "syn": ["comply", "consent", "yield"], "ant": ["resist", "protest"], "ex": "After hours of debate, the council acquiesced to the residents' demands.", "tip": "ac+quiesce（quietと同根）→文句を言わず静かに受け入れる。acquire（獲得する）は引っ掛け。", "q": {"choices": ["acquire", "protest", "question", "consent", "resist"], "ans": "D"}}, {"w": "acrimony", "pos": "n.", "ja": "（言葉・態度の）辛辣さ、とげとげしさ", "syn": ["bitterness", "rancor", "hostility"], "ant": ["goodwill", "harmony"], "ex": "The divorce was settled without acrimony.", "tip": "acr（鋭い・苦い、acidと同系）→とげのある感情。matrimony（結婚）と形が似ているので注意。", "q": {"choices": ["matrimony", "harmony", "bitterness", "ceremony", "sweetness"], "ans": "C"}}, {"w": "acute", "pos": "adj.", "ja": "鋭い、深刻な（病気が）急性の", "syn": ["sharp", "keen", "severe"], "ant": ["dull", "chronic"], "ex": "Dogs have an acute sense of smell.", "tip": "acu（針・鋭い）→acupuncture（鍼）。cute（かわいい）やaccurate（正確な）は引っ掛け。", "q": {"choices": ["cute", "dull", "mild", "keen", "accurate"], "ans": "D"}}, {"w": "adamant", "pos": "adj.", "ja": "断固とした、譲らない", "syn": ["unyielding", "resolute", "inflexible"], "ant": ["flexible", "yielding"], "ex": "She was adamant that she had locked the door.", "tip": "ギリシャ語「征服できない（硬い石）」が語源で、diamondと同語源→意志が硬い。", "q": {"choices": ["hesitant", "resolute", "adaptable", "adjacent", "timid"], "ans": "B"}}, {"w": "adept", "pos": "adj.", "ja": "熟達した、上手な", "syn": ["skilled", "proficient", "expert"], "ant": ["inept", "clumsy"], "ex": "He is adept at solving complex puzzles.", "tip": "adapt（適応する）・adopt（採用する）と綴りが似ているので要注意。反意語はinept。", "q": {"choices": ["proficient", "adopted", "inept", "clumsy", "adapted"], "ans": "A"}}, {"w": "adhere", "pos": "v.", "ja": "くっつく、（規則などを）守る", "syn": ["stick", "cling", "follow"], "ant": ["detach", "deviate"], "ex": "All players must adhere to the rules of the tournament.", "tip": "ad（〜へ）+here（くっつく）→adhesive（接着剤）。inherit（相続する）は音の引っ掛け。", "q": {"choices": ["detach", "inherit", "hesitate", "deviate", "cling"], "ans": "E"}}, {"w": "admonish", "pos": "v.", "ja": "たしなめる、諭す", "syn": ["scold", "reprimand", "caution"], "ant": ["praise", "commend"], "ex": "The teacher admonished the students for talking during the test.", "tip": "ad+mon（警告する、monitorと同根）→注意して戒める。admire（称賛する）は逆の意味。", "q": {"choices": ["admire", "praise", "reprimand", "abandon", "astonish"], "ans": "C"}}, {"w": "adroit", "pos": "adj.", "ja": "器用な、巧みな", "syn": ["skillful", "deft", "dexterous"], "ant": ["clumsy", "awkward"], "ex": "The adroit negotiator found a compromise that satisfied both sides.", "tip": "フランス語à droit（右へ）→右手が利く→器用な。adrift（漂流して）は引っ掛け。", "q": {"choices": ["deft", "awkward", "adrift", "rigid", "alert"], "ans": "A"}}, {"w": "adversary", "pos": "n.", "ja": "敵、対戦相手", "syn": ["opponent", "foe", "rival"], "ant": ["ally", "friend"], "ex": "The two chess players had been adversaries for years.", "tip": "adverse（逆の）と同根で「向かい合う者」。anniversary（記念日）は見た目の引っ掛け。", "q": {"choices": ["ally", "advertiser", "anniversary", "opponent", "advocate"], "ans": "D"}}, {"w": "adverse", "pos": "adj.", "ja": "不利な、有害な", "syn": ["unfavorable", "harmful", "hostile"], "ant": ["favorable", "beneficial"], "ex": "The drug had few adverse effects.", "tip": "adverseは「状況が不利な」、averseは「（人が）嫌がって」。diverse（多様な）とも区別。", "q": {"choices": ["favorable", "beneficial", "harmful", "advertised", "diverse"], "ans": "C"}}, {"w": "advocate", "pos": "v.", "ja": "主張する、支持する", "syn": ["support", "champion", "promote"], "ant": ["oppose"], "ex": "She advocates stricter laws against pollution.", "tip": "ad+voc（声、voice）→声を上げて支持する。名詞では「支持者・擁護者」。", "q": {"choices": ["oppose", "evoke", "revoke", "avoid", "champion"], "ans": "E"}}, {"w": "aesthetic", "pos": "adj.", "ja": "美的な、美学の", "syn": ["artistic", "tasteful"], "ant": [], "ex": "The architect cared about both the function and the aesthetic appeal of the building.", "tip": "「エステ」の語源。anesthetic（麻酔の）やathletic（運動の）と綴りが似ているので注意。", "q": {"choices": ["athletic", "artistic", "anesthetic", "practical", "ethical"], "ans": "B"}}, {"w": "affable", "pos": "adj.", "ja": "愛想のよい、気さくな", "syn": ["friendly", "amiable", "genial"], "ant": ["surly", "unfriendly"], "ex": "Our affable host made everyone feel welcome.", "tip": "af+fa（話す）+able→話しかけやすい。affordable（手ごろな）は引っ掛け。", "q": {"choices": ["surly", "affordable", "capable", "fallible", "genial"], "ans": "E"}}, {"w": "affluent", "pos": "adj.", "ja": "裕福な", "syn": ["wealthy", "prosperous", "rich"], "ant": ["poor", "impoverished"], "ex": "They grew up in an affluent suburb.", "tip": "af+flu（流れる、fluid）→富があふれ流れる。fluent（流暢な）は引っ掛け。", "q": {"choices": ["fluent", "impoverished", "prosperous", "affectionate", "influential"], "ans": "C"}}, {"w": "aggravate", "pos": "v.", "ja": "悪化させる、いらだたせる", "syn": ["worsen", "exacerbate", "irritate"], "ant": ["alleviate", "soothe"], "ex": "Scratching will only aggravate the rash.", "tip": "grav（重い、gravity）→さらに重くする。反意語alleviate（軽くする）と対で覚える。", "q": {"choices": ["alleviate", "exacerbate", "aggregate", "gratify", "soothe"], "ans": "B"}}, {"w": "agile", "pos": "adj.", "ja": "機敏な、身軽な", "syn": ["nimble", "spry"
