function startExam(planKey, custom){
  if (cur && !confirm('受験途中の模試があります。破棄して新しく開始しますか？')) return;
  const p = custom || PLANS[planKey];
  cur = {id: Date.now().toString(36), planKey, planName: p.name, name: load(LS_NAME,''),
         steps: custom ? custom.steps : p.steps(), stepIdx:0, phase:'intro', qIdx:0,
         answers:{}, conf:{}, flags:{}, elim:{}, hl:{}, essay:{prompt:'', text:''},
         used:{}, startedAt: Date.now(), endAt:null, pausedLeft:null};
  enterStep();
  saveCur();
  location.hash = '#/exam';
}
function abandon(){
  if (!confirm('受験途中の模試を破棄します。よろしいですか？')) return;
  cur = null; saveCur(); renderHome();
}

/* =====================================================================
 *  EXAM ENGINE
 * ===================================================================== */
const step = () => cur.steps[cur.stepIdx];
function enterStep(){
  cur.qIdx = 0; cur.pausedLeft = null;
  if (step().type === 'break') { cur.phase = 'run'; cur.endAt = Date.now() + step().time*1000; }
  else { cur.phase = 'intro'; cur.endAt = null; }
}
function beginStep(){
  cur.phase = 'run'; cur.endAt = Date.now() + step().time*1000; saveCur(); renderExam();
}
function timeLeft(){
  if (cur.pausedLeft != null) return cur.pausedLeft/1000;
  return cur.endAt ? (cur.endAt - Date.now())/1000 : step().time;
}
function finishStep(){
  const s = step();
  if (s.type !== 'break') cur.used[cur.stepIdx] = Math.min(s.time, Math.round(s.time - Math.max(0, timeLeft())));
  closeModal(); hideHlPop();
  cur.stepIdx++;
  if (cur.stepIdx >= cur.steps.length) return finalize();
  enterStep(); saveCur(); renderExam();
}
function finalize(){
  const a = {id: cur.id, date: Date.now(), startedAt: cur.startedAt, planKey: cur.planKey, planName: cur.planName, name: cur.name,
             steps: cur.steps.map((s,i)=>({type:s.type, key:s.key, label:s.label, qs:s.qs||[], time:s.time, used:cur.used[i]??null, wset:s.wset})),
             answers: cur.answers, conf: cur.conf, flags: cur.flags, essay: cur.essay, checks:{}};
  const list = attempts(); list.unshift(a); store(LS_ATT, list);
  cur = null; saveCur();
  location.hash = '#/result/' + a.id;
}

function tick(){
  if (!cur || !location.hash.startsWith('#/exam') || cur.phase !== 'run' || cur.pausedLeft != null) return;
  const left = timeLeft();
  const el = $('#timer');
  if (el) {
    el.textContent = fmt(left);
    el.classList.toggle('warn', left <= 300 && left > 60);
    el.classList.toggle('crit', left <= 60);
  }
  if (left <= 0) {
    if (step().type === 'break') return finishStep();
    finishStep();
    modal(`<h3 style="margin-top:0">⏰ 時間切れ</h3><p>前のセクションの制限時間が終了したため、自動的に次へ進みました。</p><button class="btn" onclick="closeModal()">OK</button>`);
  }
}
setInterval(tick, 500);

function headHTML(extra){
  const s = step(); const left = timeLeft();
  return `<div class="examhead">
    <span class="sec">${esc(s.label)}</span>${extra||''}
    <span class="sp"></span>
    <span class="small" style="opacity:.8">残り時間</span>
    <span id="timer" class="timer ${left<=60?'crit':left<=300?'warn':''}" style="${cur.hideTimer?'visibility:hidden':''}">${fmt(left)}</span>
    <button class="hbtn" onclick="cur.hideTimer=!cur.hideTimer;saveCur();renderExam()">${cur.hideTimer?'時計を表示':'時計を隠す'}</button>
    <button class="hbtn" onclick="pause()">一時停止</button>
    <button class="hbtn" onclick="location.hash='#/home'">中断</button>
  </div>`;
}

function renderExam(){
  if (!cur) return;
  const s = step();
  if (cur.pausedLeft != null) { app.innerHTML = `<div class="pausecover"><h2>一時停止中</h2><p>残り時間 ${fmt(cur.pausedLeft/1000)}（問題は非表示になっています）</p><button class="btn big" onclick="resume()">再開する</button></div>`; return; }
  if (cur.phase === 'run' && timeLeft() <= 0) { tick(); return; }

  if (s.type === 'break') {
    app.innerHTML = `<div class="exam">${headHTML()}<div class="exambody"><div class="center-card">
      <div class="card" style="text-align:center">
        <h2 style="margin-top:0">☕ ${esc(s.label)}（${s.time/60}分）</h2>
        <p>トイレ休憩・水分補給の時間です。本番では休憩も時間通りに進みます。</p>
        <p class="muted small">次：${esc(cur.steps[cur.stepIdx+1]?.label || '')}</p>
        <button class="btn big" onclick="finishStep()">休憩を終了して次へ進む</button>
      </div></div></div></div>`;
    return;
  }

  if (cur.phase === 'intro') {
    const info = SECTION_INFO[s.key];
    const n = s.type === 'writing' ? '1題（2題から選択）' : `${s.qs.length}問`;
    app.innerHTML = `<div class="exam"><div class="examhead"><span class="sec">${esc(cur.planName)}</span><span class="sp"></span>
        <span class="small">${cur.stepIdx+1} / ${cur.steps.length}</span>
        <button class="hbtn" onclick="location.hash='#/home'">ホームへ</button></div>
      <div class="exambody" style="overflow:auto"><div class="center-card">
      <div class="card">
        <div class="partlabel">${info.name}（${info.jp}）</div>
        <h1>${esc(s.label)}</h1>
        <p><b>問題数：</b>${n}　<b>制限時間：</b>${s.time/60}分</p>
        <div class="directions" style="font-size:15px">${info.directions}</div>
        ${s.type==='section' && s.key==='quant' ? '<p class="small">✏️ 計算用紙（またはホワイトボード）を用意してください。電卓は使えません。</p>' : ''}
        ${s.type==='writing' ? '<p class="small">⌨️ 本番 PC 受験ではキーボードで入力します。この画面ではスペルチェック（自動補正）はオフになっています。</p>' : ''}
        <p class="small muted">「開始」を押すとタイマーがスタートします。</p>
        <button class="btn big" onclick="beginStep()">開始</button>
      </div></div></div></div>`;
    return;
  }

  if (s.type === 'writing') return renderWriting();
  renderQuestion();
}

function renderQuestion(){
  const s = step();
  const n = s.qs[cur.qIdx]; const q = QMAP[n];
  const sel = cur.answers[n]; const el = cur.elim[n] || [];
  const pas = q.passage ? PASSAGES[q.passage] : null;
  const prevPart = cur.qIdx > 0 ? QMAP[s.qs[cur.qIdx-1]].part : null;
  const showDir = q.sec === 'verbal' && (cur.qIdx === 0 || prevPart !== q.part);
  app.innerHTML = `<div class="exam">
    ${headHTML(`<span class="qpos">Question ${cur.qIdx+1} of ${s.qs.length}</span>`)}
    <div class="exambody ${pas?'split':''}">
      ${pas ? `<div class="pane passage" id="passage">
          <div class="partlabel">${esc(pas.title)}</div>
          <div class="small muted" style="margin:4px 0 8px">ドラッグして選択するとハイライトできます
            <button class="btn sec" style="padding:2px 10px;font-size:12px;margin-left:8px" onclick="clearHl('${q.passage}')">ハイライト消去</button></div>
          <div id="ptext">${cur.hl[q.passage] || pas.html}</div></div>` : ''}
      <div class="pane qpane">
        <div class="partlabel">${q.sec==='verbal' ? (q.part==='Synonyms'?'Part A: Synonyms':'Part B: Analogies') : SECTION_INFO[q.sec].name}</div>
        ${showDir ? `<div class="directions">${PART_DIR[q.part]}</div>` : ''}
        <div class="qnum">Q${q.no}${cur.flags[n] ? ' 🚩' : ''}</div>
        <div class="prompt">${q.prompt}</div>
        <div>${q.choices.map((c,i)=>`
          <div class="choice ${sel===L[i]?'sel':''} ${el.includes(L[i])?'elim':''}" onclick="choose('${L[i]}')">
            <span class="letter">${L[i]}</span><span class="ctext">${c}</span>
            <button class="x" title="この選択肢を消去" onclick="event.stopPropagation();toggleElim('${L[i]}')">✕</button>
          </div>`).join('')}</div>
        <div class="confrow">自信度：
          ${['○','△','Skip'].map(c=>`<button class="${cur.conf[n]===c?'on':''}" onclick="setConf('${c}')">${c}</button>`).join('')}
          ${sel ? `<button style="margin-left:auto" onclick="choose(null)">解答を取り消す</button>` : ''}
        </div>
      </div>
    </div>
    <div class="examfoot">
      <button class="btn sec" ${cur.qIdx===0?'disabled':''} onclick="go(-1)">◀ 前へ</button>
      <button class="btn sec flagbtn ${cur.flags[n]?'on':''}" onclick="toggleFlag()">🚩 見直し</button>
      <button class="btn sec" onclick="showNav()">問題一覧</button>
      <span class="sp"></span>
      ${cur.qIdx < s.qs.length-1 ? `<button class="btn" onclick="go(1)">次へ ▶</button>` : `<button class="btn" onclick="confirmEnd()">セクションを終了</button>`}
    </div>
  </div>`;
}

function choose(l){ const n = step().qs[cur.qIdx]; if (l) { cur.answers[n] = l; (cur.elim[n]||[]).includes(l) && toggleElim(l, true); } else delete cur.answers[n]; saveCur(); renderQuestion(); }
function toggleElim(l, silent){ const n = step().qs[cur.qIdx]; const e = cur.elim[n] = cur.elim[n] || []; const i = e.indexOf(l); i>=0 ? e.splice(i,1) : e.push(l); if (i<0 && cur.answers[n]===l) delete cur.answers[n]; if (!silent) { saveCur(); renderQuestion(); } }
function setConf(c){ const n = step().qs[cur.qIdx]; cur.conf[n] === c ? delete cur.conf[n] : cur.conf[n] = c; saveCur(); renderQuestion(); }
function toggleFlag(){ const n = step().qs[cur.qIdx]; cur.flags[n] ? delete cur.flags[n] : cur.flags[n] = true; saveCur(); renderQuestion(); }
function go(d){ const s = step(); cur.qIdx = Math.max(0, Math.min(s.qs.length-1, cur.qIdx + d)); hideHlPop(); saveCur(); renderQuestion(); const qp = document.querySelector('.qpane'); if (qp) qp.scrollTop = 0; }
function jump(i){ cur.qIdx = i; closeModal(); saveCur(); renderQuestion(); }
function showNav(){
  const s = step();
  const un = s.qs.filter(n=>!cur.answers[n]).length;
  modal(`<h3 style="margin-top:0">問題一覧（${esc(s.label)}）</h3>
    <div class="small muted">青＝解答済み / 白＝未解答 / 🚩＝見直しマーク　未解答：${un}問</div>
    <div class="navgrid">${s.qs.map((n,i)=>`<button class="${cur.answers[n]?'ans':''} ${i===cur.qIdx?'cur':''}" onclick="jump(${i})">Q${QMAP[n].no}${cur.answers[n]?`<div class="small">${cur.answers[n]}</div>`:'<div class="small">&nbsp;</div>'}${cur.flags[n]?'<span class="f">🚩</span>':''}</button>`).join('')}</div>
    <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn sec" onclick="closeModal()">閉じる</button><button class="btn" onclick="confirmEnd()">セクションを終了</button></div>`);
}
function confirmEnd(){
  const s = step();
  let msg;
  if (s.type === 'writing') msg = `現在 <b>${words(cur.essay.text)}</b> 語です。`;
  else { const un = s.qs.filter(n=>!cur.answers[n]).length, fl = s.qs.filter(n=>cur.flags[n]).length;
         msg = `未解答：<b>${un}</b>問　見直しマーク：<b>${fl}</b>問`; }
  modal(`<h3 style="margin-top:0">${esc(s.label)} を終了しますか？</h3><p>${msg}</p>
    <p class="small muted">終了すると、このセクションには戻れません。残り時間：${fmt(timeLeft())}</p>
    <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn sec" onclick="closeModal()">戻る</button><button class="btn" onclick="finishStep()">終了して次へ</button></div>`);
}
function pause(){ cur.pausedLeft = Math.max(0, cur.endAt - Date.now()); saveCur(); renderExam(); }
function resume(){ cur.endAt = Date.now() + cur.pausedLeft; cur.pausedLeft = null; saveCur(); renderExam(); }

/* --- writing --- */
function renderWriting(){
  const e = cur.essay; const WP = WRITING_SETS[step().wset || 'v1'] || WRITING_SETS.v1;
  app.innerHTML = `<div class="exam">${headHTML()}
    <div class="exambody" style="overflow:auto"><div class="pane qpane">
      <div class="directions">${SECTION_INFO.writing.directions}</div>
      ${Object.entries(WP).map(([k,p])=>`
        <label class="choice ${e.prompt===k?'sel':''}" style="align-items:flex-start" onclick="cur.essay.prompt='${k}';saveCur();renderWriting()">
          <span class="letter">${k}</span><span class="ctext"><b>${p.label}</b><br>${p.text}</span></label>`).join('')}
      <div style="display:flex;justify-content:space-between;margin:16px 0 6px" class="small">
        <span>${e.prompt ? `選択中：Option ${e.prompt}` : '<span style="color:var(--warn)">↑ まずプロンプトを1つ選んでください</span>'}</span>
        <span>語数：<b id="wc">${words(e.text)}</b> words（目安 250〜350）</span>
      </div>
      <textarea class="essay" id="essay" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" placeholder="Write your essay here...">${esc(e.text)}</textarea>
    </div></div>
    <div class="examfoot"><span class="small muted">入力内容は自動保存されます。</span><span class="sp"></span><button class="btn" onclick="confirmEnd()">セクションを終了</button></div>
  </div>`;
  const ta = $('#essay');
  ta.addEventListener('input', () => { cur.essay.text = ta.value; $('#wc').textContent = words(ta.value); saveCur(); });
}

/* --- highlight in passage --- */
let hlPop = null;
function hideHlPop(){ if (hlPop) { hlPop.remove(); hlPop = null; } }
document.addEventListener('mouseup', ev => {
  if (ev.target.closest && ev.target.closest('.hlpop')) return;
  setTimeout(() => {
    hideHlPop();
    const pt = $('#ptext'); if (!pt) return;
    const sel = window.getSelection(); if (!sel.rangeCount || sel.isCollapsed) return;
    const r = sel.getRangeAt(0); if (!pt.contains(r.commonAncestorContainer)) return;
    const rect = r.getBoundingClientRect();
    hlPop = document.createElement('button'); hlPop.className = 'hlpop'; hlPop.textContent = '🖍 ハイライト';
    hlPop.style.left = Math.max(8, rect.left + rect.width/2 - 50) + 'px'; hlPop.style.top = Math.max(8, rect.top - 40) + 'px';
    hlPop.onclick = () => { applyHl(r); hideHlPop(); sel.removeAllRanges(); };
    document.body.appendChild(hlPop);
  }, 10);
});
function applyHl(r){
  const q = QMAP[step().qs[cur.qIdx]];
  const pt = $('#ptext');
  const walker = document.createTreeWalker(pt, NodeFilter.SHOW_TEXT);
  const nodes = []; while (walker.nextNode()) { const t = walker.currentNode; if (r.intersectsNode(t)) nodes.push(t); }
  nodes.forEach(t => {
    let s = 0, e = t.length;
    if (t === r.startContainer) s = r.startOffset;
    if (t === r.endContainer) e = r.endOffset;
    if (e <= s) return;
    const mid = t.splitText(s); mid.splitText(e - s);
    const m = document.createElement('mark'); mid.parentNode.insertBefore(m, mid); m.appendChild(mid);
  });
  cur.hl[q.passage] = pt.innerHTML; saveCur();
}
function clearHl(p){ delete cur.hl[p]; saveCur(); renderQuestion(); }

document.addEventListener('keydown', ev => {
  if (['INPUT','TEXTAREA'].includes(document.activeElement.tagName) || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  if (location.hash.startsWith('#/vocab')) return vocabKey(ev);
  if (!cur || !location.hash.startsWith('#/exam') || cur.phase !== 'run' || cur.pausedLeft != null) return;
  if (step().type !== 'section' || $('#modal').innerHTML) return;
  const k = ev.key.toUpperCase();
  if (L.includes(k)) choose(k);
  else if (ev.key === 'ArrowRight') go(1);
  else if (ev.key === 'ArrowLeft') go(-1);
});

/* =====================================================================
 *  SCORING
 * ===================================================================== */
function score(a){
  const rows = [];
  a.steps.forEach(s => (s.qs||[]).forEach(n => {
    const q = QMAP[n]; if (!q) return; const ua = a.answers[n];
    rows.push({n, q, ua, st: !ua ? 'om' : ua === q.ans ? 'ok' : 'ng', conf: a.conf[n], flag: a.flags[n]});
  }));
  const agg = list => { const ok = list.filter(r=>r.st==='ok').length, ng = list.filter(r=>r.st==='ng').length, om = list.filter(r=>r.st==='om').length;
                        return {ok, ng, om, total:list.length, raw: ok - ng/4, pct: list.length ? Math.round(ok*100/list.length) : 0}; };
  const bySec = {}; ['verbal','quant','reading'].forEach(k => { const l = rows.filter(r=>r.q.sec===k); if (l.length) bySec[k] = agg(l); });
  const byTopic = {};
  rows.forEach(r => { const t = topicKey(r.q); (byTopic[t] = byTopic[t] || []).push(r); });
  const rank = k => k==='Synonyms'?0 : k==='Analogies'?1 : k.startsWith('Math')?2 : 3;
  return {rows, all: agg(rows), bySec, byTopic: Object.fromEntries(Object.entries(byTopic).sort((a,b)=>rank(a[0])-rank(b[0]) || a[0].localeCompare(b[0],'ja')).map(([k,v])=>[k, agg(v)]))};
}
const MATH_CATS = [
  ['図形・座標', /角|三角|円|面積|周|体積|表面積|図形|座標|傾き|距離|中点|三平方|ピタゴラス|直方体|立方体|正方形|長方形|多角形|平行|相似/],
  ['統計・確率・資料', /平均|中央値|最頻|範囲|確率|資料|データ|表|グラフ|場合の数|組み合わせ|並べ|統計/],
  ['割合・比・速さ', /割合|百分率|パーセント|%|割引|利益|比|速さ|単位|仕事|濃度|利息|税/],
  ['代数（式・方程式）', /方程式|不等式|式|演算|関数|代入|因数|文字/],
  ['数の性質・計算', /.*/]
];
const mathCat = t => MATH_CATS.find(([n,re]) => re.test(t||''))[0];
const topicKey = q => q.sec==='quant' ? 'Math: ' + mathCat(q.topic) : q.sec==='reading' ? 'Reading: ' + (q.topic.split(':')[1]||q.topic).trim() : q.topic;
const SEC_LABEL = {verbal:'Verbal（語彙・類推）', quant:'Quantitative（数学）', reading:'Reading（長文読解）'};
const fmtRaw = x => (Math.round(x*100)/100).toString();

function weakness(list){
  const t = {}; const wrongCount = {};

    t[k] = t[k] || {ok:0,total:0}; t[k].total++; if (r.st==='ok') t[k].ok++;
    if (r.st !== 'ok') wrongCount[r.n] = (wrongCount[r.n]||0) + 1;

  const ws = Object.entries(wrongCount).filter(([n])=>QMAP[n]).sort((a,b)=>b[1]-a[1]).slice(0,20);

function importData(file){
  if (!file) return;
  file.text().then(t => { let inc = JSON.parse(t); let voc = null; if (!Array.isArray(inc)) { voc = inc.vocab; inc = inc.attempts || []; }

function drawList(a, s){
  const F_ = [['all','すべて'],['ng','不正解'],['om','無回答'],['wrongall','不正解＋無回答'],['flag','🚩見直しマーク'],['tri','自信度 △/Skip'],['ok','正解']];
  const cnt = k => s.rows.filter(r=>match(r,k)).length;
  $('#filters').innerHTML = F_.map(([k,l])=>`<button class="${resultFilter===k?'on':''}" onclick="resultFilter='${k}';drawList(window._a,window._s)">${l}（${cnt(k)}）</button>`).join('');
  window._a = a; window._s = s;
  const rows = s.rows.filter(r=>match(r,resultFilter));
  let lastSec = null, html = '';
  rows.forEach(r => {
    const secName = r.q.set==='v1' ? SEC_LABEL[r.q.sec] : (r.q.sub==='quant1' ? 'Quantitative 1（数学①）' : r.q.sub==='quant2' ? 'Quantitative 2（数学②）' : SEC_LABEL[r.q.sec]);
    if (secName !== lastSec) { html += `<h3>${secName}</h3>`; lastSec = secName; }
    html += qcard(r.q, r, resultFilter !== 'all' && resultFilter !== 'ok');
  });
  $('#qlist').innerHTML = rows.length ? html : '<p class="muted">該当する問題はありません。</p>';
}
function match(r,k){

}
function qcard(q, r, open){

  return `<details class="qcard" id="q-${esc(String(q.n))}" ${open?'open':''}>

      <div class="expl"><b>解説</b>　正解：(${q.ans})<br>${q.expl}</div>

function retry(ns, name){

  startExam(null, {name, steps});
}

    <h2>セット別</h2>
    <div class="grid2">${sets.map((s,i)=>{ const k = s.filter(w=>v.known[w.w]).length; return `<div class="card">
      <h3 style="margin-top:0">Set ${i+1} <span class="small muted">${esc(s[0].w)} 〜 ${esc(s[s.length-1].w)}</span></h3>
      <div style="display:flex;align-items:center;gap:8px" class="small"><div class="bar" style="flex:1"><div style="width:${Math.round(k*100/s.length)}%;background:var(--ok)"></div></div>覚えた ${k}/${s.length}</div>
      <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn" onclick="startVocab('card',${i})">単語カード</button>
        <button class="btn sec" onclick="startVocab('quiz',${i})">同義語クイズ</button>
      </div></div>`; }).join('')}</div>`;
}
function startVocab(kind, which, timed){
  const v = vstate(); let words;
  if (which === 'weak') words = VOCAB.filter(w=>(v.wrong[w.w]||0) > (v.right[w.w]||0));
  else if (which === 'random') words = shuffle(VOCAB).slice(0,20);
  else words = vocabSets()[which];
  if (kind === 'card') { const unk = words.filter(w=>!v.known[w.w]); words = unk.length ? unk : words; }
  const title = which==='weak' ? '苦手な単語' : which==='random' ? 'ランダム20問' : `Set ${which+1}`;
  VQ = {kind, title, items: kind==='quiz' ? shuffle(words) : words, i:0, flipped:false, picked:null, ok:0, ng:[], timed:!!timed, analogy:false};
  location.hash === '#/vocab/session' ? drawSession() : location.hash = '#/vocab/session';
}
function drawSession(){
  stopVocabTimer();
  if (!VQ) return renderVocab();
  const back = VQ.analogy ? '#/vocab/analogy' : '#/vocab';
  if (VQ.i >= VQ.items.length) {
    app.innerHTML = `<h1>${esc(VQ.title)}：おつかれさまでした！</h1><div class="card">
      ${VQ.kind==='card' ? `<p>${VQ.items.length}語のカードを確認しました。</p>` : `<p style="font-size:20px">正解 <b>${VQ.ok} / ${VQ.items.length}</b></p>
        ${VQ.ng.length ? `<h3>間違えた${VQ.analogy?'問題':'単語'}</h3><ul>${VQ.ng.map(x=>`<li>${x}</li>`).join('')}</ul>` : '<p>全問正解！🎉</p>'}`}
      <div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn" href="${back}" style="text-decoration:none">ドリルのトップへ</a></div></div>`;
    VQ = null; return;
  }
  const it = VQ.items[VQ.i]; const v = vstate();
  const head = `<div class="small"><a href="${back}">‹ もどる</a>　${esc(VQ.title)}　${VQ.i+1} / ${VQ.items.length}${VQ.timed?`　⏱ <b id="vt">30</b>秒`:''}</div>`;
  if (VQ.kind === 'card') {
    app.innerHTML = `${head}<div class="card flash" onclick="VQ.flipped=!VQ.flipped;drawSession()">
        <div class="fw">${esc(it.w)}</div><div class="muted">${esc(it.pos||'')}</div>
        ${VQ.flipped ? wordDetail(it) : '<p class="muted small" style="margin-top:30px">クリック（またはスペースキー）で意味を表示</p>'}
      </div>
      <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
        <button class="btn sec" ${VQ.i===0?'disabled':''} onclick="VQ.i--;VQ.flipped=false;drawSession()">◀ 前へ</button>
        <button class="btn danger" onclick="markKnown(false)">まだ（←）</button>
        <button class="btn" style="background:var(--ok)" onclick="markKnown(true)">覚えた！（→）</button>
      </div>`;
    return;
  }
  // quiz (synonym or analogy)
  const q = VQ.analogy ? it : it.q; const prompt = VQ.analogy ? it.prompt : `<span class="word">${esc(it.w.toUpperCase())}</span>`;
  const done = VQ.picked != null;
  app.innerHTML = `${head}<div class="card">
      <div class="partlabel">${VQ.analogy ? 'Analogy — ' + esc(atypeName(it.type)) : 'Synonym — 最も意味が近いものを選ぼう'}</div>
      <div class="prompt" style="margin-top:10px">${prompt}</div>
      ${q.choices.map((c,i)=>{ const l=L[i]; let cls=''; if (done) { if (l===q.ans) cls='correct'; else if (l===VQ.picked) cls='wrong'; }
        return `<div class="choice vq ${cls}" onclick="${done?'':`pickVocab('${l}')`}"><span class="letter">${l}</span><span class="ctext">${c}</span></div>`; }).join('')}
      ${done ? `<div class="expl">${VQ.picked===q.ans ? '<b style="color:var(--ok)">○ 正解！</b>' : VQ.picked==='timeout' ? '<b style="color:var(--ng)">⏰ 時間切れ</b>　正解：('+q.ans+')' : '<b style="color:var(--ng)">✕ 不正解</b>　正解：('+q.ans+')'}<br>
          ${VQ.analogy ? it.expl : wordDetail(it)}</div>
        <div style="text-align:right;margin-top:12px"><button class="btn" onclick="VQ.i++;VQ.picked=null;drawSession()">次へ ▶（Enter）</button></div>` : ''}
    </div>`;
  if (VQ.timed && !done) {
    let left = 30; vTimer = setInterval(() => { left--; const e = $('#vt'); if (e) e.textContent = left; if (left <= 0) { stopVocabTimer(); pickVocab('timeout'); } }, 1000);
  }
}
function wordDetail(it){
  return `<div class="wd"><div style="font-size:18px;margin:8px 0"><b>${esc(it.ja)}</b></div>
    ${it.syn && it.syn.length ? `<div><span class="tag ok">類義語</span> ${esc(it.syn.join(', '))}</div>` : ''}
    ${it.ant && it.ant.length ? `<div><span class="tag ng">反意語</span> ${esc(it.ant.join(', '))}</div>` : ''}
    ${it.ex ? `<div style="margin-top:6px"><i>${esc(it.ex)}</i></div>` : ''}
    ${it.tip ? `<div class="small muted" style="margin-top:6px">💡 ${esc(it.tip)}</div>` : ''}</div>`;
}
function markKnown(k){
  const v = vstate(); const it = VQ.items[VQ.i];
  if (k) v.known[it.w] = true; else delete v.known[it.w];
  vsave(v); VQ.i++; VQ.flipped = false; drawSession();
}
function pickVocab(l){
  stopVocabTimer();
  const it = VQ.items[VQ.i]; const q = VQ.analogy ? it : it.q; const v = vstate();
  VQ.picked = l; const ok = l === q.ans;
  const key = VQ.analogy ? 'a' : ''; const id = VQ.analogy ? it._id : it.w;
  if (ok) { VQ.ok++; v[key+'right'][id] = (v[key+'right'][id]||0) + 1; }
  else { v[key+'wrong'][id] = (v[key+'wrong'][id]||0) + 1; VQ.ng.push(VQ.analogy ? `${esc(plain(it.prompt))} … 正解：${plain(it.choices[L.indexOf(it.ans)])}` : `<b>${esc(it.w)}</b>：${esc(it.ja)}`); }
  vsave(v); drawSession();
}
function vocabKey(ev){
  if (!VQ || location.hash !== '#/vocab/session') return;
  if (VQ.kind === 'card') {
    if (ev.key === ' ') { ev.preventDefault(); VQ.flipped = !VQ.flipped; drawSession(); }
    else if (ev.key === 'ArrowRight') markKnown(true);
    else if (ev.key === 'ArrowLeft') markKnown(false);
  } else {
    const k = ev.key.toUpperCase();
    if (VQ.picked == null && L.includes(k)) pickVocab(k);
    else if (VQ.picked != null && ev.key === 'Enter') { VQ.i++; VQ.picked = null; drawSession(); }
  }
}
function renderVocabList(){
  const v = vstate();
  app.innerHTML = `<h1>単語一覧・検索</h1>
    <div class="filters"><button onclick="location.hash='#/vocab'">単語カード・同義語クイズ</button><button onclick="location.hash='#/vocab/analogy'">アナロジー練習</button><button class="on">単語一覧・検索</button></div>
    <div class="card"><input type="text" id="vs" placeholder="英単語・日本語で検索" style="width:100%" oninput="drawVocabList()">
      <label class="small" style="display:inline-block;margin-top:8px"><input type="checkbox" id="vu" onchange="drawVocabList()"> まだ覚えていない単語だけ</label></div>
    <div class="card" style="padding:0;overflow:auto"><table id="vt2"></table></div>`;
  drawVocabList();
}
function drawVocabList(){
  const v = vstate(); const s = ($('#vs').value||'').toLowerCase(); const u = $('#vu').checked;
  const list = VOCAB.filter(w => (!u || !v.known[w.w]) && (!s || w.w.includes(s) || (w.ja||'').includes(s) || (w.syn||[]).join(' ').includes(s)));
  $('#vt2').innerHTML = `<tr><th class="l">単語</th><th class="l">意味</th><th class="l">類義語 / 反意語</th><th>覚えた</th></tr>` +
    list.map(w => `<tr><td class="l"><b>${esc(w.w)}</b> <span class="small muted">${esc(w.pos||'')}</span></td><td class="l">${esc(w.ja)}</td>
      <td class="l small">${esc((w.syn||[]).join(', '))}${w.ant&&w.ant.length?`<br><span class="muted">⇔ ${esc(w.ant.join(', '))}</span>`:''}</td>
      <td><input type="checkbox" ${v.known[w.w]?'checked':''} onchange="toggleKnown(${jsArg(w.w)},this.checked)"></td></tr>`).join('');
}
function toggleKnown(w, k){ const v = vstate(); if (k) v.known[w] = true; else delete v.known[w]; vsave(v); }

/* --- analogy drill --- */
ANALOGY.questions.forEach((q,i) => q._id = 'a' + i);
const atypeName = id => { const t = ANALOGY.types.find(t=>t.id===id); return t ? `${t.ja}（${t.name}）` : id; };
function renderAnalogyHome(){
  const v = vstate();
  const stat = id => { const qs = ANALOGY.questions.filter(q=>!id || q.type===id); const r = qs.filter(q=>(v.aright[q._id]||0) > 0).length; return [r, qs.length]; };
  const weakQs = ANALOGY.questions.filter(q=>(v.awrong[q._id]||0) > (v.aright[q._id]||0));
  app.innerHTML = `<h1>アナロジー練習（Analogies）</h1>
    <div class="filters"><button onclick="location.hash='#/vocab'">単語カード・同義語クイズ</button><button class="on">アナロジー練習</button><button onclick="location.hash='#/vocab/list'">単語一覧・検索</button></div>
    <div class="card small">
      <b>解き方のコツ：</b>最初の2語の関係を「<b>ブリッジ文</b>」（例：「A は B の一部である」）にしてから、同じ文が成り立つ選択肢を探します。
      複数の選択肢が当てはまるときは、ブリッジ文をより具体的にしましょう。
      <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" onclick="startAnalogy(null)">全タイプからランダム20問</button>
        <button class="btn sec" onclick="startAnalogy(null,true)">⏱ 本番ペース（1問30秒）20問</button>
        <button class="btn sec" ${weakQs.length?'':'disabled'} onclick="startAnalogy('weak')">間違えた問題を復習（${weakQs.length}問）</button>
      </div></div>
    <h2>関係のタイプ別</h2>
    <div class="card" style="padding:0;overflow:auto"><table>
      <tr><th class="l">タイプ</th><th class="l">ブリッジ文</th><th class="l">例</th><th>正解済み</th><th></th></tr>
      ${ANALOGY.types.map(t=>{ const [r,n]=stat(t.id); return `<tr><td class="l"><b>${esc(t.ja)}</b><div class="small muted">${esc(t.name)}</div></td><td class="l small">${esc(t.bridge)}</td><td class="l small"><i>${esc(t.example)}</i></td><td>${r}/${n}</td>
        <td><button class="btn sec" style="padding:4px 12px" onclick="startAnalogy('${t.id}')">練習</button></td></tr>`; }).join('')}
    </table></div>`;
}
function startAnalogy(type, timed){
  const v = vstate(); let qs;
  if (type === 'weak') qs = ANALOGY.questions.filter(q=>(v.awrong[q._id]||0) > (v.aright[q._id]||0));
  else if (type) qs = ANALOGY.questions.filter(q=>q.type===type);
  else qs = shuffle(ANALOGY.questions).slice(0,20);
  VQ = {kind:'quiz', analogy:true, title: type==='weak' ? '間違えたアナロジー' : type ? atypeName(type) : 'アナロジー ランダム20問', items: type && type!=='weak' ? qs : shuffle(qs), i:0, picked:null, ok:0, ng:[], timed:!!timed};
  location.hash === '#/vocab/session' ? drawSession() : location.hash = '#/vocab/session';
}

/* =====================================================================
 *  GUIDE
 * ===================================================================== */

  app.innerHTML = `<h1>SSAT 本番情報（Upper Level）</h1>
  <div class="card">
    <h3 style="margin-top:0">本番の科目の順番と時間配分</h3>
    <p class="small">全6セクション・合計3時間10分（休憩含む）。どの受験方式（PC・紙）でも、科目の順番と制限時間は同一です。</p>
    <div style="overflow:auto"><table>
      <tr><th>順番</th><th>セクション</th><th>問題数</th><th>制限時間</th><th class="l">内容・注意点</th></tr>
      <tr><td>Part 1</td><td>Writing Sample</td><td>1題（2題から選択）</td><td>25分</td><td class="l">Personal（意見論述）または Creative/General から1つを選んで執筆（採点対象外だが志望校へ送付）</td></tr>
      <tr><td><i>休憩①</i></td><td><i>Break 1</i></td><td>—</td><td>5〜10分</td><td class="l">紙受験は5分、PC受験は10分</td></tr>
      <tr><td>Part 2</td><td>Quantitative 1（数学①）</td><td>25問</td><td>30分</td><td class="l">1問あたり約1分12秒ペース。電卓使用不可</td></tr>
      <tr><td>Part 3</td><td>Reading（長文読解）</td><td>40問</td><td>40分</td><td class="l">約8つのパッセージ。1問1分ペースで最も時間との戦いになる</td></tr>
      <tr><td><i>休憩②</i></td><td><i>Break 2</i></td><td>—</td><td>10分</td><td class="l">軽食やストレッチでリフレッシュ</td></tr>
      <tr><td>Part 4</td><td>Verbal（語彙・類推）</td><td>60問</td><td>30分</td><td class="l">前半30問が Synonyms、後半30問が Analogies。1問30秒のスピード勝負</td></tr>
      <tr><td>Part 5</td><td>Quantitative 2（数学②）</td><td>25問</td><td>30分</td><td class="l">数学①と合算（計50問）して数学スコアが算出される</td></tr>
      <tr><td>Part 6</td><td>Experimental（実験問題）</td><td>16問</td><td>15分</td><td class="l">スコアには反映されないダミーセクション</td></tr>
    </table></div>
  </div>
  <div class="card small">
    <h3 style="margin-top:0">この模試での練習のコツ</h3>
    <ul>
      <li><b>フル模試 1〜3</b> は本番と同じ問題数・制限時間・順番です（Experimental は省略）。約3時間かかるので、本番と同じ時間帯にまとめて受けるのがおすすめです。</li>
      <li><b>問題集 ver.1（本番順・短縮版）</b>は、本番の順番で約1時間40分の短縮練習ができます。</li>
      <li>Prometric（PC受験）の場合、Writing はキーボード入力です。この模試の Writing 画面はスペルチェック（自動補正）オフにしてあるので、25分間タイピングする練習に使えます。</li>
      <li>PC受験では長文を画面上でスクロールしながら読み、ハイライト機能を使います。Reading ではドラッグで本文をハイライトする練習をしておきましょう。</li>
      <li>Verbal は1問30秒。<a href="#/vocab">単語ドリル</a>の「本番ペース」モードでスピードに慣れておきましょう。</li>
    </ul>
  </div>`;
}

route();
